  - id: "10"
    title: 설정 파일
    doc: |
      # 설정 파일

      **목표:** 매번 환경변수를 export하지 않도록, 접속 정보를 설정 파일에 저장해 둔다.

      **새로 배우는 것:** toml 파싱, "값이 어디서 왔는지"를 구분하는 설계, 설정 병합

      ### 10-1. 요구사항

      1. 기본 위치: `$XDG_CONFIG_HOME/tget/config.toml`, 없으면 `~/.config/tget/config.toml`
      2. `--config <경로>` 로 다른 파일을 지정할 수 있다.
      3. 기본 위치에 파일이 **없으면 조용히 넘어간다.** `--config` 로 지정한 파일이 없으면 **에러.**
      4. 파일 형식이 잘못되면, **어느 파일인지** 보이는 에러를 낸다.
      5. 우선순위: **명령줄 옵션 > 환경변수 > 설정 파일 > 기본값**
      6. 설정 파일에 넣을 수 있는 것: prowlarr_url, prowlarr_api_key, qbit_url, qbit_user, qbit_pass, save_path. 전부 생략 가능.

      설정 파일 예시:

      ```
      prowlarr_url = "http://nas.example.com:9696"
      prowlarr_api_key = "abcdef..."
      qbit_url = "http://nas.example.com:8080"
      qbit_user = "admin"
      qbit_pass = "secret"
      save_path = "/downloads"
      ```

      ### 10-2. 크레이트

      ```bash
      cargo add toml dirs
      ```

      - `toml`: serde와 함께 TOML ↔ 구조체 변환. 사용법은 serde_json과 거의 같아요.
      - `dirs`: 운영체제별 홈 디렉터리 찾기 (`dirs::home_dir()`).

      ▶ `Cargo.toml` — 재생에서 따라 칩니다

      ### 10-3. 설계 힌트 (가장 중요)

      **문제:** 지금 Args의 `qbit_url` 에는 `default_value` 가 있어서, 값이 "사용자가 준 것"인지 "기본값"인지 구분할 수 없어요. 그러면 설정 파일 값이 끼어들 틈이 없어요.

      **해결 방향:**

      - 접속 관련 Args 필드에서 `default_value` 를 **지우고** 전부 `Option<String>` 으로 바꿔요. clap의 `env` 는 그대로 둬요. 그러면 Args의 값이 Some이면 "명령줄이나 환경변수에서 왔다"는 뜻이 돼요.
      - 새 모듈 `config.rs` 에 구조체 두 개:
        - `FileConfig`: toml 파일의 모양. 모든 필드가 Option. `#[derive(Deserialize, Default)]`
        - `Settings`: 최종 확정값. URL·사용자 이름은 String(기본값까지 채워짐), API 키·save_path는 Option.
      - `Settings::load(args: &Args) -> Result<Settings>` 하나만 바깥에 공개하세요. 내부는 "파일 읽기"와 "병합" 두 함수로 나누면 테스트하기 좋아요.
      - `prowlarr::search` 는 이제 `(http, &Settings, query)` 를 받게 바꾸세요.

      ▶ `src/cli.rs` — 재생에서 따라 칩니다

      ▶ `src/config.rs` — 재생에서 따라 칩니다

      ▶ `src/prowlarr.rs` — 재생에서 따라 칩니다

      ▶ `src/main.rs` — 재생에서 따라 칩니다

      ### 10-4. 테스트할 것

      - 명령줄 값이 파일 값을 이긴다.
      - 명령줄에 없으면 파일 값이 쓰인다.
      - 둘 다 없으면 기본값.

      읽는 법:

      - Option의 `or` 는 "앞이 None이면 뒤". 그리고 마지막에 `unwrap_or_else(|| "기본값".into())`. Args의 필드를 빌려 쓰는 중이라 `args.qbit_url.clone().or(file.qbit_url)` 처럼 clone이 필요해요.
      - `Args::parse_from(["tget", "x", "--qbit-url", "http://cli:1"])` 로 가짜 명령줄을 넣을 수 있어요. 첫 원소는 프로그램 이름 자리예요.
      - FileConfig는 `FileConfig { qbit_url: Some(...), ..Default::default() }` 처럼 일부만 채울 수 있어요.
      - 주의: 테스트를 돌리는 셸에 QBIT_URL 같은 환경변수가 export되어 있으면 결과가 달라져요.
      - `std::env::var_os("XDG_CONFIG_HOME")` 는 `Option<OsString>`. `.map(PathBuf::from)` 하고, 없으면 `dirs::home_dir()` 에 `.join(".config")`. 반환 타입을 `Option<PathBuf>` 로 두면 `?` 로 깔끔하게 쓸 수 있어요.

      ### 확인

      ```bash
      mkdir -p ~/.config/tget
      # config.toml을 만들고 실제 값을 넣은 뒤
      chmod 600 ~/.config/tget/config.toml     # 비밀번호가 들어 있으니 나만 읽게
      unset PROWLARR_API_KEY QBIT_PASS
      cargo run -- ubuntu --dry-run            # 환경변수 없이도 동작
      cargo run -- ubuntu --config nope.toml   # 에러에 nope.toml
      echo 'bad = [' > /tmp/bad.toml && cargo run -- x --config /tmp/bad.toml   # 줄·칸 위치까지 나오는 파싱 에러
      cargo test
      ```

      ### 이해 체크

      - default_value를 지우지 않고 설정 파일을 지원하려 하면 정확히 어떤 경우가 틀어지나요?
      - Settings와 FileConfig를 한 구조체로 합치면 안 되는 이유는?

      ## 정답 노트에서

      - 사용자가 아무것도 안 줘도 Args.qbit_url이 항상 `http://localhost:8080` 으로 차 있어요. 그래서 설정 파일의 qbit_url이 영원히 무시돼요.
      - FileConfig는 "없을 수 있음"(Option)이 본질이고, Settings는 "확정된 값"이 본질이에요. 합치면 쓰는 쪽마다 unwrap이나 기본값 처리가 흩어져요.
    steps:
      - message: "[10] Cargo.toml — toml, dirs 추가"
        files:
          - path: Cargo.toml
            content: |
              [package]
              name = "tget"
              version = "0.1.0"
              edition = "2024"

              [dependencies]
              anyhow = "1.0.104"
              clap = { version = "4.6.7", features = ["derive", "env"] }
              dirs = "7.0.0"
              reqwest = { version = "0.13.5", features = ["json", "cookies", "query", "form"] }
              serde = { version = "1.0.229", features = ["derive"] }
              serde_json = "1.0.154"
              tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
              toml = "1.1.8"
      - message: "[10] cli.rs — 접속 옵션을 Option으로, --config"
        files:
          - path: src/cli.rs
            content: |
              use std::path::PathBuf;

              use clap::Parser;

              /// 파일명으로 토렌트를 검색하고, 있으면 qBittorrent로 다운로드를 시작한다.
              #[derive(Parser, Debug)]
              #[command(version)]
              pub struct Args {
                  /// 검색할 파일명
                  pub query: String,

                  /// 보여줄 결과 수
                  #[arg(short, long, default_value_t = 10)]
                  pub limit: usize,

                  /// 최소 시더 수
                  #[arg(long, default_value_t = 1)]
                  pub min_seeders: u32,

                  /// 선택 없이 시더가 가장 많은 결과를 바로 받는다
                  #[arg(short, long)]
                  pub first: bool,

                  /// 결과만 보여주고 추가하지 않는다
                  #[arg(long)]
                  pub dry_run: bool,

                  /// Prowlarr 대신 로컬 JSON 파일에서 검색 결과를 읽는다 (개발용)
                  #[arg(long)]
                  pub fixture: Option<PathBuf>,

                  /// 설정 파일 경로 (기본: ~/.config/tget/config.toml)
                  #[arg(long)]
                  pub config: Option<PathBuf>,

                  /// 저장 경로 (qBittorrent 기준)
                  #[arg(long)]
                  pub save_path: Option<String>,

                  #[arg(long, env = "PROWLARR_URL")]
                  pub prowlarr_url: Option<String>,

                  #[arg(long, env = "PROWLARR_API_KEY", hide_env_values = true)]
                  pub prowlarr_api_key: Option<String>,

                  #[arg(long, env = "QBIT_URL")]
                  pub qbit_url: Option<String>,

                  #[arg(long, env = "QBIT_USER")]
                  pub qbit_user: Option<String>,

                  #[arg(long, env = "QBIT_PASS", hide_env_values = true)]
                  pub qbit_pass: Option<String>,
              }
      - message: "[10] config.rs — 설정 파일 읽기와 우선순위 병합"
        files:
          - path: src/config.rs
            content: |
              use std::fs;
              use std::path::{Path, PathBuf};

              use anyhow::{Context, Result};
              use serde::Deserialize;

              use crate::cli::Args;

              /// config.toml 의 모양. 모든 칸이 비어 있어도 된다.
              #[derive(Debug, Default, Deserialize)]
              pub struct FileConfig {
                  pub prowlarr_url: Option<String>,
                  pub prowlarr_api_key: Option<String>,
                  pub qbit_url: Option<String>,
                  pub qbit_user: Option<String>,
                  pub qbit_pass: Option<String>,
                  pub save_path: Option<String>,
              }

              /// CLI/환경변수 > 설정 파일 > 기본값 순으로 합친 최종 설정.
              #[derive(Debug)]
              pub struct Settings {
                  pub prowlarr_url: String,
                  pub prowlarr_api_key: Option<String>,
                  pub qbit_url: String,
                  pub qbit_user: String,
                  pub qbit_pass: String,
                  pub save_path: Option<String>,
              }

              impl Settings {
                  pub fn load(args: &Args) -> Result<Self> {
                      let file = match &args.config {
                          Some(path) => read_file(path)?,
                          None => match default_path() {
                              Some(path) if path.exists() => read_file(&path)?,
                              _ => FileConfig::default(),
                          },
                      };
                      Ok(Self::merge(args, file))
                  }

                  fn merge(args: &Args, file: FileConfig) -> Self {
                      Self {
                          prowlarr_url: args
                              .prowlarr_url
                              .clone()
                              .or(file.prowlarr_url)
                              .unwrap_or_else(|| "http://localhost:9696".into()),
                          prowlarr_api_key: args.prowlarr_api_key.clone().or(file.prowlarr_api_key),
                          qbit_url: args
                              .qbit_url
                              .clone()
                              .or(file.qbit_url)
                              .unwrap_or_else(|| "http://localhost:8080".into()),
                          qbit_user: args
                              .qbit_user
                              .clone()
                              .or(file.qbit_user)
                              .unwrap_or_else(|| "admin".into()),
                          qbit_pass: args.qbit_pass.clone().or(file.qbit_pass).unwrap_or_default(),
                          save_path: args.save_path.clone().or(file.save_path),
                      }
                  }
              }

              fn default_path() -> Option<PathBuf> {
                  let base = std::env::var_os("XDG_CONFIG_HOME")
                      .map(PathBuf::from)
                      .or_else(|| dirs::home_dir().map(|h| h.join(".config")))?;
                  Some(base.join("tget").join("config.toml"))
              }

              fn read_file(path: &Path) -> Result<FileConfig> {
                  let raw = fs::read_to_string(path)
                      .with_context(|| format!("설정 파일 {} 을 읽지 못했어요", path.display()))?;
                  toml::from_str(&raw).with_context(|| format!("설정 파일 {} 형식이 잘못됐어요", path.display()))
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use clap::Parser;

                  #[test]
                  fn cli_wins_over_file() {
                      let args = Args::parse_from(["tget", "x", "--qbit-url", "http://cli:1"]);
                      let file = FileConfig {
                          qbit_url: Some("http://file:2".into()),
                          qbit_user: Some("me".into()),
                          ..Default::default()
                      };
                      let s = Settings::merge(&args, file);
                      assert_eq!(s.qbit_url, "http://cli:1");
                      assert_eq!(s.qbit_user, "me");
                      assert_eq!(s.prowlarr_url, "http://localhost:9696");
                  }
              }
      - message: "[10] prowlarr.rs — Settings와 검색어를 받게"
        files:
          - path: src/prowlarr.rs
            content: |
              use std::fs;
              use std::path::Path;

              use anyhow::{Context, Result};

              use crate::config::Settings;
              use crate::hit::Hit;

              pub async fn search(http: &reqwest::Client, settings: &Settings, query: &str) -> Result<Vec<Hit>> {
                  let api_key = settings
                      .prowlarr_api_key
                      .as_deref()
                      .context("Prowlarr API 키가 필요해요 (PROWLARR_API_KEY 또는 config.toml)")?;
                  let url = format!("{}/api/v1/search", settings.prowlarr_url.trim_end_matches('/'));

                  http.get(url)
                      .header("X-Api-Key", api_key)
                      .query(&[("query", query), ("type", "search")])
                      .send()
                      .await
                      .context("Prowlarr에 연결하지 못했어요")?
                      .error_for_status()
                      .context("Prowlarr 검색 실패 (API 키를 확인하세요)")?
                      .json()
                      .await
                      .context("Prowlarr 응답을 해석하지 못했어요")
              }

              pub fn load_fixture(path: &Path) -> Result<Vec<Hit>> {
                  let raw = fs::read_to_string(path)
                      .with_context(|| format!("{} 을 읽지 못했어요", path.display()))?;
                  Ok(serde_json::from_str(&raw)?)
              }
      - message: "[10] main.rs — Settings::load 사용"
        files:
          - path: src/main.rs
            content: |
              mod cli;
              mod config;
              mod hit;
              mod prowlarr;
              mod qbit;
              mod ui;

              use anyhow::{Result, bail};
              use clap::Parser;

              use cli::Args;
              use config::Settings;
              use qbit::Qbit;

              #[tokio::main]
              async fn main() -> Result<()> {
                  let args = Args::parse();
                  let settings = Settings::load(&args)?;
                  let http = reqwest::Client::builder().cookie_store(true).build()?;

                  let hits = match &args.fixture {
                      Some(path) => prowlarr::load_fixture(path)?,
                      None => prowlarr::search(&http, &settings, &args.query).await?,
                  };
                  let hits = hit::rank(hits, args.min_seeders, args.limit);

                  if hits.is_empty() {
                      bail!("'{}' 에 해당하는 토렌트를 찾지 못했어요", args.query);
                  }

                  ui::print_hits(&hits);

                  if args.dry_run {
                      return Ok(());
                  }

                  let chosen = if args.first {
                      &hits[0]
                  } else {
                      match ui::prompt_choice(hits.len())? {
                          Some(i) => &hits[i],
                          None => {
                              println!("취소했어요");
                              return Ok(());
                          }
                      }
                  };

                  let qbit = Qbit::login(http, &settings.qbit_url, &settings.qbit_user, &settings.qbit_pass).await?;
                  qbit.add(chosen.link().unwrap(), settings.save_path.as_deref()).await?;
                  println!("→ qBittorrent에 추가됨: {}", chosen.title);
                  Ok(())
              }
  - id: "11"
    title: 진행률 보기 --watch
    doc: |
      # 진행률 보기 --watch

      **목표:** `tget ubuntu -w` 로 추가한 뒤, 그 토렌트의 다운로드 진행률을 한 줄로 갱신하며 보여 준다.

      ### 11-1. 요구사항

      - `-w`/`--watch` 플래그.
      - 추가한 뒤 **2초마다** 상태를 조회해서, **같은 줄을 덮어쓰며** 이렇게 보여 준다:

      ```
      [##########----------]  50.0%  3.0MB/s  downloading
      ```

      - 진행률이 100%가 되면 줄을 바꾸고 `완료: <이름>` 을 찍고 끝낸다.
      - Ctrl+C로 그만 볼 수 있다 (다운로드 자체는 qBittorrent에서 계속됨). 시작할 때 이걸 안내한다.
      - **방금 추가한 그 토렌트**만 보여야 한다. 다른 토렌트가 수십 개 있어도.

      ### 11-2. 필요한 정보

      - 상태 조회: `GET /api/v2/torrents/info` → 토렌트 객체 배열. 쓸 칸: `name`, `progress` (0.0–1.0 실수), `dlspeed` (초당 바이트), `state`.
      - `/torrents/info` 는 `tag=<태그>` 쿼리로 거를 수 있어요.
      - `/torrents/add` 는 **추가된 토렌트의 해시를 돌려주지 않아요.** 그런데 add에 `tags=<태그>` form 필드를 같이 보낼 수 있어요. 이 둘을 어떻게 엮으면 될까요?
      - 2초 기다리기: `tokio::time::sleep` (tokio에 `time` 기능 추가 필요). `std::thread::sleep` 은 async 안에서 쓰면 안 돼요. 왜일까요?
      - 같은 줄 덮어쓰기: 줄 맨 앞으로 돌아가는 `\r` + `print!` + flush. 이전 줄이 더 길었을 때 찌꺼기가 남는 문제도 생각해 보세요.

      ▶ `Cargo.toml` — 재생에서 따라 칩니다

      ▶ `src/cli.rs` — 재생에서 따라 칩니다

      ▶ `src/qbit.rs` — 재생에서 따라 칩니다

      ▶ `src/ui.rs` — 재생에서 따라 칩니다

      ▶ `src/main.rs` — 재생에서 따라 칩니다

      ### 11-3. 생각해 볼 함정

      - magnet은 메타데이터를 받기 전까지 **목록에 늦게 나타나거나** 정보가 비어 있을 수 있어요. 빈 배열을 만나도 에러로 끝내면 안 돼요.
      - 진행률 막대의 채운 칸 수를 계산할 때 실수 오차로 20을 넘지 않게.

      ### 확인

      - Stage 7의 mock 서버로: 조회할 때마다 50%씩 올라서 두 번째에 `완료: ubuntu.iso` 가 나와야 해요. mock은 **add 때 받은 tags와 같은 tag로 조회해야만** 결과를 돌려주니, 태그 연결이 틀리면 영원히 기다려요.
      - 실제 qBittorrent로: 작은 합법 파일 하나를 끝까지 받아 보기.

      > 막히면 qBittorrent Web UI의 개발자 도구(Network 탭)를 열어 보세요. UI가 바로 이 API로 동작해요. API 문서는 GitHub의 qbittorrent/qBittorrent 위키 "WebUI API (qBittorrent 5.0)" 페이지에 있어요.

      ## 정답 노트에서

      - 태그 연결: add 때 `tags=tget-<유닉스초>` 를 붙이고, info를 `tag=` 로 거르면 "방금 넣은 그것"만 나와요.
      - 진행률 줄 끝의 공백 4칸은 이전 줄이 더 길었을 때 남는 찌꺼기를 지우는 용도예요.
      - `.min(WIDTH)` 로 실수 오차가 있어도 막대가 20칸을 넘지 않게 막아요.
      - `std::thread::sleep` 은 tokio의 작업 스레드 자체를 재워 버려서, 그동안 다른 async 작업이 못 돌아요. async 안에서는 `tokio::time::sleep(...).await`.
    steps:
      - message: "[11] Cargo.toml — tokio time 기능 추가"
        files:
          - path: Cargo.toml
            content: |
              [package]
              name = "tget"
              version = "0.1.0"
              edition = "2024"

              [dependencies]
              anyhow = "1.0.104"
              clap = { version = "4.6.7", features = ["derive", "env"] }
              dirs = "7.0.0"
              reqwest = { version = "0.13.5", features = ["json", "cookies", "query", "form"] }
