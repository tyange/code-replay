        files:
          - path: mock_prowlarr.py
            content: |
              # mock_prowlarr.py — tget 개발용 가짜 Prowlarr (포트 19696, API 키는 key)
              import json, time
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
              from urllib.parse import parse_qs, urlparse

              INDEXERS = [
                  {"id": 1, "name": "Archive", "enable": True},
                  {"id": 2, "name": "Slowpoke", "enable": True},
                  {"id": 3, "name": "Broken", "enable": True},
                  {"id": 4, "name": "Retired", "enable": False},
              ]

              # .NET 서버처럼 & 와 한글을 \uXXXX 로 이스케이프한 응답 (ensure_ascii + & 치환)
              ARCHIVE = [
                  {"title": "ubuntu-24.04.1-desktop-amd64.iso", "size": 6203355136, "seeders": 1200,
                   "indexer": "Archive", "magnetUrl": "magnet:?xt=urn:btih:0000000000000000000000000000000000000001&dn=ubuntu"},
                  {"title": "우분투 한글 안내서.pdf", "size": 1048576, "seeders": 30,
                   "indexer": "Archive", "magnetUrl": "magnet:?xt=urn:btih:0000000000000000000000000000000000000005"},
              ]
              SLOW = [
                  {"title": "ubuntu-24.04-live-server-amd64.iso", "size": 2754981888, "seeders": 800,
                   "indexer": "Slowpoke", "downloadUrl": "http://localhost:9696/2/download?link=abc"},
              ]


              def dotnet_json(obj):
                  return json.dumps(obj, ensure_ascii=True).replace("&", "\\u0026")


              class H(BaseHTTPRequestHandler):
                  def log_message(self, *a):
                      pass

                  def send(self, code, body):
                      self.send_response(code)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(body.encode())

                  def do_GET(self):
                      if self.headers.get("X-Api-Key") != "key":
                          return self.send(401, '{"error":"Unauthorized"}')
                      u = urlparse(self.path)
                      if u.path == "/api/v1/indexer":
                          return self.send(200, json.dumps(INDEXERS))
                      if u.path == "/api/v1/search":
                          ids = parse_qs(u.query).get("indexerIds", [])
                          if ids == ["1"] or not ids:
                              return self.send(200, dotnet_json(ARCHIVE))
                          if ids == ["2"]:
                              time.sleep(5)
                              return self.send(200, dotnet_json(SLOW))
                          if ids == ["3"]:
                              return self.send(500, '{"message":"indexer exploded"}')
                          return self.send(200, "[]")
                      self.send(404, "")


              ThreadingHTTPServer(("127.0.0.1", 19696), H).serve_forever()
      - message: "[15] prowlarr.rs — 인덱서마다 spawn하는 병렬 검색"
        files:
          - path: src/prowlarr.rs
            content: |
              use std::fs;
              use std::path::Path;
              use std::sync::Arc;
              use std::time::Duration;

              use anyhow::{Context, Result, anyhow};
              use serde::Deserialize;
              use tokio::task::JoinSet;

              use crate::config::Settings;

              #[derive(Debug, Deserialize)]
              pub struct Indexer {
                  pub id: u32,
                  pub name: String,
                  pub enable: bool,
              }

              /// 인덱서 하나의 검색 결과. 실패해도 전체를 멈추지 않도록 Result를 그대로 담는다.
              pub struct IndexerResult {
                  pub name: String,
                  pub body: Result<String>,
              }

              fn api_key(settings: &Settings) -> Result<&str> {
                  settings
                      .prowlarr_api_key
                      .as_deref()
                      .context("Prowlarr API 키가 필요해요 (PROWLARR_API_KEY 또는 config.toml)")
              }

              fn endpoint(settings: &Settings, path: &str) -> String {
                  format!("{}{path}", settings.prowlarr_url.trim_end_matches('/'))
              }

              pub async fn indexers(http: &reqwest::Client, settings: &Settings) -> Result<Vec<Indexer>> {
                  http.get(endpoint(settings, "/api/v1/indexer"))
                      .header("X-Api-Key", api_key(settings)?)
                      .send()
                      .await
                      .context("Prowlarr에 연결하지 못했어요")?
                      .error_for_status()
                      .context("인덱서 목록을 가져오지 못했어요 (API 키를 확인하세요)")?
                      .json()
                      .await
                      .context("인덱서 목록을 해석하지 못했어요")
              }

              async fn search_one(
                  http: &reqwest::Client,
                  settings: &Settings,
                  query: &str,
                  indexer_id: u32,
              ) -> Result<String> {
                  let id = indexer_id.to_string();
                  Ok(http
                      .get(endpoint(settings, "/api/v1/search"))
                      .header("X-Api-Key", api_key(settings)?)
                      .query(&[("query", query), ("type", "search"), ("indexerIds", &id)])
                      .send()
                      .await?
                      .error_for_status()?
                      .text()
                      .await?)
              }

              /// 켜져 있는 인덱서마다 태스크를 하나씩 띄워 동시에 검색한다.
              pub async fn search_all(
                  http: &reqwest::Client,
                  settings: Arc<Settings>,
                  query: &str,
                  timeout: Duration,
              ) -> Result<Vec<IndexerResult>> {
                  let mut tasks = JoinSet::new();
                  for ix in indexers(http, &settings).await? {
                      if !ix.enable {
                          continue;
                      }
                      // spawn한 태스크는 'static이어야 하므로, 빌린 값 대신 소유한 값을 넘긴다.
                      let http = http.clone();
                      let settings = Arc::clone(&settings);
                      let query = query.to_owned();
                      tasks.spawn(async move {
                          let body = tokio::time::timeout(timeout, search_one(&http, &settings, &query, ix.id))
                              .await
                              .unwrap_or_else(|_| Err(anyhow!("{}초 안에 응답이 없어요", timeout.as_secs())));
                          IndexerResult {
                              name: ix.name,
                              body,
                          }
                      });
                  }

                  let mut results = Vec::new();
                  while let Some(joined) = tasks.join_next().await {
                      results.push(joined.context("검색 태스크가 비정상 종료됐어요")?);
                  }
                  Ok(results)
              }

              pub fn load_fixture(path: &Path) -> Result<String> {
                  fs::read_to_string(path).with_context(|| format!("{} 을 읽지 못했어요", path.display()))
              }
