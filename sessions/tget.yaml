                  pub prowlarr_api_key: Option<String>,

                  #[arg(long, env = "QBIT_URL", default_value = "http://localhost:8080")]
                  pub qbit_url: String,

                  #[arg(long, env = "QBIT_USER", default_value = "admin")]
