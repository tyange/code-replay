      - message: "[15] main.rs — Arc<Settings>, 여러 원본 모아 파싱"
        files:
          - path: src/main.rs
            content: |
              mod cli;
              mod config;
              mod hit;
              mod prowlarr;
              mod qbit;
              mod ui;

              use std::sync::Arc;
              use std::time::{Duration, SystemTime, UNIX_EPOCH};

              use anyhow::{Context, Result, bail};
              use clap::Parser;

              use cli::Args;
              use config::Settings;
              use qbit::Qbit;

              #[tokio::main]
              async fn main() -> Result<()> {
                  let args = Args::parse();
                  let settings = Arc::new(Settings::load(&args)?);
                  let http = reqwest::Client::builder().cookie_store(true).build()?;

                  let raws = match &args.fixture {
                      Some(path) => vec![prowlarr::load_fixture(path)?],
                      None => {
                          let timeout = Duration::from_secs(args.timeout);
                          let results =
                              prowlarr::search_all(&http, Arc::clone(&settings), &args.query, timeout).await?;
                          let mut raws = Vec::new();
                          for r in results {
                              match r.body {
                                  Ok(body) => raws.push(body),
                                  Err(e) => eprintln!("⚠ {}: {e:#}", r.name),
                              }
                          }
                          raws
                      }
                  };

                  let mut hits = Vec::new();
                  for raw in &raws {
                      hits.extend(hit::parse(raw).context("검색 결과를 해석하지 못했어요")?);
                  }
                  let hits = hit::rank(hits, args.min_seeders, args.limit);

                  if hits.is_empty() {
                      bail!("'{}' 에 해당하는 토렌트를 찾지 못했어요", args.query);
                  }

                  let recommended = hit::best(&hits, &args.query);
                  ui::print_hits(&hits, recommended);

                  if args.dry_run {
                      return Ok(());
                  }

                  let chosen = if args.first {
                      recommended.unwrap_or(&hits[0])
                  } else {
                      match ui::prompt_choice(hits.len())? {
                          Some(i) => &hits[i],
                          None => {
                              println!("취소했어요");
                              return Ok(());
                          }
                      }
                  };

                  let qbit = Qbit::login(
                      http,
                      &settings.qbit_url,
                      &settings.qbit_user,
                      &settings.qbit_pass,
                  )
                  .await?;
                  let tag = new_tag();
                  qbit.add(chosen.link().unwrap(), settings.save_path.as_deref(), &tag)
                      .await?;
                  println!("→ qBittorrent에 추가됨: {}", chosen.title);

                  if args.watch {
                      watch(&qbit, &tag).await?;
                  }
                  Ok(())
              }

              /// 이번에 추가한 토렌트만 찾아내기 위한 고유 태그.
              fn new_tag() -> String {
                  let secs = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .map(|d| d.as_secs())
                      .unwrap_or(0);
                  format!("tget-{secs}")
              }

              async fn watch(qbit: &Qbit, tag: &str) -> Result<()> {
                  println!("진행률을 지켜보는 중… (Ctrl+C로 그만 보기, 다운로드는 계속돼요)");
                  loop {
                      // magnet은 메타데이터를 받기 전까지 목록에 늦게 나타날 수 있다.
                      if let Some(t) = qbit.info_by_tag(tag).await?.first() {
                          ui::print_progress(t)?;
                          if t.progress >= 1.0 {
                              println!("\n완료: {}", t.name);
                              return Ok(());
                          }
                      }
                      tokio::time::sleep(Duration::from_secs(2)).await;
                  }
              }
  - id: "16"
    title: Transmission도 지원하기
    doc: |
      # Transmission도 지원하기

      **목표:** `--client transmission` 이면 qBittorrent 대신 Transmission에 추가하고, `--watch` 도 똑같이 동작한다.

      **새로 배우는 것:** trait으로 공통 동작 묶기, async fn이 든 trait의 한계(dyn 불가)와 우회, **내부 가변성**(`&self` 인데 값을 바꿔야 할 때), `Mutex` vs `RefCell`, 락을 await 너머로 들고 가면 생기는 일

      ### 16-1. 주어진 인터페이스

      `downloader.rs` 새 모듈. `Progress` 구조체와 `Downloader` trait이 주어져요.

      - `name` 이 `&'static str` 인 이유: "qBittorrent" 같은 **문자열 리터럴**은 프로그램 바이너리 안에 박혀 있어서 끝까지 살아 있어요.
      - `progress` 가 `Option` 인 이유: magnet은 메타데이터를 받기 전까지 목록에 안 나타날 수 있어요(Stage 11).

      ### 16-2. Transmission RPC 명세

      | 항목 | 내용 |
      | --- | --- |
      | 주소 | POST http://localhost:9091/transmission/rpc |
      | 본문 | JSON `{"method": "...", "arguments": {...}}` |
      | 인증 | (설정했다면) HTTP Basic 인증 |
      | 세션 | 모든 요청에 `X-Transmission-Session-Id` 헤더 필요. **틀리거나 없으면 409** 와 함께 응답 헤더로 새 ID를 줌 → 그 ID로 **다시 보내기** |
      | 응답 | `{"result": "success", "arguments": {...}}`. result가 success가 아니면 실패 |
      | 추가 | method `torrent-add`, arguments: `filename` (magnet이나 URL), `download-dir` (선택), `labels` (문자열 배열) |
      | 조회 | method `torrent-get`, arguments: `fields` 배열. 응답의 `arguments.torrents` 배열 |
      | 조회 필드 | `name`, `percentDone` (0.0–1.0), `rateDownload` (초당 바이트), `status` (숫자), `labels` |
      | status | 0 stopped, 1·2 checking, 3 queued, 4 downloading, 5·6 seeding |

      - qBittorrent의 tags 역할을 Transmission에선 **labels** 가 해요. torrent-get은 라벨로 거르는 기능이 없어서, **전부 받아 와서 직접 찾아야** 해요.
      - 첫 요청은 세션 ID가 없으니 **반드시 409를 한 번 받아요.** 정상이에요.

      ### 16-3. 가짜 Transmission 서버

      ▶ `mock_transmission.py` — 재생에서 따라 칩니다

      목록에 **다른 토렌트(other.iso)도 섞어** 보내요. 라벨로 제대로 찾는지 확인하려고요.

      ### 16-4. 직접 할 일

      - [ ] `impl Downloader for Qbit`: 기존 add를 trait 쪽으로 옮기고, progress는 info_by_tag 결과를 Progress로 바꿔서. TorrentInfo는 이제 qbit.rs 밖에서 안 써도 되니 pub을 떼세요.
      - [ ] `transmission.rs`: Transmission 구조체와 `impl Downloader for Transmission`. 요청 보내는 공통 함수(`rpc(method, arguments)`)를 하나 만들어 409 처리를 그 안에 숨기세요.
      - [ ] `ClientKind` enum (Qbit, Transmission): clap의 `ValueEnum` 과 serde의 `Deserialize` 를 둘 다 derive해서 `--client`, 환경변수 `TGET_CLIENT`, config.toml의 `client = "transmission"` 에서 모두 쓸 수 있게.
      - [ ] 설정: transmission_url (기본 `http://localhost:9091/transmission/rpc`), transmission_user, transmission_pass. Stage 10과 같은 우선순위.
      - [ ] main: 설정에 따라 클라이언트를 만들고, add → `→ {이름}에 추가됨`, `--watch` 면 진행률. **watch 함수는 어떤 Downloader든 받게** (제네릭).
      - [ ] ui::print_progress가 Progress를 받게.

      ▶ `src/downloader.rs` — 재생에서 따라 칩니다

      ▶ `src/transmission.rs` — 재생에서 따라 칩니다

      ▶ `src/qbit.rs` — 재생에서 따라 칩니다

      ▶ `src/ui.rs` — 재생에서 따라 칩니다

      ▶ `src/cli.rs` — 재생에서 따라 칩니다

      ▶ `src/config.rs` — 재생에서 따라 칩니다

      ▶ `src/main.rs` — 재생에서 따라 칩니다

      ### 16-5. 부숴 보기 1: dyn Downloader로 담기

      main에서 클라이언트를 고를 때 가장 먼저 떠오르는 건 이거예요.

      ```rust
      let client: Box<dyn Downloader> = match settings.client {
          ClientKind::Qbit => Box::new(qbit),
          ClientKind::Transmission => Box::new(transmission),
      };
      ```

      ```
      error[E0038]: the trait `Downloader` is not dyn compatible
         |
      62 | pub fn boxed(c: Client) -> Box<dyn Downloader> {
         |                                ^^^^^^^^^^^^^^ `Downloader` is not dyn compatible
         |
      note: for a trait to be dyn compatible it needs to allow building a vtable
        --> src/downloader.rs:21:14
         |
      19 | pub trait Downloader {
         |           ---------- this trait is not dyn compatible...
      20 |     fn name(&self) -> &'static str;
      21 |     async fn add(&self, link: &str, save_path: Option<&str>, tag: &str) -> Result<()>;
         |              ^^^ ...because method `add` is `async`
      22 |     async fn progress(&self, tag: &str) -> Result<Option<Progress>>;
         |              ^^^^^^^^ ...because method `progress` is `async`
      ```

      `async fn` 은 구현마다 **크기가 다른 Future 타입**을 돌려줘요. `dyn` 은 "실행 중에 함수 표(vtable)를 보고 부른다"는 뜻인데, 반환 타입의 크기를 모르면 표를 만들 수 없어요.

      우회 방법은 세 가지예요. **이 Stage에선 1번**을 쓰세요.

      1. **enum으로 묶기**: `enum Client { Qbit(Qbit), Transmission(Transmission) }` 를 만들고 Client에도 Downloader를 구현해서 match로 넘겨주기. 고를 수 있는 종류가 정해져 있을 때 가장 단순해요.
      2. **제네릭**: `fn run<D: Downloader>(d: &D)` → 컴파일할 때 종류별로 코드가 따로 만들어져요. watch는 이 방식으로.
      3. **직접 Box에 담은 Future 돌려주기**: `fn add(..) -> Pin<Box<dyn Future<Output = ..> + Send + '_>>`. async-trait 크레이트가 해 주는 일이에요. (보너스)

      ### 16-6. 부숴 보기 2: &self인데 세션 ID를 바꿔야 한다

      Transmission 구조체에 `session_id: String` 을 두고, 409를 받았을 때 `self.session_id = new_id.to_string();` 하면:

      ```
      error[E0594]: cannot assign to `self.session_id`, which is behind a `&` reference
         |
      79 |                 self.session_id = new_id.to_string();
         |                 ^^^^^^^^^^^^^^^ `self` is a `&` reference, so it cannot be written to
         |
      help: consider changing this to be a mutable reference
         |
      54 |     async fn rpc(&mut self, method: &str, arguments: Value) -> Result<Value> {
      ```

      컴파일러는 `&mut self` 로 바꾸라고 하지만, 그러면 trait의 `add(&self, ...)` 와 맞지 않아요. 그리고 개념적으로도 "세션 ID 갱신"은 **바깥에서 보기엔 아무것도 안 바뀐** 내부 사정이에요. 이럴 때 쓰는 게 **내부 가변성**이에요: `&self` 로도 안쪽 값을 바꿀 수 있게 해 주는 타입들.

      | 타입 | 스레드 간 공유 | 실패 시 |
      | --- | --- | --- |
      | `Cell<T>` | 안 됨 | 값을 통째로 바꾸기만 가능 (Copy 타입 위주) |
      | `RefCell<T>` | 안 됨 (Sync 아님) | 규칙 위반 시 **실행 중 패닉** |
      | `Mutex<T>` | 됨 | 다른 스레드가 쥐고 있으면 기다림 |
      | `RwLock<T>` | 됨 | 읽기 여럿 또는 쓰기 하나 |

      ### 16-7. 부숴 보기 3: RefCell이면 안 되나?

      `RefCell<String>` 으로 만들면 지금 main에선 **잘 돌아요.** 그런데 Transmission을 Arc로 감싸서 spawn한 태스크에서 쓰려는 순간:

      ```
      error: future cannot be sent between threads safely
          |
      143 |     tokio::spawn(async move { t.add("magnet:x", None, "tag").await });
          |     ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ future created by async block is not `Send`
          |
          = help: within `Transmission`, the trait `Sync` is not implemented for `RefCell<std::string::String>`
          = note: if you want to do aliasing and mutation between multiple threads, use `std::sync::RwLock` instead
      note: captured value is not `Send`
          |
      143 |     tokio::spawn(async move { t.add("magnet:x", None, "tag").await });
          |                               ^ has type `Arc<Transmission>` which is not `Send`
      ```

      사슬을 따라가 보세요: RefCell은 Sync가 아님 → 그걸 품은 Transmission도 Sync가 아님 → `Arc<T>` 는 T가 Sync여야 Send → 태스크로 못 넘김. **Mutex를 쓰면 같은 코드가 컴파일돼요**(직접 확인해 보세요). 클라이언트는 언젠가 여러 태스크가 나눠 쓸 수 있으니 Mutex를 고르세요.

      ### 16-8. 부숴 보기 4: 락을 쥔 채로 await하기

      Mutex로 바꾼 뒤, 세션 ID를 이렇게 쓰면 편해 보여요.

      ```rust
      let guard = self.session_id.lock().unwrap();
      let mut req = self.http.post(&self.url).header(SESSION_HEADER, guard.as_str()).json(&body);
      // ... 그리고 아래에서 req.send().await
      ```

      main에서 바로 부를 땐 컴파일돼요. 그런데 이 클라이언트를 spawn한 태스크에서 쓰면:

      ```
      error: future cannot be sent between threads safely
          |
      143 |     tokio::spawn(async move { t.add("magnet:x", None, "tag").await });
          |     ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ future created by async block is not `Send`
          |
          = help: within `{async block@src/transmission.rs:143:18: 143:28}`, the trait `std::marker::Send` is not implemented for `std::sync::MutexGuard<'_, std::string::String>`
      note: future is not `Send` as this value is used across an await
          |
       61 |             let guard = self.session_id.lock().unwrap();
          |                 ----- has type `std::sync::MutexGuard<'_, std::string::String>` which is not `Send`
      ...
       72 |                 .await
          |                  ^^^^^ await occurs here, with `guard` maybe used later
      ```

      "await 너머로 guard를 들고 간다" → 기다리는 동안 락이 계속 잠겨 있고, 다른 스레드에서 깨어나 그 락을 풀려고 하게 돼요. 표준 Mutex는 그걸 허용하지 않아요.

      **고치는 법:** 락은 **값을 복사해 오는 그 한 줄 안에서만** 쥐세요. `let session_id = self.session_id.lock().unwrap().clone();` 처럼 쓰면 문장이 끝날 때 guard가 사라져요.

      > `.lock().unwrap()` 의 unwrap은 언제 패닉할까요? 다른 스레드가 락을 쥔 채로 패닉해서 락이 "오염(poisoned)"됐을 때뿐이에요. 우리 코드는 락을 쥔 채로 패닉할 일이 없어요. Stage 12의 "unwrap마다 이유 말하기"에 이걸 적어 두세요.

      ### 확인

      ```bash
      # 터미널 A
      python3 mock_transmission.py

      # 터미널 B
      cargo run -- "ubuntu server" --fixture fixtures/search.json -f -w \
        --client transmission --transmission-url http://127.0.0.1:19091/transmission/rpc --save-path /dl
      ```

      ```
      → Transmission에 추가됨: ubuntu-24.04-live-server-amd64.iso
      진행률을 지켜보는 중… (Ctrl+C로 그만 보기, 다운로드는 계속돼요)
      [####################] 100.0%  2.0MB/s  seeding
      완료: ubuntu.iso
      ```

      터미널 A에는 이렇게 찍혀야 해요. **첫 줄의 409가 핵심**이에요.

      ```
      409 → 세션 ID 알려 줌
      torrent-add {'download-dir': '/dl', 'filename': 'http://localhost:9696/1/download?link=abc', 'labels': ['tget-1791879628']}
      torrent-get {'fields': ['name', 'percentDone', 'rateDownload', 'status', 'labels']}
      torrent-get {'fields': ['name', 'percentDone', 'rateDownload', 'status', 'labels']}
      ```

      - qBittorrent mock으로 `--client` 없이 돌려도 Stage 11과 똑같이 동작해야 해요.
      - `TGET_CLIENT=transmission` 환경변수로도 고를 수 있어야 해요.
      - 테스트: config.toml에 `client = "transmission"` 이 있으면 Transmission이 골라지는지.

      ### 이해 체크

      - 16-5의 우회 1(enum)과 2(제네릭)는 각각 언제 더 나은가요?
      - Transmission의 세션 ID를 `Mutex<String>` 에 넣는 게 "안전하지만 과한" 선택일 수도 있어요. 언제 과할까요?
      - `&mut self` 로 바꾸라는 컴파일러 제안을 따르면, 클라이언트를 여러 태스크가 공유하는 상황에서 무엇이 문제가 될까요?

      ## 정답 노트에서

      - `args["torrents"].clone()` 의 clone: `serde_json::from_value` 가 Value를 **값으로** 가져가기 때문이에요. args를 더 안 쓰니 `args["torrents"].take()` 로 복사 없이 꺼낼 수도 있어요(args를 mut으로). 직접 바꿔 보세요.
      - `main.rs` 에서 `use downloader::{Client, ClientKind, Downloader};` 의 **Downloader도 꼭 가져와야** 해요. trait 메서드(`client.add`)는 trait이 스코프에 있어야 부를 수 있어요.
      - 설정(cli.rs, config.rs)은 Stage 10과 같은 패턴으로 client, transmission_url, transmission_user, transmission_pass 네 칸을 늘리면 돼요. client는 `args.client.or(file.client).unwrap_or_default()` — ClientKind가 Copy라 clone이 필요 없어요.
      - enum: 종류가 정해져 있고 실행 중에 고를 때. 제네릭: 호출하는 쪽이 컴파일 시점에 종류를 알고, 종류별로 최적화된 코드가 나와도 될 때. (watch처럼 "어떤 Downloader든" 받는 함수)
      - 클라이언트를 절대 여러 태스크가 공유하지 않는다면 `RefCell` 이나 `Cell` 로 충분하고, Mutex의 잠금 비용은 필요 없어요. 다만 세션 ID 갱신은 드문 일이라 이 비용은 사실상 0이에요.
      - `&mut self` 는 "동시에 하나만" 쓸 수 있다는 뜻이에요. 여러 태스크가 하나의 클라이언트를 동시에 쓰려면 결국 바깥을 Mutex로 감싸야 하고, 그러면 **요청 전체**를 잠그게 돼요. 내부 가변성은 **세션 ID 바꾸는 그 한 줄**만 잠가요.
    steps:
      - message: "[16] mock_transmission.py — 개발용 가짜 Transmission"
        files:
          - path: mock_transmission.py
            content: |
              # mock_transmission.py — tget 개발용 가짜 Transmission RPC (포트 19091)
              import json, sys
              from http.server import BaseHTTPRequestHandler, HTTPServer

              SESSION = "sess-42"
              state = {"done": 0.0, "labels": [], "requests": 0}


              class H(BaseHTTPRequestHandler):
                  def log_message(self, *a):
                      pass

                  def send(self, code, body, headers=()):
                      self.send_response(code)
                      for k, v in headers:
                          self.send_header(k, v)
                      self.end_headers()
                      self.wfile.write(body.encode())

                  def do_POST(self):
                      if self.path != "/transmission/rpc":
                          return self.send(404, "")
                      state["requests"] += 1
                      if self.headers.get("X-Transmission-Session-Id") != SESSION:
                          print("409 → 세션 ID 알려 줌", file=sys.stderr)
                          return self.send(409, "Conflict", [("X-Transmission-Session-Id", SESSION)])
                      req = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                      method, args = req["method"], req.get("arguments", {})
                      print(method, args, file=sys.stderr)
                      if method == "torrent-add":
                          state["labels"] = args.get("labels", [])
                          return self.send(200, json.dumps({"result": "success", "arguments": {"torrent-added": {"id": 1}}}))
                      if method == "torrent-get":
                          state["done"] = min(1.0, state["done"] + 0.5)
                          t = {"name": "ubuntu.iso", "percentDone": state["done"], "rateDownload": 2097152,
                               "status": 6 if state["done"] >= 1 else 4, "labels": state["labels"]}
                          other = {"name": "other.iso", "percentDone": 0.1, "rateDownload": 0, "status": 0, "labels": []}
                          return self.send(200, json.dumps({"result": "success", "arguments": {"torrents": [other, t]}}))
                      self.send(200, json.dumps({"result": "method name not recognized"}))


              HTTPServer(("127.0.0.1", 19091), H).serve_forever()
      - message: "[16] downloader.rs — Downloader trait과 Client enum"
        files:
          - path: src/downloader.rs
            content: |
              use anyhow::Result;
              use serde::Deserialize;

              use crate::qbit::Qbit;
              use crate::transmission::Transmission;

              /// 어떤 클라이언트든 진행 상황은 이 모양으로 맞춘다.
              #[derive(Debug)]
              pub struct Progress {
                  pub name: String,
                  /// 0.0 – 1.0
                  pub done: f64,
                  /// 초당 바이트
                  pub speed: u64,
                  pub state: String,
              }

              /// 토렌트 클라이언트가 해 줘야 하는 일.
              pub trait Downloader {
                  fn name(&self) -> &'static str;
                  async fn add(&self, link: &str, save_path: Option<&str>, tag: &str) -> Result<()>;
                  async fn progress(&self, tag: &str) -> Result<Option<Progress>>;
              }

              #[derive(Debug, Clone, Copy, Default, PartialEq, Eq, clap::ValueEnum, Deserialize)]
              #[serde(rename_all = "lowercase")]
              pub enum ClientKind {
                  #[default]
                  Qbit,
                  Transmission,
              }

              /// async fn이 든 trait은 dyn으로 못 쓰므로, 고를 수 있는 클라이언트를 enum으로 묶는다.
              pub enum Client {
                  Qbit(Qbit),
                  Transmission(Transmission),
              }

              impl Downloader for Client {
                  fn name(&self) -> &'static str {
                      match self {
                          Client::Qbit(c) => c.name(),
                          Client::Transmission(c) => c.name(),
                      }
                  }

                  async fn add(&self, link: &str, save_path: Option<&str>, tag: &str) -> Result<()> {
                      match self {
                          Client::Qbit(c) => c.add(link, save_path, tag).await,
                          Client::Transmission(c) => c.add(link, save_path, tag).await,
                      }
                  }

                  async fn progress(&self, tag: &str) -> Result<Option<Progress>> {
                      match self {
                          Client::Qbit(c) => c.progress(tag).await,
                          Client::Transmission(c) => c.progress(tag).await,
                      }
                  }
              }
      - message: "[16] transmission.rs — Mutex로 세션 ID 갱신하는 RPC 클라이언트"
        files:
          - path: src/transmission.rs
            content: |
              use std::sync::Mutex;

              use anyhow::{Context, Result, bail};
              use reqwest::StatusCode;
              use serde::Deserialize;
              use serde_json::{Value, json};

              use crate::downloader::{Downloader, Progress};

              const SESSION_HEADER: &str = "X-Transmission-Session-Id";

              /// Transmission RPC 클라이언트.
              /// 세션 ID는 서버가 409로 알려 줄 때마다 바뀌므로, &self 메서드 안에서도 고칠 수 있게 Mutex에 둔다.
              pub struct Transmission {
                  http: reqwest::Client,
                  url: String,
                  user: Option<String>,
                  pass: Option<String>,
                  session_id: Mutex<String>,
              }

              #[derive(Deserialize)]
              struct RpcResponse {
                  result: String,
                  #[serde(default)]
                  arguments: Value,
              }

              #[derive(Deserialize)]
              #[serde(rename_all = "camelCase")]
              struct Torrent {
                  name: String,
                  percent_done: f64,
                  rate_download: u64,
                  status: i64,
                  #[serde(default)]
                  labels: Vec<String>,
              }

              impl Transmission {
                  pub fn new(
                      http: reqwest::Client,
                      url: &str,
                      user: Option<String>,
                      pass: Option<String>,
                  ) -> Self {
                      Self {
                          http,
                          url: url.to_string(),
                          user,
                          pass,
                          session_id: Mutex::new(String::new()),
                      }
                  }

                  async fn rpc(&self, method: &str, arguments: Value) -> Result<Value> {
                      let body = json!({ "method": method, "arguments": arguments });
                      // 첫 요청은 세션 ID가 없어서 409를 받는 게 정상이다. 한 번 갱신하고 다시 보낸다.
                      for _ in 0..2 {
                          // lock()이 돌려준 가드는 이 문장이 끝나면 바로 풀린다. await 너머로 들고 가지 않는다.
                          let session_id = self.session_id.lock().unwrap().clone();
                          let mut req = self
                              .http
                              .post(&self.url)
                              .header(SESSION_HEADER, session_id)
                              .json(&body);
                          if let Some(user) = &self.user {
                              req = req.basic_auth(user, self.pass.as_deref());
                          }
                          let res = req
                              .send()
                              .await
                              .context("Transmission에 연결하지 못했어요")?;

                          if res.status() == StatusCode::CONFLICT {
                              let new_id = res
                                  .headers()
                                  .get(SESSION_HEADER)
                                  .and_then(|v| v.to_str().ok())
                                  .context("Transmission이 세션 ID를 주지 않았어요")?;
                              *self.session_id.lock().unwrap() = new_id.to_string();
                              continue;
                          }

                          let res: RpcResponse = res
                              .error_for_status()
                              .context("Transmission 요청 실패 (사용자/비밀번호를 확인하세요)")?
                              .json()
                              .await
                              .context("Transmission 응답을 해석하지 못했어요")?;
                          if res.result != "success" {
                              bail!("Transmission 오류: {}", res.result);
                          }
                          return Ok(res.arguments);
                      }
                      bail!("Transmission 세션을 맺지 못했어요")
                  }
              }

              fn status_name(status: i64) -> &'static str {
                  match status {
                      0 => "stopped",
                      1 | 2 => "checking",
                      3 => "queued",
                      4 => "downloading",
                      5 | 6 => "seeding",
                      _ => "unknown",
                  }
              }

              impl Downloader for Transmission {
                  fn name(&self) -> &'static str {
                      "Transmission"
                  }

                  async fn add(&self, link: &str, save_path: Option<&str>, tag: &str) -> Result<()> {
                      let mut args = json!({ "filename": link, "labels": [tag] });
                      if let Some(p) = save_path {
                          args["download-dir"] = json!(p);
                      }
                      self.rpc("torrent-add", args).await?;
                      Ok(())
                  }

                  async fn progress(&self, tag: &str) -> Result<Option<Progress>> {
                      let fields = ["name", "percentDone", "rateDownload", "status", "labels"];
                      let args = self.rpc("torrent-get", json!({ "fields": fields })).await?;
                      let torrents: Vec<Torrent> = serde_json::from_value(args["torrents"].clone())
                          .context("Transmission 토렌트 목록을 해석하지 못했어요")?;
                      Ok(torrents
                          .into_iter()
                          .find(|t| t.labels.iter().any(|l| l == tag))
                          .map(|t| Progress {
                              name: t.name,
                              done: t.percent_done,
                              speed: t.rate_download,
                              state: status_name(t.status).to_string(),
                          }))
                  }
              }
      - message: "[16] qbit.rs — impl Downloader for Qbit"
        files:
          - path: src/qbit.rs
            content: |
              use anyhow::{Context, Result, bail};
              use serde::Deserialize;

              use crate::downloader::{Downloader, Progress};

              /// qBittorrent Web API 클라이언트. 로그인 쿠키는 reqwest의 cookie_store가 들고 있는다.
              pub struct Qbit {
                  http: reqwest::Client,
                  base: String,
              }

              #[derive(Debug, Deserialize)]
              struct TorrentInfo {
                  name: String,
                  progress: f64,
                  dlspeed: u64,
                  state: String,
              }

              impl Qbit {
                  pub async fn login(http: reqwest::Client, url: &str, user: &str, pass: &str) -> Result<Self> {
                      let base = url.trim_end_matches('/').to_string();
                      let body = http
                          .post(format!("{base}/api/v2/auth/login"))
                          .header("Referer", &base)
                          .form(&[("username", user), ("password", pass)])
                          .send()
                          .await
                          .context("qBittorrent에 연결하지 못했어요")?
                          .text()
                          .await?;
                      if body.trim() != "Ok." {
                          bail!("qBittorrent 로그인 실패 (사용자/비밀번호를 확인하세요)");
                      }
                      Ok(Self { http, base })
                  }

                  async fn info_by_tag(&self, tag: &str) -> Result<Vec<TorrentInfo>> {
                      Ok(self
                          .http
                          .get(format!("{}/api/v2/torrents/info", self.base))
                          .header("Referer", &self.base)
                          .query(&[("tag", tag)])
                          .send()
                          .await?
                          .error_for_status()?
                          .json()
                          .await?)
                  }
              }

              impl Downloader for Qbit {
                  fn name(&self) -> &'static str {
                      "qBittorrent"
                  }

                  async fn add(&self, link: &str, save_path: Option<&str>, tag: &str) -> Result<()> {
                      let mut form = vec![("urls", link), ("tags", tag)];
                      if let Some(p) = save_path {
                          form.push(("savepath", p));
                      }
                      let res = self
                          .http
                          .post(format!("{}/api/v2/torrents/add", self.base))
                          .header("Referer", &self.base)
                          .form(&form)
                          .send()
                          .await?;
                      let status = res.status();
                      let body = res.text().await.unwrap_or_default();
                      if !status.is_success() || body.contains("Fails") {
                          bail!("토렌트 추가 실패 ({status}): {body}");
                      }
                      Ok(())
                  }

                  async fn progress(&self, tag: &str) -> Result<Option<Progress>> {
                      // magnet은 메타데이터를 받기 전까지 목록에 늦게 나타날 수 있다.
                      Ok(self
                          .info_by_tag(tag)
                          .await?
                          .into_iter()
                          .next()
                          .map(|t| Progress {
                              name: t.name,
                              done: t.progress,
                              speed: t.dlspeed,
                              state: t.state,
                          }))
                  }
              }
      - message: "[16] ui.rs — Progress로 진행률 그리기"
        files:
          - path: src/ui.rs
            content: |
              use std::io::{self, Write};

              use anyhow::Result;

              use crate::downloader::Progress;
              use crate::hit::Hit;

              /// 목록을 찍는다. recommended와 **같은 항목(같은 메모리 위치)** 앞에 ★를 붙인다.
              pub fn print_hits(hits: &[Hit], recommended: Option<&Hit>) {
                  for (i, h) in hits.iter().enumerate() {
                      let mark = if recommended.is_some_and(|r| std::ptr::eq(r, h)) {
                          "★"
                      } else {
                          " "
                      };
                      println!(
                          "{mark}{:>2}) {}\n      {}  seeders {}  [{}]",
                          i + 1,
                          h.title,
                          human_size(h.size),
                          h.seeders(),
                          h.indexer
                      );
                  }
              }

              pub fn prompt_choice(max: usize) -> Result<Option<usize>> {
                  loop {
                      print!("선택 (1-{max}, 엔터=취소)> ");
                      io::stdout().flush()?;

                      let mut line = String::new();
                      io::stdin().read_line(&mut line)?;
                      let line = line.trim();

                      if line.is_empty() || line.eq_ignore_ascii_case("q") {
                          return Ok(None);
                      }
                      match line.parse::<usize>() {
                          Ok(n) if (1..=max).contains(&n) => return Ok(Some(n - 1)),
                          _ => println!("1-{max} 사이 숫자를 입력하세요"),
                      }
                  }
              }

              /// 한 줄을 \r 로 덮어쓰며 진행률을 그린다.
              pub fn print_progress(p: &Progress) -> Result<()> {
                  const WIDTH: usize = 20;
                  let filled = ((p.done * WIDTH as f64) as usize).min(WIDTH);
                  print!(
                      "\r[{}{}] {:>5.1}%  {}/s  {}    ",
                      "#".repeat(filled),
                      "-".repeat(WIDTH - filled),
                      p.done * 100.0,
                      human_size(p.speed),
                      p.state
                  );
                  io::stdout().flush()?;
                  Ok(())
              }

              pub fn human_size(bytes: u64) -> String {
                  const UNITS: [&str; 5] = ["B", "KB", "MB", "GB", "TB"];
                  let mut v = bytes as f64;
                  let mut u = 0;
                  while v >= 1024.0 && u < UNITS.len() - 1 {
                      v /= 1024.0;
                      u += 1;
                  }
                  format!("{v:.1}{}", UNITS[u])
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  #[test]
                  fn human_size_units() {
                      assert_eq!(human_size(0), "0.0B");
                      assert_eq!(human_size(1023), "1023.0B");
                      assert_eq!(human_size(1024), "1.0KB");
                      assert_eq!(human_size(1536), "1.5KB");
                      assert_eq!(human_size(5 * 1024 * 1024 * 1024), "5.0GB");
                  }

                  #[test]
                  fn human_size_caps_at_tb() {
                      assert_eq!(human_size(2048 * 1024u64.pow(4)), "2048.0TB");
                  }
              }
