        files:
          - path: src/qbit.rs
            content: |
              use anyhow::{Context, Result, bail};
              use serde::Deserialize;

              /// qBittorrent Web API 클라이언트. 로그인 쿠키는 reqwest의 cookie_store가 들고 있는다.
              pub struct Qbit {
                  http: reqwest::Client,
                  base: String,
              }

              #[derive(Debug, Deserialize)]
              pub struct TorrentInfo {
                  pub name: String,
                  pub progress: f64,
                  pub dlspeed: u64,
                  pub state: String,
              }

              impl Qbit {
                  pub async fn login(http: reqwest::Client, url: &str, user: &str, pass: &str) -> Result<Self> {
                      let base = url.trim_end_matches('/').to_string();
                      let body = http
                          .post(format!("{base}/api/v2/auth/login"))
                          .header("Referer", &base)
                          .form(&[("username", user), ("password", pass)])
                          .send()
                          .await
                          .context("qBittorrent에 연결하지 못했어요")?
                          .text()
                          .await?;
                      if body.trim() != "Ok." {
                          bail!("qBittorrent 로그인 실패 (사용자/비밀번호를 확인하세요)");
                      }
                      Ok(Self { http, base })
                  }

                  pub async fn add(&self, link: &str, save_path: Option<&str>, tag: &str) -> Result<()> {
                      let mut form = vec![("urls", link), ("tags", tag)];
                      if let Some(p) = save_path {
                          form.push(("savepath", p));
                      }
                      let res = self
                          .http
                          .post(format!("{}/api/v2/torrents/add", self.base))
                          .header("Referer", &self.base)
                          .form(&form)
                          .send()
                          .await?;
                      let status = res.status();
                      let body = res.text().await.unwrap_or_default();
                      if !status.is_success() || body.contains("Fails") {
                          bail!("토렌트 추가 실패 ({status}): {body}");
                      }
                      Ok(())
                  }

                  pub async fn info_by_tag(&self, tag: &str) -> Result<Vec<TorrentInfo>> {
                      Ok(self
                          .http
                          .get(format!("{}/api/v2/torrents/info", self.base))
                          .header("Referer", &self.base)
                          .query(&[("tag", tag)])
                          .send()
                          .await?
                          .error_for_status()?
                          .json()
                          .await?)
                  }
              }
      - message: "[11] ui.rs — 한 줄 덮어쓰는 진행률 막대"
        files:
          - path: src/ui.rs
            content: |
              use std::io::{self, Write};

              use anyhow::Result;

              use crate::hit::Hit;
              use crate::qbit::TorrentInfo;

              pub fn print_hits(hits: &[Hit]) {
                  for (i, h) in hits.iter().enumerate() {
                      println!(
                          "{:>2}) {}\n     {}  seeders {}  [{}]",
                          i + 1,
                          h.title,
                          human_size(h.size),
                          h.seeders(),
                          h.indexer
                      );
                  }
              }

              pub fn prompt_choice(max: usize) -> Result<Option<usize>> {
                  loop {
                      print!("선택 (1-{max}, 엔터=취소)> ");
                      io::stdout().flush()?;

                      let mut line = String::new();
                      io::stdin().read_line(&mut line)?;
                      let line = line.trim();

                      if line.is_empty() || line.eq_ignore_ascii_case("q") {
                          return Ok(None);
                      }
                      match line.parse::<usize>() {
                          Ok(n) if (1..=max).contains(&n) => return Ok(Some(n - 1)),
                          _ => println!("1-{max} 사이 숫자를 입력하세요"),
                      }
                  }
              }

              /// 한 줄을 \r 로 덮어쓰며 진행률을 그린다.
              pub fn print_progress(t: &TorrentInfo) -> Result<()> {
                  const WIDTH: usize = 20;
                  let filled = ((t.progress * WIDTH as f64) as usize).min(WIDTH);
                  print!(
                      "\r[{}{}] {:>5.1}%  {}/s  {}    ",
                      "#".repeat(filled),
                      "-".repeat(WIDTH - filled),
                      t.progress * 100.0,
                      human_size(t.dlspeed),
                      t.state
                  );
                  io::stdout().flush()?;
                  Ok(())
              }

              pub fn human_size(bytes: u64) -> String {
                  const UNITS: [&str; 5] = ["B", "KB", "MB", "GB", "TB"];
                  let mut v = bytes as f64;
                  let mut u = 0;
                  while v >= 1024.0 && u < UNITS.len() - 1 {
                      v /= 1024.0;
                      u += 1;
                  }
                  format!("{v:.1}{}", UNITS[u])
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  #[test]
                  fn human_size_units() {
                      assert_eq!(human_size(0), "0.0B");
                      assert_eq!(human_size(1023), "1023.0B");
                      assert_eq!(human_size(1024), "1.0KB");
                      assert_eq!(human_size(1536), "1.5KB");
                      assert_eq!(human_size(5 * 1024 * 1024 * 1024), "5.0GB");
                  }

                  #[test]
                  fn human_size_caps_at_tb() {
                      assert_eq!(human_size(2048 * 1024u64.pow(4)), "2048.0TB");
                  }
              }
      - message: "[11] main.rs — 고유 태그와 watch 루프"
        files:
          - path: src/main.rs
            content: |
              mod cli;
              mod config;
              mod hit;
              mod prowlarr;
              mod qbit;
              mod ui;

              use std::time::{Duration, SystemTime, UNIX_EPOCH};

              use anyhow::{Result, bail};
              use clap::Parser;

              use cli::Args;
              use config::Settings;
              use qbit::Qbit;

              #[tokio::main]
              async fn main() -> Result<()> {
                  let args = Args::parse();
                  let settings = Settings::load(&args)?;
                  let http = reqwest::Client::builder().cookie_store(true).build()?;

                  let hits = match &args.fixture {
                      Some(path) => prowlarr::load_fixture(path)?,
                      None => prowlarr::search(&http, &settings, &args.query).await?,
                  };
                  let hits = hit::rank(hits, args.min_seeders, args.limit);

                  if hits.is_empty() {
                      bail!("'{}' 에 해당하는 토렌트를 찾지 못했어요", args.query);
                  }

                  ui::print_hits(&hits);

                  if args.dry_run {
                      return Ok(());
                  }

                  let chosen = if args.first {
                      &hits[0]
                  } else {
                      match ui::prompt_choice(hits.len())? {
                          Some(i) => &hits[i],
                          None => {
                              println!("취소했어요");
                              return Ok(());
                          }
                      }
                  };

                  let qbit = Qbit::login(http, &settings.qbit_url, &settings.qbit_user, &settings.qbit_pass).await?;
                  let tag = new_tag();
                  qbit.add(chosen.link().unwrap(), settings.save_path.as_deref(), &tag)
                      .await?;
                  println!("→ qBittorrent에 추가됨: {}", chosen.title);

                  if args.watch {
                      watch(&qbit, &tag).await?;
                  }
                  Ok(())
              }

              /// 이번에 추가한 토렌트만 찾아내기 위한 고유 태그.
              fn new_tag() -> String {
                  let secs = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .map(|d| d.as_secs())
                      .unwrap_or(0);
                  format!("tget-{secs}")
              }

              async fn watch(qbit: &Qbit, tag: &str) -> Result<()> {
                  println!("진행률을 지켜보는 중… (Ctrl+C로 그만 보기, 다운로드는 계속돼요)");
                  loop {
                      // magnet은 메타데이터를 받기 전까지 목록에 늦게 나타날 수 있다.
                      if let Some(t) = qbit.info_by_tag(tag).await?.first() {
                          ui::print_progress(t)?;
                          if t.progress >= 1.0 {
                              println!("\n완료: {}", t.name);
                              return Ok(());
                          }
                      }
                      tokio::time::sleep(Duration::from_secs(2)).await;
                  }
              }
  - id: "12"
    title: 마무리와 배포
    doc: |
      # 마무리와 배포

      체크리스트예요. 하나씩 지우세요.

      - [ ] `cargo fmt` → 코드 스타일 통일
      - [ ] `cargo clippy` → 경고 0개. **적어도 하나는 나올 거예요.** sort_by 쪽을 보고, 제안대로 고친 뒤 왜 그게 더 나은지 설명해 보세요. (힌트: `std::cmp::Reverse`)
      - [ ] `cargo test` 전부 초록
      - [ ] `unwrap()` 을 전부 찾아(`grep -n unwrap src/*.rs`) 각각 "절대 패닉하지 않는 이유"를 말할 수 있는지. 말 못 하면 고치기.
      - [ ] `--help` 를 읽어 보고, 설명 없는 옵션에 문서 주석 달기
      - [ ] `cargo build --release` 후 `ls -lh target/debug/tget target/release/tget` 로 크기 비교. 왜 다를까요?
      - [ ] `cargo install --path .` → `~/.cargo/bin/tget` 에 설치. 이제 아무 폴더에서 `tget ubuntu` 가 돼요.
      - [ ] README.md: 무엇인지, 설치, 설정 파일 예시, 사용 예, "합법 파일용" 안내
      - [ ] `git status` 로 `target/`, 설정 파일, API 키가 커밋 대상에 없는지 확인 후 커밋
      - [ ] (선택) 개인 git 서버(예: git.example.com)에 저장소 만들고 push

      ▶ `src/hit.rs` — 재생에서 따라 칩니다 (clippy 제안 반영)

      ▶ `src/cli.rs` — 재생에서 따라 칩니다 (문서 주석)

      ▶ `src/config.rs`, `src/prowlarr.rs`, `src/main.rs` — 재생에서 따라 칩니다 (`cargo fmt` 결과)

      ▶ `README.md` — 재생에서 따라 칩니다

      ## 정답 노트에서

      `cargo clippy` 가 `unnecessary_sort_by` 를 알려 줘요. `hits.sort_by_key(|h| std::cmp::Reverse(h.seeders()));` 로 바꿔요.

      - 비교 함수를 직접 쓰면 a/b를 뒤집는 실수를 하기 쉬워요. "이 키로 정렬, 단 반대로"라고 **의도를 그대로** 적는 쪽이 읽기 쉽고 틀리기 어려워요.
      - debug와 release의 크기 차이: debug는 디버그 정보가 들어 있고 최적화를 하지 않아요. release는 최적화를 하고, 디버그 정보도 기본으로 빠져요.
    steps:
      - message: "[12] hit.rs — clippy 제안대로 sort_by_key + Reverse"
        files:
          - path: src/hit.rs
            content: |
              use serde::Deserialize;

              /// Prowlarr 검색 결과 한 건.
              #[derive(Debug, Deserialize)]
              #[serde(rename_all = "camelCase")]
              pub struct Hit {
                  pub title: String,
                  #[serde(default)]
                  pub size: u64,
                  pub seeders: Option<u32>,
                  #[serde(default)]
                  pub indexer: String,
                  pub magnet_url: Option<String>,
                  pub download_url: Option<String>,
              }

              impl Hit {
                  pub fn seeders(&self) -> u32 {
                      self.seeders.unwrap_or(0)
                  }

                  pub fn link(&self) -> Option<&str> {
                      self.magnet_url
                          .as_deref()
                          .or(self.download_url.as_deref())
                          .filter(|s| !s.is_empty())
                  }
              }

              /// 받을 수 없는 결과를 걸러내고 시더 많은 순으로 limit개만 남긴다.
              pub fn rank(mut hits: Vec<Hit>, min_seeders: u32, limit: usize) -> Vec<Hit> {
                  hits.retain(|h| h.seeders() >= min_seeders && h.link().is_some());
                  hits.sort_by_key(|h| std::cmp::Reverse(h.seeders()));
                  hits.truncate(limit);
                  hits
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  fn fixture() -> Vec<Hit> {
                      serde_json::from_str(include_str!("../fixtures/search.json")).unwrap()
                  }

                  #[test]
                  fn parses_fixture() {
                      let hits = fixture();
                      assert_eq!(hits.len(), 5);
                      assert_eq!(hits[3].seeders, None);
                      assert_eq!(hits[4].link(), None);
                  }

                  #[test]
                  fn magnet_is_preferred() {
                      let hit = Hit {
                          title: "a".into(),
                          size: 0,
                          seeders: None,
                          indexer: String::new(),
                          magnet_url: Some("magnet:x".into()),
                          download_url: Some("http://y".into()),
                      };
                      assert_eq!(hit.link(), Some("magnet:x"));
                  }

                  #[test]
                  fn rank_filters_and_sorts() {
                      let ranked = rank(fixture(), 1, 10);
                      let titles: Vec<_> = ranked.iter().map(|h| h.title.as_str()).collect();
                      assert_eq!(
                          titles,
                          [
                              "ubuntu-24.04.1-desktop-amd64.iso",
                              "ubuntu-24.04-live-server-amd64.iso"
                          ]
                      );
                  }

                  #[test]
                  fn rank_respects_limit() {
                      assert_eq!(rank(fixture(), 0, 1).len(), 1);
                  }
              }
