      - message: "[16] config.rs — client·Transmission 설정 병합"
        files:
          - path: src/config.rs
            content: |
              use std::fs;
              use std::path::{Path, PathBuf};

              use anyhow::{Context, Result};
              use serde::Deserialize;

              use crate::cli::Args;
              use crate::downloader::ClientKind;

              /// config.toml 의 모양. 모든 칸이 비어 있어도 된다.
              #[derive(Debug, Default, Deserialize)]
              pub struct FileConfig {
                  pub prowlarr_url: Option<String>,
                  pub prowlarr_api_key: Option<String>,
                  pub qbit_url: Option<String>,
                  pub qbit_user: Option<String>,
                  pub qbit_pass: Option<String>,
                  pub save_path: Option<String>,
                  pub client: Option<ClientKind>,
                  pub transmission_url: Option<String>,
                  pub transmission_user: Option<String>,
                  pub transmission_pass: Option<String>,
              }

              /// CLI/환경변수 > 설정 파일 > 기본값 순으로 합친 최종 설정.
              #[derive(Debug)]
              pub struct Settings {
                  pub prowlarr_url: String,
                  pub prowlarr_api_key: Option<String>,
                  pub qbit_url: String,
                  pub qbit_user: String,
                  pub qbit_pass: String,
                  pub save_path: Option<String>,
                  pub client: ClientKind,
                  pub transmission_url: String,
                  pub transmission_user: Option<String>,
                  pub transmission_pass: Option<String>,
              }

              impl Settings {
                  pub fn load(args: &Args) -> Result<Self> {
                      let file = match &args.config {
                          Some(path) => read_file(path)?,
                          None => match default_path() {
                              Some(path) if path.exists() => read_file(&path)?,
                              _ => FileConfig::default(),
                          },
                      };
                      Ok(Self::merge(args, file))
                  }

                  fn merge(args: &Args, file: FileConfig) -> Self {
                      Self {
                          prowlarr_url: args
                              .prowlarr_url
                              .clone()
                              .or(file.prowlarr_url)
                              .unwrap_or_else(|| "http://localhost:9696".into()),
                          prowlarr_api_key: args.prowlarr_api_key.clone().or(file.prowlarr_api_key),
                          qbit_url: args
                              .qbit_url
                              .clone()
                              .or(file.qbit_url)
                              .unwrap_or_else(|| "http://localhost:8080".into()),
                          qbit_user: args
                              .qbit_user
                              .clone()
                              .or(file.qbit_user)
                              .unwrap_or_else(|| "admin".into()),
                          qbit_pass: args
                              .qbit_pass
                              .clone()
                              .or(file.qbit_pass)
                              .unwrap_or_default(),
                          save_path: args.save_path.clone().or(file.save_path),
                          client: args.client.or(file.client).unwrap_or_default(),
                          transmission_url: args
                              .transmission_url
                              .clone()
                              .or(file.transmission_url)
                              .unwrap_or_else(|| "http://localhost:9091/transmission/rpc".into()),
                          transmission_user: args.transmission_user.clone().or(file.transmission_user),
                          transmission_pass: args.transmission_pass.clone().or(file.transmission_pass),
                      }
                  }
              }

              fn default_path() -> Option<PathBuf> {
                  let base = std::env::var_os("XDG_CONFIG_HOME")
                      .map(PathBuf::from)
                      .or_else(|| dirs::home_dir().map(|h| h.join(".config")))?;
                  Some(base.join("tget").join("config.toml"))
              }

              fn read_file(path: &Path) -> Result<FileConfig> {
                  let raw = fs::read_to_string(path)
                      .with_context(|| format!("설정 파일 {} 을 읽지 못했어요", path.display()))?;
                  toml::from_str(&raw).with_context(|| format!("설정 파일 {} 형식이 잘못됐어요", path.display()))
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use clap::Parser;

                  #[test]
                  fn cli_wins_over_file() {
                      let args = Args::parse_from(["tget", "x", "--qbit-url", "http://cli:1"]);
                      let file = FileConfig {
                          qbit_url: Some("http://file:2".into()),
                          qbit_user: Some("me".into()),
                          ..Default::default()
                      };
                      let s = Settings::merge(&args, file);
                      assert_eq!(s.qbit_url, "http://cli:1");
                      assert_eq!(s.qbit_user, "me");
                      assert_eq!(s.prowlarr_url, "http://localhost:9696");
                  }

                  #[test]
                  fn client_from_file() {
                      let args = Args::parse_from(["tget", "x"]);
                      let file: FileConfig = toml::from_str(r#"client = "transmission""#).unwrap();
                      let s = Settings::merge(&args, file);
                      assert_eq!(s.client, ClientKind::Transmission);
                  }
              }
      - message: "[16] main.rs — 클라이언트 고르기와 제네릭 watch"
        files:
          - path: src/main.rs
            content: |
              mod cli;
              mod config;
              mod downloader;
              mod hit;
              mod prowlarr;
              mod qbit;
              mod transmission;
              mod ui;

              use std::sync::Arc;
              use std::time::{Duration, SystemTime, UNIX_EPOCH};

              use anyhow::{Context, Result, bail};
              use clap::Parser;

              use cli::Args;
              use config::Settings;
              use downloader::{Client, ClientKind, Downloader};
              use qbit::Qbit;
              use transmission::Transmission;

              #[tokio::main]
              async fn main() -> Result<()> {
                  let args = Args::parse();
                  let settings = Arc::new(Settings::load(&args)?);
                  let http = reqwest::Client::builder().cookie_store(true).build()?;

                  let raws = match &args.fixture {
                      Some(path) => vec![prowlarr::load_fixture(path)?],
                      None => {
                          let timeout = Duration::from_secs(args.timeout);
                          let results =
                              prowlarr::search_all(&http, Arc::clone(&settings), &args.query, timeout).await?;
                          let mut raws = Vec::new();
                          for r in results {
                              match r.body {
                                  Ok(body) => raws.push(body),
                                  Err(e) => eprintln!("⚠ {}: {e:#}", r.name),
                              }
                          }
                          raws
                      }
                  };

                  let mut hits = Vec::new();
                  for raw in &raws {
                      hits.extend(hit::parse(raw).context("검색 결과를 해석하지 못했어요")?);
                  }
                  let hits = hit::rank(hits, args.min_seeders, args.limit);

                  if hits.is_empty() {
                      bail!("'{}' 에 해당하는 토렌트를 찾지 못했어요", args.query);
                  }

                  let recommended = hit::best(&hits, &args.query);
                  ui::print_hits(&hits, recommended);

                  if args.dry_run {
                      return Ok(());
                  }

                  let chosen = if args.first {
                      recommended.unwrap_or(&hits[0])
                  } else {
                      match ui::prompt_choice(hits.len())? {
                          Some(i) => &hits[i],
                          None => {
                              println!("취소했어요");
                              return Ok(());
                          }
                      }
                  };

                  let client = match settings.client {
                      ClientKind::Qbit => Client::Qbit(
                          Qbit::login(
                              http,
                              &settings.qbit_url,
                              &settings.qbit_user,
                              &settings.qbit_pass,
                          )
                          .await?,
                      ),
                      ClientKind::Transmission => Client::Transmission(Transmission::new(
                          http,
                          &settings.transmission_url,
                          settings.transmission_user.clone(),
                          settings.transmission_pass.clone(),
                      )),
                  };
                  let tag = new_tag();
                  client
                      .add(chosen.link().unwrap(), settings.save_path.as_deref(), &tag)
                      .await?;
                  println!("→ {}에 추가됨: {}", client.name(), chosen.title);

                  if args.watch {
                      watch(&client, &tag).await?;
                  }
                  Ok(())
              }

              /// 이번에 추가한 토렌트만 찾아내기 위한 고유 태그.
              fn new_tag() -> String {
                  let secs = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .map(|d| d.as_secs())
                      .unwrap_or(0);
                  format!("tget-{secs}")
              }

              async fn watch<D: Downloader>(client: &D, tag: &str) -> Result<()> {
                  println!("진행률을 지켜보는 중… (Ctrl+C로 그만 보기, 다운로드는 계속돼요)");
                  loop {
                      if let Some(p) = client.progress(tag).await? {
                          ui::print_progress(&p)?;
                          if p.done >= 1.0 {
                              println!("\n완료: {}", p.name);
                              return Ok(());
                          }
                      }
                      tokio::time::sleep(Duration::from_secs(2)).await;
                  }
              }
  - id: "17"
    title: 직접 만드는 에러 타입
    doc: |
      # 직접 만드는 에러 타입

      **목표:** 실패 원인마다 **다른 종료 코드**로 끝나게 해서, 셸 스크립트가 "설정이 틀렸는지, 인증이 틀렸는지, 서버가 죽었는지" 구분할 수 있게 한다.

      **새로 배우는 것:** `thiserror` 로 에러 enum 만들기, `#[source]` 와 `#[from]`, `?` 가 몰래 하는 `From` 변환, anyhow와 thiserror의 역할 분담, `std::process::ExitCode`, 원인 사슬에서 타입 찾기

      ### 17-1. 요구사항

      | 종료 코드 | 상황 |
      | --- | --- |
      | 0 | 성공 (취소 포함) |
      | 1 | 그 밖의 모든 실패 (결과 없음 등) |
      | 2 | 설정 파일을 읽지 못함 / 형식이 잘못됨 |
      | 3 | Prowlarr API 키가 없음 / 인증 실패 (Prowlarr, qBittorrent, Transmission) |
      | 4 | 연결 실패, 시간 초과, 그 밖의 HTTP 오류 |

      - 에러 메시지와 `Caused by:` 원인 사슬은 **지금과 똑같이** 보여야 해요.
      - 인증 실패를 정확히 잡으려면: Prowlarr는 응답 상태 **401**, qBittorrent는 로그인 본문이 `Ok.` 가 아님, Transmission은 **401**.

      ### 17-2. 설계 방향

      - `cargo add thiserror`
      - 새 모듈 `error.rs` 에 `pub enum TgetError` 를 만들어요. 변형(variant) 후보:
        - ConfigRead { path, source: io 에러 }
        - ConfigParse { path, source: toml 에러 }
        - MissingApiKey
        - Unauthorized { service }
        - Connect { service, source: reqwest 에러 }
        - Timeout { secs }
        - Task (태스크 패닉, JoinError에서 변환)
        - Http (그 밖의 reqwest 에러, 자동 변환)
      - `impl TgetError { pub fn exit_code(&self) -> u8 }`
      - **역할 분담:** config, prowlarr, qbit 로그인처럼 "무엇이 잘못됐는지 구분이 중요한" 곳은 `Result<T, TgetError>`. main과 나머지 흐름은 계속 `anyhow::Result`. anyhow는 어떤 에러든 받아 줘서, TgetError를 `?` 로 올리면 그대로 담겨요.
      - main은 `async fn run() -> anyhow::Result<()>` 로 본체를 옮기고, `main` 은 `ExitCode` 를 돌려주게. 에러를 `eprintln!("Error: {e:?}")` 로 찍으면 지금과 같은 모양이 나와요.

      ▶ `Cargo.toml` — 재생에서 따라 칩니다

      ▶ `src/error.rs` — 재생에서 따라 칩니다

      ### 17-3. 부숴 보기: ? 가 하는 일

      config.rs의 read_file을 `Result<FileConfig, TgetError>` 로 바꾸고, 본문은 그대로 `fs::read_to_string(path)?` 로 두면:

      ```
      error[E0277]: `?` couldn't convert the error to `TgetError`
         |
      95 | fn read_file(path: &Path) -> Result<FileConfig, TgetError> {
         |                              ----------------------------- expected `TgetError` because of this
      96 |     let raw = fs::read_to_string(path)?;
         |               ------------------------^ the trait `From<std::io::Error>` is not implemented for `TgetError`
         |               |
         |               this can't be annotated with `?` because it has type `Result<_, std::io::Error>`
         |
      note: `TgetError` needs to implement `From<std::io::Error>`
         = note: the question mark operation (`?`) implicitly performs a conversion on the error value using the `From` trait
      ```

      마지막 note가 핵심이에요. **`?` 는 에러를 돌려주기 전에 `From::from` 으로 변환해요.** 그동안 anyhow에서 `?` 가 아무 에러나 받아 준 것도 anyhow가 모든 에러에 대해 From을 구현해 뒀기 때문이에요.

      고치는 길은 두 가지예요.

      - `#[from] std::io::Error` 로 자동 변환을 만든다 → **하지만 path를 담을 수 없어요.** #[from] 변형에는 원인 에러 말고 다른 칸을 둘 수 없거든요. 어느 파일인지 모르는 에러 메시지가 돼요.
      - `.map_err(|source| TgetError::ConfigRead { path: path.to_path_buf(), source })?` 로 **직접** 감싼다 → 이쪽을 쓰세요.

      ▶ `src/config.rs` — 재생에서 따라 칩니다

      ### 17-4. 힌트만

      <details><summary>힌트: thiserror 속성</summary>

      - `#[error("...")]` 가 Display 메시지가 돼요. 칸 이름을 `{service}` 처럼 쓸 수 있어요. PathBuf는 Display가 없어서 `#[error("... {} ...", path.display())]` 처럼 식을 넘겨요.
      - `#[source]` 를 붙인 칸이 `Caused by:` 사슬로 이어져요. 단, **칸 이름이 `source` 면 속성이 없어도 자동으로** 원인이 돼요. 실험: `#[source]` 만 빼면 출력이 그대로이고, 칸 이름까지 `cause` 로 바꾸면 `Caused by:` 가 사라져요. 둘 다 해 보세요.
      - `#[error(transparent)]` 는 "내 메시지 없이 안쪽 에러를 그대로 보여 줘".

      </details>

      <details><summary>힌트: 종료 코드 찾기</summary>

      - anyhow 에러에 context가 몇 겹 씌워져 있어도, `e.chain()` 은 원인 사슬의 모든 에러를 차례로 보여 줘요.
      - 각 원인에 `downcast_ref::<TgetError>()` 를 시도해서 처음 찾은 것의 exit_code. 못 찾으면 1.
      - 이걸 `pub fn exit_code_of(err: &anyhow::Error) -> u8` 로 error.rs에 두면 테스트하기 좋아요.

      </details>

      <details><summary>힌트: 인증 실패 구분</summary>

      - `res.status() == StatusCode::UNAUTHORIZED` 를 `error_for_status()` **보다 먼저** 검사해야 해요. 순서가 바뀌면 401이 일반 HTTP 에러로 뭉개져요.
      - Prowlarr의 send 부분을 `async fn send(req: RequestBuilder) -> Result<Response, TgetError>` 같은 함수로 모으면 indexers와 search_one이 같이 써요.

      </details>

      <details><summary>힌트: 시간 초과</summary>

      - Stage 15의 `anyhow!("{}초 안에 응답이 없어요")` 를 `TgetError::Timeout { secs }` 로. 그러면 IndexerResult.body도 `Result<String, TgetError>` 가 돼요.

      </details>

      ▶ `src/prowlarr.rs` — 재생에서 따라 칩니다

      ▶ `src/qbit.rs` — 재생에서 따라 칩니다

      ▶ `src/transmission.rs` — 재생에서 따라 칩니다

      ▶ `src/main.rs` — 재생에서 따라 칩니다

      ### 17-5. 테스트

      - [ ] context를 씌운 MissingApiKey에서 exit_code_of가 3
      - [ ] TgetError가 없는 anyhow 에러에서 1
      - [ ] 기존 테스트 전부 통과

      ### 확인

      가짜 서버 세 개를 켜 두고 `echo $?` 로 확인하세요.

      | 명령 (공통 옵션 생략) | 기대 종료 코드 |
      | --- | --- |
      | `x --config 깨진.toml` | 2 |
      | `x --config 없는파일.toml` | 2 |
      | API 키 없이 `x --dry-run` | 3 |
      | `--prowlarr-url http://127.0.0.1:19696 --prowlarr-api-key nope` | 3 |
      | `--prowlarr-url http://127.0.0.1:1 --prowlarr-api-key key` | 4 |
      | fixture + `-f --qbit-url http://127.0.0.1:18080 --qbit-pass wrong` | 3 |
      | fixture + `zzz --dry-run --min-seeders 99999` | 1 |
      | fixture + `-f --qbit-url http://127.0.0.1:18080 --qbit-pass pw` | 0 |

      API 키 없이 확인할 땐 셸에 PROWLARR_API_KEY가 export되어 있지 않은지, 기본 설정 파일에 키가 들어 있지 않은지도 확인하세요.

      ### 이해 체크

      - 라이브러리를 만든다면 왜 anyhow 대신 thiserror 쪽 에러를 공개해야 할까요?
      - `#[from]` 을 남발하면 생기는 문제는? (힌트: 어느 단계에서 난 io 에러인지)
      - 종료 코드를 정할 때 "0과 1 말고는 전부 우리 마음대로"일까요? 셸에서 이미 의미가 있는 코드 범위를 찾아보세요.

      ## Part 2 마무리 체크리스트

      - [ ] `cargo clippy --all-targets` 경고 0, `cargo fmt --check` 통과
      - [ ] `cargo test` 전부 통과 (정답 기준 12개)
      - [ ] 부숴 보기에서 본 에러들을 **내 말로** 한 줄씩 정리한 노트 만들기 (E0515, E0505, E0502, E0106, E0716, E0521, E0038, E0594, E0277, Send/Sync 에러)
      - [ ] Part 1 Stage 12의 unwrap 점검을 다시: Part 2에서 새로 생긴 unwrap(락 등)에도 이유 달기
      - [ ] 커밋

      > 🎓 여기까지 오면 **"빌림 검사기가 왜 화를 내는지 설명할 수 있는"** 단계예요. 다음으로는 보너스 과제 6번(wiremock 통합 테스트)이나, 16-5의 우회 3번(Box에 담은 Future)을 직접 구현해 보는 걸 추천해요. 둘 다 이번 Part의 개념을 한 번 더 꺼내 쓰게 돼요.

      ## 정답 노트에서

      - `match` 에 `_ =>` 를 **쓰지 않은** 이유: 나중에 변형을 하나 추가하면 컴파일러가 "exit_code에서 이걸 처리 안 했다"고 알려 줘요. 와일드카드를 쓰면 조용히 넘어가요.
      - `Settings::load` 의 반환 타입도 `Result<Self, TgetError>` 로. config.rs에서 anyhow import는 이제 필요 없어요.
      - indexers는 `Ok(send(req).await?.json().await?)`, search_one은 `Ok(send(req).await?.text().await?)` 로 줄어들어요. `?` 가 reqwest::Error를 `#[from]` 으로 Http 변형에 넣어 줘요.
      - search_all의 `joined?` 는 JoinError를 Task 변형으로 바꿔요.
      - qBittorrent 로그인은 `.map_err(|source| TgetError::Connect { service: "qBittorrent", source })` 와, 본문이 `Ok.` 가 아닐 때 `Unauthorized { service: "qBittorrent" }`. Transmission도 같은 모양이고, 401은 `.into()` 로 anyhow에 담아 돌려줘요.
      - 라이브러리 사용자는 에러 **종류**를 보고 분기해야 해요(재시도할지, 사용자에게 알릴지). anyhow는 "뭔가 실패했다"만 남겨서 분기가 어렵고, 사용자의 에러 처리 방식을 강요해요.
      - 서로 다른 단계(설정 읽기, 캐시 읽기 등)의 io 에러가 모두 같은 변형으로 뭉개져서 **어디서** 났는지 잃어버려요. ConfigRead에 path를 넣은 게 바로 그 이유예요.
      - 아니에요. 셸에서 126(실행 권한 없음), 127(명령 없음), 128 이상(시그널로 종료, 예: Ctrl+C는 130)은 이미 의미가 있어요. sysexits.h의 64–78 범위를 관례로 쓰는 프로그램도 있어요. 작은 숫자(2–4)를 쓴 tget은 안전한 쪽이에요.
    steps:
      - message: "[17] Cargo.toml — thiserror 추가"
        files:
          - path: Cargo.toml
            content: |
              [package]
              name = "tget"
              version = "0.1.0"
              edition = "2024"

              [dependencies]
              anyhow = "1.0.104"
              clap = { version = "4.6.7", features = ["derive", "env"] }
              dirs = "7.0.0"
              reqwest = { version = "0.13.5", features = ["json", "cookies", "query", "form"] }
              serde = { version = "1.0.229", features = ["derive"] }
              serde_json = "1.0.154"
              thiserror = "2.0.21"
              tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
              toml = "1.1.8"
      - message: "[17] error.rs — TgetError와 종료 코드"
        files:
          - path: src/error.rs
            content: |
              use std::path::PathBuf;

              use thiserror::Error;

              /// tget이 "알고 있는" 실패들. 종류마다 다른 종료 코드를 준다.
              #[derive(Debug, Error)]
              pub enum TgetError {
                  #[error("설정 파일 {} 을 읽지 못했어요", path.display())]
                  ConfigRead {
                      path: PathBuf,
                      #[source]
                      source: std::io::Error,
                  },

                  #[error("설정 파일 {} 형식이 잘못됐어요", path.display())]
                  ConfigParse {
                      path: PathBuf,
                      #[source]
                      source: toml::de::Error,
                  },

                  #[error("Prowlarr API 키가 필요해요 (PROWLARR_API_KEY 또는 config.toml)")]
                  MissingApiKey,

                  #[error("{service} 인증 실패 (API 키나 비밀번호를 확인하세요)")]
                  Unauthorized { service: &'static str },

                  #[error("{service}에 연결하지 못했어요")]
                  Connect {
                      service: &'static str,
                      #[source]
                      source: reqwest::Error,
                  },

                  #[error("{secs}초 안에 응답이 없어요")]
                  Timeout { secs: u64 },

                  #[error("검색 태스크가 비정상 종료됐어요")]
                  Task(#[from] tokio::task::JoinError),

                  #[error(transparent)]
                  Http(#[from] reqwest::Error),
              }

              impl TgetError {
                  /// 셸 스크립트에서 실패 원인을 구분할 수 있게 하는 종료 코드.
                  pub fn exit_code(&self) -> u8 {
                      match self {
                          TgetError::ConfigRead { .. } | TgetError::ConfigParse { .. } => 2,
                          TgetError::MissingApiKey | TgetError::Unauthorized { .. } => 3,
                          TgetError::Connect { .. } | TgetError::Timeout { .. } | TgetError::Http(_) => 4,
                          TgetError::Task(_) => 1,
                      }
                  }
              }

              /// 원인 사슬 어딘가에 TgetError가 있으면 그 종료 코드, 없으면 1.
              /// context가 몇 겹 씌워져 있어도 찾아낸다.
              pub fn exit_code_of(err: &anyhow::Error) -> u8 {
                  err.chain()
                      .find_map(|cause| cause.downcast_ref::<TgetError>())
                      .map_or(1, TgetError::exit_code)
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use anyhow::Context;

                  #[test]
                  fn exit_code_survives_context() {
                      let err: anyhow::Result<()> = Err(TgetError::MissingApiKey.into());
                      let err = err.context("검색 준비 중").unwrap_err();
                      assert_eq!(exit_code_of(&err), 3);
                  }

                  #[test]
                  fn unknown_errors_exit_with_1() {
                      assert_eq!(exit_code_of(&anyhow::anyhow!("뭔가 잘못됨")), 1);
                  }
              }
      - message: "[17] config.rs — 설정 에러를 TgetError로"
        files:
          - path: src/config.rs
            content: |
              use std::fs;
              use std::path::{Path, PathBuf};

              use serde::Deserialize;

              use crate::cli::Args;
              use crate::downloader::ClientKind;
              use crate::error::TgetError;

              /// config.toml 의 모양. 모든 칸이 비어 있어도 된다.
              #[derive(Debug, Default, Deserialize)]
              pub struct FileConfig {
                  pub prowlarr_url: Option<String>,
                  pub prowlarr_api_key: Option<String>,
                  pub qbit_url: Option<String>,
                  pub qbit_user: Option<String>,
                  pub qbit_pass: Option<String>,
                  pub save_path: Option<String>,
                  pub client: Option<ClientKind>,
                  pub transmission_url: Option<String>,
                  pub transmission_user: Option<String>,
                  pub transmission_pass: Option<String>,
              }

              /// CLI/환경변수 > 설정 파일 > 기본값 순으로 합친 최종 설정.
              #[derive(Debug)]
              pub struct Settings {
                  pub prowlarr_url: String,
                  pub prowlarr_api_key: Option<String>,
                  pub qbit_url: String,
                  pub qbit_user: String,
                  pub qbit_pass: String,
                  pub save_path: Option<String>,
                  pub client: ClientKind,
                  pub transmission_url: String,
                  pub transmission_user: Option<String>,
                  pub transmission_pass: Option<String>,
              }

              impl Settings {
                  pub fn load(args: &Args) -> Result<Self, TgetError> {
                      let file = match &args.config {
                          Some(path) => read_file(path)?,
                          None => match default_path() {
                              Some(path) if path.exists() => read_file(&path)?,
                              _ => FileConfig::default(),
                          },
                      };
                      Ok(Self::merge(args, file))
                  }

                  fn merge(args: &Args, file: FileConfig) -> Self {
                      Self {
                          prowlarr_url: args
                              .prowlarr_url
                              .clone()
                              .or(file.prowlarr_url)
                              .unwrap_or_else(|| "http://localhost:9696".into()),
                          prowlarr_api_key: args.prowlarr_api_key.clone().or(file.prowlarr_api_key),
                          qbit_url: args
                              .qbit_url
                              .clone()
                              .or(file.qbit_url)
                              .unwrap_or_else(|| "http://localhost:8080".into()),
                          qbit_user: args
                              .qbit_user
                              .clone()
                              .or(file.qbit_user)
                              .unwrap_or_else(|| "admin".into()),
                          qbit_pass: args
                              .qbit_pass
                              .clone()
                              .or(file.qbit_pass)
                              .unwrap_or_default(),
                          save_path: args.save_path.clone().or(file.save_path),
                          client: args.client.or(file.client).unwrap_or_default(),
                          transmission_url: args
                              .transmission_url
                              .clone()
                              .or(file.transmission_url)
                              .unwrap_or_else(|| "http://localhost:9091/transmission/rpc".into()),
                          transmission_user: args.transmission_user.clone().or(file.transmission_user),
                          transmission_pass: args.transmission_pass.clone().or(file.transmission_pass),
                      }
                  }
              }

              fn default_path() -> Option<PathBuf> {
                  let base = std::env::var_os("XDG_CONFIG_HOME")
                      .map(PathBuf::from)
                      .or_else(|| dirs::home_dir().map(|h| h.join(".config")))?;
                  Some(base.join("tget").join("config.toml"))
              }

              fn read_file(path: &Path) -> Result<FileConfig, TgetError> {
                  let raw = fs::read_to_string(path).map_err(|source| TgetError::ConfigRead {
                      path: path.to_path_buf(),
                      source,
                  })?;
                  toml::from_str(&raw).map_err(|source| TgetError::ConfigParse {
                      path: path.to_path_buf(),
                      source,
                  })
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use clap::Parser;

                  #[test]
                  fn cli_wins_over_file() {
                      let args = Args::parse_from(["tget", "x", "--qbit-url", "http://cli:1"]);
                      let file = FileConfig {
                          qbit_url: Some("http://file:2".into()),
                          qbit_user: Some("me".into()),
                          ..Default::default()
                      };
                      let s = Settings::merge(&args, file);
                      assert_eq!(s.qbit_url, "http://cli:1");
                      assert_eq!(s.qbit_user, "me");
                      assert_eq!(s.prowlarr_url, "http://localhost:9696");
                  }

                  #[test]
                  fn client_from_file() {
                      let args = Args::parse_from(["tget", "x"]);
                      let file: FileConfig = toml::from_str(r#"client = "transmission""#).unwrap();
                      let s = Settings::merge(&args, file);
                      assert_eq!(s.client, ClientKind::Transmission);
                  }
              }
      - message: "[17] prowlarr.rs — 인증·연결·시간 초과 구분"
        files:
          - path: src/prowlarr.rs
            content: |
              use std::fs;
              use std::path::Path;
              use std::sync::Arc;
              use std::time::Duration;

              use anyhow::{Context, Result};
              use reqwest::StatusCode;
              use serde::Deserialize;
              use tokio::task::JoinSet;

              use crate::config::Settings;
              use crate::error::TgetError;

              #[derive(Debug, Deserialize)]
              pub struct Indexer {
                  pub id: u32,
                  pub name: String,
                  pub enable: bool,
              }

              /// 인덱서 하나의 검색 결과. 실패해도 전체를 멈추지 않도록 Result를 그대로 담는다.
              pub struct IndexerResult {
                  pub name: String,
                  pub body: Result<String, TgetError>,
              }

              fn api_key(settings: &Settings) -> Result<&str, TgetError> {
                  settings
                      .prowlarr_api_key
                      .as_deref()
                      .ok_or(TgetError::MissingApiKey)
              }

              /// 요청을 보내고, 연결 실패·인증 실패·그 밖의 HTTP 오류를 TgetError로 나눠 담는다.
              async fn send(req: reqwest::RequestBuilder) -> Result<reqwest::Response, TgetError> {
                  let res = req.send().await.map_err(|source| TgetError::Connect {
                      service: "Prowlarr",
                      source,
                  })?;
                  if res.status() == StatusCode::UNAUTHORIZED {
                      return Err(TgetError::Unauthorized {
                          service: "Prowlarr",
                      });
                  }
                  Ok(res.error_for_status()?)
              }

              fn endpoint(settings: &Settings, path: &str) -> String {
                  format!("{}{path}", settings.prowlarr_url.trim_end_matches('/'))
              }

              pub async fn indexers(
                  http: &reqwest::Client,
                  settings: &Settings,
              ) -> Result<Vec<Indexer>, TgetError> {
                  let req = http
                      .get(endpoint(settings, "/api/v1/indexer"))
                      .header("X-Api-Key", api_key(settings)?);
                  Ok(send(req).await?.json().await?)
              }

              async fn search_one(
                  http: &reqwest::Client,
                  settings: &Settings,
                  query: &str,
                  indexer_id: u32,
              ) -> Result<String, TgetError> {
                  let id = indexer_id.to_string();
                  let req = http
                      .get(endpoint(settings, "/api/v1/search"))
                      .header("X-Api-Key", api_key(settings)?)
                      .query(&[("query", query), ("type", "search"), ("indexerIds", &id)]);
                  Ok(send(req).await?.text().await?)
              }

              /// 켜져 있는 인덱서마다 태스크를 하나씩 띄워 동시에 검색한다.
              pub async fn search_all(
                  http: &reqwest::Client,
                  settings: Arc<Settings>,
                  query: &str,
                  timeout: Duration,
              ) -> Result<Vec<IndexerResult>, TgetError> {
                  let mut tasks = JoinSet::new();
                  for ix in indexers(http, &settings).await? {
                      if !ix.enable {
                          continue;
                      }
                      // spawn한 태스크는 'static이어야 하므로, 빌린 값 대신 소유한 값을 넘긴다.
                      let http = http.clone();
                      let settings = Arc::clone(&settings);
                      let query = query.to_owned();
                      tasks.spawn(async move {
                          let body = tokio::time::timeout(timeout, search_one(&http, &settings, &query, ix.id))
                              .await
                              .unwrap_or(Err(TgetError::Timeout {
                                  secs: timeout.as_secs(),
                              }));
                          IndexerResult {
                              name: ix.name,
                              body,
                          }
                      });
                  }

                  let mut results = Vec::new();
                  while let Some(joined) = tasks.join_next().await {
                      results.push(joined?);
                  }
                  Ok(results)
              }

              pub fn load_fixture(path: &Path) -> Result<String> {
                  fs::read_to_string(path).with_context(|| format!("{} 을 읽지 못했어요", path.display()))
              }
      - message: "[17] qbit.rs — 로그인 실패를 TgetError로"
        files:
          - path: src/qbit.rs
            content: |
              use anyhow::{Result, bail};
              use serde::Deserialize;

              use crate::downloader::{Downloader, Progress};
              use crate::error::TgetError;

              /// qBittorrent Web API 클라이언트. 로그인 쿠키는 reqwest의 cookie_store가 들고 있는다.
              pub struct Qbit {
                  http: reqwest::Client,
                  base: String,
              }

              #[derive(Debug, Deserialize)]
              struct TorrentInfo {
                  name: String,
                  progress: f64,
                  dlspeed: u64,
                  state: String,
              }

              impl Qbit {
                  pub async fn login(http: reqwest::Client, url: &str, user: &str, pass: &str) -> Result<Self> {
                      let base = url.trim_end_matches('/').to_string();
                      let body = http
                          .post(format!("{base}/api/v2/auth/login"))
                          .header("Referer", &base)
                          .form(&[("username", user), ("password", pass)])
                          .send()
                          .await
                          .map_err(|source| TgetError::Connect {
                              service: "qBittorrent",
                              source,
                          })?
                          .text()
                          .await?;
                      if body.trim() != "Ok." {
                          return Err(TgetError::Unauthorized {
                              service: "qBittorrent",
                          }
                          .into());
                      }
                      Ok(Self { http, base })
                  }

                  async fn info_by_tag(&self, tag: &str) -> Result<Vec<TorrentInfo>> {
                      Ok(self
                          .http
                          .get(format!("{}/api/v2/torrents/info", self.base))
                          .header("Referer", &self.base)
                          .query(&[("tag", tag)])
                          .send()
                          .await?
                          .error_for_status()?
                          .json()
                          .await?)
                  }
              }

              impl Downloader for Qbit {
                  fn name(&self) -> &'static str {
                      "qBittorrent"
                  }

                  async fn add(&self, link: &str, save_path: Option<&str>, tag: &str) -> Result<()> {
                      let mut form = vec![("urls", link), ("tags", tag)];
                      if let Some(p) = save_path {
                          form.push(("savepath", p));
                      }
                      let res = self
                          .http
                          .post(format!("{}/api/v2/torrents/add", self.base))
                          .header("Referer", &self.base)
                          .form(&form)
                          .send()
                          .await?;
                      let status = res.status();
                      let body = res.text().await.unwrap_or_default();
                      if !status.is_success() || body.contains("Fails") {
                          bail!("토렌트 추가 실패 ({status}): {body}");
                      }
                      Ok(())
                  }

                  async fn progress(&self, tag: &str) -> Result<Option<Progress>> {
                      // magnet은 메타데이터를 받기 전까지 목록에 늦게 나타날 수 있다.
                      Ok(self
                          .info_by_tag(tag)
                          .await?
                          .into_iter()
                          .next()
                          .map(|t| Progress {
                              name: t.name,
                              done: t.progress,
                              speed: t.dlspeed,
                              state: t.state,
                          }))
                  }
              }
      - message: "[17] transmission.rs — 401과 연결 실패를 TgetError로"
        files:
          - path: src/transmission.rs
            content: |
              use std::sync::Mutex;

              use anyhow::{Context, Result, bail};
              use reqwest::StatusCode;
              use serde::Deserialize;
              use serde_json::{Value, json};

              use crate::downloader::{Downloader, Progress};
              use crate::error::TgetError;

              const SESSION_HEADER: &str = "X-Transmission-Session-Id";

              /// Transmission RPC 클라이언트.
              /// 세션 ID는 서버가 409로 알려 줄 때마다 바뀌므로, &self 메서드 안에서도 고칠 수 있게 Mutex에 둔다.
              pub struct Transmission {
                  http: reqwest::Client,
                  url: String,
                  user: Option<String>,
                  pass: Option<String>,
                  session_id: Mutex<String>,
              }

              #[derive(Deserialize)]
              struct RpcResponse {
                  result: String,
                  #[serde(default)]
                  arguments: Value,
              }

              #[derive(Deserialize)]
              #[serde(rename_all = "camelCase")]
              struct Torrent {
                  name: String,
                  percent_done: f64,
                  rate_download: u64,
                  status: i64,
                  #[serde(default)]
                  labels: Vec<String>,
              }

              impl Transmission {
                  pub fn new(
                      http: reqwest::Client,
                      url: &str,
                      user: Option<String>,
                      pass: Option<String>,
                  ) -> Self {
                      Self {
                          http,
                          url: url.to_string(),
                          user,
                          pass,
                          session_id: Mutex::new(String::new()),
                      }
                  }

                  async fn rpc(&self, method: &str, arguments: Value) -> Result<Value> {
                      let body = json!({ "method": method, "arguments": arguments });
                      // 첫 요청은 세션 ID가 없어서 409를 받는 게 정상이다. 한 번 갱신하고 다시 보낸다.
                      for _ in 0..2 {
                          // lock()이 돌려준 가드는 이 문장이 끝나면 바로 풀린다. await 너머로 들고 가지 않는다.
                          let session_id = self.session_id.lock().unwrap().clone();
                          let mut req = self
                              .http
                              .post(&self.url)
                              .header(SESSION_HEADER, session_id)
                              .json(&body);
                          if let Some(user) = &self.user {
                              req = req.basic_auth(user, self.pass.as_deref());
                          }
                          let res = req.send().await.map_err(|source| TgetError::Connect {
                              service: "Transmission",
                              source,
                          })?;

                          if res.status() == StatusCode::UNAUTHORIZED {
                              return Err(TgetError::Unauthorized {
                                  service: "Transmission",
                              }
                              .into());
                          }

                          if res.status() == StatusCode::CONFLICT {
                              let new_id = res
                                  .headers()
                                  .get(SESSION_HEADER)
                                  .and_then(|v| v.to_str().ok())
                                  .context("Transmission이 세션 ID를 주지 않았어요")?;
                              *self.session_id.lock().unwrap() = new_id.to_string();
                              continue;
                          }

                          let res: RpcResponse = res
                              .error_for_status()
                              .context("Transmission 요청 실패 (사용자/비밀번호를 확인하세요)")?
                              .json()
                              .await
                              .context("Transmission 응답을 해석하지 못했어요")?;
                          if res.result != "success" {
                              bail!("Transmission 오류: {}", res.result);
                          }
                          return Ok(res.arguments);
                      }
                      bail!("Transmission 세션을 맺지 못했어요")
                  }
              }

              fn status_name(status: i64) -> &'static str {
                  match status {
                      0 => "stopped",
                      1 | 2 => "checking",
                      3 => "queued",
                      4 => "downloading",
                      5 | 6 => "seeding",
                      _ => "unknown",
                  }
              }

              impl Downloader for Transmission {
                  fn name(&self) -> &'static str {
                      "Transmission"
                  }

                  async fn add(&self, link: &str, save_path: Option<&str>, tag: &str) -> Result<()> {
                      let mut args = json!({ "filename": link, "labels": [tag] });
                      if let Some(p) = save_path {
                          args["download-dir"] = json!(p);
                      }
                      self.rpc("torrent-add", args).await?;
                      Ok(())
                  }

                  async fn progress(&self, tag: &str) -> Result<Option<Progress>> {
                      let fields = ["name", "percentDone", "rateDownload", "status", "labels"];
                      let args = self.rpc("torrent-get", json!({ "fields": fields })).await?;
                      let torrents: Vec<Torrent> = serde_json::from_value(args["torrents"].clone())
                          .context("Transmission 토렌트 목록을 해석하지 못했어요")?;
                      Ok(torrents
                          .into_iter()
                          .find(|t| t.labels.iter().any(|l| l == tag))
                          .map(|t| Progress {
                              name: t.name,
                              done: t.percent_done,
                              speed: t.rate_download,
                              state: status_name(t.status).to_string(),
                          }))
                  }
              }
      - message: "[17] main.rs — run()과 ExitCode"
        files:
          - path: src/main.rs
            content: |
              mod cli;
              mod config;
              mod downloader;
              mod error;
              mod hit;
              mod prowlarr;
              mod qbit;
              mod transmission;
              mod ui;

              use std::process::ExitCode;
              use std::sync::Arc;
              use std::time::{Duration, SystemTime, UNIX_EPOCH};

              use anyhow::{Context, Result, bail};
              use clap::Parser;

              use cli::Args;
              use config::Settings;
              use downloader::{Client, ClientKind, Downloader};
              use qbit::Qbit;
              use transmission::Transmission;

              #[tokio::main]
              async fn main() -> ExitCode {
                  match run().await {
                      Ok(()) => ExitCode::SUCCESS,
                      Err(e) => {
                          eprintln!("Error: {e:?}");
                          ExitCode::from(error::exit_code_of(&e))
                      }
                  }
              }

              async fn run() -> Result<()> {
                  let args = Args::parse();
                  let settings = Arc::new(Settings::load(&args)?);
                  let http = reqwest::Client::builder().cookie_store(true).build()?;

                  let raws = match &args.fixture {
                      Some(path) => vec![prowlarr::load_fixture(path)?],
                      None => {
                          let timeout = Duration::from_secs(args.timeout);
                          let results =
                              prowlarr::search_all(&http, Arc::clone(&settings), &args.query, timeout).await?;
                          let mut raws = Vec::new();
                          for r in results {
                              match r.body {
                                  Ok(body) => raws.push(body),
                                  Err(e) => eprintln!("⚠ {}: {e:#}", r.name),
                              }
                          }
                          raws
                      }
                  };

                  let mut hits = Vec::new();
                  for raw in &raws {
                      hits.extend(hit::parse(raw).context("검색 결과를 해석하지 못했어요")?);
                  }
                  let hits = hit::rank(hits, args.min_seeders, args.limit);

                  if hits.is_empty() {
                      bail!("'{}' 에 해당하는 토렌트를 찾지 못했어요", args.query);
                  }

                  let recommended = hit::best(&hits, &args.query);
                  ui::print_hits(&hits, recommended);

                  if args.dry_run {
                      return Ok(());
                  }

                  let chosen = if args.first {
                      recommended.unwrap_or(&hits[0])
                  } else {
                      match ui::prompt_choice(hits.len())? {
                          Some(i) => &hits[i],
                          None => {
                              println!("취소했어요");
                              return Ok(());
                          }
                      }
                  };

                  let client = match settings.client {
                      ClientKind::Qbit => Client::Qbit(
                          Qbit::login(
                              http,
                              &settings.qbit_url,
                              &settings.qbit_user,
                              &settings.qbit_pass,
                          )
                          .await?,
                      ),
                      ClientKind::Transmission => Client::Transmission(Transmission::new(
                          http,
                          &settings.transmission_url,
                          settings.transmission_user.clone(),
                          settings.transmission_pass.clone(),
                      )),
                  };
                  let tag = new_tag();
                  client
                      .add(chosen.link().unwrap(), settings.save_path.as_deref(), &tag)
                      .await?;
                  println!("→ {}에 추가됨: {}", client.name(), chosen.title);

                  if args.watch {
                      watch(&client, &tag).await?;
                  }
                  Ok(())
              }

              /// 이번에 추가한 토렌트만 찾아내기 위한 고유 태그.
              fn new_tag() -> String {
                  let secs = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .map(|d| d.as_secs())
                      .unwrap_or(0);
                  format!("tget-{secs}")
              }

              async fn watch<D: Downloader>(client: &D, tag: &str) -> Result<()> {
                  println!("진행률을 지켜보는 중… (Ctrl+C로 그만 보기, 다운로드는 계속돼요)");
                  loop {
                      if let Some(p) = client.progress(tag).await? {
                          ui::print_progress(&p)?;
                          if p.done >= 1.0 {
                              println!("\n완료: {}", p.name);
                              return Ok(());
                          }
                      }
                      tokio::time::sleep(Duration::from_secs(2)).await;
                  }
              }
