            content: |
              use std::io::{self, Write};

              use anyhow::Result;

              use crate::hit::Hit;

              pub fn print_hits(hits: &[Hit]) {
                  for (i, h) in hits.iter().enumerate() {
                      println!(
                          "{:>2}) {}\n     {}  seeders {}  [{}]",
                          i + 1,
                          h.title,
                          human_size(h.size),
                          h.seeders(),
                          h.indexer
                      );
                  }
              }

              pub fn prompt_choice(max: usize) -> Result<Option<usize>> {
                  loop {
                      print!("선택 (1-{max}, 엔터=취소)> ");
                      io::stdout().flush()?;

                      let mut line = String::new();
                      io::stdin().read_line(&mut line)?;
                      let line = line.trim();

                      if line.is_empty() || line.eq_ignore_ascii_case("q") {
                          return Ok(None);
                      }
                      match line.parse::<usize>() {
                          Ok(n) if (1..=max).contains(&n) => return Ok(Some(n - 1)),
                          _ => println!("1-{max} 사이 숫자를 입력하세요"),
                      }
                  }
              }

              pub fn human_size(bytes: u64) -> String {
                  const UNITS: [&str; 5] = ["B", "KB", "MB", "GB", "TB"];
                  let mut v = bytes as f64;
                  let mut u = 0;
                  while v >= 1024.0 && u < UNITS.len() - 1 {
                      v /= 1024.0;
                      u += 1;
                  }
                  format!("{v:.1}{}", UNITS[u])
              }
      - message: "[8] prowlarr.rs — search와 load_fixture"
        files:
          - path: src/prowlarr.rs
            content: |
              use std::fs;
              use std::path::Path;

              use anyhow::{Context, Result};

              use crate::cli::Args;
              use crate::hit::Hit;

              pub async fn search(http: &reqwest::Client, args: &Args) -> Result<Vec<Hit>> {
                  let api_key = args
                      .prowlarr_api_key
                      .as_deref()
                      .context("PROWLARR_API_KEY 환경변수나 --prowlarr-api-key 가 필요해요")?;
                  let url = format!("{}/api/v1/search", args.prowlarr_url.trim_end_matches('/'));

                  http.get(url)
                      .header("X-Api-Key", api_key)
                      .query(&[("query", args.query.as_str()), ("type", "search")])
                      .send()
                      .await
                      .context("Prowlarr에 연결하지 못했어요")?
                      .error_for_status()
                      .context("Prowlarr 검색 실패 (API 키를 확인하세요)")?
                      .json()
                      .await
                      .context("Prowlarr 응답을 해석하지 못했어요")
              }

              pub fn load_fixture(path: &Path) -> Result<Vec<Hit>> {
                  let raw = fs::read_to_string(path)
                      .with_context(|| format!("{} 을 읽지 못했어요", path.display()))?;
                  Ok(serde_json::from_str(&raw)?)
              }
      - message: "[8] qbit.rs — 로그인 상태를 담은 Qbit 구조체"
        files:
          - path: src/qbit.rs
            content: |
              use anyhow::{Context, Result, bail};

              /// qBittorrent Web API 클라이언트. 로그인 쿠키는 reqwest의 cookie_store가 들고 있는다.
              pub struct Qbit {
                  http: reqwest::Client,
                  base: String,
              }

              impl Qbit {
                  pub async fn login(http: reqwest::Client, url: &str, user: &str, pass: &str) -> Result<Self> {
                      let base = url.trim_end_matches('/').to_string();
                      let body = http
                          .post(format!("{base}/api/v2/auth/login"))
                          .header("Referer", &base)
                          .form(&[("username", user), ("password", pass)])
                          .send()
                          .await
                          .context("qBittorrent에 연결하지 못했어요")?
                          .text()
                          .await?;
                      if body.trim() != "Ok." {
                          bail!("qBittorrent 로그인 실패 (사용자/비밀번호를 확인하세요)");
                      }
                      Ok(Self { http, base })
                  }

                  pub async fn add(&self, link: &str, save_path: Option<&str>) -> Result<()> {
                      let mut form = vec![("urls", link)];
                      if let Some(p) = save_path {
                          form.push(("savepath", p));
                      }
                      let res = self
                          .http
                          .post(format!("{}/api/v2/torrents/add", self.base))
                          .header("Referer", &self.base)
                          .form(&form)
                          .send()
                          .await?;
                      let status = res.status();
                      let body = res.text().await.unwrap_or_default();
                      if !status.is_success() || body.contains("Fails") {
                          bail!("토렌트 추가 실패 ({status}): {body}");
                      }
                      Ok(())
                  }
              }
      - message: "[8] main.rs — mod 선언과 전체 흐름만 남기기"
        files:
          - path: src/main.rs
            content: |
              mod cli;
              mod hit;
              mod prowlarr;
              mod qbit;
              mod ui;

              use anyhow::{Result, bail};
              use clap::Parser;

              use cli::Args;
              use qbit::Qbit;

              #[tokio::main]
              async fn main() -> Result<()> {
                  let args = Args::parse();
                  let http = reqwest::Client::builder().cookie_store(true).build()?;

                  let mut hits = match &args.fixture {
                      Some(path) => prowlarr::load_fixture(path)?,
                      None => prowlarr::search(&http, &args).await?,
                  };
                  hits.retain(|h| h.seeders() >= args.min_seeders && h.link().is_some());
                  hits.sort_by(|a, b| b.seeders().cmp(&a.seeders()));
                  hits.truncate(args.limit);

                  if hits.is_empty() {
                      bail!("'{}' 에 해당하는 토렌트를 찾지 못했어요", args.query);
                  }

                  ui::print_hits(&hits);

                  if args.dry_run {
                      return Ok(());
                  }

                  let chosen = if args.first {
                      &hits[0]
                  } else {
                      match ui::prompt_choice(hits.len())? {
                          Some(i) => &hits[i],
                          None => {
                              println!("취소했어요");
                              return Ok(());
                          }
                      }
                  };

                  let qbit = Qbit::login(http, &args.qbit_url, &args.qbit_user, &args.qbit_pass).await?;
                  qbit.add(chosen.link().unwrap(), args.save_path.as_deref()).await?;
                  println!("→ qBittorrent에 추가됨: {}", chosen.title);
                  Ok(())
              }
  - id: "9"
    title: 테스트 쓰기
    doc: |
      # 테스트 쓰기

      **목표:** 네트워크 없이 확인할 수 있는 로직(크기 표시, 거르기/정렬, JSON 해석)에 자동 테스트를 붙인다.

      **새로 배우는 것:** `#[cfg(test)]`, `#[test]`, `assert_eq!`, `include_str!`, `cargo test`

      ### 9-1. 먼저 리팩터링: rank 함수 빼내기

      main에 있는 retain → sort_by → truncate 세 줄은 테스트하기 좋은 순수 로직이에요. hit.rs로 옮기세요.

      ```rust
      /// 받을 수 없는 결과를 걸러내고 시더 많은 순으로 limit개만 남긴다.
      pub fn rank(mut hits: Vec<Hit>, min_seeders: u32, limit: usize) -> Vec<Hit>
      ```

      - 매개변수에 `mut` 을 붙이면 받은 벡터를 그 자리에서 고칠 수 있어요. 소유권을 받아서 고친 뒤 돌려주는 패턴.
      - main에서는 `let hits = hit::rank(hits, args.min_seeders, args.limit);`

      ▶ `src/hit.rs` — 재생에서 따라 칩니다

      ### 9-2. 첫 테스트 (ui.rs 맨 아래)

      ▶ `src/ui.rs` — 재생에서 따라 칩니다

      - `#[cfg(test)]` → `cargo test` 할 때만 컴파일돼요. 실제 바이너리엔 안 들어가요.
      - `use super::*;` → 바깥 모듈(ui)의 모든 것을 가져와요. 테스트 모듈은 **같은 파일의 비공개 함수도** 쓸 수 있어요.
      - `assert_eq!(실제, 기대)` → 다르면 두 값을 보여 주며 실패해요.

      ```bash
      cargo test            # 전부
      cargo test human      # 이름에 human이 들어간 테스트만
      ```

      ### 9-3. 직접 쓸 테스트 목록

      | 위치 | 테스트 이름 (예시) | 확인할 것 |
      | --- | --- | --- |
      | ui.rs | human_size_caps_at_tb | 2048 TB를 넣어도 패닉 없이 "2048.0TB" |
      | hit.rs | parses_fixture | fixture가 5건, 4번째 seeders는 None, 5번째 link()는 None |
      | hit.rs | magnet_is_preferred | magnet과 download 둘 다 있으면 link()는 magnet |
      | hit.rs | rank_filters_and_sorts | rank(fixture, 1, 10)의 제목이 정확히 [1번 iso, 2번 iso] 순서 |
      | hit.rs | rank_respects_limit | rank(fixture, 0, 1)의 길이가 1 |

      - 테스트에서 fixture 읽기: `include_str!("../fixtures/search.json")` → **컴파일할 때** 파일 내용을 문자열로 박아 넣어요. 경로는 **이 소스 파일 기준**이라 `src/hit.rs` 에선 `../fixtures/...`.
      - Hit을 직접 만들 땐 모든 필드를 적어야 해요: `Hit { title: "a".into(), size: 0, seeders: None, ... }`
      - 2048 TB 계산: `2048 * 1024u64.pow(4)`. 숫자 뒤의 `u64` 는 타입 지정이에요. 빼면 컴파일러가 "어떤 정수 타입의 pow인지 모르겠다"는 에러(E0689)를 내요. 직접 확인해 보세요.

      ▶ `src/main.rs` — 재생에서 따라 칩니다

      ### 9-4. 빨강-초록 체험 (꼭!)

      1. rank의 sort_by에서 a와 b를 일부러 뒤집어 `cargo test` → rank_filters_and_sorts가 **어떻게** 실패하는지 메시지를 읽어 보세요.
      2. 되돌리고 다시 초록.

      ### 확인

      - `cargo test` → 테스트 6개 이상, 전부 `ok`.

      ### 이해 체크

      - `include_str!` 과 `fs::read_to_string` 의 차이는? 테스트에서 include_str!이 더 나은 이유는?
      - 왜 prowlarr::search 같은 함수는 이번 Stage에서 테스트하지 않았을까요? 테스트하려면 무엇이 필요할까요?

      ## 정답 노트에서

      - include_str!은 컴파일 때 파일을 바이너리에 넣어요. 테스트를 어느 폴더에서 돌려도 경로가 깨지지 않아요.
      - 네트워크가 필요해서요. 가짜 HTTP 서버(wiremock 등)를 띄우거나 HTTP 부분을 trait으로 추상화해야 해요.
    steps:
      - message: "[9] hit.rs — rank 함수와 테스트"
