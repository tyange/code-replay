      - message: "[1-2] action.rs — 행동 enum"
        files:
          - path: rogue-core/src/action.rs
            content: |
              use crate::geom::Dir;

              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              pub enum Action {
                  Wait,
                  Move(Dir),
              }
      - message: "[1-2] game.rs — 게임 구조체와 한 턴 진행"
        files:
          - path: rogue-core/src/game.rs
            content: |
              use crate::action::Action;
              use crate::geom::Point;
              use crate::map::Map;

              pub struct Game {
                  map: Map,
                  player: Point,
              }

              impl Game {
                  pub fn new() -> Game {
                      Game {
                          map: Map::room(30, 20),
                          player: Point::new(15, 10),
                      }
                  }

                  pub fn map(&self) -> &Map {
                      &self.map
                  }

                  pub fn player(&self) -> Point {
                      self.player
                  }

                  /// 행동 하나를 받아 게임을 한 턴 진행한다. core의 유일한 입구
                  pub fn step(&mut self, action: Action) {
                      match action {
                          Action::Wait => {}
                          Action::Move(dir) => {
                              let to = self.player.step(dir);
                              if self.map.is_walkable(to) {
                                  self.player = to;
                              }
                          }
                      }
                  }
              }

              impl Default for Game {
                  fn default() -> Self {
                      Game::new()
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::geom::Dir;

                  #[test]
                  fn move_into_floor() {
                      let mut game = Game::new();
                      game.step(Action::Move(Dir::Right));
                      assert_eq!(game.player(), Point::new(16, 10));
                  }

                  #[test]
                  fn move_into_wall_does_nothing() {
                      let mut game = Game::new();
                      for _ in 0..30 {
                          game.step(Action::Move(Dir::Left));
                      }
                      assert_eq!(game.player(), Point::new(1, 10));
                  }

                  #[test]
                  fn wait_changes_nothing() {
                      let mut game = Game::new();
                      game.step(Action::Wait);
                      assert_eq!(game.player(), Point::new(15, 10));
                  }
              }
      - message: "[1-2] lib.rs — action, game 공개"
        files:
          - path: rogue-core/src/lib.rs
            content: |
              mod action;
              mod game;
              mod geom;
              mod map;

              pub use action::Action;
              pub use game::Game;
              pub use geom::{Dir, Point};
              pub use map::{Map, Tile};
      - message: "[1-2] main.rs — 키를 행동으로 바꿔 턴 진행"
        files:
          - path: rogue/src/main.rs
            content: |
              use macroquad::prelude::*;
              use rogue_core::{Action, Dir, Game, Point, Tile};

              const TILE: f32 = 24.0;

              fn tile_color(tile: Tile) -> Color {
                  match tile {
                      Tile::Wall => DARKGRAY,
                      Tile::Floor => Color::new(0.15, 0.15, 0.2, 1.0),
                  }
              }

              /// 이번 프레임에 눌린 키를 core의 행동으로 바꾼다
              fn read_action() -> Option<Action> {
                  if is_key_pressed(KeyCode::Up) {
                      Some(Action::Move(Dir::Up))
                  } else if is_key_pressed(KeyCode::Down) {
                      Some(Action::Move(Dir::Down))
                  } else if is_key_pressed(KeyCode::Left) {
                      Some(Action::Move(Dir::Left))
                  } else if is_key_pressed(KeyCode::Right) {
                      Some(Action::Move(Dir::Right))
                  } else if is_key_pressed(KeyCode::Space) {
                      Some(Action::Wait)
                  } else {
                      None
                  }
              }

              #[macroquad::main("Rogue")]
              async fn main() {
                  let mut game = Game::new();

                  loop {
                      if let Some(action) = read_action() {
                          game.step(action);
                      }

                      clear_background(BLACK);

                      let map = game.map();
                      for y in 0..map.height() {
                          for x in 0..map.width() {
                              if let Some(tile) = map.tile(Point::new(x, y)) {
                                  draw_rectangle(
                                      x as f32 * TILE,
                                      y as f32 * TILE,
                                      TILE - 1.0,
                                      TILE - 1.0,
                                      tile_color(tile),
                                  );
                              }
                          }
                      }

                      let p = game.player();
                      draw_text(
                          "@",
                          p.x as f32 * TILE + 5.0,
                          (p.y + 1) as f32 * TILE - 5.0,
                          TILE,
                          YELLOW,
                      );

                      next_frame().await;
                  }
              }
  - id: 2-2
    title: "2-2. 엔티티를 ID로: 세대 번호 붙은 아레나"
    doc: |
      # 2-2. 엔티티를 ID로: 세대 번호 붙은 아레나

      > 재생 코드와 원문이 다른 곳: `rogue/src/main.rs` 의 `draw_glyph` 에서 원문 `&ch.to_string()` 을 `ch.to_string()` 으로 고쳤습니다.

      ### 만들 것

      몬스터를 생성하고 죽일 수 있는 엔티티 저장소. 겉보기 동작은 2-1과 같지만 참조도 `Rc`도 없습니다.

      ### 요구사항

      **엔티티 ID**

      - ID는 숫자 두 개를 담는 작은 `Copy` 구조체입니다: **슬롯 번호**와 **세대 번호**.
      - 이 구조체는 아무것도 빌리지 않습니다. 그냥 숫자입니다. 그래서 어디에 저장해도 수명 문제가 생기지 않습니다. 몬스터의 "쫓아가는 대상" 필드는 이제 이 ID입니다.

      **저장소**

      - 슬롯들의 `Vec`을 가집니다. 각 슬롯은 "현재 세대 번호"와 "살아 있으면 그 데이터, 아니면 비어 있음"을 담습니다.
      - 비어 있는 슬롯 번호 목록(재사용 대기열)도 가집니다.
      - **생성**: 빈 슬롯이 있으면 재사용하고, 없으면 끝에 추가합니다. 그 슬롯의 현재 세대로 ID를 만들어 돌려줍니다.
      - **삭제**: 슬롯을 비우고, **세대 번호를 1 올리고**, 재사용 대기열에 넣습니다.
      - **조회**(불변/가변 두 개): ID의 슬롯에 데이터가 있고 **세대가 일치할 때만** 돌려줍니다. 반환 타입은 `Option`입니다.

      **게임에서**

      - 2-1의 몬스터 이동/공격을 이 저장소 위에서 다시 만듭니다. 몬스터가 플레이어 ID로 플레이어를 조회하고, 결과가 `None`이면 대상이 이미 사라진 것입니다.
      - 플레이어도 그냥 저장소 안의 엔티티 하나입니다. 게임 구조체는 "플레이어의 ID"만 따로 기억합니다.

      ### 코드

      `arena.rs` 의 네 함수(`spawn`, `despawn`, `get`, `get_mut`)가 핵심이고, 테스트 세 개가 통과하면 끝입니다.

      ▶ `rogue-core/src/arena.rs` (새 파일) — 재생에서 따라 칩니다

      ▶ `rogue-core/src/lib.rs` — 재생에서 따라 칩니다

      `rogue-core/src/lib.rs` 에 `mod arena;` 를 추가하고 `pub use arena::EntityId;` 는 일단 필요 없습니다 (밖으로 내보낼 이유가 없는 타입은 `pub` 으로 열지 않습니다).

      ▶ `rogue-core/src/game.rs` (2-2 부터 이렇게 바뀝니다) — 재생에서 따라 칩니다

      ▶ `rogue/src/main.rs` (그리기 부분이 `glyphs()` 를 쓰도록 바뀝니다) — 재생에서 따라 칩니다

      ### 일부러 해볼 실수

      1. 세대 번호 없이 슬롯 번호만으로 ID를 만들어 보세요. 몬스터 A를 죽이고 새 몬스터 B를 생성하면 같은 슬롯을 받습니다. A를 쫓던 다른 몬스터가 갑자기 B를 쫓기 시작합니다. 테스트로 재현하세요.
      1. 세대를 되돌리고, 그 테스트가 실패에서 통과로 바뀌는 것을 확인합니다.

      ### 확인 기준

      - [ ] 몬스터가 플레이어에게 다가오고 공격한다 (참조, Rc, RefCell 없이)
      - [ ] 체력이 0이 된 몬스터가 저장소에서 사라지고, 화면에서도 사라진다
      - [ ] 죽은 엔티티의 ID로 조회하면 None이 나오는 테스트가 있다

      ### 이해 체크

      - 이 방식은 "댕글링 포인터" 문제를 어떻게 해결하는가? 컴파일 타임 검사를 무엇으로 바꾼 것인가?
      - 2-1의 `RefCell`과 비교해서, 실수했을 때 결과가 어떻게 다른가? (패닉 vs `None`)

      ## 정답 노트에서

      - 세대 번호는 **despawn 할 때** 올려요. 그래야 옛 ID 가 같은 슬롯의 새 주인을 가리키지 못해요.
      - `get` 이 `Option` 을 돌려주는 이유: 죽은 개체의 ID 가 남아 있어도 패닉이 아니라 "없음"이 돼요. 몬스터가 이미 죽은 플레이어를 노리는 상황을 이 한 가지 규칙이 처리해요.
      - `slot as usize` 는 u32 에서 usize 로 넓히는 변환이라 안전해요. 반대로 `usize` 를 `u32` 로 줄일 때는 `try_from` 을 썼어요.
    steps:
      - message: "[2-2] arena.rs — 세대 번호가 붙은 아레나"
        files:
          - path: rogue-core/src/arena.rs
            content: |
              use crate::geom::Point;

              /// 슬롯 번호와 세대 번호. 아무것도 빌리지 않는 그냥 숫자 두 개라서 어디에 저장해도 수명 문제가 없다
              #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
              pub struct EntityId {
                  slot: u32,
                  generation: u32,
              }

              #[derive(Debug, Clone)]
              pub struct Creature {
                  pub pos: Point,
                  pub hp: i32,
                  pub glyph: char,
                  pub target: Option<EntityId>,
              }

              struct Slot {
                  generation: u32,
                  value: Option<Creature>,
              }

              pub struct Arena {
                  slots: Vec<Slot>,
                  free: Vec<u32>,
              }

              impl Arena {
                  pub fn new() -> Arena {
                      Arena {
                          slots: Vec::new(),
                          free: Vec::new(),
                      }
                  }

                  /// 빈 슬롯이 있으면 재사용하고, 없으면 끝에 추가한다
                  pub fn spawn(&mut self, creature: Creature) -> EntityId {
                      if let Some(slot) = self.free.pop() {
                          // 비어 있던 슬롯 재사용. 세대 번호는 despawn 때 이미 올라가 있다
                          if let Some(s) = self.slots.get_mut(slot as usize) {
                              s.value = Some(creature);
                              return EntityId {
                                  slot,
                                  generation: s.generation,
                              };
                          }
                      }
                      let slot = u32::try_from(self.slots.len()).expect("슬롯 수가 u32 범위를 넘지 않는다");
                      self.slots.push(Slot {
                          generation: 0,
                          value: Some(creature),
                      });
                      EntityId {
                          slot,
                          generation: 0,
                      }
                  }

                  /// 슬롯을 비우고 세대를 올린다. 세대가 다른 ID 면 None
                  pub fn despawn(&mut self, id: EntityId) -> Option<Creature> {
                      let slot = self.slots.get_mut(id.slot as usize)?;
                      if slot.generation != id.generation {
                          return None; // 이미 다른 개체가 쓰고 있는 슬롯
                      }
                      let creature = slot.value.take()?;
                      slot.generation += 1;
                      self.free.push(id.slot);
                      Some(creature)
                  }

                  /// 슬롯에 값이 있고 세대가 일치할 때만 Some
                  pub fn get(&self, id: EntityId) -> Option<&Creature> {
                      let slot = self.slots.get(id.slot as usize)?;
                      if slot.generation == id.generation {
                          slot.value.as_ref()
                      } else {
                          None
                      }
                  }

                  pub fn get_mut(&mut self, id: EntityId) -> Option<&mut Creature> {
                      let slot = self.slots.get_mut(id.slot as usize)?;
                      if slot.generation == id.generation {
                          slot.value.as_mut()
                      } else {
                          None
                      }
                  }

                  /// 살아 있는 모든 개체의 ID (2-3에서 이터레이터로 바꾼다)
                  pub fn ids(&self) -> Vec<EntityId> {
                      self.slots
                          .iter()
                          .enumerate()
                          .filter(|(_, s)| s.value.is_some())
                          .filter_map(|(i, s)| {
                              Some(EntityId {
                                  slot: u32::try_from(i).ok()?,
                                  generation: s.generation,
                              })
                          })
                          .collect()
                  }
              }

              impl Default for Arena {
                  fn default() -> Self {
                      Arena::new()
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  fn goblin() -> Creature {
                      Creature {
                          pos: Point::new(1, 1),
                          hp: 5,
                          glyph: 'g',
                          target: None,
                      }
                  }

                  #[test]
                  fn despawned_id_returns_none() {
                      let mut arena = Arena::new();
                      let id = arena.spawn(goblin());
                      assert!(arena.get(id).is_some());
                      arena.despawn(id);
                      assert!(arena.get(id).is_none());
                      assert!(arena.get_mut(id).is_none());
                  }

                  #[test]
                  fn stale_id_does_not_see_new_occupant() {
                      let mut arena = Arena::new();
                      let a = arena.spawn(goblin());
                      arena.despawn(a);
                      let b = arena.spawn(goblin()); // 같은 슬롯을 재사용한다
                      assert_ne!(a, b);
                      assert!(arena.get(a).is_none()); // 세대가 다르므로 B가 보이지 않는다
                      assert!(arena.get(b).is_some());
                      assert!(arena.despawn(a).is_none()); // A의 ID로 B를 죽일 수도 없다
                      assert!(arena.get(b).is_some());
                  }

                  #[test]
                  fn ids_lists_only_living() {
                      let mut arena = Arena::new();
                      let a = arena.spawn(goblin());
                      let b = arena.spawn(goblin());
                      arena.despawn(a);
                      assert_eq!(arena.ids(), vec![b]);
                  }
              }
