      - message: "[2-3] entity.rs — 엔티티의 존재만 관리"
        files:
          - path: rogue-core/src/entity.rs
            content: |
              /// 슬롯 번호와 세대 번호. 아무것도 빌리지 않는 그냥 숫자 두 개
              #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
              pub struct EntityId {
                  slot: u32,
                  generation: u32,
              }

              impl EntityId {
                  pub(crate) fn new(slot: u32, generation: u32) -> EntityId {
                      EntityId { slot, generation }
                  }

                  pub(crate) fn index(self) -> usize {
                      self.slot as usize
                  }

                  pub(crate) fn generation(self) -> u32 {
                      self.generation
                  }
              }

              struct Slot {
                  generation: u32,
                  alive: bool,
              }

              /// 엔티티가 "존재하는가"만 관리한다. 데이터는 컴포넌트 저장소가 가진다
              #[derive(Default)]
              pub struct Entities {
                  slots: Vec<Slot>,
                  free: Vec<u32>,
              }

              impl Entities {
                  pub fn spawn(&mut self) -> EntityId {
                      if let Some(slot) = self.free.pop()
                          && let Some(s) = self.slots.get_mut(slot as usize)
                      {
                          s.alive = true;
                          return EntityId::new(slot, s.generation);
                      }
                      let slot = u32::try_from(self.slots.len()).expect("슬롯 수가 u32 범위를 넘지 않는다");
                      self.slots.push(Slot {
                          generation: 0,
                          alive: true,
                      });
                      EntityId::new(slot, 0)
                  }

                  pub fn despawn(&mut self, id: EntityId) -> bool {
                      match self.slots.get_mut(id.index()) {
                          Some(s) if s.alive && s.generation == id.generation() => {
                              s.alive = false;
                              s.generation += 1;
                              self.free.push(id.slot);
                              true
                          }
                          _ => false,
                      }
                  }

                  pub fn is_alive(&self, id: EntityId) -> bool {
                      self.slots
                          .get(id.index())
                          .is_some_and(|s| s.alive && s.generation == id.generation())
                  }

                  /// 살아 있는 엔티티의 ID 들. 반환된 이터레이터는 self 를 빌린다
                  pub fn iter(&self) -> impl Iterator<Item = EntityId> + '_ {
                      self.slots.iter().enumerate().filter_map(|(i, s)| {
                          if s.alive {
                              Some(EntityId::new(u32::try_from(i).ok()?, s.generation))
                          } else {
                              None
                          }
                      })
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  #[test]
                  fn stale_id_is_not_alive_after_slot_reuse() {
                      let mut entities = Entities::default();
                      let a = entities.spawn();
                      assert!(entities.despawn(a));
                      let b = entities.spawn(); // 같은 슬롯
                      assert_ne!(a, b);
                      assert!(!entities.is_alive(a));
                      assert!(entities.is_alive(b));
                      assert!(!entities.despawn(a)); // A의 ID로 B를 지울 수 없다
                      assert!(entities.is_alive(b));
                  }

                  #[test]
                  fn iter_lists_living_only() {
                      let mut entities = Entities::default();
                      let a = entities.spawn();
                      let b = entities.spawn();
                      entities.despawn(a);
                      assert_eq!(entities.iter().collect::<Vec<_>>(), vec![b]);
                  }
              }
      - message: "[2-3] store.rs — 제네릭 컴포넌트 저장소"
        files:
          - path: rogue-core/src/store.rs
            content: |
              use crate::entity::EntityId;

              /// 컴포넌트 하나를 담는 저장소. 슬롯 번호로 인덱싱되는 Vec이고, 각 칸은 (세대, 값) 또는 비어 있음
              pub struct Store<T> {
                  slots: Vec<Option<(u32, T)>>,
              }

              impl<T> Default for Store<T> {
                  fn default() -> Self {
                      Store { slots: Vec::new() }
                  }
              }

              impl<T> Store<T> {
                  pub fn insert(&mut self, id: EntityId, value: T) {
                      let i = id.index();
                      if self.slots.len() <= i {
                          self.slots.resize_with(i + 1, || None);
                      }
                      if let Some(slot) = self.slots.get_mut(i) {
                          *slot = Some((id.generation(), value));
                      }
                  }

                  pub fn get(&self, id: EntityId) -> Option<&T> {
                      match self.slots.get(id.index())? {
                          Some((generation, value)) if *generation == id.generation() => Some(value),
                          _ => None,
                      }
                  }

                  pub fn get_mut(&mut self, id: EntityId) -> Option<&mut T> {
                      match self.slots.get_mut(id.index())? {
                          Some((generation, value)) if *generation == id.generation() => Some(value),
                          _ => None,
                      }
                  }

                  pub fn remove(&mut self, id: EntityId) -> Option<T> {
                      let slot = self.slots.get_mut(id.index())?;
                      match slot {
                          Some((generation, _)) if *generation == id.generation() => {
                              slot.take().map(|(_, value)| value)
                          }
                          _ => None,
                      }
                  }

                  /// 살아 있는 모든 (ID, 값) 쌍. 반환된 이터레이터는 이 저장소를 빌리고 있다
                  pub fn iter(&self) -> impl Iterator<Item = (EntityId, &T)> + '_ {
                      self.slots.iter().enumerate().filter_map(|(i, slot)| {
                          let (generation, value) = slot.as_ref()?;
                          Some((EntityId::new(u32::try_from(i).ok()?, *generation), value))
                      })
                  }

                  pub fn iter_mut(&mut self) -> impl Iterator<Item = (EntityId, &mut T)> + '_ {
                      self.slots.iter_mut().enumerate().filter_map(|(i, slot)| {
                          let (generation, value) = slot.as_mut()?;
                          Some((EntityId::new(u32::try_from(i).ok()?, *generation), value))
                      })
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::entity::Entities;

                  #[test]
                  fn insert_get_remove() {
                      let mut entities = Entities::default();
                      let a = entities.spawn();
                      let mut store = Store::default();
                      store.insert(a, 10);
                      assert_eq!(store.get(a), Some(&10));
                      *store.get_mut(a).expect("방금 넣었다") += 1;
                      assert_eq!(store.remove(a), Some(11));
                      assert_eq!(store.get(a), None);
                  }

                  #[test]
                  fn stale_id_gets_nothing() {
                      let mut entities = Entities::default();
                      let a = entities.spawn();
                      let mut store = Store::default();
                      store.insert(a, "old");
                      entities.despawn(a);
                      let b = entities.spawn(); // 같은 슬롯, 다른 세대
                      store.insert(b, "new");
                      assert_eq!(store.get(a), None);
                      assert_eq!(store.get(b), Some(&"new"));
                  }

                  #[test]
                  fn iter_skips_empty_slots() {
                      let mut entities = Entities::default();
                      let ids: Vec<_> = (0..4).map(|_| entities.spawn()).collect();
                      let mut store = Store::default();
                      store.insert(ids[1], 'b');
                      store.insert(ids[3], 'd');
                      let seen: Vec<_> = store.iter().map(|(_, v)| *v).collect();
                      assert_eq!(seen, vec!['b', 'd']);
                  }
              }
