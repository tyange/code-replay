            content: |
              use serde::{Deserialize, Serialize};

              use crate::entity::EntityId;

              /// 컴포넌트 하나를 담는 저장소. 슬롯 번호로 인덱싱되는 Vec이고, 각 칸은 (세대, 값) 또는 비어 있음
              #[derive(Serialize, Deserialize)]
              pub struct Store<T> {
                  slots: Vec<Option<(u32, T)>>,
              }

              impl<T> Default for Store<T> {
                  fn default() -> Self {
                      Store { slots: Vec::new() }
                  }
              }

              impl<T> Store<T> {
                  pub fn insert(&mut self, id: EntityId, value: T) {
                      let i = id.index();
                      if self.slots.len() <= i {
                          self.slots.resize_with(i + 1, || None);
                      }
                      if let Some(slot) = self.slots.get_mut(i) {
                          *slot = Some((id.generation(), value));
                      }
                  }

                  pub fn get(&self, id: EntityId) -> Option<&T> {
                      match self.slots.get(id.index())? {
                          Some((generation, value)) if *generation == id.generation() => Some(value),
                          _ => None,
                      }
                  }

                  pub fn get_mut(&mut self, id: EntityId) -> Option<&mut T> {
                      match self.slots.get_mut(id.index())? {
                          Some((generation, value)) if *generation == id.generation() => Some(value),
                          _ => None,
                      }
                  }

                  pub fn remove(&mut self, id: EntityId) -> Option<T> {
                      let slot = self.slots.get_mut(id.index())?;
                      match slot {
                          Some((generation, _)) if *generation == id.generation() => {
                              slot.take().map(|(_, value)| value)
                          }
                          _ => None,
                      }
                  }

                  /// 살아 있는 모든 (ID, 값) 쌍. 반환된 이터레이터는 이 저장소를 빌리고 있다
                  pub fn iter(&self) -> impl Iterator<Item = (EntityId, &T)> + '_ {
                      self.slots.iter().enumerate().filter_map(|(i, slot)| {
                          let (generation, value) = slot.as_ref()?;
                          Some((EntityId::new(u32::try_from(i).ok()?, *generation), value))
                      })
                  }

                  pub fn iter_mut(&mut self) -> impl Iterator<Item = (EntityId, &mut T)> + '_ {
                      self.slots.iter_mut().enumerate().filter_map(|(i, slot)| {
                          let (generation, value) = slot.as_mut()?;
                          Some((EntityId::new(u32::try_from(i).ok()?, *generation), value))
                      })
                  }

                  /// 서로 다른 두 엔티티의 값을 동시에 가변으로 빌린다
                  pub fn get_two_mut(&mut self, a: EntityId, b: EntityId) -> Option<(&mut T, &mut T)> {
                      if a.index() == b.index() {
                          return None; // 같은 칸을 두 번 가변으로 빌릴 수는 없다
                      }
                      let [slot_a, slot_b] = self.slots.get_disjoint_mut([a.index(), b.index()]).ok()?;
                      match (slot_a, slot_b) {
                          (Some((ga, va)), Some((gb, vb))) if *ga == a.generation() && *gb == b.generation() => {
                              Some((va, vb))
                          }
                          _ => None,
                      }
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::entity::Entities;

                  #[test]
                  fn insert_get_remove() {
                      let mut entities = Entities::default();
                      let a = entities.spawn();
                      let mut store = Store::default();
                      store.insert(a, 10);
                      assert_eq!(store.get(a), Some(&10));
                      *store.get_mut(a).expect("방금 넣었다") += 1;
                      assert_eq!(store.remove(a), Some(11));
                      assert_eq!(store.get(a), None);
                  }

                  #[test]
                  fn stale_id_gets_nothing() {
                      let mut entities = Entities::default();
                      let a = entities.spawn();
                      let mut store = Store::default();
                      store.insert(a, "old");
                      entities.despawn(a);
                      let b = entities.spawn(); // 같은 슬롯, 다른 세대
                      store.insert(b, "new");
                      assert_eq!(store.get(a), None);
                      assert_eq!(store.get(b), Some(&"new"));
                  }

                  #[test]
                  fn iter_skips_empty_slots() {
                      let mut entities = Entities::default();
                      let ids: Vec<_> = (0..4).map(|_| entities.spawn()).collect();
                      let mut store = Store::default();
                      store.insert(ids[1], 'b');
                      store.insert(ids[3], 'd');
                      let seen: Vec<_> = store.iter().map(|(_, v)| *v).collect();
                      assert_eq!(seen, vec!['b', 'd']);
                  }

                  #[test]
                  fn get_two_mut_borrows_two_at_once() {
                      let mut entities = Entities::default();
                      let (a, b) = (entities.spawn(), entities.spawn());
                      let mut store = Store::default();
                      store.insert(a, 1);
                      store.insert(b, 2);
                      {
                          let (x, y) = store.get_two_mut(a, b).expect("둘 다 있다");
                          std::mem::swap(x, y);
                      }
                      assert_eq!(store.get(a), Some(&2));
                      assert_eq!(store.get(b), Some(&1));
                      assert!(store.get_two_mut(a, a).is_none()); // 같은 엔티티
                      entities.despawn(b);
                      let c = entities.spawn(); // b와 같은 슬롯, 다른 세대
                      store.insert(c, 3);
                      assert!(store.get_two_mut(a, b).is_none()); // 세대가 안 맞는 ID
                      assert!(store.get_two_mut(a, c).is_some());
                  }
              }
          - path: rogue-core/src/world.rs
            content: |
              use serde::{Deserialize, Serialize};

              use crate::comps::{
                  Ai, BlocksTile, Combat, Glyph, Health, InBackpack, Item, Monster, Name, Player, Position, Rgb,
                  Viewshed,
              };
              use crate::defs::{ItemDef, MonsterDef};
              use crate::entity::{Entities, EntityId};
              use crate::geom::Point;
              use crate::store::Store;

              #[derive(Default, Serialize, Deserialize)]
              pub struct World {
                  pub entities: Entities,
                  pub positions: Store<Position>,
                  pub glyphs: Store<Glyph>,
                  pub healths: Store<Health>,
                  pub names: Store<Name>,
                  pub blockers: Store<BlocksTile>,
                  pub players: Store<Player>,
                  pub monsters: Store<Monster>,
                  pub ais: Store<Ai>,
                  pub combats: Store<Combat>,
                  pub viewsheds: Store<Viewshed>,
                  pub items: Store<Item>,
                  pub backpacks: Store<InBackpack>,
              }

              impl World {
                  /// 엔티티와 모든 컴포넌트를 지운다
                  pub fn despawn(&mut self, id: EntityId) {
                      self.entities.despawn(id);
                      self.positions.remove(id);
                      self.glyphs.remove(id);
                      self.healths.remove(id);
                      self.names.remove(id);
                      self.blockers.remove(id);
                      self.players.remove(id);
                      self.monsters.remove(id);
                      self.ais.remove(id);
                      self.combats.remove(id);
                      self.viewsheds.remove(id);
                      self.items.remove(id);
                      self.backpacks.remove(id);
                  }

                  pub fn spawn_player(&mut self, pos: Point) -> EntityId {
                      let id = self.entities.spawn();
                      self.positions.insert(id, Position(pos));
                      self.glyphs.insert(
                          id,
                          Glyph {
                              ch: '@',
                              color: Rgb {
                                  r: 255,
                                  g: 221,
                                  b: 51,
                              },
                          },
                      );
                      self.healths.insert(id, Health { hp: 30, max: 30 });
                      self.combats.insert(
                          id,
                          Combat {
                              power: 5,
                              defense: 2,
                          },
                      );
                      self.names.insert(id, Name("Player".to_string()));
                      self.blockers.insert(id, BlocksTile);
                      self.players.insert(id, Player);
                      self.viewsheds.insert(id, Viewshed::new(8));
                      id
                  }

                  pub fn spawn_monster(&mut self, def: &MonsterDef, pos: Point) -> EntityId {
                      let id = self.entities.spawn();
                      self.positions.insert(id, Position(pos));
                      self.glyphs.insert(
                          id,
                          Glyph {
                              ch: def.glyph,
                              color: def.color,
                          },
                      );
                      self.healths.insert(
                          id,
                          Health {
                              hp: def.hp,
                              max: def.hp,
                          },
                      );
                      self.combats.insert(
                          id,
                          Combat {
                              power: def.power,
                              defense: def.defense,
                          },
                      );
                      self.names.insert(id, Name(def.name.clone())); // 정의는 계속 쓰이므로 복사한다
                      self.blockers.insert(id, BlocksTile);
                      self.monsters.insert(id, Monster);
                      self.ais.insert(id, def.ai);
                      self.viewsheds.insert(id, Viewshed::new(def.vision));
                      id
                  }

                  /// 바닥에 놓인 아이템. 길을 막지 않으므로 BlocksTile 은 없다
                  pub fn spawn_item(&mut self, def: &ItemDef, pos: Point) -> EntityId {
                      let id = self.entities.spawn();
                      self.positions.insert(id, Position(pos));
                      self.glyphs.insert(
                          id,
                          Glyph {
                              ch: def.glyph,
                              color: def.color,
                          },
                      );
                      self.names.insert(id, Name(def.name.clone())); // 정의는 계속 쓰이므로 복사한다
                      self.items.insert(id, Item(def.effect));
                      id
                  }

                  /// 이 좌표에서 길을 막고 있는 엔티티
                  pub fn blocker_at(&self, p: Point) -> Option<EntityId> {
                      self.positions
                          .iter()
                          .find(|(id, pos)| pos.0 == p && self.blockers.get(*id).is_some())
                          .map(|(id, _)| id)
                  }
              }

              /// 테스트에서만 쓰는 편의 함수. 정의는 이 프로젝트의 데이터 파일에서 꺼낸다
              #[cfg(test)]
              impl World {
                  pub fn spawn_goblin(&mut self, pos: Point) -> EntityId {
                      self.spawn_monster(&crate::defs::builtin().monsters.remove(0), pos)
                  }

                  pub fn spawn_kobold(&mut self, pos: Point) -> EntityId {
                      self.spawn_monster(&crate::defs::builtin().monsters.remove(1), pos)
                  }

                  pub fn spawn_potion(&mut self, pos: Point) -> EntityId {
                      self.spawn_item(&crate::defs::builtin().items.remove(0), pos)
                  }

                  pub fn spawn_scroll(&mut self, pos: Point) -> EntityId {
                      self.spawn_item(&crate::defs::builtin().items.remove(1), pos)
                  }
              }
      - message: "[4-3] error.rs — Encode, Version 변형"
        files:
          - path: rogue-core/src/error.rs
            content: |
              use std::fmt;

              /// 데이터 파일이나 저장 파일을 다루다 실패할 수 있는 이유
              #[derive(Debug)]
              pub enum DataError {
                  /// 파일을 못 읽었다. 원래 에러를 그대로 감싼다
                  Io(std::io::Error),
                  /// RON 문법이나 필드 이름이 틀렸다. 원래 에러를 그대로 감싼다
                  Parse(ron::error::SpannedError),
                  /// 문법은 맞지만 내용이 말이 안 된다
                  Invalid { what: String, reason: String },
                  /// 저장할 때 인코딩에 실패했다
                  Encode(ron::Error),
                  /// 저장 파일의 버전이 이 프로그램과 다르다
                  Version { found: u32, expected: u32 },
              }

              impl fmt::Display for DataError {
                  fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                      match self {
                          DataError::Io(_) => write!(f, "cannot read the data file"),
                          DataError::Parse(_) => write!(f, "the data file has a syntax error"),
                          DataError::Invalid { what, reason } => write!(f, "{what}: {reason}"),
                          DataError::Encode(_) => write!(f, "cannot encode the save file"),
                          DataError::Version { found, expected } => {
                              write!(
                                  f,
                                  "save file version {found} is not supported (expected {expected})"
                              )
                          }
                      }
                  }
              }

              impl std::error::Error for DataError {
                  /// 원인 에러. 실행 파일은 이걸 따라가며 체인 전체를 보여 줄 수 있다
                  fn source(&self) -> Option<&(dyn std::error::Error + 'static)> {
                      match self {
                          DataError::Io(e) => Some(e),
                          DataError::Parse(e) => Some(e),
                          DataError::Encode(e) => Some(e),
                          DataError::Invalid { .. } | DataError::Version { .. } => None,
                      }
                  }
              }

              impl From<std::io::Error> for DataError {
                  fn from(e: std::io::Error) -> Self {
                      DataError::Io(e)
                  }
              }

              impl From<ron::error::SpannedError> for DataError {
                  fn from(e: ron::error::SpannedError) -> Self {
                      DataError::Parse(e)
                  }
              }

              impl From<ron::Error> for DataError {
                  fn from(e: ron::Error) -> Self {
                      DataError::Encode(e)
                  }
              }
      - message: "[4-3] game.rs — 저장 문자열 만들기와 되살리기"
        files:
          - path: rogue-core/src/game.rs
            content: |
              use serde::{Deserialize, Serialize};

              use crate::action::Action;
              use crate::ai;
              use crate::combat;
              use crate::comps::{Effect, InBackpack};
              use crate::defs::Defs;
              use crate::dungeon;
              use crate::entity::EntityId;
              use crate::error::DataError;
              use crate::event::Event;
              use crate::fov;
              use crate::geom::{Dir, Point};
              use crate::map::Map;
              use crate::rng::Rng;
              use crate::state::{Input, RunState};
              use crate::world::World;

              const SAVE_VERSION: u32 = 1;

              /// 저장할 때의 모양. 게임을 복사하지 않도록 빌려서 감싼다
              #[derive(Serialize)]
              struct SaveRef<'a> {
                  version: u32,
                  game: &'a Game,
              }

              /// 본문보다 먼저 버전만 읽는다. 나머지 필드는 무시된다
              #[derive(Deserialize)]
              struct SaveHeader {
                  version: u32,
              }

              /// 읽을 때의 모양. 읽은 게임은 소유한 값이어야 한다
              #[derive(Deserialize)]
              struct SaveOwned {
                  game: Game,
              }

              #[derive(Serialize, Deserialize)]
              pub struct Game {
                  map: Map,
                  world: World,
                  player: EntityId,
                  events: Vec<Event>,
                  log: Vec<String>,
                  state: RunState,
                  rng: Rng,
                  /// 정의 목록은 저장하지 않는다. 불러올 때 데이터 파일에서 다시 받는다
                  #[serde(skip)]
                  defs: Defs,
              }

              impl Game {
                  /// 시드 하나로 던전 한 판이 정해진다. 같은 시드는 항상 같은 판이다
                  pub fn new(seed: u64, defs: Defs) -> Game {
                      let mut rng = Rng::new(seed);
                      let dungeon = dungeon::generate(40, 25, &mut rng);
                      let Some((first, rest)) = dungeon.rooms.split_first() else {
                          unreachable!("생성기는 방을 최소 하나는 만든다");
                      };
                      let mut world = World::default();
                      let player = world.spawn_player(first.center());
                      for room in rest {
                          for _ in 0..rng.range(0, 3) {
                              let p = room.random_point(&mut rng);
                              if world.blocker_at(p).is_some() {
                                  continue; // 이미 막힌 자리
                              }
                              if let Some(def) = rng.pick(&defs.monsters) {
                                  world.spawn_monster(def, p);
                              }
                          }
                          for def in &defs.items {
                              if rng.chance(def.chance) {
                                  world.spawn_item(def, room.random_point(&mut rng));
                              }
                          }
                      }
                      let mut game = Game {
                          map: dungeon.map,
                          world,
                          player,
                          events: Vec::new(),
                          log: Vec::new(),
                          state: RunState::AwaitingInput,
                          rng,
                          defs,
                      };
                      game.update_views();
                      game
                  }

                  /// 3 단계까지 쓰던 손으로 만든 방. 기존 테스트를 그대로 돌리기 위해 남긴다
                  #[cfg(test)]
                  pub fn hand_made() -> Game {
                      use crate::map::Tile;

                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(15, 10));
                      world.spawn_goblin(Point::new(5, 5));
                      world.spawn_goblin(Point::new(24, 4));
                      world.spawn_kobold(Point::new(20, 15));
                      world.spawn_potion(Point::new(18, 12));
                      world.spawn_scroll(Point::new(13, 8));
                      let mut map = Map::room(30, 20);
                      // 시야와 길찾기를 시험할 벽
                      for y in 3..=12 {
                          map.set(Point::new(10, y), Tile::Wall);
                      }
                      for x in 16..=24 {
                          map.set(Point::new(x, 7), Tile::Wall);
                      }
                      let mut game = Game {
                          map,
                          world,
                          player,
                          events: Vec::new(),
                          log: Vec::new(),
                          state: RunState::AwaitingInput,
                          rng: Rng::new(0),
                          defs: crate::defs::builtin(),
                      };
                      game.update_views();
                      game
                  }

                  pub fn map(&self) -> &Map {
                      &self.map
                  }

                  pub fn world(&self) -> &World {
                      &self.world
                  }

                  pub fn player(&self) -> EntityId {
                      self.player
                  }

                  /// 지금까지의 전투 메시지. 오래된 것이 앞에 있다
                  pub fn log(&self) -> &[String] {
                      &self.log
                  }

                  pub fn state(&self) -> &RunState {
                      &self.state
                  }

                  pub fn is_over(&self) -> bool {
                      matches!(self.state, RunState::GameOver { .. })
                  }

                  pub fn player_hp(&self) -> i32 {
                      self.world.healths.get(self.player).map_or(0, |h| h.hp)
                  }

                  /// 플레이어에게 지금 보이는 좌표인가
                  pub fn can_see(&self, p: Point) -> bool {
                      self.world
                          .viewsheds
                          .get(self.player)
                          .is_some_and(|v| v.visible.contains(&p))
                  }

                  /// 게임 전체를 문자열로. 시야처럼 다시 계산할 수 있는 값은 빠진다
                  pub fn to_save_string(&self) -> Result<String, DataError> {
                      Ok(ron::to_string(&SaveRef {
                          version: SAVE_VERSION,
                          game: self,
                      })?)
                  }

                  /// 저장 문자열에서 게임을 되살린다. 망가졌거나 버전이 다르면 에러
                  pub fn from_save_string(text: &str, defs: Defs) -> Result<Game, DataError> {
                      // 버전부터 본다: 형식이 바뀐 옛 파일은 본문 해석에서 먼저 실패할 수 있기 때문이다
                      let header: SaveHeader = ron::from_str(text)?;
                      if header.version != SAVE_VERSION {
                          return Err(DataError::Version {
                              found: header.version,
                              expected: SAVE_VERSION,
                          });
                      }
                      let SaveOwned { mut game } = ron::from_str(text)?;
                      if game.world.positions.get(game.player).is_none() {
                          return Err(DataError::Invalid {
                              what: "save file".to_string(),
                              reason: "the player entity is missing".to_string(),
                          });
                      }
                      game.defs = defs;
                      // 저장하지 않은 시야를 다시 계산하게 한다
                      for (_, view) in game.world.viewsheds.iter_mut() {
                          view.dirty = true;
                      }
                      game.update_views();
                      Ok(game)
                  }

                  /// 플레이어가 가방에 가진 아이템. 가방 칸 순서대로 나온다
                  pub fn inventory(&self) -> impl Iterator<Item = EntityId> + '_ {
                      self.world
                          .backpacks
                          .iter()
                          .filter(|(_, pack)| pack.owner == self.player)
                          .map(|(id, _)| id)
                  }

                  /// 매 프레임 한 번 부른다. 현재 상태를 값으로 꺼내(소비) 다음 상태를 만들어 되돌려 넣는다
                  pub fn update(&mut self, input: Option<Input>) {
                      let current = std::mem::replace(&mut self.state, RunState::AwaitingInput);
                      self.state = match current {
                          RunState::AwaitingInput => self.on_awaiting_input(input),
                          RunState::MonsterTurn => match self.monsters_act() {
                              Some(cause) => RunState::GameOver { cause },
                              None => RunState::AwaitingInput,
                          },
                          RunState::ShowInventory => self.on_inventory(input),
                          RunState::Targeting { item, cursor } => self.on_targeting(item, cursor, input),
                          RunState::GameOver { cause } => match input {
                              Some(Input::Restart) => {
                                  // 같은 수열 위에서 다음 판을 만든다. core 는 시계를 모른다
                                  let seed = self.rng.next_u64();
                                  // 새 판에도 정의가 필요한데, self 를 덮어쓰기 전에 값을 만들어야 하므로 복사한다
                                  *self = Game::new(seed, self.defs.clone());
                                  return;
                              }
                              _ => RunState::GameOver { cause },
                          },
                      };
                  }

                  fn on_awaiting_input(&mut self, input: Option<Input>) -> RunState {
                      match input {
                          Some(Input::Act(action)) => self.player_turn(action),
                          Some(Input::OpenInventory) => RunState::ShowInventory,
                          Some(Input::Restart)
                          | Some(Input::Cancel)
                          | Some(Input::Choose(_))
                          | Some(Input::MoveCursor(_))
                          | Some(Input::Confirm)
                          | None => RunState::AwaitingInput,
                      }
                  }

                  fn on_inventory(&mut self, input: Option<Input>) -> RunState {
                      match input {
                          Some(Input::Cancel) | Some(Input::OpenInventory) => RunState::AwaitingInput,
                          Some(Input::Choose(n)) => {
                              // 빌림이 이 줄에서 끝나도록 값(EntityId, Copy)만 꺼낸다
                              let chosen = self.inventory().nth(n);
                              match chosen {
                                  Some(item) => self.use_item(item),
                                  None => RunState::ShowInventory,
                              }
                          }
                          Some(Input::Act(_))
                          | Some(Input::Restart)
                          | Some(Input::MoveCursor(_))
                          | Some(Input::Confirm)
                          | None => RunState::ShowInventory,
                      }
                  }

                  fn on_targeting(&mut self, item: EntityId, cursor: Point, input: Option<Input>) -> RunState {
                      match input {
                          Some(Input::MoveCursor(dir)) => {
                              let next = cursor.step(dir);
                              // 보이는 곳으로만 커서를 옮길 수 있다
                              let cursor = if self.can_see(next) { next } else { cursor };
                              RunState::Targeting { item, cursor }
                          }
                          Some(Input::Confirm) => self.cast(item, cursor),
                          Some(Input::Cancel) => RunState::ShowInventory,
                          Some(Input::Act(_))
                          | Some(Input::Restart)
                          | Some(Input::OpenInventory)
                          | Some(Input::Choose(_))
                          | None => RunState::Targeting { item, cursor },
                      }
                  }

                  /// 플레이어의 행동 하나를 처리하고 다음 상태를 돌려준다
                  fn player_turn(&mut self, action: Action) -> RunState {
                      self.perform(self.player, action);
                      self.update_views();
                      self.finish_player_turn()
                  }

                  fn finish_player_turn(&mut self) -> RunState {
                      match self.apply_events() {
                          Some(cause) => RunState::GameOver { cause },
                          None => RunState::MonsterTurn,
                      }
                  }

                  fn use_item(&mut self, item: EntityId) -> RunState {
                      let Some(effect) = self.world.items.get(item).map(|i| i.0) else {
                          return RunState::ShowInventory;
                      };
                      let name = self.name_of(item);
                      match effect {
                          Effect::Heal(amount) => {
                              self.push_log(format!("You drink the {name}."));
                              self.events.push(Event::Heal {
                                  target: self.player,
                                  amount,
                              });
                              self.events.push(Event::Consume { item });
                              self.finish_player_turn()
                          }
                          Effect::AreaDamage { .. } => {
                              let cursor = self
                                  .world
                                  .positions
                                  .get(self.player)
                                  .map_or(Point::new(0, 0), |p| p.0);
                              RunState::Targeting { item, cursor }
                          }
                      }
                  }

                  fn cast(&mut self, item: EntityId, center: Point) -> RunState {
                      let Some(Effect::AreaDamage { amount, radius }) = self.world.items.get(item).map(|i| i.0)
                      else {
                          return RunState::ShowInventory;
                      };
                      let name = self.name_of(item);
                      self.push_log(format!("You read the {name}."));
                      self.events
                          .extend(self.world.monsters.iter().filter_map(|(id, _)| {
                              let pos = self.world.positions.get(id)?.0;
                              (pos.dist2(center) <= radius * radius).then_some(Event::Damage {
                                  target: id,
                                  amount,
                                  source: self.player,
                              })
                          }));
                      self.events.push(Event::Consume { item });
                      self.finish_player_turn()
                  }

                  fn perform(&mut self, actor: EntityId, action: Action) {
                      match action {
                          Action::Wait => {}
                          Action::Move(dir) => self.try_move(actor, dir),
                          Action::Pickup => self.pickup(actor),
                      }
                  }

                  fn try_move(&mut self, actor: EntityId, dir: Dir) {
                      let Some(from) = self.world.positions.get(actor).map(|p| p.0) else {
                          return;
                      };
                      let to = from.step(dir);
                      match self.world.blocker_at(to) {
                          Some(other) => self.attack(actor, other),
                          None if self.map.is_walkable(to) => {
                              if let Some(p) = self.world.positions.get_mut(actor) {
                                  p.0 = to;
                              }
                              if let Some(v) = self.world.viewsheds.get_mut(actor) {
                                  v.dirty = true;
                              }
                          }
                          None => {}
                      }
                  }

                  /// 발밑의 아이템 하나를 가방에 넣는다. 바닥에서 사라지므로 Position을 지운다
                  fn pickup(&mut self, actor: EntityId) {
                      let Some(here) = self.world.positions.get(actor).map(|p| p.0) else {
                          return;
                      };
                      let found = self
                          .world
                          .items
                          .iter()
                          .map(|(id, _)| id)
                          .find(|&id| self.world.positions.get(id).is_some_and(|p| p.0 == here));
                      match found {
                          Some(item) => {
                              self.world.positions.remove(item);
                              self.world
                                  .backpacks
                                  .insert(item, InBackpack { owner: actor });
                              let name = self.name_of(item);
                              self.push_log(format!("You pick up the {name}."));
                          }
                          None => self.push_log("There is nothing here to pick up.".to_string()),
                      }
                  }

                  fn attack(&mut self, attacker: EntityId, defender: EntityId) {
                      // 플레이어와 몬스터 사이에서만 싸운다 (몬스터끼리는 서로 막기만 한다)
                      if attacker != self.player && defender != self.player {
                          return;
                      }
                      // 체력을 직접 바꾸지 않고, 일어나야 할 일을 큐에 넣는다
                      if let Some(event) = combat::attack_event(&self.world, attacker, defender) {
                          self.events.push(event);
                      }
                  }

                  /// 쌓인 이벤트를 한 번에 적용한다. 플레이어가 죽었으면 사인(죽인 쪽의 이름)을 돌려준다
                  fn apply_events(&mut self) -> Option<String> {
                      let mut cause = None;
                      let events = std::mem::take(&mut self.events);
                      for event in events {
                          match event {
                              Event::Damage {
                                  target,
                                  amount,
                                  source,
                              } => {
                                  let attacker = self.name_of(source);
                                  let defender = self.name_of(target);
                                  let Some(health) = self.world.healths.get_mut(target) else {
                                      continue; // 같은 턴에 이미 죽은 대상
                                  };
                                  health.hp -= amount;
                                  let dead = health.hp <= 0;
                                  self.push_log(format!("{attacker} hits {defender} for {amount}."));
                                  if dead {
                                      self.push_log(format!("{defender} dies."));
                                      if target == self.player {
                                          // 플레이어는 지우지 않는다. 죽음은 상태(GameOver)로 표현한다
                                          cause = Some(attacker);
                                      } else {
                                          self.world.despawn(target);
                                      }
                                  }
                              }
                              Event::Heal { target, amount } => {
                                  let name = self.name_of(target);
                                  if let Some(health) = self.world.healths.get_mut(target) {
                                      health.hp = (health.hp + amount).min(health.max);
                                      self.push_log(format!("{name} recovers {amount} HP."));
                                  }
                              }
                              Event::Consume { item } => self.world.despawn(item),
                          }
                      }
                      cause
                  }

                  /// 다시 계산이 필요한 시야만 계산한다. 플레이어가 본 타일은 "본 적 있음"으로 기록한다
                  fn update_views(&mut self) {
                      for (id, view) in self.world.viewsheds.iter_mut() {
                          if !view.dirty {
                              continue;
                          }
                          let Some(pos) = self.world.positions.get(id) else {
                              continue;
                          };
                          view.visible = fov::compute(&self.map, pos.0, view.range);
                          view.dirty = false;
                          if id == self.player {
                              for &p in &view.visible {
                                  self.map.mark_explored(p);
                              }
                          }
                      }
                  }

                  fn name_of(&self, id: EntityId) -> String {
                      self.world
                          .names
                          .get(id)
                          .map_or_else(|| "Something".to_string(), |n| n.0.clone()) // 로그에 남길 이름은 소유한 값이 필요하다
                  }

                  /// 화면 아래 메시지 줄에 한 줄을 남긴다 (실행 파일이 불러오기 실패를 알리는 데도 쓴다)
                  pub fn push_log(&mut self, line: String) {
                      self.log.push(line);
                      if self.log.len() > 100 {
                          self.log.drain(..50);
                      }
                  }

                  /// 모든 몬스터가 행동한다. 플레이어가 죽으면 사인을 돌려준다
                  fn monsters_act(&mut self) -> Option<String> {
                      // 순회하면서 perform 으로 월드를 고쳐야 하므로, ID 를 먼저 모아 빌림을 끝낸다
                      let ids: Vec<EntityId> = self.world.monsters.iter().map(|(id, _)| id).collect();
                      for id in ids {
                          let action = ai::decide(&self.world, &self.map, id, self.player);
                          self.perform(id, action);
                          self.update_views();
                          if let Some(cause) = self.apply_events() {
                              return Some(cause);
                          }
                      }
                      None
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::map::Tile;

                  /// 입력 하나를 넣고, 몬스터 차례까지 끝낸다
                  fn act(game: &mut Game, action: Action) {
                      game.update(Some(Input::Act(action)));
                      game.update(None);
                  }

                  fn player_pos(game: &Game) -> Option<Point> {
                      game.world.positions.get(game.player).map(|p| p.0)
                  }

                  /// 몬스터를 모두 치워서 플레이어만 남긴다
                  fn clear_monsters(game: &mut Game) {
                      let ids: Vec<EntityId> = game.world.monsters.iter().map(|(id, _)| id).collect();
                      for id in ids {
                          game.world.despawn(id);
                      }
                  }

                  #[test]
                  fn player_moves_and_stops_at_wall() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      act(&mut game, Action::Move(Dir::Right));
                      assert_eq!(player_pos(&game), Some(Point::new(16, 10)));
                      for _ in 0..30 {
                          act(&mut game, Action::Move(Dir::Left));
                      }
                      assert_eq!(player_pos(&game), Some(Point::new(11, 10)));
                  }

                  #[test]
                  fn moving_into_a_monster_attacks_it() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(16, 10));
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      // 이동하지 않고 공격한다: 공격 5 - 방어 1 = 4
                      assert_eq!(player_pos(&game), Some(Point::new(15, 10)));
                      assert_eq!(game.world.healths.get(goblin).map(|h| h.hp), Some(6));
                      assert_eq!(
                          game.log().first().map(String::as_str),
                          Some("Player hits Goblin for 4.")
                      );
                  }

                  #[test]
                  fn monster_dies_and_is_removed() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(16, 10));
                      if let Some(h) = game.world.healths.get_mut(goblin) {
                          h.hp = 4;
                      }
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      assert!(!game.world.entities.is_alive(goblin));
                      assert!(game.world.blocker_at(Point::new(16, 10)).is_none());
                      assert_eq!(game.log().last().map(String::as_str), Some("Goblin dies."));
                  }

                  #[test]
                  fn monsters_approach_the_player() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(12, 10));
                      act(&mut game, Action::Wait);
                      assert_eq!(
                          game.world.positions.get(goblin).map(|p| p.0),
                          Some(Point::new(13, 10))
                      );
                  }

                  #[test]
                  fn adjacent_monster_attacks_the_player() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      game.world.spawn_goblin(Point::new(16, 10));
                      act(&mut game, Action::Wait);
                      // 공격 4 - 방어 2 = 2
                      assert_eq!(game.player_hp(), 28);
                      assert_eq!(game.log(), ["Goblin hits Player for 2."]);
                  }

                  #[test]
                  fn minimum_damage_applies_in_game() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(16, 10));
                      if let Some(c) = game.world.combats.get_mut(goblin) {
                          c.defense = 99;
                      }
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      assert_eq!(game.world.healths.get(goblin).map(|h| h.hp), Some(9));
                  }

                  #[test]
                  fn no_input_changes_nothing() {
                      let mut game = Game::hand_made();
                      for _ in 0..10 {
                          game.update(None);
                      }
                      assert_eq!(player_pos(&game), Some(Point::new(15, 10)));
                      assert_eq!(game.state(), &RunState::AwaitingInput);
                      assert!(game.log().is_empty());
                  }

                  #[test]
                  fn turn_goes_through_monster_turn() {
                      let mut game = Game::hand_made();
                      game.update(Some(Input::Act(Action::Wait)));
                      assert_eq!(game.state(), &RunState::MonsterTurn);
                      game.update(None);
                      assert_eq!(game.state(), &RunState::AwaitingInput);
                  }

                  #[test]
                  fn player_death_leads_to_game_over() {
                      let mut game = Game::hand_made();
                      // 몬스터는 플레이어가 보여야 다가온다. 시야 안에 고블린 하나를 둔다
                      game.world.spawn_goblin(Point::new(16, 10));
                      for _ in 0..200 {
                          act(&mut game, Action::Wait);
                      }
                      assert!(game.is_over());
                      assert_eq!(
                          game.state(),
                          &RunState::GameOver {
                              cause: "Goblin".to_string()
                          }
                      );
                  }

                  #[test]
                  fn game_over_ignores_moves_and_restart_starts_over() {
                      let mut game = Game::hand_made();
                      // 몬스터는 플레이어가 보여야 다가온다. 시야 안에 고블린 하나를 둔다
                      game.world.spawn_goblin(Point::new(16, 10));
                      for _ in 0..200 {
                          act(&mut game, Action::Wait);
                      }
                      let before = player_pos(&game);
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      assert!(game.is_over());
                      assert_eq!(player_pos(&game), before);

                      game.update(Some(Input::Restart));
                      assert_eq!(game.state(), &RunState::AwaitingInput);
                      assert_eq!(game.player_hp(), 30);
                  }

                  /// 플레이어 발밑으로 아이템을 옮겨 놓는다
                  fn put_under_player(game: &mut Game, item: EntityId) {
                      let here = player_pos(game).unwrap();
                      game.world
                          .positions
                          .insert(item, crate::comps::Position(here));
                  }

                  #[test]
                  fn pickup_moves_item_into_backpack() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      let potion = game.world.spawn_potion(Point::new(0, 0));
                      put_under_player(&mut game, potion);
                      act(&mut game, Action::Pickup);
                      assert!(game.world.positions.get(potion).is_none());
                      assert_eq!(game.inventory().collect::<Vec<_>>(), vec![potion]);
                  }

                  #[test]
                  fn pickup_on_empty_floor_only_logs() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      act(&mut game, Action::Pickup);
                      assert_eq!(
                          game.log().last().map(String::as_str),
                          Some("There is nothing here to pick up.")
                      );
                      assert_eq!(game.inventory().count(), 0);
                  }

                  #[test]
                  fn potion_heals_up_to_max_and_is_consumed() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      let potion = game.world.spawn_potion(Point::new(0, 0));
                      put_under_player(&mut game, potion);
                      act(&mut game, Action::Pickup);
                      game.world.healths.get_mut(game.player).unwrap().hp = 25;
                      game.update(Some(Input::OpenInventory));
                      game.update(Some(Input::Choose(0)));
                      assert_eq!(game.state(), &RunState::MonsterTurn);
                      assert_eq!(game.player_hp(), 30); // 25 + 12가 아니라 최대 체력까지만
                      assert!(game.world.items.get(potion).is_none());
                      assert_eq!(game.inventory().count(), 0);
                  }

                  #[test]
                  fn opening_inventory_costs_no_turn() {
                      let mut game = Game::hand_made();
                      game.world.spawn_goblin(Point::new(17, 10));
                      let before: Vec<_> = game
                          .world
                          .positions
                          .iter()
                          .map(|(id, p)| (id, *p))
                          .collect();
                      game.update(Some(Input::OpenInventory));
                      assert_eq!(game.state(), &RunState::ShowInventory);
                      game.update(Some(Input::Cancel));
                      assert_eq!(game.state(), &RunState::AwaitingInput);
                      // 몬스터 차례를 거치지 않았으므로 아무도 움직이지 않았다
                      let after: Vec<_> = game
                          .world
                          .positions
                          .iter()
                          .map(|(id, p)| (id, *p))
                          .collect();
                      assert_eq!(before, after);
                  }

                  #[test]
                  fn choosing_a_missing_slot_changes_nothing() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      game.update(Some(Input::OpenInventory));
                      game.update(Some(Input::Choose(3)));
                      assert_eq!(game.state(), &RunState::ShowInventory);
                      assert_eq!(game.player_hp(), 30);
                      assert!(game.log().is_empty());
                  }

                  #[test]
                  fn scroll_goes_through_targeting_and_hits_area() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      let near = game.world.spawn_goblin(Point::new(17, 10));
                      let far = game.world.spawn_goblin(Point::new(15, 15));
                      let scroll = game.world.spawn_scroll(Point::new(0, 0));
                      put_under_player(&mut game, scroll);
                      act(&mut game, Action::Pickup);

                      game.update(Some(Input::OpenInventory));
                      game.update(Some(Input::Choose(0)));
                      assert!(matches!(game.state(), RunState::Targeting { .. }));
                      game.update(Some(Input::MoveCursor(Dir::Right)));
                      game.update(Some(Input::MoveCursor(Dir::Right)));
                      game.update(Some(Input::Confirm));
                      assert_eq!(game.state(), &RunState::MonsterTurn);
                      // 고블린 HP 10, 피해 8: 범위 안은 살아남고(2), 범위 밖은 그대로
                      assert_eq!(game.world.healths.get(near).map(|h| h.hp), Some(2));
                      assert_eq!(game.world.healths.get(far).map(|h| h.hp), Some(10));
                      assert!(game.world.items.get(scroll).is_none());
                  }

                  #[test]
                  fn cancelling_targeting_keeps_the_scroll() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      let scroll = game.world.spawn_scroll(Point::new(0, 0));
                      put_under_player(&mut game, scroll);
                      act(&mut game, Action::Pickup);
                      game.update(Some(Input::OpenInventory));
                      game.update(Some(Input::Choose(0)));
                      assert!(matches!(game.state(), RunState::Targeting { .. }));
                      game.update(Some(Input::Cancel));
                      assert_eq!(game.state(), &RunState::ShowInventory);
                      assert_eq!(game.inventory().collect::<Vec<_>>(), vec![scroll]);
                  }

                  #[test]
                  fn cursor_cannot_leave_the_field_of_view() {
                      let mut game = Game::hand_made();
                      clear_monsters(&mut game);
                      let scroll = game.world.spawn_scroll(Point::new(0, 0));
                      put_under_player(&mut game, scroll);
                      act(&mut game, Action::Pickup);
                      game.update(Some(Input::OpenInventory));
                      game.update(Some(Input::Choose(0)));
                      for _ in 0..30 {
                          game.update(Some(Input::MoveCursor(Dir::Left)));
                      }
                      let RunState::Targeting { cursor, .. } = game.state() else {
                          panic!("should still be targeting");
                      };
                      assert!(game.can_see(*cursor));
                  }

                  /// 화면에 놓인 모든 것의 (위치, 글자). 두 판이 같은지 비교할 때 쓴다
                  fn layout(game: &Game) -> Vec<(Point, char)> {
                      game.world
                          .positions
                          .iter()
                          .filter_map(|(id, p)| Some((p.0, game.world.glyphs.get(id)?.ch)))
                          .collect()
                  }

                  #[test]
                  fn same_seed_same_game() {
                      let a = Game::new(42, crate::defs::builtin());
                      let b = Game::new(42, crate::defs::builtin());
                      assert_eq!(a.map(), b.map());
                      assert_eq!(layout(&a), layout(&b));
                  }

                  #[test]
                  fn different_seed_different_game() {
                      let a = Game::new(1, crate::defs::builtin());
                      let b = Game::new(2, crate::defs::builtin());
                      assert_ne!(a.map(), b.map());
                  }

                  #[test]
                  fn player_starts_on_floor_with_nothing_on_top() {
                      for seed in 0..50 {
                          let game = Game::new(seed, crate::defs::builtin());
                          let here = player_pos(&game).expect("player has a position");
                          assert_eq!(game.map().tile(here), Some(Tile::Floor), "seed {seed}");
                          let others = game
                              .world
                              .positions
                              .iter()
                              .filter(|&(id, p)| id != game.player && p.0 == here)
                              .count();
                          assert_eq!(others, 0, "seed {seed}");
                      }
                  }

                  #[test]
                  fn restart_gives_a_new_dungeon_but_is_deterministic() {
                      let mut a = Game::new(9, crate::defs::builtin());
                      let mut b = Game::new(9, crate::defs::builtin());
                      let first = a.map().clone();
                      for game in [&mut a, &mut b] {
                          game.state = RunState::GameOver {
                              cause: "test".to_string(),
                          };
                          game.update(Some(Input::Restart));
                      }
                      assert_eq!(a.state(), &RunState::AwaitingInput);
                      assert_ne!(a.map(), &first);
                      assert_eq!(a.map(), b.map());
                  }

                  fn play_script(game: &mut Game, steps: usize) {
                      let moves = [Dir::Right, Dir::Down, Dir::Left, Dir::Up];
                      for i in 0..steps {
                          act(game, Action::Move(moves[i % 4]));
                          if i % 5 == 0 {
                              act(game, Action::Wait);
                          }
                      }
                  }

                  #[test]
                  fn save_and_load_roundtrip() {
                      let mut game = Game::new(11, crate::defs::builtin());
                      play_script(&mut game, 12);
                      let text = game.to_save_string().unwrap();
                      let loaded = Game::from_save_string(&text, crate::defs::builtin()).unwrap();
                      assert_eq!(loaded.to_save_string().unwrap(), text);
                      assert_eq!(player_pos(&loaded), player_pos(&game));
                      // 시야는 저장하지 않았지만 불러오면서 다시 계산된다
                      let here = player_pos(&loaded).unwrap();
                      assert!(loaded.can_see(here));
                  }

                  #[test]
                  fn loaded_game_continues_exactly_like_the_original() {
                      let mut original = Game::new(21, crate::defs::builtin());
                      play_script(&mut original, 8);
                      let text = original.to_save_string().unwrap();
                      let mut loaded = Game::from_save_string(&text, crate::defs::builtin()).unwrap();
                      play_script(&mut original, 40);
                      play_script(&mut loaded, 40);
                      assert_eq!(
                          original.to_save_string().unwrap(),
                          loaded.to_save_string().unwrap()
                      );
                  }

                  #[test]
                  fn garbage_save_is_an_error_not_a_panic() {
                      for text in ["", "hello", "(version: 1)", "(version: 1, game: 5)"] {
                          assert!(Game::from_save_string(text, crate::defs::builtin()).is_err());
                      }
                  }

                  #[test]
                  fn wrong_version_is_reported_as_version_error() {
                      let game = Game::new(3, crate::defs::builtin());
                      let text = game.to_save_string().unwrap();
                      let old = text.replacen(&format!("version:{SAVE_VERSION}"), "version:99", 1);
                      assert_ne!(old, text);
                      match Game::from_save_string(&old, crate::defs::builtin()) {
                          Err(DataError::Version { found, expected }) => {
                              assert_eq!((found, expected), (99, 1));
                          }
                          Err(other) => panic!("expected Version, got {other:?}"),
                          Ok(_) => panic!("expected Version, got a game"),
                      }
                  }

                  #[test]
                  fn save_without_a_player_is_invalid() {
                      let mut game = Game::new(3, crate::defs::builtin());
                      game.world.despawn(game.player);
                      let text = game.to_save_string().unwrap();
                      let err = Game::from_save_string(&text, crate::defs::builtin()).err();
                      assert!(matches!(err, Some(DataError::Invalid { .. })));
                  }
              }
      - message: "[4-3] main.rs — 시작할 때 이어하기, 닫을 때 저장"
        files:
          - path: rogue/src/main.rs
            content: |
              use std::error::Error;

              use macroquad::prelude::*;
              use rogue_core::{Action, DataError, Defs, Dir, Game, Input, Point, Rgb, RunState, Tile};

              const TILE: f32 = 20.0;
              /// 이어하기 파일. rogue 폴더에서 실행하면 그 폴더에 생긴다
              const SAVE_PATH: &str = "save.ron";

              const NUMBER_KEYS: [KeyCode; 9] = [
                  KeyCode::Key1,
                  KeyCode::Key2,
                  KeyCode::Key3,
                  KeyCode::Key4,
                  KeyCode::Key5,
                  KeyCode::Key6,
                  KeyCode::Key7,
                  KeyCode::Key8,
                  KeyCode::Key9,
              ];

              fn tile_color(tile: Tile) -> Color {
                  match tile {
                      Tile::Wall => DARKGRAY,
                      Tile::Floor => Color::new(0.15, 0.15, 0.2, 1.0),
                  }
              }

              fn dim(c: Color) -> Color {
                  Color::new(c.r * 0.4, c.g * 0.4, c.b * 0.4, c.a)
              }

              /// core의 색을 macroquad의 색으로. 변환은 실행 파일 쪽에 둔다
              fn to_color(c: Rgb) -> Color {
                  Color::from_rgba(c.r, c.g, c.b, 255)
              }

              /// 이번 프레임에 눌린 방향키
              fn read_direction() -> Option<Dir> {
                  if is_key_pressed(KeyCode::Up) {
                      Some(Dir::Up)
                  } else if is_key_pressed(KeyCode::Down) {
                      Some(Dir::Down)
                  } else if is_key_pressed(KeyCode::Left) {
                      Some(Dir::Left)
                  } else if is_key_pressed(KeyCode::Right) {
                      Some(Dir::Right)
                  } else {
                      None
                  }
              }

              /// 같은 키라도 지금 상태에 따라 뜻이 다르다. 상태마다 키 해석을 따로 둔다
              fn read_input(state: &RunState) -> Option<Input> {
                  match state {
                      RunState::AwaitingInput => {
                          if let Some(dir) = read_direction() {
                              Some(Input::Act(Action::Move(dir)))
                          } else if is_key_pressed(KeyCode::Space) {
                              Some(Input::Act(Action::Wait))
                          } else if is_key_pressed(KeyCode::G) {
                              Some(Input::Act(Action::Pickup))
                          } else if is_key_pressed(KeyCode::I) {
                              Some(Input::OpenInventory)
                          } else {
                              None
                          }
                      }
                      RunState::ShowInventory => {
                          if is_key_pressed(KeyCode::Escape) || is_key_pressed(KeyCode::I) {
                              Some(Input::Cancel)
                          } else {
                              NUMBER_KEYS
                                  .iter()
                                  .position(|&k| is_key_pressed(k))
                                  .map(Input::Choose)
                          }
                      }
                      RunState::Targeting { .. } => {
                          if let Some(dir) = read_direction() {
                              Some(Input::MoveCursor(dir))
                          } else if is_key_pressed(KeyCode::Enter) {
                              Some(Input::Confirm)
                          } else if is_key_pressed(KeyCode::Escape) {
                              Some(Input::Cancel)
                          } else {
                              None
                          }
                      }
                      RunState::MonsterTurn => None,
                      RunState::GameOver { .. } => is_key_pressed(KeyCode::R).then_some(Input::Restart),
                  }
              }

              /// 시드는 실행 파일 쪽의 일이다: core는 시계를 모른다
              fn fresh_seed() -> u64 {
                  std::time::SystemTime::now()
                      .duration_since(std::time::UNIX_EPOCH)
                      .map_or(0, |d| d.as_nanos() as u64)
              }

              fn draw_glyph(p: Point, ch: char, color: Color) {
                  draw_text(
                      ch.to_string(),
                      p.x as f32 * TILE + 5.0,
                      (p.y + 1) as f32 * TILE - 5.0,
                      TILE,
                      color,
                  );
              }

              /// 저장 파일이 있으면 이어서, 없으면 새 게임. 망가졌으면 새 게임을 시작하고 이유를 남긴다
              fn load_or_new(defs: &Defs) -> Game {
                  // Game 이 정의 목록을 소유하므로, 넘길 때마다 복사본을 만든다
                  let Ok(text) = std::fs::read_to_string(SAVE_PATH) else {
                      return Game::new(fresh_seed(), defs.clone()); // 파일이 없는 것은 에러가 아니다
                  };
                  match Game::from_save_string(&text, defs.clone()) {
                      Ok(game) => game,
                      Err(err) => {
                          let mut game = Game::new(fresh_seed(), defs.clone());
                          game.push_log(format!("Starting a new game: {err}"));
                          game
                      }
                  }
              }

              /// 창을 닫을 때 부른다. 게임오버면 저장 파일을 지운다. 실패해도 게임을 멈추지 않는다
              fn save_on_quit(game: &Game) {
                  if game.is_over() {
                      let _ = std::fs::remove_file(SAVE_PATH); // 이미 없으면 지울 것도 없다
                      return;
                  }
                  let result = game
                      .to_save_string()
                      .map_err(|e| e.to_string())
                      .and_then(|text| std::fs::write(SAVE_PATH, text).map_err(|e| e.to_string()));
                  if let Err(err) = result {
                      eprintln!("could not save the game: {err}");
                  }
              }

              /// 데이터 파일을 못 읽었을 때의 화면. 에러와 원인 체인을 보여 주고 Esc 로 닫는다
              async fn show_data_error(err: &DataError) {
                  let mut lines = vec![err.to_string()];
                  let mut source = err.source();
                  while let Some(cause) = source {
                      lines.push(format!("caused by: {cause}"));
                      source = cause.source();
                  }
                  loop {
                      if is_key_pressed(KeyCode::Escape) {
                          return;
                      }
                      clear_background(BLACK);
                      draw_text("Cannot load the game data", 20.0, 40.0, 32.0, RED);
                      for (i, line) in lines.iter().enumerate() {
                          draw_text(line, 20.0, 80.0 + i as f32 * 26.0, 22.0, WHITE);
                      }
                      draw_text(
                          "Press Esc to quit",
                          20.0,
                          screen_height() - 30.0,
                          24.0,
                          GRAY,
                      );
                      next_frame().await;
                  }
              }

              #[macroquad::main("Rogue")]
              async fn main() {
                  // cargo run 은 rogue 폴더에서 하므로, 저장소 루트의 data 폴더는 한 단계 위에 있다
                  let defs = match Defs::load("../data/defs.ron") {
                      Ok(defs) => defs,
                      Err(err) => {
                          show_data_error(&err).await;
                          return;
                      }
                  };
                  let mut game = load_or_new(&defs);
                  // 창 닫기를 바로 처리하지 않고, 저장할 기회를 얻는다
                  prevent_quit();

                  loop {
                      if is_quit_requested() {
                          save_on_quit(&game);
                          break;
                      }

                      let input = read_input(game.state());
                      game.update(input);

                      clear_background(BLACK);

                      let map = game.map();
                      for y in 0..map.height() {
                          for x in 0..map.width() {
                              let p = Point::new(x, y);
                              let visible = game.can_see(p);
                              // 지금 보이지도 않고 본 적도 없으면 그리지 않는다
                              if !visible && !map.is_explored(p) {
                                  continue;
                              }
                              if let Some(tile) = map.tile(p) {
                                  let color = if visible {
                                      tile_color(tile)
                                  } else {
                                      dim(tile_color(tile))
                                  };
                                  draw_rectangle(
                                      x as f32 * TILE,
                                      y as f32 * TILE,
                                      TILE - 1.0,
                                      TILE - 1.0,
                                      color,
                                  );
                              }
                          }
                      }

                      // 위치와 모양이 둘 다 있는 것은 모두 그린다. 플레이어인지 몬스터인지는 묻지 않는다
                      let world = game.world();
                      for (id, pos) in world.positions.iter() {
                          if !game.can_see(pos.0) {
                              continue;
                          }
                          if let Some(glyph) = world.glyphs.get(id) {
                              draw_glyph(pos.0, glyph.ch, to_color(glyph.color));
                          }
                      }

                      let base_y = map.height() as f32 * TILE;
                      draw_text(
                          format!("HP {}", game.player_hp()),
                          10.0,
                          base_y + 24.0,
                          28.0,
                          WHITE,
                      );

                      // 최근 전투 메시지 4줄
                      for (i, line) in game.log().iter().rev().take(4).enumerate() {
                          draw_text(line, 10.0, base_y + 50.0 + i as f32 * 20.0, 20.0, LIGHTGRAY);
                      }

                      // 상태에 따라 무엇을 더 그릴지 정한다. 와일드카드 없이 모든 상태를 적는다
                      match game.state() {
                          RunState::AwaitingInput | RunState::MonsterTurn => {}
                          RunState::ShowInventory => {
                              draw_rectangle(40.0, 40.0, 440.0, 320.0, Color::new(0.0, 0.0, 0.0, 0.85));
                              draw_text("Inventory (1-9 use, Esc close)", 60.0, 75.0, 26.0, WHITE);
                              for (i, id) in game.inventory().enumerate() {
                                  let name = world.names.get(id).map_or("?", |n| n.0.as_str());
                                  draw_text(
                                      format!("{}) {name}", i + 1),
                                      60.0,
                                      110.0 + i as f32 * 26.0,
                                      24.0,
                                      LIGHTGRAY,
                                  );
                              }
                          }
                          RunState::Targeting { cursor, .. } => {
                              draw_rectangle_lines(
                                  cursor.x as f32 * TILE,
                                  cursor.y as f32 * TILE,
                                  TILE,
                                  TILE,
                                  2.0,
                                  YELLOW,
                              );
                              draw_text(
                                  "Arrows move, Enter fire, Esc back",
                                  10.0,
                                  20.0,
                                  24.0,
                                  YELLOW,
                              );
                          }
                          RunState::GameOver { cause } => {
                              let mid_y = screen_height() / 2.0;
                              draw_text(
                                  format!("You died. Killed by {cause}."),
                                  40.0,
                                  mid_y,
                                  36.0,
                                  RED,
                              );
                              draw_text("Press R to restart", 40.0, mid_y + 40.0, 28.0, WHITE);
                          }
                      }

                      next_frame().await;
                  }
              }
  - id: 5-1
    title: 5-1. 백그라운드 층 생성
    doc: |
      # 5-1. 백그라운드 층 생성

      ### 만들 것

      계단을 내려가면 다음 층을 생성합니다. 생성은 **별도 스레드**에서 하고, 그동안 화면은 "다음 층 생성 중" 문구와 함께 계속 반응합니다. 테스트를 위해 생성 함수에 일부러 짧은 지연을 넣으세요.

      ### 요구사항

      - 계단 타일과 "내려가기" 행동을 추가합니다. 3-1의 상태 enum에 "층 생성 대기 중"이 추가됩니다.
      - 내려가기가 일어나면: 채널을 만들고, 송신자와 **생성에 필요한 값들(시드, 깊이, 정의 목록 등)을 스레드로 옮겨서(move)** 스레드를 띄웁니다. 스레드는 생성한 층 데이터를 송신자로 보냅니다.
      - 메인 루프는 대기 상태에서 매 프레임 수신자를 **막지 않는 방식으로** 확인합니다. 결과가 오면 월드에 반영하고 입력 대기로 돌아갑니다.
      - 정의 목록처럼 크고 읽기만 하는 데이터는 매번 복사하지 말고 공유하세요. 스레드 사이에서 공유하려면 어떤 포인터 타입이 필요한지 찾아보는 것이 이 단계의 과제입니다.

      ### 코드

      이 단계부터는 **요구사항, 데이터 모양, 검증 테스트**가 중심입니다. "어디가 막힐지"는 힌트로 미리 알려 드립니다.

      **무엇을 만드나**

      - 마지막 방 가운데에 계단 타일 `Tile::Stairs` 를 놓습니다. 걸을 수 있고 시야를 가리지 않습니다. `Map::find(tile) -> Option<Point>` 도 만드세요.
      - `Action::Descend` (키는 `.`). 계단 위에서만 동작합니다. 아니면 로그 `There are no stairs here.` 만 남기고 턴은 쓰입니다.
      - 다음 층은 **다른 스레드**가 만들고, 그동안 `RunState::Generating` 입니다. 이 상태에서는 입력과 몬스터 행동이 없고, 매 프레임 `update(None)` 이 결과를 **막지 않고** 확인합니다. 화면에는 `Generating next floor...` 가 뜨고 창은 계속 반응해야 합니다.
      - 층이 바뀌어도 플레이어 엔티티(같은 `EntityId`)와 가방 속 아이템은 유지됩니다. 바닥에 있던 몬스터와 아이템은 모두 치웁니다.
      - 같은 시드는 스레드가 얼마나 빨리 끝나든 같은 층을 만듭니다.

      ▶ `rogue-core/src/map.rs` (계단 타일과 `find`) — 재생에서 따라 칩니다

      ▶ `rogue-core/src/dungeon.rs` (마지막 방에 계단) — 재생에서 따라 칩니다

      ▶ `rogue-core/src/action.rs` (`Descend`) — 재생에서 따라 칩니다

      ▶ `rogue-core/src/state.rs` (`Generating`) — 재생에서 따라 칩니다

      **데이터 모양**

      `Floor` 는 층 하나의 "설계도"입니다. 월드를 건드리지 않는 순수한 값이라서 다른 스레드에서 만들어 보낼 수 있습니다. 몬스터와 아이템은 정의 목록의 번호로 적어 둡니다. `generate_floor(seed, depth, defs)` 는 (시드, 깊이, 정의 목록)이 같으면 항상 같은 층을 만듭니다. 테스트는 `floor_and_defs_can_cross_threads`, `same_inputs_same_floor`, `stairs_exist_and_are_reachable`, `nothing_spawns_on_the_start_tile` 입니다.

      ▶ `rogue-core/src/floor.rs` (새 파일) — 재생에서 따라 칩니다

      테스트에서는 `Arc::new(builtin())` 을 돌려주는 `builtin_arc()` 도우미를 두면 편합니다.

      ▶ `rogue-core/src/defs.rs` (테스트용 `builtin_arc`) — 재생에서 따라 칩니다

      `Game` 에는 이런 필드가 늘어납니다: `defs: Arc<Defs>` (더 이상 `Defs` 가 아닙니다), `depth: u32`, `turns: u32`, `kills: u32`, 그리고 저장하지 않는(`#[serde(skip)]`) `pending: Option<Receiver<Floor>>`, `generation_delay: Duration`. 접근자 `depth()`, `turns()`, `kills()`, `set_generation_delay(Duration)` 를 만드세요. `Game::new(seed, defs: Arc<Defs>)` 와 `from_save_string(text, defs: Arc<Defs>)` 로 시그니처가 바뀝니다.

      `game.rs` 의 테스트들이 "블로킹하지 않는다", "타이밍과 무관하게 결정적이다"를 검사합니다: `descending_builds_the_next_floor_in_the_background`, `same_seed_gives_the_same_floors_regardless_of_timing`, `monsters_do_not_act_while_generating`, 그리고 `descend_off_the_stairs_only_logs` (계단이 아닌 곳에서 `Descend` → 로그에 `no stairs`, 깊이 0 그대로), `inventory_survives_the_trip` (물약을 줍고 내려가도 가방에 남는다).

      ▶ `rogue-core/src/game.rs` — 재생에서 따라 칩니다

      <details><summary>힌트 1: 스레드에 무엇을 넘길까</summary>

      `thread::spawn(move || ...)` 의 클로저는 `'static` 이어야 하고 `self` 를 빌릴 수 없습니다. 필요한 값(시드, 깊이, 정의 목록, 지연 시간, 보내는 쪽 `Sender`)을 **먼저 지역 변수로 꺼낸 뒤** `move` 로 옮기세요. 정의 목록은 `Arc::clone(&self.defs)` 로 공유합니다. `Defs` 를 `clone()` 으로 복사하면 틀린 것은 아니지만 매번 큰 데이터를 복사합니다. 반대로 `self.defs` 를 그냥 쓰려 하면 `E0521` (borrowed data escapes outside of method) 입니다.

      </details>

      <details><summary>힌트 2: `Rc` 를 쓰면 어떻게 되나</summary>

      `Arc<Defs>` 대신 `Rc<Defs>` 로 바꿔 보세요. `Rc<Defs>` 가 스레드 사이에서 안전하게 보내질 수 없다는 에러 (`E0277`, `cannot be sent between threads safely`) 가 납니다. `Send` 가 없다는 뜻이고, 컴파일러가 "이 값은 다른 스레드에 줄 수 없다"고 막는 것입니다. `floor_and_defs_can_cross_threads` 테스트는 이 사실을 타입 수준에서 못 박습니다.

      </details>

      <details><summary>힌트 3: 막지 않고 확인하기</summary>

      `Receiver::recv()` 는 올 때까지 멈춥니다. 매 프레임 불리는 `update` 에서는 `try_recv()` 를 쓰세요. 결과는 셋입니다: `Ok(floor)` → 층을 적용하고 `AwaitingInput`, `Err(Empty)` → 계속 `Generating`, `Err(Disconnected)` → 스레드가 죽었음. 마지막은 패닉 대신 로그를 남기고 게임으로 돌아옵니다. `if let Some(rx) = &self.pending` 으로 빌린 채 `self.pending = None` 을 하려면 막힙니다. `let result = rx.try_recv();` 로 결과 값만 꺼내 빌림을 끝내세요.

      </details>

      <details><summary>힌트 4: 층을 갈아 끼울 때 지울 것</summary>

      위치(`Position`)가 있는 엔티티가 바닥에 있는 것들입니다 (가방 속 아이템은 위치가 없습니다). 플레이어를 뺀 위치 있는 엔티티를 전부 `despawn` 하세요. 순회하면서 `despawn` 하면 빌림이 충돌하니 `Vec<EntityId>` 로 먼저 모읍니다.

      </details>

      <details><summary>힌트 5: 저장 중에 `Generating` 이었다면</summary>

      받을 쪽 `Receiver` 는 저장되지 않으므로, 불러온 뒤 `Generating` 에 영원히 머무릅니다. `from_save_string` 에서 이 상태를 `AwaitingInput` 으로 되돌리세요. 플레이어는 여전히 계단 위에 있으므로 다시 내려가면 됩니다.

      </details>

      ▶ `rogue-core/src/lib.rs` (floor 연결) — 재생에서 따라 칩니다

      `rogue/src/main.rs` — `.` 키 → `Input::Act(Action::Descend)` (대기·행동 키와 같은 `AwaitingInput` 갈래), `Generating` 상태에서는 키를 읽지 않고, `Tile::Stairs` 의 색을 정하고, HUD 에 `Depth n` 을 더하고, `Generating` 갈래에서 안내 문구를 그립니다. 실행해서 확인할 때는 지연을 800ms 로 줘서 "생성 중에도 창이 반응하는지"를 눈으로 보세요.

      ▶ `rogue/src/main.rs` — 재생에서 따라 칩니다

      ### 일부러 해볼 실수

      1. 스레드에 월드나 맵의 **참조**를 넘겨 보세요. `'static`에 관한 에러가 납니다. 왜 스레드는 바깥의 지역 변수를 빌릴 수 없을까요?
      1. 정의 목록을 `Rc`로 감싸서 스레드에 넘겨 보세요. `Send`에 관한 에러가 납니다. 2-1에서 `Rc<RefCell>`을 그대로 썼다면 이 시점에 게임 전체가 막혔을 겁니다.
      1. 막지 않는 확인 대신 결과가 올 때까지 기다리는 수신 함수를 써 보세요. 창이 어떻게 되나요?

      ### 확인 기준

      - [ ] 층 생성 중에도 창이 멈추지 않고 문구가 보인다
      - [ ] 생성이 끝나면 새 층에서 이어서 플레이할 수 있다
      - [ ] 같은 시드면 같은 순서로 같은 층들이 나온다

      ### 이해 체크

      - `Send`와 `'static`은 각각 무엇을 보장하는가? 왜 스레드 생성 함수는 둘 다 요구하는가?
      - `Rc`와 `Arc`의 차이는 무엇이고, 왜 기본이 `Rc`인가?

      ## 정답 노트에서

      층 설계도 `Floor` 는 월드를 건드리지 않는 **순수한 값**이라서 다른 스레드에서 만들어 보낼 수 있어요. `update` 의 `Generating` 갈래는 `self.poll_generation()` 을 부르기만 해요. 상태가 `Generating` 인 동안 `monsters_act` 가 불리지 않으니 몬스터는 얼어 있어요.

      - `thread::spawn` 의 클로저는 `'static` 이라서 `self` 나 `&self.defs` 같은 **빌린 값**을 가져갈 수 없어요 (`borrowed data escapes outside of method` 류의 E0521). 그래서 필요한 값을 `seed`, `depth`, `Arc<Defs>`, 채널 송신자로 **미리 꺼내** `move` 로 넘겨요.
      - `Arc<Defs>` 를 복제하면 목록 전체가 아니라 참조 횟수만 늘어요. `Rc` 로 바꾸면 `Rc<Defs>` cannot be sent between threads safely 에러가 나요 (`Send` 가 아님).
      - 층 생성 스레드가 **월드를 만지지 않고** `Floor` 라는 값만 만들어 보내는 것이 설계의 핵심이에요. 월드에 락을 걸 필요가 없고, 결과 적용은 메인 스레드가 `try_recv` 로 받아서 해요.
      - `try_recv` 는 기다리지 않아요. `Empty` 면 "아직", `Disconnected` 면 "보내는 쪽이 이미 사라졌다"(스레드가 패닉했거나 끝났는데 보낸 게 없음)이라 둘을 다르게 처리해요. `recv()` 를 쓰면 화면이 멈춰요.
      - 같은 `seed`, `depth` 면 같은 층이 나와요. 스레드가 끝나는 시간이 달라도 결과는 같아야 하니, 시드를 **스레드 안에서 정하지 않고** 메인 스레드의 `rng` 에서 미리 뽑아 넘겼어요 (`same_seed_gives_the_same_floors_regardless_of_timing` 테스트).
    steps:
      - message: "[5-1] map.rs — 계단 타일과 find"
        files:
          - path: rogue-core/src/map.rs
            content: |
              use serde::{Deserialize, Serialize};

              use crate::geom::Point;

              #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
              pub enum Tile {
                  Wall,
                  Floor,
                  /// 다음 층으로 내려가는 계단. 걸을 수 있고 시야를 가리지 않는다
                  Stairs,
              }

              #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
              pub struct Map {
                  width: i32,
                  height: i32,
                  tiles: Vec<Tile>,
                  /// 플레이어가 한 번이라도 본 칸
                  explored: Vec<bool>,
              }

              impl Map {
                  /// 테두리는 벽, 안쪽은 바닥인 방
                  pub fn room(width: i32, height: i32) -> Map {
                      let len = usize::try_from(width * height).unwrap_or(0);
                      let mut map = Map {
                          width,
                          height,
                          tiles: vec![Tile::Wall; len],
                          explored: vec![false; len],
                      };
                      for y in 1..height - 1 {
                          for x in 1..width - 1 {
                              map.set(Point::new(x, y), Tile::Floor);
                          }
                      }
                      map
                  }

                  /// 전부 벽인 맵. 던전 생성기가 여기에 방과 복도를 판다
                  pub fn solid(width: i32, height: i32) -> Map {
                      let len = usize::try_from(width * height).unwrap_or(0);
                      Map {
                          width,
                          height,
                          tiles: vec![Tile::Wall; len],
                          explored: vec![false; len],
                      }
                  }

                  pub fn width(&self) -> i32 {
                      self.width
                  }

                  pub fn height(&self) -> i32 {
                      self.height
                  }

                  /// 좌표 → 1차원 인덱스. 맵 밖이면 None
                  fn index(&self, p: Point) -> Option<usize> {
                      if p.x < 0 || p.y < 0 || p.x >= self.width || p.y >= self.height {
                          return None;
                      }
                      usize::try_from(p.y * self.width + p.x).ok()
                  }

                  pub fn tile(&self, p: Point) -> Option<Tile> {
                      self.index(p).and_then(|i| self.tiles.get(i)).copied()
                  }

                  pub fn is_walkable(&self, p: Point) -> bool {
                      matches!(self.tile(p), Some(Tile::Floor | Tile::Stairs))
                  }

                  /// 시야를 가리는가. 벽이거나 맵 밖이면 가린다
                  pub fn blocks_sight(&self, p: Point) -> bool {
                      matches!(self.tile(p), Some(Tile::Wall) | None)
                  }

                  pub fn is_explored(&self, p: Point) -> bool {
                      self.index(p)
                          .and_then(|i| self.explored.get(i))
                          .copied()
                          .unwrap_or(false)
                  }

                  pub fn mark_explored(&mut self, p: Point) {
                      if let Some(e) = self.index(p).and_then(|i| self.explored.get_mut(i)) {
                          *e = true;
                      }
                  }

                  /// 이 타일이 처음 나오는 좌표 (위에서 아래로, 왼쪽에서 오른쪽으로 찾는다)
                  pub fn find(&self, tile: Tile) -> Option<Point> {
                      let i = self.tiles.iter().position(|&t| t == tile)?;
                      let i = i32::try_from(i).ok()?;
                      Some(Point::new(i % self.width, i / self.width))
                  }

                  /// 타일을 바꾼다. 맵 밖이면 false
                  pub fn set(&mut self, p: Point, tile: Tile) -> bool {
                      match self.index(p).and_then(|i| self.tiles.get_mut(i)) {
                          Some(t) => {
                              *t = tile;
                              true
                          }
                          None => false,
                      }
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  #[test]
                  fn index_in_range() {
                      let map = Map::room(10, 8);
                      assert_eq!(map.index(Point::new(0, 0)), Some(0));
                      assert_eq!(map.index(Point::new(3, 2)), Some(23));
                      assert_eq!(map.index(Point::new(9, 7)), Some(79));
                  }

                  #[test]
                  fn index_out_of_range() {
                      let map = Map::room(10, 8);
                      assert_eq!(map.index(Point::new(-1, 0)), None);
                      assert_eq!(map.index(Point::new(0, -1)), None);
                      assert_eq!(map.index(Point::new(10, 0)), None);
                      assert_eq!(map.index(Point::new(0, 8)), None);
                  }

                  #[test]
                  fn room_has_walls_outside_and_floor_inside() {
                      let map = Map::room(10, 8);
                      assert_eq!(map.tile(Point::new(0, 3)), Some(Tile::Wall));
                      assert_eq!(map.tile(Point::new(9, 3)), Some(Tile::Wall));
                      assert_eq!(map.tile(Point::new(5, 4)), Some(Tile::Floor));
                      assert_eq!(map.tile(Point::new(-5, 4)), None);
                  }

                  #[test]
                  fn walkable_is_false_outside_map() {
                      let map = Map::room(10, 8);
                      assert!(map.is_walkable(Point::new(5, 4)));
                      assert!(!map.is_walkable(Point::new(0, 0)));
                      assert!(!map.is_walkable(Point::new(-1, -1)));
                  }
              }
      - message: "[5-1] dungeon.rs — 마지막 방에 계단"
        files:
          - path: rogue-core/src/dungeon.rs
            content: |
              use crate::geom::Point;
              use crate::map::{Map, Tile};
              use crate::rng::Rng;

              /// 이보다 작은 구역은 더 쪼개지 않는다
              const MIN_AREA: i32 = 9;
              const MAX_DEPTH: u32 = 3;

              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              pub struct Rect {
                  pub x: i32,
                  pub y: i32,
                  pub w: i32,
                  pub h: i32,
              }

              impl Rect {
                  pub fn center(&self) -> Point {
                      Point::new(self.x + self.w / 2, self.y + self.h / 2)
                  }

                  /// 사각형 안의 무작위 좌표
                  pub fn random_point(&self, rng: &mut Rng) -> Point {
                      let x = rng.range(self.x, self.x + self.w);
                      let y = rng.range(self.y, self.y + self.h);
                      Point::new(x, y)
                  }
              }

              /// 공간을 쪼갠 트리. 자식이 자기 자신 타입이라서 `Box`가 필요하다
              enum Node {
                  Leaf(Rect),
                  Split(Box<Node>, Box<Node>),
              }

              pub struct Dungeon {
                  pub map: Map,
                  /// 만들어진 순서대로의 방 목록. 첫 방이 시작 방이다
                  pub rooms: Vec<Rect>,
              }

              pub fn generate(width: i32, height: i32, rng: &mut Rng) -> Dungeon {
                  let whole = Rect {
                      x: 0,
                      y: 0,
                      w: width,
                      h: height,
                  };
                  let tree = split(whole, rng, MAX_DEPTH);
                  let mut map = Map::solid(width, height);
                  let mut rooms = Vec::new();
                  carve(&tree, &mut map, rng, &mut rooms);
                  // 마지막 방 가운데에 다음 층으로 가는 계단을 둔다
                  if let Some(last) = rooms.last() {
                      map.set(last.center(), Tile::Stairs);
                  }
                  Dungeon { map, rooms }
              }

              fn split(area: Rect, rng: &mut Rng, depth: u32) -> Node {
                  let can_cut_rows = area.h >= 2 * MIN_AREA; // 위아래로 자를 수 있나
                  let can_cut_cols = area.w >= 2 * MIN_AREA; // 좌우로 자를 수 있나
                  if depth == 0 || !(can_cut_rows || can_cut_cols) {
                      return Node::Leaf(area);
                  }
                  let cut_rows = if can_cut_rows && can_cut_cols {
                      rng.chance(50)
                  } else {
                      can_cut_rows
                  };
                  let (a, b) = if cut_rows {
                      let at = rng.range(MIN_AREA, area.h - MIN_AREA + 1);
                      (
                          Rect { h: at, ..area },
                          Rect {
                              y: area.y + at,
                              h: area.h - at,
                              ..area
                          },
                      )
                  } else {
                      let at = rng.range(MIN_AREA, area.w - MIN_AREA + 1);
                      (
                          Rect { w: at, ..area },
                          Rect {
                              x: area.x + at,
                              w: area.w - at,
                              ..area
                          },
                      )
                  };
                  // 같은 rng 를 가변 참조로 이어서 쓴다. 두 번째 호출은 첫 번째가 쓴 다음 상태에서 시작한다
                  let first = split(a, rng, depth - 1);
                  let second = split(b, rng, depth - 1);
                  Node::Split(Box::new(first), Box::new(second))
              }

              /// 트리를 훑으며 방을 파고 복도로 잇는다. 이 가지를 대표하는 좌표를 돌려준다
              fn carve(node: &Node, map: &mut Map, rng: &mut Rng, rooms: &mut Vec<Rect>) -> Point {
                  match node {
                      Node::Leaf(area) => {
                          let w = rng.range(4, area.w - 1);
                          let h = rng.range(4, area.h - 1);
                          // 구역 가장자리에 벽 한 칸은 남긴다
                          let room = Rect {
                              x: area.x + rng.range(1, area.w - w),
                              y: area.y + rng.range(1, area.h - h),
                              w,
                              h,
                          };
                          for y in room.y..room.y + room.h {
                              for x in room.x..room.x + room.w {
                                  map.set(Point::new(x, y), Tile::Floor);
                              }
                          }
                          rooms.push(room);
                          room.center()
                      }
                      Node::Split(first, second) => {
                          let a = carve(first, map, rng, rooms);
                          let b = carve(second, map, rng, rooms);
                          dig_corridor(map, a, b, rng);
                          a
                      }
                  }
              }

              /// ㄱ자 복도. 가로부터 팔지 세로부터 팔지는 무작위
              fn dig_corridor(map: &mut Map, a: Point, b: Point, rng: &mut Rng) {
                  let (corner_x, corner_y) = if rng.chance(50) {
                      (b.x, a.y)
                  } else {
                      (a.x, b.y)
                  };
                  let corner = Point::new(corner_x, corner_y);
                  dig_line(map, a, corner);
                  dig_line(map, corner, b);
              }

              /// 가로 또는 세로로 곧은 선을 판다
              fn dig_line(map: &mut Map, from: Point, to: Point) {
                  for x in from.x.min(to.x)..=from.x.max(to.x) {
                      map.set(Point::new(x, from.y), Tile::Floor);
                  }
                  for y in from.y.min(to.y)..=from.y.max(to.y) {
                      map.set(Point::new(to.x, y), Tile::Floor);
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::path::astar;

                  #[test]
                  fn same_seed_same_dungeon() {
                      let a = generate(40, 25, &mut Rng::new(5));
                      let b = generate(40, 25, &mut Rng::new(5));
                      assert_eq!(a.rooms, b.rooms);
                      assert_eq!(a.map, b.map);
                  }

                  #[test]
                  fn different_seeds_make_different_dungeons() {
                      let a = generate(40, 25, &mut Rng::new(1));
                      let b = generate(40, 25, &mut Rng::new(2));
                      assert_ne!(a.map, b.map);
                  }

                  #[test]
                  fn every_room_is_reachable_from_the_first() {
                      for seed in 0..200 {
                          let d = generate(40, 25, &mut Rng::new(seed));
                          assert!(d.rooms.len() >= 2, "seed {seed}: too few rooms");
                          let start = d.rooms[0].center();
                          for room in &d.rooms {
                              assert!(
                                  astar(&d.map, start, room.center()).is_some(),
                                  "seed {seed}: room at {:?} is cut off",
                                  room.center()
                              );
                          }
                      }
                  }

                  #[test]
                  fn rooms_stay_inside_the_border() {
                      for seed in 0..200 {
                          let d = generate(40, 25, &mut Rng::new(seed));
                          for r in &d.rooms {
                              assert!(r.x >= 1 && r.y >= 1 && r.x + r.w <= 39 && r.y + r.h <= 24);
                          }
                      }
                  }
              }
