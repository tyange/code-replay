              impl World {
                  /// 엔티티와 모든 컴포넌트를 지운다
                  pub fn despawn(&mut self, id: EntityId) {
                      self.entities.despawn(id);
                      self.positions.remove(id);
                      self.glyphs.remove(id);
                      self.healths.remove(id);
                      self.names.remove(id);
                      self.blockers.remove(id);
                      self.players.remove(id);
                      self.monsters.remove(id);
                      self.ais.remove(id);
                      self.combats.remove(id);
                      self.viewsheds.remove(id);
                  }

                  pub fn spawn_player(&mut self, pos: Point) -> EntityId {
                      let id = self.entities.spawn();
                      self.positions.insert(id, Position(pos));
                      self.glyphs.insert(
                          id,
                          Glyph {
                              ch: '@',
                              color: Rgb {
                                  r: 255,
                                  g: 221,
                                  b: 51,
                              },
                          },
                      );
                      self.healths.insert(id, Health { hp: 30, max: 30 });
                      self.combats.insert(
                          id,
                          Combat {
                              power: 5,
                              defense: 2,
                          },
                      );
                      self.names.insert(id, Name("Player".to_string()));
                      self.blockers.insert(id, BlocksTile);
                      self.players.insert(id, Player);
                      self.viewsheds.insert(id, Viewshed::new(8));
                      id
                  }

                  pub fn spawn_goblin(&mut self, pos: Point) -> EntityId {
                      self.spawn_monster(
                          pos,
                          'g',
                          Rgb {
                              r: 80,
                              g: 200,
                              b: 80,
                          },
                          "Goblin",
                          (10, 4, 1),
                          Ai::Chaser,
                      )
                  }

                  pub fn spawn_kobold(&mut self, pos: Point) -> EntityId {
                      self.spawn_monster(
                          pos,
                          'k',
                          Rgb {
                              r: 230,
                              g: 140,
                              b: 60,
                          },
                          "Kobold",
                          (8, 3, 0),
                          Ai::Coward { flee_below: 3 },
                      )
                  }

                  /// stats = (체력, 공격력, 방어력)
                  fn spawn_monster(
                      &mut self,
                      pos: Point,
                      ch: char,
                      color: Rgb,
                      name: &str,
                      stats: (i32, i32, i32),
                      ai: Ai,
                  ) -> EntityId {
                      let (hp, power, defense) = stats;
                      let id = self.entities.spawn();
                      self.positions.insert(id, Position(pos));
                      self.glyphs.insert(id, Glyph { ch, color });
                      self.healths.insert(id, Health { hp, max: hp });
                      self.combats.insert(id, Combat { power, defense });
                      self.names.insert(id, Name(name.to_string()));
                      self.blockers.insert(id, BlocksTile);
                      self.monsters.insert(id, Monster);
                      self.ais.insert(id, ai);
                      self.viewsheds.insert(id, Viewshed::new(7));
                      id
                  }

                  /// 이 좌표에서 길을 막고 있는 엔티티
                  pub fn blocker_at(&self, p: Point) -> Option<EntityId> {
                      self.positions
                          .iter()
                          .find(|(id, pos)| pos.0 == p && self.blockers.get(*id).is_some())
                          .map(|(id, _)| id)
                  }
              }
      - message: "[3-3] fov.rs — 시야 계산"
        files:
          - path: rogue-core/src/fov.rs
            content: |
              use std::collections::HashSet;

              use crate::geom::{Point, line};
              use crate::map::Map;

              /// `origin`에서 `range` 안에 있고 벽에 가려지지 않은 좌표들.
              /// 반경 둘레의 각 칸으로 직선을 긋고, 벽을 만나면 멈춘다
              pub fn compute(map: &Map, origin: Point, range: i32) -> HashSet<Point> {
                  let mut seen = HashSet::new();
                  seen.insert(origin);
                  for target in perimeter(origin, range) {
                      for p in line(origin, target).into_iter().skip(1) {
                          let (dx, dy) = (p.x - origin.x, p.y - origin.y);
                          if dx * dx + dy * dy > range * range {
                              break;
                          }
                          seen.insert(p); // 벽 자체는 보인다
                          if map.blocks_sight(p) {
                              break;
                          }
                      }
                  }
                  seen
              }

              fn perimeter(c: Point, r: i32) -> impl Iterator<Item = Point> {
                  (-r..=r).flat_map(move |d| {
                      [
                          Point::new(c.x + d, c.y - r),
                          Point::new(c.x + d, c.y + r),
                          Point::new(c.x - r, c.y + d),
                          Point::new(c.x + r, c.y + d),
                      ]
                  })
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::map::Tile;

                  #[test]
                  fn open_room_sees_within_range_only() {
                      let map = Map::room(30, 20);
                      let seen = compute(&map, Point::new(15, 10), 4);
                      assert!(seen.contains(&Point::new(15, 10)));
                      assert!(seen.contains(&Point::new(18, 10)));
                      assert!(!seen.contains(&Point::new(22, 10)));
                  }

                  #[test]
                  fn wall_hides_what_is_behind_it() {
                      let mut map = Map::room(30, 20);
                      map.set(Point::new(12, 10), Tile::Wall);
                      let seen = compute(&map, Point::new(10, 10), 6);
                      assert!(seen.contains(&Point::new(12, 10))); // 벽 자체는 보이고
                      assert!(!seen.contains(&Point::new(14, 10))); // 그 뒤는 안 보인다
                  }
              }
      - message: "[3-3] path.rs — Ord 를 직접 구현한 A*"
        files:
          - path: rogue-core/src/path.rs
            content: |
              use std::cmp::Ordering;
              use std::collections::{BinaryHeap, HashMap};

              use crate::geom::{Dir, Point};
              use crate::map::Map;

              /// 열린 목록에 넣을 노드. BinaryHeap은 큰 것부터 꺼내므로 비용이 작을수록 "크게" 비교한다
              #[derive(Debug, PartialEq, Eq)]
              struct Node {
                  f: u32,
                  pos: Point,
              }

              impl Ord for Node {
                  fn cmp(&self, other: &Self) -> Ordering {
                      other
                          .f
                          .cmp(&self.f)
                          .then_with(|| (self.pos.x, self.pos.y).cmp(&(other.pos.x, other.pos.y)))
                  }
              }

              impl PartialOrd for Node {
                  fn partial_cmp(&self, other: &Self) -> Option<Ordering> {
                      Some(self.cmp(other))
                  }
              }

              /// 맨해튼 거리
              fn heuristic(a: Point, b: Point) -> u32 {
                  a.x.abs_diff(b.x) + a.y.abs_diff(b.y)
              }

              /// `start`에서 `goal`까지의 경로. 출발점은 빼고 도착점은 포함한다. 갈 수 없으면 None
              pub fn astar(map: &Map, start: Point, goal: Point) -> Option<Vec<Point>> {
                  let mut open = BinaryHeap::new();
                  let mut came_from: HashMap<Point, Point> = HashMap::new();
                  let mut cost: HashMap<Point, u32> = HashMap::new();
                  cost.insert(start, 0);
                  open.push(Node {
                      f: heuristic(start, goal),
                      pos: start,
                  });

                  while let Some(Node { pos, .. }) = open.pop() {
                      if pos == goal {
                          return Some(reconstruct(&came_from, start, goal));
                      }
                      let g = cost.get(&pos).copied()?;
                      for dir in Dir::ALL {
                          let next = pos.step(dir);
                          if !map.is_walkable(next) {
                              continue;
                          }
                          let new_g = g + 1;
                          if cost.get(&next).is_none_or(|&old| new_g < old) {
                              cost.insert(next, new_g);
                              came_from.insert(next, pos);
                              open.push(Node {
                                  f: new_g + heuristic(next, goal),
                                  pos: next,
                              });
                          }
                      }
                  }
                  None
              }

              fn reconstruct(came_from: &HashMap<Point, Point>, start: Point, goal: Point) -> Vec<Point> {
                  let mut path = Vec::new();
                  let mut cur = goal;
                  while cur != start {
                      path.push(cur);
                      match came_from.get(&cur) {
                          Some(&prev) => cur = prev,
                          None => break,
                      }
                  }
                  path.reverse();
                  path
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::map::Tile;

                  #[test]
                  fn straight_path_in_open_room() {
                      let map = Map::room(30, 20);
                      let path = astar(&map, Point::new(1, 1), Point::new(5, 1)).expect("길이 있다");
                      assert_eq!(path.len(), 4);
                      assert_eq!(path.last(), Some(&Point::new(5, 1)));
                      assert_eq!(path.first(), Some(&Point::new(2, 1)));
                  }

                  #[test]
                  fn same_start_and_goal_is_empty_path() {
                      let map = Map::room(30, 20);
                      assert_eq!(
                          astar(&map, Point::new(3, 3), Point::new(3, 3)),
                          Some(vec![])
                      );
                  }

                  #[test]
                  fn goes_around_a_wall_with_a_gap() {
                      let mut map = Map::room(30, 20);
                      for y in 1..19 {
                          map.set(Point::new(10, y), Tile::Wall);
                      }
                      map.set(Point::new(10, 15), Tile::Floor); // 틈
                      let path = astar(&map, Point::new(5, 5), Point::new(15, 5)).expect("틈으로 돌아간다");
                      assert!(path.contains(&Point::new(10, 15)));
                      assert!(path.iter().all(|&p| map.is_walkable(p)));
                  }

                  #[test]
                  fn blocked_map_has_no_path() {
                      let mut map = Map::room(30, 20);
                      for y in 1..19 {
                          map.set(Point::new(10, y), Tile::Wall);
                      }
                      assert_eq!(astar(&map, Point::new(5, 5), Point::new(15, 5)), None);
                  }
              }
      - message: "[3-3] ai.rs — 보일 때만, 길찾기로 쫓는다"
        files:
          - path: rogue-core/src/ai.rs
            content: |
              use crate::action::Action;
              use crate::comps::Ai;
              use crate::entity::EntityId;
              use crate::geom::{Dir, Point};
              use crate::map::Map;
              use crate::path::astar;
              use crate::world::World;

              /// 월드를 읽기만 하고 행동 하나를 고른다. 실제 적용은 플레이어와 같은 경로를 탄다
              pub fn decide(world: &World, map: &Map, me: EntityId, player: EntityId) -> Action {
                  let Some(&ai) = world.ais.get(me) else {
                      return Action::Wait;
                  };
                  let (Some(from), Some(goal)) = (
                      world.positions.get(me).map(|p| p.0),
                      world.positions.get(player).map(|p| p.0),
                  ) else {
                      return Action::Wait;
                  };
                  // 플레이어가 내 시야에 있을 때만 반응한다
                  let sees_player = world
                      .viewsheds
                      .get(me)
                      .is_some_and(|v| v.visible.contains(&goal));
                  if !sees_player {
                      return Action::Wait;
                  }
                  match ai {
                      Ai::Chaser => chase(map, from, goal),
                      Ai::Coward { flee_below } => {
                          let hp = world.healths.get(me).map_or(0, |h| h.hp);
                          if hp < flee_below {
                              step_away(map, from, goal).map_or(Action::Wait, Action::Move)
                          } else {
                              chase(map, from, goal)
                          }
                      }
                  }
              }

              /// 길찾기로 구한 경로의 첫 걸음
              fn chase(map: &Map, from: Point, goal: Point) -> Action {
                  astar(map, from, goal)
                      .and_then(|path| path.first().copied())
                      .and_then(|next| Dir::between(from, next))
                      .map_or(Action::Wait, Action::Move)
              }

              /// 위협에서 가장 멀어지는, 걸어갈 수 있는 방향. 갈 곳이 없으면 None
              fn step_away(map: &Map, from: Point, threat: Point) -> Option<Dir> {
                  Dir::ALL
                      .into_iter()
                      .filter(|&d| map.is_walkable(from.step(d)))
                      .max_by_key(|&d| {
                          let p = from.step(d);
                          (p.x - threat.x).pow(2) + (p.y - threat.y).pow(2)
                      })
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::fov;
                  use crate::map::Tile;

                  /// 모든 엔티티의 시야를 계산해 둔다
                  fn look(world: &mut World, map: &Map) {
                      for (id, vs) in world.viewsheds.iter_mut() {
                          if let Some(pos) = world.positions.get(id) {
                              vs.visible = fov::compute(map, pos.0, vs.range);
                              vs.dirty = false;
                          }
                      }
                  }

                  fn setup(monster_at: Point) -> (World, Map, EntityId, EntityId) {
                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(10, 10));
                      let kobold = world.spawn_kobold(monster_at);
                      let map = Map::room(30, 20);
                      look(&mut world, &map);
                      (world, map, player, kobold)
                  }

                  #[test]
                  fn chaser_approaches() {
                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(10, 10));
                      let goblin = world.spawn_goblin(Point::new(6, 10));
                      let map = Map::room(30, 20);
                      look(&mut world, &map);
                      assert_eq!(
                          decide(&world, &map, goblin, player),
                          Action::Move(Dir::Right)
                      );
                  }

                  #[test]
                  fn healthy_coward_approaches() {
                      let (world, map, player, kobold) = setup(Point::new(6, 10));
                      assert_eq!(
                          decide(&world, &map, kobold, player),
                          Action::Move(Dir::Right)
                      );
                  }

                  #[test]
                  fn hurt_coward_flees() {
                      let (mut world, map, player, kobold) = setup(Point::new(6, 10));
                      if let Some(h) = world.healths.get_mut(kobold) {
                          h.hp = 2;
                      }
                      assert_eq!(
                          decide(&world, &map, kobold, player),
                          Action::Move(Dir::Left)
                      );
                  }

                  #[test]
                  fn cornered_coward_waits() {
                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(2, 2));
                      let kobold = world.spawn_kobold(Point::new(1, 1));
                      if let Some(h) = world.healths.get_mut(kobold) {
                          h.hp = 1;
                      }
                      let mut map = Map::room(30, 20);
                      map.set(Point::new(2, 1), Tile::Wall);
                      map.set(Point::new(1, 2), Tile::Wall);
                      look(&mut world, &map);
                      assert_eq!(decide(&world, &map, kobold, player), Action::Wait);
                  }

                  #[test]
                  fn chaser_waits_when_it_cannot_see() {
                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(10, 10));
                      let goblin = world.spawn_goblin(Point::new(1, 1));
                      let map = Map::room(30, 20);
                      look(&mut world, &map);
                      assert_eq!(decide(&world, &map, goblin, player), Action::Wait);
                  }

                  #[test]
                  fn chaser_goes_around_a_wall() {
                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(10, 10));
                      let goblin = world.spawn_goblin(Point::new(5, 10));
                      let mut map = Map::room(30, 20);
                      for y in 6..=14 {
                          map.set(Point::new(6, y), Tile::Wall);
                      }
                      look(&mut world, &map);
                      // 벽이 직선 시야를 막으므로, "방금까지 보였다"를 흉내 낸다
                      if let Some(vs) = world.viewsheds.get_mut(goblin) {
                          vs.visible.insert(Point::new(10, 10));
                      }
                      assert!(matches!(
                          decide(&world, &map, goblin, player),
                          Action::Move(Dir::Up | Dir::Down)
                      ));
                  }
              }
      - message: "[3-3] game.rs — 시야 갱신과 시험용 벽"
        files:
          - path: rogue-core/src/game.rs
            content: |
              use crate::action::Action;
              use crate::ai;
              use crate::combat;
              use crate::entity::EntityId;
              use crate::event::Event;
              use crate::fov;
              use crate::geom::Point;
              use crate::map::{Map, Tile};
              use crate::state::{Input, RunState};
              use crate::world::World;

              pub struct Game {
                  map: Map,
                  world: World,
                  player: EntityId,
                  events: Vec<Event>,
                  log: Vec<String>,
                  state: RunState,
              }

              impl Game {
                  pub fn new() -> Game {
                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(15, 10));
                      world.spawn_goblin(Point::new(5, 5));
                      world.spawn_goblin(Point::new(24, 4));
                      world.spawn_kobold(Point::new(20, 15));
                      let mut map = Map::room(30, 20);
                      // 시야와 길찾기를 시험할 벽
                      for y in 3..=12 {
                          map.set(Point::new(10, y), Tile::Wall);
                      }
                      for x in 16..=24 {
                          map.set(Point::new(x, 7), Tile::Wall);
                      }
                      let mut game = Game {
                          map,
                          world,
                          player,
                          events: Vec::new(),
                          log: Vec::new(),
                          state: RunState::AwaitingInput,
                      };
                      game.update_views();
                      game
                  }

                  pub fn map(&self) -> &Map {
                      &self.map
                  }

                  pub fn world(&self) -> &World {
                      &self.world
                  }

                  pub fn player(&self) -> EntityId {
                      self.player
                  }

                  /// 지금까지의 전투 메시지. 오래된 것이 앞에 있다
                  pub fn log(&self) -> &[String] {
                      &self.log
                  }

                  pub fn state(&self) -> &RunState {
                      &self.state
                  }

                  pub fn is_over(&self) -> bool {
                      matches!(self.state, RunState::GameOver { .. })
                  }

                  pub fn player_hp(&self) -> i32 {
                      self.world.healths.get(self.player).map_or(0, |h| h.hp)
                  }

                  /// 플레이어에게 지금 보이는 좌표인가
                  pub fn can_see(&self, p: Point) -> bool {
                      self.world
                          .viewsheds
                          .get(self.player)
                          .is_some_and(|v| v.visible.contains(&p))
                  }

                  /// 매 프레임 한 번 부른다. 현재 상태를 값으로 꺼내(소비) 다음 상태를 만들어 되돌려 넣는다
                  pub fn update(&mut self, input: Option<Input>) {
                      let current = std::mem::replace(&mut self.state, RunState::AwaitingInput);
                      self.state = match current {
                          RunState::AwaitingInput => match input {
                              Some(Input::Act(action)) => {
                                  self.perform(self.player, action);
                                  self.update_views();
                                  match self.apply_events() {
                                      Some(cause) => RunState::GameOver { cause },
                                      None => RunState::MonsterTurn,
                                  }
                              }
                              Some(Input::Restart) | None => RunState::AwaitingInput,
                          },
                          RunState::MonsterTurn => match self.monsters_act() {
                              Some(cause) => RunState::GameOver { cause },
                              None => RunState::AwaitingInput,
                          },
                          RunState::GameOver { cause } => match input {
                              Some(Input::Restart) => {
                                  *self = Game::new();
                                  return;
                              }
                              Some(Input::Act(_)) | None => RunState::GameOver { cause },
                          },
                      };
                  }

                  fn perform(&mut self, actor: EntityId, action: Action) {
                      let Action::Move(dir) = action else {
                          return; // Wait
                      };
                      let Some(from) = self.world.positions.get(actor).map(|p| p.0) else {
                          return;
                      };
                      let to = from.step(dir);
                      match self.world.blocker_at(to) {
                          Some(other) => self.attack(actor, other),
                          None if self.map.is_walkable(to) => {
                              if let Some(p) = self.world.positions.get_mut(actor) {
                                  p.0 = to;
                              }
                              if let Some(v) = self.world.viewsheds.get_mut(actor) {
                                  v.dirty = true;
                              }
                          }
                          None => {}
                      }
                  }

                  fn attack(&mut self, attacker: EntityId, defender: EntityId) {
                      // 플레이어와 몬스터 사이에서만 싸운다 (몬스터끼리는 서로 막기만 한다)
                      if attacker != self.player && defender != self.player {
                          return;
                      }
                      // 체력을 직접 바꾸지 않고, 일어나야 할 일을 큐에 넣는다
                      if let Some(event) = combat::attack_event(&self.world, attacker, defender) {
                          self.events.push(event);
                      }
                  }

                  /// 쌓인 이벤트를 한 번에 적용한다. 플레이어가 죽었으면 사인(죽인 쪽의 이름)을 돌려준다
                  fn apply_events(&mut self) -> Option<String> {
                      let mut cause = None;
                      let events = std::mem::take(&mut self.events);
                      for event in events {
                          match event {
                              Event::Damage {
                                  target,
                                  amount,
                                  source,
                              } => {
                                  let attacker = self.name_of(source);
                                  let defender = self.name_of(target);
                                  let Some(health) = self.world.healths.get_mut(target) else {
                                      continue; // 같은 턴에 이미 죽은 대상
                                  };
                                  health.hp -= amount;
                                  let dead = health.hp <= 0;
                                  self.push_log(format!("{attacker} hits {defender} for {amount}."));
                                  if dead {
                                      self.push_log(format!("{defender} dies."));
                                      if target == self.player {
                                          // 플레이어는 지우지 않는다. 죽음은 상태(GameOver)로 표현한다
                                          cause = Some(attacker);
                                      } else {
                                          self.world.despawn(target);
                                      }
                                  }
                              }
                          }
                      }
                      cause
                  }

                  /// 다시 계산이 필요한 시야만 계산한다. 플레이어가 본 타일은 "본 적 있음"으로 기록한다
                  fn update_views(&mut self) {
                      for (id, view) in self.world.viewsheds.iter_mut() {
                          if !view.dirty {
                              continue;
                          }
                          let Some(pos) = self.world.positions.get(id) else {
                              continue;
                          };
                          view.visible = fov::compute(&self.map, pos.0, view.range);
                          view.dirty = false;
                          if id == self.player {
                              for &p in &view.visible {
                                  self.map.mark_explored(p);
                              }
                          }
                      }
                  }

                  fn name_of(&self, id: EntityId) -> String {
                      self.world
                          .names
                          .get(id)
                          .map_or_else(|| "Something".to_string(), |n| n.0.clone()) // 로그에 남길 이름은 소유한 값이 필요하다
                  }

                  fn push_log(&mut self, line: String) {
                      self.log.push(line);
                      if self.log.len() > 100 {
                          self.log.drain(..50);
                      }
                  }

                  /// 모든 몬스터가 행동한다. 플레이어가 죽으면 사인을 돌려준다
                  fn monsters_act(&mut self) -> Option<String> {
                      // 순회하면서 perform 으로 월드를 고쳐야 하므로, ID 를 먼저 모아 빌림을 끝낸다
                      let ids: Vec<EntityId> = self.world.monsters.iter().map(|(id, _)| id).collect();
                      for id in ids {
                          let action = ai::decide(&self.world, &self.map, id, self.player);
                          self.perform(id, action);
                          self.update_views();
                          if let Some(cause) = self.apply_events() {
                              return Some(cause);
                          }
                      }
                      None
                  }
              }

              impl Default for Game {
                  fn default() -> Self {
                      Game::new()
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::geom::Dir;

                  /// 입력 하나를 넣고, 몬스터 차례까지 끝낸다
                  fn act(game: &mut Game, action: Action) {
                      game.update(Some(Input::Act(action)));
                      game.update(None);
                  }

                  fn player_pos(game: &Game) -> Option<Point> {
                      game.world.positions.get(game.player).map(|p| p.0)
                  }

                  /// 몬스터를 모두 치워서 플레이어만 남긴다
                  fn clear_monsters(game: &mut Game) {
                      let ids: Vec<EntityId> = game.world.monsters.iter().map(|(id, _)| id).collect();
                      for id in ids {
                          game.world.despawn(id);
                      }
                  }

                  #[test]
                  fn player_moves_and_stops_at_wall() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      act(&mut game, Action::Move(Dir::Right));
                      assert_eq!(player_pos(&game), Some(Point::new(16, 10)));
                      for _ in 0..30 {
                          act(&mut game, Action::Move(Dir::Left));
                      }
                      assert_eq!(player_pos(&game), Some(Point::new(11, 10)));
                  }

                  #[test]
                  fn moving_into_a_monster_attacks_it() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(16, 10));
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      // 이동하지 않고 공격한다: 공격 5 - 방어 1 = 4
                      assert_eq!(player_pos(&game), Some(Point::new(15, 10)));
                      assert_eq!(game.world.healths.get(goblin).map(|h| h.hp), Some(6));
                      assert_eq!(
                          game.log().first().map(String::as_str),
                          Some("Player hits Goblin for 4.")
                      );
                  }

                  #[test]
                  fn monster_dies_and_is_removed() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(16, 10));
                      if let Some(h) = game.world.healths.get_mut(goblin) {
                          h.hp = 4;
                      }
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      assert!(!game.world.entities.is_alive(goblin));
                      assert!(game.world.blocker_at(Point::new(16, 10)).is_none());
                      assert_eq!(game.log().last().map(String::as_str), Some("Goblin dies."));
                  }

                  #[test]
                  fn monsters_approach_the_player() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(12, 10));
                      act(&mut game, Action::Wait);
                      assert_eq!(
                          game.world.positions.get(goblin).map(|p| p.0),
                          Some(Point::new(13, 10))
                      );
                  }

                  #[test]
                  fn adjacent_monster_attacks_the_player() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      game.world.spawn_goblin(Point::new(16, 10));
                      act(&mut game, Action::Wait);
                      // 공격 4 - 방어 2 = 2
                      assert_eq!(game.player_hp(), 28);
                      assert_eq!(game.log(), ["Goblin hits Player for 2."]);
                  }

                  #[test]
                  fn minimum_damage_applies_in_game() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(16, 10));
                      if let Some(c) = game.world.combats.get_mut(goblin) {
                          c.defense = 99;
                      }
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      assert_eq!(game.world.healths.get(goblin).map(|h| h.hp), Some(9));
                  }

                  #[test]
                  fn no_input_changes_nothing() {
                      let mut game = Game::new();
                      for _ in 0..10 {
                          game.update(None);
                      }
                      assert_eq!(player_pos(&game), Some(Point::new(15, 10)));
                      assert_eq!(game.state(), &RunState::AwaitingInput);
                      assert!(game.log().is_empty());
                  }

                  #[test]
                  fn turn_goes_through_monster_turn() {
                      let mut game = Game::new();
                      game.update(Some(Input::Act(Action::Wait)));
                      assert_eq!(game.state(), &RunState::MonsterTurn);
                      game.update(None);
                      assert_eq!(game.state(), &RunState::AwaitingInput);
                  }

                  #[test]
                  fn player_death_leads_to_game_over() {
                      let mut game = Game::new();
                      // 몬스터는 플레이어가 보여야 다가온다. 시야 안에 고블린 하나를 둔다
                      game.world.spawn_goblin(Point::new(16, 10));
                      for _ in 0..200 {
                          act(&mut game, Action::Wait);
                      }
                      assert!(game.is_over());
                      assert_eq!(
                          game.state(),
                          &RunState::GameOver {
                              cause: "Goblin".to_string()
                          }
                      );
                  }

                  #[test]
                  fn game_over_ignores_moves_and_restart_starts_over() {
                      let mut game = Game::new();
                      // 몬스터는 플레이어가 보여야 다가온다. 시야 안에 고블린 하나를 둔다
                      game.world.spawn_goblin(Point::new(16, 10));
                      for _ in 0..200 {
                          act(&mut game, Action::Wait);
                      }
                      let before = player_pos(&game);
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      assert!(game.is_over());
                      assert_eq!(player_pos(&game), before);

                      game.update(Some(Input::Restart));
                      assert_eq!(game.state(), &RunState::AwaitingInput);
                      assert_eq!(game.player_hp(), 30);
                  }
              }
