      - message: "[5-1] floor.rs — 층 설계도와 generate_floor"
        files:
          - path: rogue-core/src/floor.rs
            content: |
              use std::collections::HashSet;

              use crate::defs::Defs;
              use crate::dungeon;
              use crate::geom::Point;
              use crate::map::Map;
              use crate::rng::Rng;

              /// 층 하나의 "설계도". 월드를 건드리지 않는 순수한 값이라서 다른 스레드에서 만들어 보낼 수 있다.
              /// 몬스터와 아이템은 정의 목록의 번호로 적어 둔다
              pub struct Floor {
                  pub depth: u32,
                  pub map: Map,
                  pub start: Point,
                  pub monsters: Vec<(usize, Point)>, // (정의 목록의 번호, 위치)
                  pub items: Vec<(usize, Point)>,
              }

              /// (시드, 깊이, 정의 목록)이 같으면 항상 같은 층이다
              pub fn generate_floor(seed: u64, depth: u32, defs: &Defs) -> Floor {
                  let mut rng = Rng::new(seed);
                  let dungeon = dungeon::generate(40, 25, &mut rng);
                  let start = dungeon
                      .rooms
                      .first()
                      .map_or(Point::new(1, 1), |room| room.center());
                  let mut used: HashSet<Point> = HashSet::from([start]);
                  let mut monsters = Vec::new();
                  let mut items = Vec::new();
                  // 깊어질수록 몬스터가 조금씩 늘어난다
                  let max_monsters = 2 + i32::try_from(depth / 2).unwrap_or(0);
                  for room in dungeon.rooms.iter().skip(1) {
                      for _ in 0..rng.range(0, max_monsters + 1) {
                          let p = room.random_point(&mut rng);
                          if defs.monsters.is_empty() || !used.insert(p) {
                              continue;
                          }
                          let index =
                              usize::try_from(rng.range(0, i32::try_from(defs.monsters.len()).unwrap_or(1)))
                                  .unwrap_or(0);
                          monsters.push((index, p));
                      }
                      for (index, def) in defs.items.iter().enumerate() {
                          if rng.chance(def.chance) {
                              items.push((index, room.random_point(&mut rng)));
                          }
                      }
                  }
                  Floor {
                      depth,
                      map: dungeon.map,
                      start,
                      monsters,
                      items,
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::defs::builtin;
                  use crate::map::Tile;
                  use crate::path::astar;

                  fn assert_send<T: Send>() {}

                  #[test]
                  fn floor_and_defs_can_cross_threads() {
                      assert_send::<Floor>();
                      assert_send::<std::sync::Arc<Defs>>();
                  }

                  #[test]
                  fn same_inputs_same_floor() {
                      let defs = builtin();
                      let a = generate_floor(8, 2, &defs);
                      let b = generate_floor(8, 2, &defs);
                      assert_eq!(a.map, b.map);
                      assert_eq!(a.monsters, b.monsters);
                      assert_eq!(a.items, b.items);
                  }

                  #[test]
                  fn stairs_exist_and_are_reachable() {
                      let defs = builtin();
                      for seed in 0..100 {
                          let f = generate_floor(seed, 0, &defs);
                          let stairs = f.map.find(Tile::Stairs).expect("stairs");
                          assert!(astar(&f.map, f.start, stairs).is_some(), "seed {seed}");
                          assert_ne!(stairs, f.start);
                      }
                  }

                  #[test]
                  fn nothing_spawns_on_the_start_tile() {
                      let defs = builtin();
                      for seed in 0..100 {
                          let f = generate_floor(seed, 3, &defs);
                          assert!(f.monsters.iter().all(|(_, p)| *p != f.start));
                      }
                  }
              }
      - message: "[5-1] defs.rs — 테스트용 builtin_arc"
        files:
          - path: rogue-core/src/defs.rs
            content: |
              use std::collections::HashSet;
              use std::path::Path;

              use serde::Deserialize;

              use crate::comps::{Ai, Effect, Rgb};
              use crate::error::DataError;

              #[derive(Debug, Clone, Deserialize)]
              pub struct MonsterDef {
                  pub name: String,
                  pub glyph: char,
                  pub color: Rgb,
                  pub hp: i32,
                  pub power: i32,
                  pub defense: i32,
                  pub vision: i32,
                  pub ai: Ai,
              }

              #[derive(Debug, Clone, Deserialize)]
              pub struct ItemDef {
                  pub name: String,
                  pub glyph: char,
                  pub color: Rgb,
                  pub effect: Effect,
                  /// 방 하나에 놓일 확률(%)
                  pub chance: i32,
              }

              /// 저장 파일에는 넣지 않는다(`#[serde(skip)]`). 그래서 빈 값을 만들 수 있어야 한다
              #[derive(Debug, Clone, Default, Deserialize)]
              pub struct Defs {
                  pub monsters: Vec<MonsterDef>,
                  pub items: Vec<ItemDef>,
              }

              fn invalid(what: impl Into<String>, reason: impl Into<String>) -> DataError {
                  DataError::Invalid {
                      what: what.into(),
                      reason: reason.into(),
                  }
              }

              impl Defs {
                  pub fn load(path: impl AsRef<Path>) -> Result<Defs, DataError> {
                      let text = std::fs::read_to_string(path)?; // io::Error → DataError::Io
                      Defs::from_ron(&text)
                  }

                  pub fn from_ron(text: &str) -> Result<Defs, DataError> {
                      let defs: Defs = ron::from_str(text)?; // SpannedError → DataError::Parse
                      defs.validate()?;
                      Ok(defs)
                  }

                  fn validate(&self) -> Result<(), DataError> {
                      if self.monsters.is_empty() {
                          return Err(invalid("monsters", "at least one monster is required"));
                      }
                      let mut seen = HashSet::new();
                      for m in &self.monsters {
                          let what = format!("monster \"{}\"", m.name);
                          if !seen.insert(m.name.as_str()) {
                              return Err(invalid(what, "duplicate name"));
                          }
                          if m.hp <= 0 {
                              return Err(invalid(what, format!("hp must be positive (got {})", m.hp)));
                          }
                          if m.power < 0 || m.defense < 0 {
                              return Err(invalid(what, "power and defense cannot be negative"));
                          }
                          if m.vision <= 0 {
                              return Err(invalid(what, "vision must be positive"));
                          }
                      }
                      let mut seen = HashSet::new();
                      for i in &self.items {
                          let what = format!("item \"{}\"", i.name);
                          if !seen.insert(i.name.as_str()) {
                              return Err(invalid(what, "duplicate name"));
                          }
                          if !(0..=100).contains(&i.chance) {
                              return Err(invalid(what, "chance must be between 0 and 100"));
                          }
                          match i.effect {
                              Effect::Heal(n) if n <= 0 => {
                                  return Err(invalid(what, "heal amount must be positive"));
                              }
                              Effect::AreaDamage { amount, radius } if amount <= 0 || radius < 0 => {
                                  return Err(invalid(what, "bad area damage numbers"));
                              }
                              Effect::Heal(_) | Effect::AreaDamage { .. } => {}
                          }
                      }
                      Ok(())
                  }
              }

              /// 이 프로젝트의 파일을 테스트가 그대로 읽는다
              #[cfg(test)]
              pub fn builtin() -> Defs {
                  Defs::from_ron(include_str!("../../data/defs.ron")).expect("data/defs.ron is checked by tests")
              }

              /// 테스트에서 게임에 넘길 공유 정의 목록
              #[cfg(test)]
              pub fn builtin_arc() -> std::sync::Arc<Defs> {
                  std::sync::Arc::new(builtin())
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use std::error::Error;

                  #[test]
                  fn shipped_file_is_valid() {
                      let defs = builtin();
                      assert_eq!(defs.monsters.len(), 2);
                      assert_eq!(defs.items.len(), 2);
                  }

                  const MIN: &str = r#"(monsters: [(name: "A", glyph: 'a', color: (r:1,g:2,b:3), hp: 5, power: 1, defense: 0, vision: 5, ai: Chaser)], items: [])"#;

                  #[test]
                  fn minimal_file_loads() {
                      assert!(Defs::from_ron(MIN).is_ok());
                  }

                  #[test]
                  fn missing_file_is_io_error_with_source() {
                      let err = Defs::load("/definitely/not/here.ron").unwrap_err();
                      assert!(matches!(err, DataError::Io(_)));
                      assert!(err.source().is_some());
                  }

                  #[test]
                  fn typo_is_parse_error() {
                      let err = Defs::from_ron(&MIN.replace("hp:", "hpp:")).unwrap_err();
                      assert!(matches!(err, DataError::Parse(_)));
                      assert!(err.source().is_some());
                  }

                  #[test]
                  fn negative_hp_is_invalid() {
                      let err = Defs::from_ron(&MIN.replace("hp: 5", "hp: -5")).unwrap_err();
                      match err {
                          DataError::Invalid { what, reason } => {
                              assert!(what.contains("\"A\""));
                              assert!(reason.contains("-5"));
                          }
                          other => panic!("expected Invalid, got {other:?}"),
                      }
                  }

                  #[test]
                  fn display_is_readable() {
                      let err = Defs::from_ron(&MIN.replace("hp: 5", "hp: 0")).unwrap_err();
                      assert_eq!(
                          err.to_string(),
                          "monster \"A\": hp must be positive (got 0)"
                      );
                  }

                  #[test]
                  fn unknown_effect_name_is_parse_error() {
                      let text = MIN.replace(
                          "items: []",
                          r#"items: [(name: "B", glyph: 'b', color: (r:1,g:2,b:3), effect: Explode(3), chance: 10)]"#,
                      );
                      let err = Defs::from_ron(&text).unwrap_err();
                      assert!(matches!(err, DataError::Parse(_)));
                  }

                  #[test]
                  fn duplicate_names_are_invalid() {
                      let monster = r#"(name: "A", glyph: 'a', color: (r:1,g:2,b:3), hp: 5, power: 1, defense: 0, vision: 5, ai: Chaser)"#;
                      let text = format!("(monsters: [{monster}, {monster}], items: [])");
                      let err = Defs::from_ron(&text).unwrap_err();
                      assert!(matches!(err, DataError::Invalid { .. }));
                  }
              }
