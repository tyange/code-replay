              pub use world::World;
      - message: "[3-1] main.rs — 입력 변환과 게임오버 화면"
        files:
          - path: rogue/src/main.rs
            content: |
              use macroquad::prelude::*;
              use rogue_core::{Action, Dir, Game, Input, Point, Rgb, RunState, Tile};

              const TILE: f32 = 24.0;

              fn tile_color(tile: Tile) -> Color {
                  match tile {
                      Tile::Wall => DARKGRAY,
                      Tile::Floor => Color::new(0.15, 0.15, 0.2, 1.0),
                  }
              }

              /// core의 색을 macroquad의 색으로. 변환은 실행 파일 쪽에 둔다
              fn to_color(c: Rgb) -> Color {
                  Color::from_rgba(c.r, c.g, c.b, 255)
              }

              /// 이번 프레임에 눌린 키를 core의 입력으로 바꾼다
              fn read_input() -> Option<Input> {
                  if is_key_pressed(KeyCode::Up) {
                      Some(Input::Act(Action::Move(Dir::Up)))
                  } else if is_key_pressed(KeyCode::Down) {
                      Some(Input::Act(Action::Move(Dir::Down)))
                  } else if is_key_pressed(KeyCode::Left) {
                      Some(Input::Act(Action::Move(Dir::Left)))
                  } else if is_key_pressed(KeyCode::Right) {
                      Some(Input::Act(Action::Move(Dir::Right)))
                  } else if is_key_pressed(KeyCode::Space) {
                      Some(Input::Act(Action::Wait))
                  } else if is_key_pressed(KeyCode::R) {
                      Some(Input::Restart)
                  } else {
                      None
                  }
              }

              fn draw_glyph(p: Point, ch: char, color: Color) {
                  draw_text(
                      ch.to_string(),
                      p.x as f32 * TILE + 5.0,
                      (p.y + 1) as f32 * TILE - 5.0,
                      TILE,
                      color,
                  );
              }

              #[macroquad::main("Rogue")]
              async fn main() {
                  let mut game = Game::new();

                  loop {
                      game.update(read_input());

                      clear_background(BLACK);

                      let map = game.map();
                      for y in 0..map.height() {
                          for x in 0..map.width() {
                              if let Some(tile) = map.tile(Point::new(x, y)) {
                                  draw_rectangle(
                                      x as f32 * TILE,
                                      y as f32 * TILE,
                                      TILE - 1.0,
                                      TILE - 1.0,
                                      tile_color(tile),
                                  );
                              }
                          }
                      }

                      // 위치와 모양이 둘 다 있는 것은 모두 그린다. 플레이어인지 몬스터인지는 묻지 않는다
                      let world = game.world();
                      for (id, pos) in world.positions.iter() {
                          if let Some(glyph) = world.glyphs.get(id) {
                              draw_glyph(pos.0, glyph.ch, to_color(glyph.color));
                          }
                      }

                      let base_y = map.height() as f32 * TILE;
                      draw_text(
                          format!("HP {}", game.player_hp()),
                          10.0,
                          base_y + 24.0,
                          28.0,
                          WHITE,
                      );

                      // 최근 전투 메시지 4줄
                      for (i, line) in game.log().iter().rev().take(4).enumerate() {
                          draw_text(line, 10.0, base_y + 50.0 + i as f32 * 20.0, 20.0, LIGHTGRAY);
                      }

                      // 상태에 따라 무엇을 더 그릴지 정한다. 와일드카드 없이 모든 상태를 적는다
                      match game.state() {
                          RunState::AwaitingInput | RunState::MonsterTurn => {}
                          RunState::GameOver { cause } => {
                              let mid_y = screen_height() / 2.0;
                              draw_text(
                                  format!("You died. Killed by {cause}."),
                                  40.0,
                                  mid_y,
                                  36.0,
                                  RED,
                              );
                              draw_text("Press R to restart", 40.0, mid_y + 40.0, 28.0, WHITE);
                          }
                      }

                      next_frame().await;
                  }
              }
  - id: 3-2
    title: "3-2. 몬스터 AI: enum과 트레이트 객체"
    doc: |
      # 3-2. 몬스터 AI: enum과 트레이트 객체

      ### 만들 것

      행동 방식이 다른 몬스터 두 종류. 예를 들어 **추적형**(보이면 쫓아와서 때린다)과 **겁쟁이형**(체력이 낮으면 도망간다).

      ### 같은 기능을 두 번 구현합니다

      **구현 A: enum**

      - AI 종류를 enum으로 만들고 몬스터의 AI 컴포넌트로 붙입니다. 변형이 각자 필요한 데이터를 담을 수 있습니다(예: 겁쟁이형의 도망 기준 체력).
      - 몬스터 차례 처리에서 `match`로 분기해 각자의 행동을 결정합니다. 결정 결과는 1-2에서 만든 **행동 enum**입니다. AI는 행동을 고르기만 하고, 실제 적용은 플레이어와 같은 경로를 탑니다.

      **구현 B: 트레이트 객체**

      - "월드를 읽기 전용으로 보고 행동 하나를 결정한다"는 메서드 하나짜리 트레이트를 만듭니다.
      - 두 AI를 각각 별도 구조체로 만들어 이 트레이트를 구현하고, 컴포넌트에는 `Box<dyn 트레이트>`로 담습니다.
      - 여기서 빌림 문제를 만납니다. AI 컴포넌트는 월드 안에 있는데, AI의 메서드는 월드를 읽어야 합니다. 월드를 빌린 채로 월드 안의 것을 호출하는 구조를 어떻게 풀지 생각해 보세요. (힌트: 2-4에서 배운 "먼저 꺼내기"가 여기서도 통합니다. 컴포넌트를 잠깐 꺼냈다가 다시 넣는 방법이 있습니다.)

      ### 비교하고 하나를 고르기

      - 새 AI 종류를 추가할 때 각각 몇 군데를 고치나요?
      - AI에 새 기능(예: "이 몬스터가 지금 위험한가?")을 추가할 때는?
      - 구현 B의 컴포넌트에 `Clone`, `Debug`를 derive 하려고 해 보세요. 4-3에서는 `Serialize`도 필요해집니다.
      - 이 비교를 `LEARNING.md`에 적고 **최종적으로 enum 쪽을 남기세요.** 4-3(저장)에서 이 선택의 이유를 다시 체감하게 됩니다. 구현 B는 브랜치로 남겨 둡니다.

      ### 코드 (구현 A)

      몬스터가 `Target` 컴포넌트로 "누구를 쫓는지" 들고 다니던 구조를 없애고, 판단은 월드를 읽기만 하는 함수 하나로 모읍니다.

      ▶ `rogue-core/src/comps.rs` (`Target` 을 지우고 `Ai` enum 으로 바꿉니다) — 재생에서 따라 칩니다

      `World` 는 `targets: Store<Target>` 대신 `ais: Store<Ai>` 를 갖고, `despawn` 도 맞춰 바꿉니다. 몬스터가 늘어나므로 스폰 공통부를 도우미 `spawn_monster` 하나로 모읍니다. 고블린은 'g', 초록(80,200,80), "Goblin", 체력10/공격4/방어1, `Ai::Chaser`. 코볼드는 'k', 주황(230,140,60), "Kobold", 체력8/공격3/방어0, `Ai::Coward { flee_below: 3 }`.

      ▶ `rogue-core/src/world.rs` — 재생에서 따라 칩니다

      `spawn_goblin` 은 이제 목표 인자가 없습니다. 호출하던 곳(`Game::new`, 테스트 전부)에서 두 번째 인자를 지우고, `Game::new` 의 몬스터는 고블린 둘과 코볼드 하나로 바꿉니다: 고블린 (5,5), (24,4) / 코볼드 (20,15).

      ▶ `rogue-core/src/combat.rs` (테스트의 `spawn_goblin` 인자 정리) — 재생에서 따라 칩니다

      `ai.rs` 의 `decide` 는 월드를 읽기만 하고 행동 하나를 고릅니다.

      - 내 Ai 와 내/플레이어의 위치를 조회한다. 하나라도 없으면 `Action::Wait` (방금 죽은 몬스터가 여기로 들어와도 패닉하면 안 된다)
      - Ai 의 모든 변형을 와일드카드 없이 match 한다
        - Chaser: 플레이어 쪽으로 한 칸
        - Coward: 내 체력이 flee_below 미만이면 도망, 아니면 Chaser 와 같이 행동

      `step_toward` 는 game.rs 에 있던 함수를 그대로 옮겨 오고, `step_away` 는 네 방향 중 걸어갈 수 있는 것만 남기고 이동한 칸과 위협 사이 거리가 가장 큰 방향을 고릅니다. 테스트는 `chaser_approaches`, `healthy_coward_approaches`, `hurt_coward_flees`(코볼드 체력을 2 로 낮추면 플레이어 반대쪽(Left)으로 간다), `cornered_coward_waits`(구석에서 갈 곳이 없으면 `Action::Wait`) 네 개입니다.

      ▶ `rogue-core/src/ai.rs` (새 파일) — 재생에서 따라 칩니다

      <details><summary>힌트 1: 조회를 짧게 쓰는 법</summary>

      `let Some(&ai) = world.ais.get(me) else { return Action::Wait; };` 처럼 `let ... else` 를 쓰고, 두 위치는 튜플로 묶어 한 번에 검사합니다: `let (Some(from), Some(goal)) = (a, b) else { ... };`. `Ai` 가 `Copy` 라서 `&ai` 패턴으로 값을 꺼낼 수 있고, 그러면 `world` 를 빌린 채로 남지 않습니다.

      </details>

      <details><summary>힌트 2: 겁쟁이 분기</summary>

      체력이 없는 경우(조회 실패)는 `map_or(0, |h| h.hp)` 로 0 으로 보면 죽기 직전이라 도망 쪽으로 가는데, 그 전에 4번에서 이미 걸러집니다. 도망 방향이 `None` 이면 `Action::Wait`, 있으면 `Action::Move`. `Option::map_or(Action::Wait, Action::Move)` 한 줄로 쓸 수 있습니다.

      </details>

      <details><summary>힌트 3: `max_by_key`</summary>

      `Dir::ALL.into_iter().filter(...).max_by_key(|&d| ...)` 입니다. 키는 거리의 제곱 `(p.x - t.x).pow(2) + (p.y - t.y).pow(2)` 이면 충분합니다 (제곱근은 필요 없습니다). `max_by_key` 는 후보가 없으면 `None` 을 주므로 "갈 곳이 없음"이 그대로 표현됩니다.

      </details>

      <details><summary>힌트 4: 구석 만들기</summary>

      플레이어를 (2,2), 코볼드를 (1,1)에 두고 체력을 1 로 낮춥니다. `Map::room` 에서 (1,1) 의 이웃은 (2,1) 과 (1,2) 뿐이므로, 두 칸에 `map.set(Point::new(..), Tile::Wall)` 로 벽을 세우면 갈 수 있는 방향이 사라집니다.

      </details>

      `game.rs` 의 `monsters_act` 는 몬스터마다 `ai::decide(&self.world, &self.map, id, self.player)` 로 행동을 받아 `perform` 하도록 바꾸고, `step_toward` 는 `game.rs` 에서 지웁니다.

      ▶ `rogue-core/src/game.rs` — 재생에서 따라 칩니다

      `lib.rs` 에는 `mod ai;` 와 `pub use comps::Ai`.

      ▶ `rogue-core/src/lib.rs` — 재생에서 따라 칩니다

      구현 B(`Box<dyn Brain>`)는 위 enum 버전을 먼저 끝낸 뒤, 별도 브랜치에서 처음부터 직접 만드는 쪽입니다. `trait Brain { fn decide(&self, ...) -> Action; }` 하나와 구조체 두 개를 `Store<Box<dyn Brain>>` 에 넣는 형태입니다. 재생은 `exp/dyn-ai` 브랜치에서 볼 수 있습니다.

      ### 확인 기준

      - [ ] 두 종류 몬스터가 눈에 띄게 다르게 행동한다
      - [ ] 두 구현 모두 동작했고, 비교 기록이 있다
      - [ ] AI 코드가 월드를 직접 수정하지 않고 행동만 돌려준다

      ### 이해 체크

      - "타입을 추가하기 쉬운 설계"와 "기능을 추가하기 쉬운 설계"는 왜 동시에 얻기 어려운가? (표현 문제, expression problem)
      - 트레이트를 `dyn`으로 쓸 수 없게 만드는 조건은 무엇인가? (제네릭 메서드나 `Self`를 반환하는 메서드를 넣어 보세요)

      ## 정답 노트에서

      `Game::monsters_act` 는 이제 "각 몬스터에게 `decide` 를 묻고, 나온 행동을 플레이어와 **같은 경로**(`perform`)로 실행"하는 일만 해요.

      - 방향의 "멀어짐"은 제곱 거리로 비교해요. 루트를 씌울 필요가 없고, 정수끼리라 비교가 정확해요.
      - `decide` 는 `&World` 만 받아서 월드를 바꾸지 못해요. 그래서 AI 를 테스트할 때 월드를 만들어 `decide` 의 반환값만 비교하면 돼요.
      - 갈 곳이 없는 겁쟁이는 `None` 이 나와서 `Wait` 가 돼요. 이 경우를 `Option` 이 자연스럽게 표현해요.

      **enum 대 `dyn Brain` 비교 (가이드의 비교 실험)**

      - 저장소가 `Store<Box<dyn Brain>>` 이어야 해서, 뇌를 쓰는 동안 월드를 읽으려면 **꺼냈다 되돌려 놓는** 절차가 필요해요 (`&mut self` 와 `&World` 를 동시에 빌릴 수 없기 때문).
      - 장점: 새 몬스터를 추가해도 기존 코드를 안 건드려요. 뇌가 기억(`&mut self` 필드)을 가질 수 있어요.
      - 단점: 4-3 에서 보듯 `dyn Brain` 은 `Serialize` 를 쉽게 붙일 수 없어서 저장이 어려워요. 그래서 이 프로젝트는 **enum** 을 골랐어요. 변형이 둘뿐이고 데이터 파일(RON)에서 그대로 읽히기 때문이에요.
    steps:
      - message: "[3-2] comps.rs — Target 대신 Ai enum"
        files:
          - path: rogue-core/src/comps.rs
            content: |
              use crate::geom::Point;

              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              pub struct Rgb {
                  pub r: u8,
                  pub g: u8,
                  pub b: u8,
              }

              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              pub struct Position(pub Point);

              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              pub struct Glyph {
                  pub ch: char,
                  pub color: Rgb,
              }

              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              pub struct Health {
                  pub hp: i32,
                  pub max: i32,
              }

              #[derive(Debug, Clone, PartialEq, Eq)]
              pub struct Name(pub String);

              /// 지나갈 수 없게 막는 표시
              #[derive(Debug, Clone, Copy)]
              pub struct BlocksTile;

              #[derive(Debug, Clone, Copy)]
              pub struct Player;

              #[derive(Debug, Clone, Copy)]
              pub struct Monster;

              /// 몬스터의 행동 방식. 변형마다 필요한 데이터를 담는다
              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              pub enum Ai {
                  /// 플레이어를 쫓아와서 때린다
                  Chaser,
                  /// 체력이 `flee_below` 미만이면 도망간다
                  Coward { flee_below: i32 },
              }

              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              pub struct Combat {
                  pub power: i32,
                  pub defense: i32,
              }
      - message: "[3-2] world.rs — 고블린, 코볼드와 spawn_monster"
        files:
          - path: rogue-core/src/world.rs
            content: |
              use crate::comps::{Ai, BlocksTile, Combat, Glyph, Health, Monster, Name, Player, Position, Rgb};
              use crate::entity::{Entities, EntityId};
              use crate::geom::Point;
              use crate::store::Store;

              #[derive(Default)]
              pub struct World {
                  pub entities: Entities,
                  pub positions: Store<Position>,
                  pub glyphs: Store<Glyph>,
                  pub healths: Store<Health>,
                  pub names: Store<Name>,
                  pub blockers: Store<BlocksTile>,
                  pub players: Store<Player>,
                  pub monsters: Store<Monster>,
                  pub ais: Store<Ai>,
                  pub combats: Store<Combat>,
              }

              impl World {
                  /// 엔티티와 모든 컴포넌트를 지운다
                  pub fn despawn(&mut self, id: EntityId) {
                      self.entities.despawn(id);
                      self.positions.remove(id);
                      self.glyphs.remove(id);
                      self.healths.remove(id);
                      self.names.remove(id);
                      self.blockers.remove(id);
                      self.players.remove(id);
                      self.monsters.remove(id);
                      self.ais.remove(id);
                      self.combats.remove(id);
                  }

                  pub fn spawn_player(&mut self, pos: Point) -> EntityId {
                      let id = self.entities.spawn();
                      self.positions.insert(id, Position(pos));
                      self.glyphs.insert(
                          id,
                          Glyph {
                              ch: '@',
                              color: Rgb {
                                  r: 255,
                                  g: 221,
                                  b: 51,
                              },
                          },
                      );
                      self.healths.insert(id, Health { hp: 30, max: 30 });
                      self.combats.insert(
                          id,
                          Combat {
                              power: 5,
                              defense: 2,
                          },
                      );
                      self.names.insert(id, Name("Player".to_string()));
                      self.blockers.insert(id, BlocksTile);
                      self.players.insert(id, Player);
                      id
                  }

                  pub fn spawn_goblin(&mut self, pos: Point) -> EntityId {
                      self.spawn_monster(
                          pos,
                          'g',
                          Rgb {
                              r: 80,
                              g: 200,
                              b: 80,
                          },
                          "Goblin",
                          (10, 4, 1),
                          Ai::Chaser,
                      )
                  }

                  pub fn spawn_kobold(&mut self, pos: Point) -> EntityId {
                      self.spawn_monster(
                          pos,
                          'k',
                          Rgb {
                              r: 230,
                              g: 140,
                              b: 60,
                          },
                          "Kobold",
                          (8, 3, 0),
                          Ai::Coward { flee_below: 3 },
                      )
                  }

                  /// stats = (체력, 공격력, 방어력)
                  fn spawn_monster(
                      &mut self,
                      pos: Point,
                      ch: char,
                      color: Rgb,
                      name: &str,
                      stats: (i32, i32, i32),
                      ai: Ai,
                  ) -> EntityId {
                      let (hp, power, defense) = stats;
                      let id = self.entities.spawn();
                      self.positions.insert(id, Position(pos));
                      self.glyphs.insert(id, Glyph { ch, color });
                      self.healths.insert(id, Health { hp, max: hp });
                      self.combats.insert(id, Combat { power, defense });
                      self.names.insert(id, Name(name.to_string()));
                      self.blockers.insert(id, BlocksTile);
                      self.monsters.insert(id, Monster);
                      self.ais.insert(id, ai);
                      id
                  }

                  /// 이 좌표에서 길을 막고 있는 엔티티
                  pub fn blocker_at(&self, p: Point) -> Option<EntityId> {
                      self.positions
                          .iter()
                          .find(|(id, pos)| pos.0 == p && self.blockers.get(*id).is_some())
                          .map(|(id, _)| id)
                  }
              }
      - message: "[3-2] combat.rs — 테스트의 spawn_goblin 인자 정리"
        files:
          - path: rogue-core/src/combat.rs
            content: |
              use crate::entity::EntityId;
              use crate::event::Event;
              use crate::world::World;

              /// 공격력에서 방어력을 뺀 피해. 최소 1
              pub fn damage(power: i32, defense: i32) -> i32 {
                  (power - defense).max(1)
              }

              /// 방법 3: 이벤트. 아무것도 바꾸지 않고, 일어나야 할 일만 돌려준다
              pub fn attack_event(world: &World, attacker: EntityId, defender: EntityId) -> Option<Event> {
                  let power = world.combats.get(attacker)?.power;
                  let defense = world.combats.get(defender)?.defense;
                  Some(Event::Damage {
                      target: defender,
                      amount: damage(power, defense),
                      source: attacker,
                  })
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::geom::Point;

                  // 연습: 흡혈 공격(방어자는 피해를 입고, 공격자는 그 절반을 회복)을 세 가지 방법으로 구현해 비교한다.
                  // 공격자와 방어자의 Health가 같은 저장소 안에 있어서 둘 다 가변으로 빌려야 하는 상황이다.

                  fn setup() -> (World, EntityId, EntityId) {
                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(1, 1));
                      let goblin = world.spawn_goblin(Point::new(2, 1));
                      if let Some(h) = world.healths.get_mut(player) {
                          h.hp = 20; // 회복할 여유를 만든다
                      }
                      (world, player, goblin)
                  }

                  /// 방법 1: 값을 먼저 꺼내기
                  fn lifesteal_copy_out(world: &mut World, attacker: EntityId, defender: EntityId) -> Option<()> {
                      let power = world.combats.get(attacker)?.power;
                      let defense = world.combats.get(defender)?.defense;
                      let amount = damage(power, defense);
                      world.healths.get_mut(defender)?.hp -= amount; // 이 빌림은 여기서 끝난다
                      let h = world.healths.get_mut(attacker)?;
                      h.hp = (h.hp + amount / 2).min(h.max);
                      Some(())
                  }

                  /// 방법 2: 서로 다른 두 칸을 동시에 가변으로 빌리기
                  fn lifesteal_disjoint(world: &mut World, attacker: EntityId, defender: EntityId) -> Option<()> {
                      let power = world.combats.get(attacker)?.power;
                      let defense = world.combats.get(defender)?.defense;
                      let amount = damage(power, defense);
                      let (a, d) = world.healths.get_two_mut(attacker, defender)?; // 두 칸을 한 번에 빌린다
                      d.hp -= amount;
                      a.hp = (a.hp + amount / 2).min(a.max);
                      Some(())
                  }

                  /// 방법 3: 이벤트. 흡혈은 "피해"와 "회복" 두 이벤트의 조합일 뿐이다
                  fn lifesteal_events(
                      world: &World,
                      attacker: EntityId,
                      defender: EntityId,
                  ) -> Vec<(EntityId, i32)> {
                      let Some(Event::Damage {
                          target,
                          amount,
                          source,
                      }) = attack_event(world, attacker, defender)
                      else {
                          return Vec::new();
                      };
                      vec![(target, -amount), (source, amount / 2)]
                  }

                  #[test]
                  fn all_three_methods_agree() {
                      let (mut w1, p1, g1) = setup();
                      lifesteal_copy_out(&mut w1, p1, g1);
                      let (mut w2, p2, g2) = setup();
                      lifesteal_disjoint(&mut w2, p2, g2);
                      let (w3, p3, g3) = setup();
                      let changes = lifesteal_events(&w3, p3, g3);

                      // 플레이어(공격 5) → 고블린(방어 1): 피해 4, 흡혈 2
                      assert_eq!(w1.healths.get(g1).map(|h| h.hp), Some(6));
                      assert_eq!(w1.healths.get(p1).map(|h| h.hp), Some(22));
                      assert_eq!(w2.healths.get(g2).map(|h| h.hp), Some(6));
                      assert_eq!(w2.healths.get(p2).map(|h| h.hp), Some(22));
                      assert_eq!(changes, vec![(g3, -4), (p3, 2)]);
                  }

                  #[test]
                  fn minimum_damage_is_one() {
                      assert_eq!(damage(1, 10), 1);
                  }
              }
      - message: "[3-2] ai.rs — enum 으로 몬스터 행동 고르기"
        files:
          - path: rogue-core/src/ai.rs
            content: |
              use crate::action::Action;
              use crate::comps::Ai;
              use crate::entity::EntityId;
              use crate::geom::{Dir, Point};
              use crate::map::Map;
              use crate::world::World;

              /// 월드를 읽기만 하고 행동 하나를 고른다. 실제 적용은 플레이어와 같은 경로를 탄다
              pub fn decide(world: &World, map: &Map, me: EntityId, player: EntityId) -> Action {
                  let Some(&ai) = world.ais.get(me) else {
                      return Action::Wait;
                  };
                  let (Some(from), Some(goal)) = (
                      world.positions.get(me).map(|p| p.0),
                      world.positions.get(player).map(|p| p.0),
                  ) else {
                      return Action::Wait;
                  };
                  match ai {
                      Ai::Chaser => Action::Move(step_toward(from, goal)),
                      Ai::Coward { flee_below } => {
                          let hp = world.healths.get(me).map_or(0, |h| h.hp);
                          if hp < flee_below {
                              step_away(map, from, goal).map_or(Action::Wait, Action::Move)
                          } else {
                              Action::Move(step_toward(from, goal))
                          }
                      }
                  }
              }

              /// 목표 쪽으로 한 칸 (거리가 먼 축 우선)
              pub fn step_toward(from: Point, to: Point) -> Dir {
                  let (dx, dy) = (to.x - from.x, to.y - from.y);
                  if dx.abs() >= dy.abs() {
                      if dx > 0 { Dir::Right } else { Dir::Left }
                  } else if dy > 0 {
                      Dir::Down
                  } else {
                      Dir::Up
                  }
              }

              /// 위협에서 가장 멀어지는, 걸어갈 수 있는 방향. 갈 곳이 없으면 None
              fn step_away(map: &Map, from: Point, threat: Point) -> Option<Dir> {
                  Dir::ALL
                      .into_iter()
                      .filter(|&d| map.is_walkable(from.step(d)))
                      .max_by_key(|&d| {
                          let p = from.step(d);
                          (p.x - threat.x).pow(2) + (p.y - threat.y).pow(2)
                      })
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::map::Tile;

                  fn setup(monster_at: Point) -> (World, Map, EntityId, EntityId) {
                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(10, 10));
                      let kobold = world.spawn_kobold(monster_at);
                      (world, Map::room(30, 20), player, kobold)
                  }

                  #[test]
                  fn chaser_approaches() {
                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(10, 10));
                      let goblin = world.spawn_goblin(Point::new(4, 10));
                      let map = Map::room(30, 20);
                      assert_eq!(
                          decide(&world, &map, goblin, player),
                          Action::Move(Dir::Right)
                      );
                  }

                  #[test]
                  fn healthy_coward_approaches() {
                      let (world, map, player, kobold) = setup(Point::new(4, 10));
                      assert_eq!(
                          decide(&world, &map, kobold, player),
                          Action::Move(Dir::Right)
                      );
                  }

                  #[test]
                  fn hurt_coward_flees() {
                      let (mut world, map, player, kobold) = setup(Point::new(4, 10));
                      if let Some(h) = world.healths.get_mut(kobold) {
                          h.hp = 2;
                      }
                      assert_eq!(
                          decide(&world, &map, kobold, player),
                          Action::Move(Dir::Left)
                      );
                  }

                  #[test]
                  fn cornered_coward_waits() {
                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(2, 2));
                      let kobold = world.spawn_kobold(Point::new(1, 1));
                      if let Some(h) = world.healths.get_mut(kobold) {
                          h.hp = 1;
                      }
                      let mut map = Map::room(30, 20);
                      map.set(Point::new(2, 1), Tile::Wall);
                      map.set(Point::new(1, 2), Tile::Wall);
                      assert_eq!(decide(&world, &map, kobold, player), Action::Wait);
                  }
              }
      - message: "[3-2] game.rs — 몬스터 차례를 ai::decide 로"
        files:
          - path: rogue-core/src/game.rs
            content: |
              use crate::action::Action;
              use crate::ai;
              use crate::combat;
              use crate::entity::EntityId;
              use crate::event::Event;
              use crate::geom::Point;
              use crate::map::Map;
              use crate::state::{Input, RunState};
              use crate::world::World;

              pub struct Game {
                  map: Map,
                  world: World,
                  player: EntityId,
                  events: Vec<Event>,
                  log: Vec<String>,
                  state: RunState,
              }

              impl Game {
                  pub fn new() -> Game {
                      let mut world = World::default();
                      let player = world.spawn_player(Point::new(15, 10));
                      world.spawn_goblin(Point::new(5, 5));
                      world.spawn_goblin(Point::new(24, 4));
                      world.spawn_kobold(Point::new(20, 15));
                      Game {
                          map: Map::room(30, 20),
                          world,
                          player,
                          events: Vec::new(),
                          log: Vec::new(),
                          state: RunState::AwaitingInput,
                      }
                  }

                  pub fn map(&self) -> &Map {
                      &self.map
                  }

                  pub fn world(&self) -> &World {
                      &self.world
                  }

                  pub fn player(&self) -> EntityId {
                      self.player
                  }

                  /// 지금까지의 전투 메시지. 오래된 것이 앞에 있다
                  pub fn log(&self) -> &[String] {
                      &self.log
                  }

                  pub fn state(&self) -> &RunState {
                      &self.state
                  }

                  pub fn is_over(&self) -> bool {
                      matches!(self.state, RunState::GameOver { .. })
                  }

                  pub fn player_hp(&self) -> i32 {
                      self.world.healths.get(self.player).map_or(0, |h| h.hp)
                  }

                  /// 매 프레임 한 번 부른다. 현재 상태를 값으로 꺼내(소비) 다음 상태를 만들어 되돌려 넣는다
                  pub fn update(&mut self, input: Option<Input>) {
                      let current = std::mem::replace(&mut self.state, RunState::AwaitingInput);
                      self.state = match current {
                          RunState::AwaitingInput => match input {
                              Some(Input::Act(action)) => {
                                  self.perform(self.player, action);
                                  match self.apply_events() {
                                      Some(cause) => RunState::GameOver { cause },
                                      None => RunState::MonsterTurn,
                                  }
                              }
                              Some(Input::Restart) | None => RunState::AwaitingInput,
                          },
                          RunState::MonsterTurn => match self.monsters_act() {
                              Some(cause) => RunState::GameOver { cause },
                              None => RunState::AwaitingInput,
                          },
                          RunState::GameOver { cause } => match input {
                              Some(Input::Restart) => {
                                  *self = Game::new();
                                  return;
                              }
                              Some(Input::Act(_)) | None => RunState::GameOver { cause },
                          },
                      };
                  }

                  fn perform(&mut self, actor: EntityId, action: Action) {
                      let Action::Move(dir) = action else {
                          return; // Wait
                      };
                      let Some(from) = self.world.positions.get(actor).map(|p| p.0) else {
                          return;
                      };
                      let to = from.step(dir);
                      match self.world.blocker_at(to) {
                          Some(other) => self.attack(actor, other),
                          None if self.map.is_walkable(to) => {
                              if let Some(p) = self.world.positions.get_mut(actor) {
                                  p.0 = to;
                              }
                          }
                          None => {}
                      }
                  }

                  fn attack(&mut self, attacker: EntityId, defender: EntityId) {
                      // 플레이어와 몬스터 사이에서만 싸운다 (몬스터끼리는 서로 막기만 한다)
                      if attacker != self.player && defender != self.player {
                          return;
                      }
                      // 체력을 직접 바꾸지 않고, 일어나야 할 일을 큐에 넣는다
                      if let Some(event) = combat::attack_event(&self.world, attacker, defender) {
                          self.events.push(event);
                      }
                  }

                  /// 쌓인 이벤트를 한 번에 적용한다. 플레이어가 죽었으면 사인(죽인 쪽의 이름)을 돌려준다
                  fn apply_events(&mut self) -> Option<String> {
                      let mut cause = None;
                      let events = std::mem::take(&mut self.events);
                      for event in events {
                          match event {
                              Event::Damage {
                                  target,
                                  amount,
                                  source,
                              } => {
                                  let attacker = self.name_of(source);
                                  let defender = self.name_of(target);
                                  let Some(health) = self.world.healths.get_mut(target) else {
                                      continue; // 같은 턴에 이미 죽은 대상
                                  };
                                  health.hp -= amount;
                                  let dead = health.hp <= 0;
                                  self.push_log(format!("{attacker} hits {defender} for {amount}."));
                                  if dead {
                                      self.push_log(format!("{defender} dies."));
                                      if target == self.player {
                                          // 플레이어는 지우지 않는다. 죽음은 상태(GameOver)로 표현한다
                                          cause = Some(attacker);
                                      } else {
                                          self.world.despawn(target);
                                      }
                                  }
                              }
                          }
                      }
                      cause
                  }

                  fn name_of(&self, id: EntityId) -> String {
                      self.world
                          .names
                          .get(id)
                          .map_or_else(|| "Something".to_string(), |n| n.0.clone()) // 로그에 남길 이름은 소유한 값이 필요하다
                  }

                  fn push_log(&mut self, line: String) {
                      self.log.push(line);
                      if self.log.len() > 100 {
                          self.log.drain(..50);
                      }
                  }

                  /// 모든 몬스터가 행동한다. 플레이어가 죽으면 사인을 돌려준다
                  fn monsters_act(&mut self) -> Option<String> {
                      // 순회하면서 perform 으로 월드를 고쳐야 하므로, ID 를 먼저 모아 빌림을 끝낸다
                      let ids: Vec<EntityId> = self.world.monsters.iter().map(|(id, _)| id).collect();
                      for id in ids {
                          let action = ai::decide(&self.world, &self.map, id, self.player);
                          self.perform(id, action);
                          if let Some(cause) = self.apply_events() {
                              return Some(cause);
                          }
                      }
                      None
                  }
              }

              impl Default for Game {
                  fn default() -> Self {
                      Game::new()
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::geom::Dir;

                  /// 입력 하나를 넣고, 몬스터 차례까지 끝낸다
                  fn act(game: &mut Game, action: Action) {
                      game.update(Some(Input::Act(action)));
                      game.update(None);
                  }

                  fn player_pos(game: &Game) -> Option<Point> {
                      game.world.positions.get(game.player).map(|p| p.0)
                  }

                  /// 몬스터를 모두 치워서 플레이어만 남긴다
                  fn clear_monsters(game: &mut Game) {
                      let ids: Vec<EntityId> = game.world.monsters.iter().map(|(id, _)| id).collect();
                      for id in ids {
                          game.world.despawn(id);
                      }
                  }

                  #[test]
                  fn player_moves_and_stops_at_wall() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      act(&mut game, Action::Move(Dir::Right));
                      assert_eq!(player_pos(&game), Some(Point::new(16, 10)));
                      for _ in 0..30 {
                          act(&mut game, Action::Move(Dir::Left));
                      }
                      assert_eq!(player_pos(&game), Some(Point::new(1, 10)));
                  }

                  #[test]
                  fn moving_into_a_monster_attacks_it() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(16, 10));
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      // 이동하지 않고 공격한다: 공격 5 - 방어 1 = 4
                      assert_eq!(player_pos(&game), Some(Point::new(15, 10)));
                      assert_eq!(game.world.healths.get(goblin).map(|h| h.hp), Some(6));
                      assert_eq!(
                          game.log().first().map(String::as_str),
                          Some("Player hits Goblin for 4.")
                      );
                  }

                  #[test]
                  fn monster_dies_and_is_removed() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(16, 10));
                      if let Some(h) = game.world.healths.get_mut(goblin) {
                          h.hp = 4;
                      }
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      assert!(!game.world.entities.is_alive(goblin));
                      assert!(game.world.blocker_at(Point::new(16, 10)).is_none());
                      assert_eq!(game.log().last().map(String::as_str), Some("Goblin dies."));
                  }

                  #[test]
                  fn monsters_approach_the_player() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(5, 10));
                      act(&mut game, Action::Wait);
                      assert_eq!(
                          game.world.positions.get(goblin).map(|p| p.0),
                          Some(Point::new(6, 10))
                      );
                  }

                  #[test]
                  fn adjacent_monster_attacks_the_player() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      game.world.spawn_goblin(Point::new(16, 10));
                      act(&mut game, Action::Wait);
                      // 공격 4 - 방어 2 = 2
                      assert_eq!(game.player_hp(), 28);
                      assert_eq!(game.log(), ["Goblin hits Player for 2."]);
                  }

                  #[test]
                  fn minimum_damage_applies_in_game() {
                      let mut game = Game::new();
                      clear_monsters(&mut game);
                      let goblin = game.world.spawn_goblin(Point::new(16, 10));
                      if let Some(c) = game.world.combats.get_mut(goblin) {
                          c.defense = 99;
                      }
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      assert_eq!(game.world.healths.get(goblin).map(|h| h.hp), Some(9));
                  }

                  #[test]
                  fn no_input_changes_nothing() {
                      let mut game = Game::new();
                      for _ in 0..10 {
                          game.update(None);
                      }
                      assert_eq!(player_pos(&game), Some(Point::new(15, 10)));
                      assert_eq!(game.state(), &RunState::AwaitingInput);
                      assert!(game.log().is_empty());
                  }

                  #[test]
                  fn turn_goes_through_monster_turn() {
                      let mut game = Game::new();
                      game.update(Some(Input::Act(Action::Wait)));
                      assert_eq!(game.state(), &RunState::MonsterTurn);
                      game.update(None);
                      assert_eq!(game.state(), &RunState::AwaitingInput);
                  }

                  #[test]
                  fn player_death_leads_to_game_over() {
                      let mut game = Game::new();
                      for _ in 0..200 {
                          act(&mut game, Action::Wait);
                      }
                      assert!(game.is_over());
                      assert_eq!(
                          game.state(),
                          &RunState::GameOver {
                              cause: "Goblin".to_string()
                          }
                      );
                  }

                  #[test]
                  fn game_over_ignores_moves_and_restart_starts_over() {
                      let mut game = Game::new();
                      for _ in 0..200 {
                          act(&mut game, Action::Wait);
                      }
                      let before = player_pos(&game);
                      game.update(Some(Input::Act(Action::Move(Dir::Right))));
                      assert!(game.is_over());
                      assert_eq!(player_pos(&game), before);

                      game.update(Some(Input::Restart));
                      assert_eq!(game.state(), &RunState::AwaitingInput);
                      assert_eq!(game.player_hp(), 30);
                  }
              }
