              /// 몬스터의 행동 방식. 변형마다 필요한 데이터를 담는다
              #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
              pub enum Ai {
                  /// 플레이어를 쫓아와서 때린다
                  Chaser,
                  /// 체력이 `flee_below` 미만이면 도망간다
                  Coward { flee_below: i32 },
              }

              #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
              pub struct Combat {
                  pub power: i32,
                  pub defense: i32,
              }

              /// 시야. `visible`은 다시 계산할 수 있는 값이다
              #[derive(Debug, Clone, Serialize, Deserialize)]
              pub struct Viewshed {
                  pub range: i32,
                  /// 다시 계산할 수 있으므로 저장하지 않는다
                  #[serde(skip)]
                  pub visible: HashSet<Point>,
                  /// 저장하지 않는다. 불러온 쪽이 true 로 만들어 다시 계산하게 한다
                  #[serde(skip)]
                  pub dirty: bool,
              }

              impl Viewshed {
                  pub fn new(range: i32) -> Viewshed {
                      Viewshed {
                          range,
                          visible: HashSet::new(),
                          dirty: true,
                      }
                  }
              }

              /// 아이템을 쓰면 일어나는 일
              #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
              pub enum Effect {
                  Heal(i32),
                  AreaDamage { amount: i32, radius: i32 },
              }

              #[derive(Debug, Clone, Copy, Serialize, Deserialize)]
              pub struct Item(pub Effect);

              /// 가방에 들어 있다. 이 컴포넌트가 있으면 Position은 없다
              #[derive(Debug, Clone, Copy, Serialize, Deserialize)]
              pub struct InBackpack {
                  pub owner: EntityId,
              }
          - path: rogue-core/src/defs.rs
            content: |
              use std::collections::HashSet;
              use std::path::Path;

              use serde::Deserialize;

              use crate::comps::{Ai, Effect, Rgb};
              use crate::error::DataError;

              #[derive(Debug, Clone, Deserialize)]
              pub struct MonsterDef {
                  pub name: String,
                  pub glyph: char,
                  pub color: Rgb,
                  pub hp: i32,
                  pub power: i32,
                  pub defense: i32,
                  pub vision: i32,
                  pub ai: Ai,
              }

              #[derive(Debug, Clone, Deserialize)]
              pub struct ItemDef {
                  pub name: String,
                  pub glyph: char,
                  pub color: Rgb,
                  pub effect: Effect,
                  /// 방 하나에 놓일 확률(%)
                  pub chance: i32,
              }

              /// 저장 파일에는 넣지 않는다(`#[serde(skip)]`). 그래서 빈 값을 만들 수 있어야 한다
              #[derive(Debug, Clone, Default, Deserialize)]
              pub struct Defs {
                  pub monsters: Vec<MonsterDef>,
                  pub items: Vec<ItemDef>,
              }

              fn invalid(what: impl Into<String>, reason: impl Into<String>) -> DataError {
                  DataError::Invalid {
                      what: what.into(),
                      reason: reason.into(),
                  }
              }

              impl Defs {
                  pub fn load(path: impl AsRef<Path>) -> Result<Defs, DataError> {
                      let text = std::fs::read_to_string(path)?; // io::Error → DataError::Io
                      Defs::from_ron(&text)
                  }

                  pub fn from_ron(text: &str) -> Result<Defs, DataError> {
                      let defs: Defs = ron::from_str(text)?; // SpannedError → DataError::Parse
                      defs.validate()?;
                      Ok(defs)
                  }

                  fn validate(&self) -> Result<(), DataError> {
                      if self.monsters.is_empty() {
                          return Err(invalid("monsters", "at least one monster is required"));
                      }
                      let mut seen = HashSet::new();
                      for m in &self.monsters {
                          let what = format!("monster \"{}\"", m.name);
                          if !seen.insert(m.name.as_str()) {
                              return Err(invalid(what, "duplicate name"));
                          }
                          if m.hp <= 0 {
                              return Err(invalid(what, format!("hp must be positive (got {})", m.hp)));
                          }
                          if m.power < 0 || m.defense < 0 {
                              return Err(invalid(what, "power and defense cannot be negative"));
                          }
                          if m.vision <= 0 {
                              return Err(invalid(what, "vision must be positive"));
                          }
                      }
                      let mut seen = HashSet::new();
                      for i in &self.items {
                          let what = format!("item \"{}\"", i.name);
                          if !seen.insert(i.name.as_str()) {
                              return Err(invalid(what, "duplicate name"));
                          }
                          if !(0..=100).contains(&i.chance) {
                              return Err(invalid(what, "chance must be between 0 and 100"));
                          }
                          match i.effect {
                              Effect::Heal(n) if n <= 0 => {
                                  return Err(invalid(what, "heal amount must be positive"));
                              }
                              Effect::AreaDamage { amount, radius } if amount <= 0 || radius < 0 => {
                                  return Err(invalid(what, "bad area damage numbers"));
                              }
                              Effect::Heal(_) | Effect::AreaDamage { .. } => {}
                          }
                      }
                      Ok(())
                  }
              }

              /// 이 프로젝트의 파일을 테스트가 그대로 읽는다
              #[cfg(test)]
              pub fn builtin() -> Defs {
                  Defs::from_ron(include_str!("../../data/defs.ron")).expect("data/defs.ron is checked by tests")
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use std::error::Error;

                  #[test]
                  fn shipped_file_is_valid() {
                      let defs = builtin();
                      assert_eq!(defs.monsters.len(), 2);
                      assert_eq!(defs.items.len(), 2);
                  }

                  const MIN: &str = r#"(monsters: [(name: "A", glyph: 'a', color: (r:1,g:2,b:3), hp: 5, power: 1, defense: 0, vision: 5, ai: Chaser)], items: [])"#;

                  #[test]
                  fn minimal_file_loads() {
                      assert!(Defs::from_ron(MIN).is_ok());
                  }

                  #[test]
                  fn missing_file_is_io_error_with_source() {
                      let err = Defs::load("/definitely/not/here.ron").unwrap_err();
                      assert!(matches!(err, DataError::Io(_)));
                      assert!(err.source().is_some());
                  }

                  #[test]
                  fn typo_is_parse_error() {
                      let err = Defs::from_ron(&MIN.replace("hp:", "hpp:")).unwrap_err();
                      assert!(matches!(err, DataError::Parse(_)));
                      assert!(err.source().is_some());
                  }

                  #[test]
                  fn negative_hp_is_invalid() {
                      let err = Defs::from_ron(&MIN.replace("hp: 5", "hp: -5")).unwrap_err();
                      match err {
                          DataError::Invalid { what, reason } => {
                              assert!(what.contains("\"A\""));
                              assert!(reason.contains("-5"));
                          }
                          other => panic!("expected Invalid, got {other:?}"),
                      }
                  }

                  #[test]
                  fn display_is_readable() {
                      let err = Defs::from_ron(&MIN.replace("hp: 5", "hp: 0")).unwrap_err();
                      assert_eq!(
                          err.to_string(),
                          "monster \"A\": hp must be positive (got 0)"
                      );
                  }

                  #[test]
                  fn unknown_effect_name_is_parse_error() {
                      let text = MIN.replace(
                          "items: []",
                          r#"items: [(name: "B", glyph: 'b', color: (r:1,g:2,b:3), effect: Explode(3), chance: 10)]"#,
                      );
                      let err = Defs::from_ron(&text).unwrap_err();
                      assert!(matches!(err, DataError::Parse(_)));
                  }

                  #[test]
                  fn duplicate_names_are_invalid() {
                      let monster = r#"(name: "A", glyph: 'a', color: (r:1,g:2,b:3), hp: 5, power: 1, defense: 0, vision: 5, ai: Chaser)"#;
                      let text = format!("(monsters: [{monster}, {monster}], items: [])");
                      let err = Defs::from_ron(&text).unwrap_err();
                      assert!(matches!(err, DataError::Invalid { .. }));
                  }
              }
          - path: rogue-core/src/entity.rs
            content: |
              use serde::{Deserialize, Serialize};

              /// 슬롯 번호와 세대 번호. 아무것도 빌리지 않는 그냥 숫자 두 개
              #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash, Serialize, Deserialize)]
              pub struct EntityId {
                  slot: u32,
                  generation: u32,
              }

              impl EntityId {
                  pub(crate) fn new(slot: u32, generation: u32) -> EntityId {
                      EntityId { slot, generation }
                  }

                  pub(crate) fn index(self) -> usize {
                      self.slot as usize
                  }

                  pub(crate) fn generation(self) -> u32 {
                      self.generation
                  }
              }

              #[derive(Serialize, Deserialize)]
              struct Slot {
                  generation: u32,
                  alive: bool,
              }

              /// 엔티티가 "존재하는가"만 관리한다. 데이터는 컴포넌트 저장소가 가진다
              #[derive(Default, Serialize, Deserialize)]
              pub struct Entities {
                  slots: Vec<Slot>,
                  free: Vec<u32>,
              }

              impl Entities {
                  pub fn spawn(&mut self) -> EntityId {
                      if let Some(slot) = self.free.pop()
                          && let Some(s) = self.slots.get_mut(slot as usize)
                      {
                          s.alive = true;
                          return EntityId::new(slot, s.generation);
                      }
                      let slot = u32::try_from(self.slots.len()).expect("슬롯 수가 u32 범위를 넘지 않는다");
                      self.slots.push(Slot {
                          generation: 0,
                          alive: true,
                      });
                      EntityId::new(slot, 0)
                  }

                  pub fn despawn(&mut self, id: EntityId) -> bool {
                      match self.slots.get_mut(id.index()) {
                          Some(s) if s.alive && s.generation == id.generation() => {
                              s.alive = false;
                              s.generation += 1;
                              self.free.push(id.slot);
                              true
                          }
                          _ => false,
                      }
                  }

                  pub fn is_alive(&self, id: EntityId) -> bool {
                      self.slots
                          .get(id.index())
                          .is_some_and(|s| s.alive && s.generation == id.generation())
                  }

                  /// 살아 있는 엔티티의 ID 들. 반환된 이터레이터는 self 를 빌린다
                  pub fn iter(&self) -> impl Iterator<Item = EntityId> + '_ {
                      self.slots.iter().enumerate().filter_map(|(i, s)| {
                          if s.alive {
                              Some(EntityId::new(u32::try_from(i).ok()?, s.generation))
                          } else {
                              None
                          }
                      })
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  #[test]
                  fn stale_id_is_not_alive_after_slot_reuse() {
                      let mut entities = Entities::default();
                      let a = entities.spawn();
                      assert!(entities.despawn(a));
                      let b = entities.spawn(); // 같은 슬롯
                      assert_ne!(a, b);
                      assert!(!entities.is_alive(a));
                      assert!(entities.is_alive(b));
                      assert!(!entities.despawn(a)); // A의 ID로 B를 지울 수 없다
                      assert!(entities.is_alive(b));
                  }

                  #[test]
                  fn iter_lists_living_only() {
                      let mut entities = Entities::default();
                      let a = entities.spawn();
                      let b = entities.spawn();
                      entities.despawn(a);
                      assert_eq!(entities.iter().collect::<Vec<_>>(), vec![b]);
                  }
              }
