      - message: "[2-2] game.rs — 몬스터가 ID 로 플레이어를 쫓는다"
        files:
          - path: rogue-core/src/game.rs
            content: |
              use crate::action::Action;
              use crate::arena::{Arena, Creature, EntityId};
              use crate::geom::{Dir, Point};
              use crate::map::Map;

              pub struct Game {
                  map: Map,
                  creatures: Arena,
                  player: EntityId,
              }

              impl Game {
                  pub fn new() -> Game {
                      let mut creatures = Arena::new();
                      let player = creatures.spawn(Creature {
                          pos: Point::new(15, 10),
                          hp: 20,
                          glyph: '@',
                          target: None,
                      });
                      for pos in [Point::new(5, 5), Point::new(24, 4), Point::new(20, 15)] {
                          creatures.spawn(Creature {
                              pos,
                              hp: 6,
                              glyph: 'g',
                              target: Some(player),
                          });
                      }
                      Game {
                          map: Map::room(30, 20),
                          creatures,
                          player,
                      }
                  }

                  pub fn map(&self) -> &Map {
                      &self.map
                  }

                  pub fn is_over(&self) -> bool {
                      self.creatures.get(self.player).is_none()
                  }

                  pub fn player_hp(&self) -> i32 {
                      self.creatures.get(self.player).map_or(0, |c| c.hp)
                  }

                  /// 화면에 그릴 (위치, 글자) 목록
                  pub fn glyphs(&self) -> Vec<(Point, char)> {
                      self.creatures
                          .ids()
                          .into_iter()
                          .filter_map(|id| self.creatures.get(id))
                          .map(|c| (c.pos, c.glyph))
                          .collect()
                  }

                  /// 행동 하나를 받아 게임을 한 턴 진행한다. core의 유일한 입구
                  pub fn step(&mut self, action: Action) {
                      if self.is_over() {
                          return;
                      }
                      self.perform(self.player, action);
                      self.monsters_act();
                  }

                  fn perform(&mut self, actor: EntityId, action: Action) {
                      let Action::Move(dir) = action else {
                          return; // Wait
                      };
                      let Some(from) = self.creatures.get(actor).map(|c| c.pos) else {
                          return;
                      };
                      let to = from.step(dir);
                      match self.creature_at(to) {
                          Some(other) => self.attack(actor, other),
                          None if self.map.is_walkable(to) => {
                              if let Some(c) = self.creatures.get_mut(actor) {
                                  c.pos = to;
                              }
                          }
                          None => {}
                      }
                  }

                  fn creature_at(&self, p: Point) -> Option<EntityId> {
                      self.creatures
                          .ids()
                          .into_iter()
                          .find(|&id| self.creatures.get(id).is_some_and(|c| c.pos == p))
                  }

                  fn attack(&mut self, attacker: EntityId, defender: EntityId) {
                      // 플레이어와 몬스터 사이에서만 싸운다 (몬스터끼리는 서로 막기만 한다)
                      if attacker != self.player && defender != self.player {
                          return;
                      }
                      let dead = match self.creatures.get_mut(defender) {
                          Some(c) => {
                              c.hp -= 1;
                              c.hp <= 0
                          }
                          None => false,
                      };
                      if dead {
                          self.creatures.despawn(defender);
                      }
                  }

                  fn monsters_act(&mut self) {
                      for id in self.creatures.ids() {
                          if id == self.player {
                              continue;
                          }
                          let Some(target) = self.creatures.get(id).and_then(|c| c.target) else {
                              continue;
                          };
                          // 대상이 이미 사라졌으면 None이 나온다
                          let Some(goal) = self.creatures.get(target).map(|c| c.pos) else {
                              continue;
                          };
                          let Some(from) = self.creatures.get(id).map(|c| c.pos) else {
                              continue;
                          };
                          self.perform(id, Action::Move(step_toward(from, goal)));
                      }
                  }
              }

              impl Default for Game {
                  fn default() -> Self {
                      Game::new()
                  }
              }

              /// 목표 쪽으로 한 칸 (거리가 먼 축 우선)
              fn step_toward(from: Point, to: Point) -> Dir {
                  let (dx, dy) = (to.x - from.x, to.y - from.y);
                  if dx.abs() >= dy.abs() {
                      if dx > 0 { Dir::Right } else { Dir::Left }
                  } else if dy > 0 {
                      Dir::Down
                  } else {
                      Dir::Up
                  }
              }
      - message: "[2-2] main.rs — glyphs() 로 그리기와 HP 표시"
        files:
          - path: rogue/src/main.rs
            content: |
              use macroquad::prelude::*;
              use rogue_core::{Action, Dir, Game, Point, Tile};

              const TILE: f32 = 24.0;

              fn tile_color(tile: Tile) -> Color {
                  match tile {
                      Tile::Wall => DARKGRAY,
                      Tile::Floor => Color::new(0.15, 0.15, 0.2, 1.0),
                  }
              }

              fn glyph_color(ch: char) -> Color {
                  match ch {
                      '@' => YELLOW,
                      'g' => GREEN,
                      _ => WHITE,
                  }
              }

              /// 이번 프레임에 눌린 키를 core의 행동으로 바꾼다
              fn read_action() -> Option<Action> {
                  if is_key_pressed(KeyCode::Up) {
                      Some(Action::Move(Dir::Up))
                  } else if is_key_pressed(KeyCode::Down) {
                      Some(Action::Move(Dir::Down))
                  } else if is_key_pressed(KeyCode::Left) {
                      Some(Action::Move(Dir::Left))
                  } else if is_key_pressed(KeyCode::Right) {
                      Some(Action::Move(Dir::Right))
                  } else if is_key_pressed(KeyCode::Space) {
                      Some(Action::Wait)
                  } else {
                      None
                  }
              }

              fn draw_glyph(p: Point, ch: char) {
                  draw_text(
                      ch.to_string(),
                      p.x as f32 * TILE + 5.0,
                      (p.y + 1) as f32 * TILE - 5.0,
                      TILE,
                      glyph_color(ch),
                  );
              }

              #[macroquad::main("Rogue")]
              async fn main() {
                  let mut game = Game::new();

                  loop {
                      if let Some(action) = read_action() {
                          game.step(action);
                      }

                      clear_background(BLACK);

                      let map = game.map();
                      for y in 0..map.height() {
                          for x in 0..map.width() {
                              if let Some(tile) = map.tile(Point::new(x, y)) {
                                  draw_rectangle(
                                      x as f32 * TILE,
                                      y as f32 * TILE,
                                      TILE - 1.0,
                                      TILE - 1.0,
                                      tile_color(tile),
                                  );
                              }
                          }
                      }

                      for (pos, ch) in game.glyphs() {
                          draw_glyph(pos, ch);
                      }

                      let hud = if game.is_over() {
                          "You died.".to_string()
                      } else {
                          format!("HP {}", game.player_hp())
                      };
                      draw_text(&hud, 10.0, map.height() as f32 * TILE + 24.0, 28.0, WHITE);

                      next_frame().await;
                  }
              }
  - id: 2-3
    title: 2-3. 컴포넌트 저장소와 제네릭
    doc: |
      # 2-3. 컴포넌트 저장소와 제네릭

      ### 만들 것

      엔티티의 데이터를 종류별로 나눠 저장하는 간단한 ECS. 화면은 그대로지만 "위치와 모양이 있는 것은 모두 그린다" 같은 코드가 가능해집니다.

      ### 요구사항

      **컴포넌트**

      - 엔티티 하나에 모든 걸 담는 큰 구조체 대신, 작은 구조체 여러 개로 나눕니다: 위치, 모양(글자와 색), 체력, 이름, 길을 막는가 표시, 플레이어 표시, 몬스터 표시 정도.
      - 색은 core 안에서 직접 정의한 RGB 구조체로 표현합니다. macroquad의 색 타입으로는 실행 파일 쪽에서 변환합니다.

      **제네릭 저장소**

      - 2-2의 저장소는 엔티티의 존재(슬롯과 세대)만 관리하게 바꾸고, 데이터는 컴포넌트별 저장소에 둡니다.
      - 컴포넌트 저장소 하나를 **타입 매개변수 하나를 받는 제네릭 구조체**로 만듭니다. 엔티티 슬롯 번호로 인덱싱되는 `Vec`이고, 각 칸은 "세대 번호와 값"이 있거나 비어 있습니다.
      - 메서드: 넣기, 불변 조회, 가변 조회, 빼기, 그리고 **살아 있는 모든 (ID, 값) 쌍을 순회하는 이터레이터**.
      - 월드 구조체는 엔티티 저장소 하나와, 컴포넌트 종류마다 이 제네릭 저장소 필드를 하나씩 가집니다.

      **이터레이터를 반환하기**

      - 순회 메서드의 반환 타입은 `impl Iterator<Item = ...>` 형태가 됩니다. 아이템이 저장소 안 값에 대한 참조라서, **반환된 이터레이터가 저장소를 빌리고 있다**는 사실을 시그니처에 적어야 합니다. 컴파일러가 수명을 요구하면 에러 메시지의 제안을 읽어 보세요. `'_`가 무엇을 뜻하는지가 이 단계의 핵심입니다.
      - 그리기 코드는 "위치 저장소를 순회하면서, 같은 ID의 모양이 있으면 그린다" 형태가 됩니다.

      ### 코드

      2-2 의 `arena.rs` 는 지우고 아래 파일로 나눕니다. 테스트는 `cargo test` 로 확인하세요.

      ▶ `rogue-core/src/entity.rs` — 재생에서 따라 칩니다

      ▶ `rogue-core/src/store.rs` — 재생에서 따라 칩니다

      <details><summary>힌트 1: 반환 타입의 수명</summary>

      이터레이터는 `self` 가 가진 `Vec` 을 빌려서 만든 것이라, 반환 타입이 **`&self` 의 수명에 묶여 있다는 말**이 시그니처에 있어야 합니다. 2021 edition 에서는 `+ '_` 를 직접 써야 하고, **이 가이드의 2024 edition 에서는 안 써도 컴파일됩니다.** 그래도 한 번 직접 붙여 써 보세요. 아래 "일부러 해볼 실수" 1번에서 이 차이를 확인합니다.

      </details>

      ▶ `rogue-core/src/comps.rs` — 재생에서 따라 칩니다

      ▶ `rogue-core/src/world.rs` — 재생에서 따라 칩니다

      `rogue-core/src/game.rs` 는 2-2 에서 `Arena` 대신 `World` 를 쓰도록 바꿉니다. 구조는 같고 `attack` 과 `monsters_act` 가 바뀝니다. `monsters_act` 는 몬스터 ID 들을 먼저 `Vec` 으로 모은 뒤(왜 먼저 모아야 할까?), 각자 target 의 위치를 조회해 `step_toward` 방향으로 `perform` 합니다. 조회가 `None` 이면(대상이 이미 사라짐) 그냥 건너뜁니다.

      ▶ `rogue-core/src/game.rs` — 재생에서 따라 칩니다

      ▶ `rogue-core/src/lib.rs` — 재생에서 따라 칩니다

      `rogue/src/main.rs` 는 `use rogue_core::{..., Rgb, ...}` 를 추가하고, 색 변환 함수와 그리기 루프를 바꿉니다. 위치와 모양이 둘 다 있는 것은 모두 그린다. 플레이어인지 몬스터인지는 묻지 않습니다. `draw_glyph` 는 `(p: Point, ch: char, color: Color)` 를 받도록 바꿉니다. 2-2 의 `glyph_color` 함수는 필요 없어집니다.

      ▶ `rogue/src/main.rs` — 재생에서 따라 칩니다

      ### 일부러 해볼 실수

      1. 순회 메서드의 반환 타입에서 수명 표기를 빼 보세요. **edition 2024 에서는 빼도 컴파일됩니다.** `Cargo.toml` 의 edition 을 "2021" 로 바꿔 보면 E0700(`captures lifetime that does not appear in bounds`) 이 나옵니다. 이 에러가 무엇을 요구하는지 읽고 `+ '_` 를 붙여 해결해 보세요. 2024 에서 달라진 점이 무엇인지 한 줄로 적습니다.
      1. 위치 저장소를 순회하는 도중에, 루프 안에서 **같은 위치 저장소를 가변으로** 조회해 보세요. 어떤 에러인가요? 2-1의 시도 2와 같은 상황인데, 이번엔 컴파일 타임에 잡힙니다.
      1. 반대로 위치 저장소를 순회하면서 **체력 저장소를 가변으로** 조회해 보세요. 이건 됩니다. 월드의 서로 다른 필드를 빌리는 것이기 때문입니다. 그런데 같은 일을 월드 전체를 가변으로 받는 메서드를 거쳐서 하면 다시 안 됩니다. 둘 다 해 보세요.

      ### 확인 기준

      - [ ] 플레이어와 몬스터가 같은 그리기 코드로 그려진다
      - [ ] 엔티티 종류별 분기(플레이어면 이렇게, 몬스터면 저렇게) 없이 그리기가 동작한다
      - [ ] 컴포넌트 저장소는 구현이 하나뿐이다 (컴포넌트마다 복사하지 않았다)

      ### 선택 도전

      - 컴포넌트 종류마다 필드를 추가하는 대신 `TypeId`를 키로 하는 맵에 `Box<dyn Any>`로 저장소를 담고, 꺼낼 때 다운캐스트 해 보세요. 편해지는 점과 잃는 점(컴파일 타임 보장)을 비교합니다.

      ### 이해 체크

      - 제네릭 저장소는 컴파일 후 몇 개의 구현이 생기는가? (단형화)
      - 월드의 메서드로 감싸면 왜 필드 단위 빌림이 안 되는가?

      ## 정답 노트에서

      - `+ '_` 는 "반환된 이터레이터가 `&self` 를 빌린 채로 산다"는 것을 드러내는 표시예요. 직접 지워 보면 알 수 있듯이, 이 `iter` 는 반환 타입 안에 `&T` 가 들어 있어서 지워도 컴파일돼요. 반면 `impl Iterator<Item = EntityId>` 처럼 반환 항목에 참조가 없는 경우는 edition 2021 에서 E0700 이 나요. edition 2024 에서는 `impl Trait` 가 인자의 수명을 기본으로 붙잡아서 이 에러 자체가 사라졌어요. 그래서 이 가이드의 코드에서 `+ '_` 는 "일부러 적어 둔 설명"에 가까워요.
      - `iter` 가 `Vec` 을 새로 만들어 돌려주지 않고 이터레이터를 돌려주는 이유: 호출하는 쪽이 `.filter`, `.map`, `.next()` 를 이어 붙이면 필요한 만큼만 계산해요.
      - `if let ... && let ...` (let-chain)은 edition 2024 에서 쓸 수 있어요.
