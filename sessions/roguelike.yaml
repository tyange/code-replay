      - message: "[5-2] bot.rs — 키보드 대신 입력을 고르는 봇"
        files:
          - path: rogue-sim/src/bot.rs
            content: |
              use rogue_core::{Action, Dir, Effect, Game, Input, Point, RunState, Tile, astar};

              /// 봇의 정책. 월드를 읽기만 하고 입력 하나를 고른다 (3-2 의 몬스터 AI 와 같은 모양).
              /// 입력이 필요 없는 상태(몬스터 차례, 층 생성 중, 게임오버)에서는 None
              pub fn choose(game: &Game) -> Option<Input> {
                  match game.state() {
                      RunState::AwaitingInput => Some(on_map(game)),
                      RunState::ShowInventory => Some(match heal_slot(game) {
                          Some(slot) => Input::Choose(slot),
                          None => Input::Cancel,
                      }),
                      RunState::Targeting { .. } => Some(Input::Cancel),
                      RunState::MonsterTurn | RunState::Generating | RunState::GameOver { .. } => None,
                  }
              }

              fn on_map(game: &Game) -> Input {
                  let world = game.world();
                  let Some(here) = world.positions.get(game.player()).map(|p| p.0) else {
                      return Input::Act(Action::Wait);
                  };
                  let hp = game.player_hp();
                  let max = world.healths.get(game.player()).map_or(1, |h| h.max);

                  // 1. 체력이 바닥나면 물약
                  if hp * 3 < max && heal_slot(game).is_some() {
                      return Input::OpenInventory;
                  }
                  // 2. 보이는 몬스터 중 가장 가까운 것과 싸운다
                  let nearest = world
                      .monsters
                      .iter()
                      .filter_map(|(id, _)| world.positions.get(id))
                      .map(|p| p.0)
                      .filter(|&p| game.can_see(p))
                      .min_by_key(|&p| p.dist2(here));
                  if let Some(target) = nearest
                      && let Some(step) = next_step(game, here, target)
                  {
                      return Input::Act(Action::Move(step));
                  }
                  // 3. 발밑의 아이템 줍기
                  let item_here = world
                      .items
                      .iter()
                      .any(|(id, _)| world.positions.get(id).is_some_and(|p| p.0 == here));
                  if item_here {
                      return Input::Act(Action::Pickup);
                  }
                  // 4. 계단으로
                  if game.map().tile(here) == Some(Tile::Stairs) {
                      return Input::Act(Action::Descend);
                  }
                  if let Some(stairs) = game.map().find(Tile::Stairs)
                      && let Some(step) = next_step(game, here, stairs)
                  {
                      return Input::Act(Action::Move(step));
                  }
                  Input::Act(Action::Wait)
              }

              /// to 로 가는 최단 경로의 첫 걸음 방향
              fn next_step(game: &Game, from: Point, to: Point) -> Option<Dir> {
                  let path = astar(game.map(), from, to)?;
                  Dir::between(from, *path.first()?)
              }

              /// 인벤토리에서 회복 물약이 몇 번째 칸인가
              fn heal_slot(game: &Game) -> Option<usize> {
                  game.inventory().position(|id| {
                      matches!(
                          game.world().items.get(id).map(|item| item.0),
                          Some(Effect::Heal(_))
                      )
                  })
              }
      - message: "[5-2] run.rs — 시드 하나로 한 판"
        files:
          - path: rogue-sim/src/run.rs
            content: |
              use std::sync::Arc;

              use rogue_core::{Defs, Game, RunState};

              use crate::bot;

              const MAX_TURNS: u32 = 2000;
              /// 입력 없이 도는 횟수까지 포함한 안전장치. 봇이 제자리에서 맴돌아도 끝나게 한다
              const MAX_STEPS: u32 = 50_000;

              #[derive(Debug, Clone, PartialEq, Eq)]
              /// 한 판이 끝난 이유
              pub enum Outcome {
                  Died(String),
                  TurnLimit,
              }

              #[derive(Debug, Clone, PartialEq, Eq)]
              /// 한 판의 결과
              pub struct RunResult {
                  pub depth: u32,
                  pub turns: u32,
                  pub kills: u32,
                  pub outcome: Outcome,
              }

              /// 시드 하나로 한 판을 끝까지(죽거나 상한에 닿을 때까지) 돌린다
              pub fn play_one(seed: u64, defs: &Arc<Defs>) -> RunResult {
                  let mut game = Game::new(seed, Arc::clone(defs));
                  let mut steps = 0;
                  let outcome = loop {
                      if let RunState::GameOver { cause } = game.state() {
                          break Outcome::Died(cause.clone()); // game 을 계속 쓰므로 이름은 복사한다
                      }
                      steps += 1;
                      if game.turns() >= MAX_TURNS || steps >= MAX_STEPS {
                          break Outcome::TurnLimit;
                      }
                      let input = bot::choose(&game);
                      game.update(input);
                      if game.state() == &RunState::Generating {
                          std::thread::yield_now(); // 층 생성 스레드가 일할 틈을 준다
                      }
                  };
                  RunResult {
                      depth: game.depth(),
                      turns: game.turns(),
                      kills: game.kills(),
                      outcome,
                  }
              }
      - message: "[5-2] stats.rs — 순서와 무관하게 합쳐지는 통계"
        files:
          - path: rogue-sim/src/stats.rs
            content: |
              use std::collections::BTreeMap;
              use std::fmt;

              use crate::run::{Outcome, RunResult};

              /// 여러 판의 통계. 합계와 최댓값만 가져서, 어떤 순서로 더하고 합쳐도 같은 값이 된다
              #[derive(Debug, Default, Clone, PartialEq, Eq)]
              pub struct Stats {
                  pub games: u64,
                  pub total_depth: u64,
                  pub max_depth: u32,
                  pub total_turns: u64,
                  pub total_kills: u64,
                  pub turn_limit: u64,
                  /// 사망 원인별 횟수. 출력 순서가 일정하도록 BTreeMap 을 쓴다
                  pub deaths: BTreeMap<String, u64>,
              }

              impl Stats {
                  pub fn add(&mut self, r: &RunResult) {
                      self.games += 1;
                      self.total_depth += u64::from(r.depth);
                      self.max_depth = self.max_depth.max(r.depth);
                      self.total_turns += u64::from(r.turns);
                      self.total_kills += u64::from(r.kills);
                      match &r.outcome {
                          Outcome::Died(cause) => *self.deaths.entry(cause.clone()).or_default() += 1,
                          Outcome::TurnLimit => self.turn_limit += 1,
                      }
                  }

                  /// 두 통계를 하나로. map-reduce 의 reduce 단계
                  pub fn merge(mut self, other: Stats) -> Stats {
                      self.games += other.games;
                      self.total_depth += other.total_depth;
                      self.max_depth = self.max_depth.max(other.max_depth);
                      self.total_turns += other.total_turns;
                      self.total_kills += other.total_kills;
                      self.turn_limit += other.turn_limit;
                      for (cause, n) in other.deaths {
                          *self.deaths.entry(cause).or_default() += n;
                      }
                      self
                  }
              }

              /// 평균 표시용. 판 수가 0 이면 0
              fn average(total: u64, games: u64) -> f64 {
                  if games == 0 {
                      return 0.0;
                  }
                  // 표시용 평균이라 아주 큰 수에서 정밀도가 조금 줄어도 상관없다
                  total as f64 / games as f64
              }

              impl fmt::Display for Stats {
                  fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
                      writeln!(f, "games            {}", self.games)?;
                      writeln!(
                          f,
                          "avg depth        {:.2}",
                          average(self.total_depth, self.games)
                      )?;
                      writeln!(f, "max depth        {}", self.max_depth)?;
                      writeln!(
                          f,
                          "avg turns        {:.1}",
                          average(self.total_turns, self.games)
                      )?;
                      writeln!(
                          f,
                          "avg kills        {:.2}",
                          average(self.total_kills, self.games)
                      )?;
                      writeln!(f, "hit turn limit   {}", self.turn_limit)?;
                      for (cause, n) in &self.deaths {
                          writeln!(f, "killed by {cause:<9}{n}")?;
                      }
                      Ok(())
                  }
              }
      - message: "[5-2] sim.rs — 순차, scoped 두 가지, rayon"
        files:
          - path: rogue-sim/src/sim.rs
            content: |
              use std::sync::{Arc, Mutex};
              use std::thread;

              use rayon::prelude::*;
              use rogue_core::Defs;

              use crate::run::play_one;
              use crate::stats::Stats;

              /// 시드 0 부터 차례로 한 판씩
              pub fn sequential(games: u64, defs: &Arc<Defs>) -> Stats {
                  let mut stats = Stats::default();
                  for seed in 0..games {
                      stats.add(&play_one(seed, defs));
                  }
                  stats
              }

              /// scoped thread + 공유 통계 하나를 Mutex 로 보호
              pub fn scoped_mutex(games: u64, defs: &Arc<Defs>, threads: u64) -> Stats {
                  let shared = Arc::new(Mutex::new(Stats::default()));
                  thread::scope(|scope| {
                      for t in 0..threads {
                          let shared = Arc::clone(&shared);
                          scope.spawn(move || {
                              for seed in (t..games).step_by(threads as usize) {
                                  let result = play_one(seed, defs); // 잠그기 전에 계산한다
                                  if let Ok(mut stats) = shared.lock() {
                                      stats.add(&result);
                                  }
                              }
                          });
                      }
                  });
                  match Arc::try_unwrap(shared) {
                      Ok(mutex) => mutex.into_inner().unwrap_or_default(),
                      Err(_) => Stats::default(), // scope 가 끝났으니 다른 소유자는 없다
                  }
              }

              /// 각 스레드가 자기 통계를 만들어 돌려주고, 마지막에 합친다 (map-reduce)
              pub fn scoped_map_reduce(games: u64, defs: &Arc<Defs>, threads: u64) -> Stats {
                  thread::scope(|scope| {
                      let handles: Vec<_> = (0..threads)
                          .map(|t| {
                              scope.spawn(move || {
                                  let mut stats = Stats::default();
                                  for seed in (t..games).step_by(threads as usize) {
                                      stats.add(&play_one(seed, defs));
                                  }
                                  stats
                              })
                          })
                          .collect();
                      handles
                          .into_iter()
                          .filter_map(|h| h.join().ok())
                          .fold(Stats::default(), Stats::merge)
                  })
              }

              /// rayon. 순차 버전과 거의 같은 모양이다
              pub fn parallel(games: u64, defs: &Arc<Defs>) -> Stats {
                  (0..games)
                      .into_par_iter()
                      .map(|seed| {
                          let mut stats = Stats::default();
                          stats.add(&play_one(seed, defs));
                          stats
                      })
                      .reduce(Stats::default, Stats::merge)
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  fn defs() -> Arc<Defs> {
                      Arc::new(Defs::load("../data/defs.ron").expect("run tests from the rogue-sim folder"))
                  }

                  #[test]
                  fn every_method_gives_identical_statistics() {
                      let defs = defs();
                      let n = 40;
                      let baseline = sequential(n, &defs);
                      assert_eq!(baseline.games, n);
                      for threads in [1, 2, 3, 7] {
                          assert_eq!(
                              scoped_mutex(n, &defs, threads),
                              baseline,
                              "mutex x{threads}"
                          );
                          assert_eq!(
                              scoped_map_reduce(n, &defs, threads),
                              baseline,
                              "map-reduce x{threads}"
                          );
                      }
                      assert_eq!(parallel(n, &defs), baseline, "rayon");
                  }

                  #[test]
                  fn same_seed_same_result() {
                      let defs = defs();
                      assert_eq!(play_one(3, &defs), play_one(3, &defs));
                  }

                  #[test]
                  fn the_bot_gets_somewhere() {
                      let defs = defs();
                      let stats = sequential(30, &defs);
                      assert!(stats.total_depth > 0, "bot never left the first floor");
                  }
              }
      - message: "[5-2] main.rs — 시뮬레이션 실행과 시간 비교"
        files:
          - path: rogue-sim/src/main.rs
            content: |
              mod bot;
              mod run;
              mod sim;
              mod stats;

              use std::error::Error;
              use std::process::ExitCode;
              use std::sync::Arc;
              use std::time::Instant;

              use rogue_core::Defs;

              use crate::stats::Stats;

              /// 한 방식을 돌려 걸린 시간과, 통계가 순차 결과와 같은지를 한 줄로 보여 준다
              fn report(name: &str, baseline: &Stats, run: impl FnOnce() -> Stats) {
                  let started = Instant::now();
                  let stats = run();
                  let elapsed = started.elapsed().as_secs_f64();
                  let verdict = if &stats == baseline {
                      "statistics same"
                  } else {
                      "DIFFERENT"
                  };
                  println!("{name:<24}{elapsed:>8.2}s   {verdict}");
              }

              fn main() -> ExitCode {
                  let games: u64 = std::env::args()
                      .nth(1)
                      .and_then(|arg| arg.parse().ok())
                      .unwrap_or(1000);

                  // rogue-sim 폴더에서 실행하므로 저장소 루트의 data 폴더는 한 단계 위에 있다
                  let defs = match Defs::load("../data/defs.ron") {
                      Ok(defs) => Arc::new(defs),
                      Err(err) => {
                          eprintln!("error: {err}");
                          let mut source = err.source();
                          while let Some(cause) = source {
                              eprintln!("caused by: {cause}");
                              source = cause.source();
                          }
                          return ExitCode::FAILURE;
                      }
                  };
                  let threads =
                      std::thread::available_parallelism().map_or(4, |n| u64::try_from(n.get()).unwrap_or(4));

                  let started = Instant::now();
                  let baseline = sim::sequential(games, &defs);
                  let elapsed = started.elapsed().as_secs_f64();
                  println!("{baseline}");
                  println!("{:<24}{elapsed:>8.2}s", "sequential");

                  report("scoped + Arc<Mutex>", &baseline, || {
                      sim::scoped_mutex(games, &defs, threads)
                  });
                  report("scoped + map-reduce", &baseline, || {
                      sim::scoped_map_reduce(games, &defs, threads)
                  });
                  report("rayon", &baseline, || sim::parallel(games, &defs));
                  println!("({threads} threads)");

                  ExitCode::SUCCESS
              }
  - id: "6"
    title: 6. 정리
    doc: |
      # 6. 정리

      ### 할 일

      1. 세 패키지 폴더에서 각각 `cargo clippy`를 실행해 모두 경고 0개. 여유가 있으면 `clippy::pedantic`을 한 번 켜서 읽어 보고, 동의하는 것만 고칩니다.
      1. 각 패키지에서 `cargo fmt`, `cargo test`.
      1. core의 공개 항목(`pub`)에 문서 주석을 달고 `cargo doc --open`으로 확인합니다. 무엇을 공개했는지 한눈에 보이면 0단계의 경계 설계를 점검할 수 있습니다.
      1. 2-1, 3-2의 실패 브랜치와 `LEARNING.md` 기록을 다시 읽습니다.

      ▶ `rogue-core/src/lib.rs` (크레이트 문서 주석) — 재생에서 따라 칩니다

      ▶ `rogue-core/src/game.rs` (공개 메서드 문서 주석) — 재생에서 따라 칩니다

      ### 점검 목록

      - [ ] clippy 경고 0개, 테스트 전부 통과
      - [ ] core가 macroquad에 의존하지 않는다
      - [ ] core에 `unwrap`이 없고, `expect`마다 이유가 적혀 있다
      - [ ] `clone()`마다 이유 주석이 있다
      - [ ] 엔티티끼리 참조나 `Rc`로 엮인 곳이 없다
      - [ ] 같은 시드 → 같은 결과가 게임과 시뮬레이션 모두에서 성립한다

      ### 통과 질문 (문서 없이 답할 수 있는가)

      1. 엔티티끼리 참조로 엮는 설계는 러스트에서 왜 막히고, ID 기반 설계는 그 문제를 어디로 옮기는가?
      1. `impl Iterator + '_`에서 `'_`는 무엇을 말하는가? 생략하면 컴파일러는 무엇을 가정하는가?
      1. 같은 구조체의 두 필드를 동시에 가변으로 빌릴 수 있는데, 메서드를 거치면 왜 안 되는가?
      1. enum과 `dyn` 트레이트 중 무엇을 고를지 결정하는 기준 두 가지는?
      1. 재귀 enum에 `Box`가 필요한 이유는?
      1. 라이브러리에서 직접 정의한 에러 enum을 쓰는 이유와, `?`가 동작하는 원리는?
      1. `Send`, `Sync`, `'static`을 각각 설명하고, `Rc`와 `RefCell`이 각각 어느 것을 만족하지 않는지 말하라.
      1. 이벤트 큐, 채널, map-reduce의 공통점은 무엇인가?

      ## 막혔을 때

      | 증상 | 의심할 것 |
      | --- | --- |
      | 수명 매개변수가 여기저기 번진다 | 구조체에 참조를 담았는지. 대부분 ID나 소유한 값으로 바꾸면 사라집니다 |
      | `cannot borrow ... as mutable more than once` | 같은 저장소를 순회하면서 수정하는지. 먼저 꺼내기, 이벤트 큐, 필드 단위로 빌리기 중 하나 |
      | 월드 메서드 안에서만 빌림 에러 | `&mut self` 전체를 빌리고 있는지. 필드를 직접 빌리는 자유 함수로 쪼개 보세요 |
      | `already borrowed` 패닉 | `RefCell`이 남아 있는지. 2-1 브랜치의 코드가 섞였을 수 있습니다 |
      | 길찾기가 이상한 경로를 낸다 | `Ord` 구현의 비교 방향, 최대 힙인지, 필드 순서 |
      | `the trait bound ... is not satisfied` (serde) | 제네릭 저장소의 타입 매개변수 조건, 중첩된 타입 중 derive가 빠진 것 |
      | `cannot be sent between threads safely` | 월드나 정의 목록 안의 `Rc`, `RefCell`, 트레이트 객체 |
      | `borrowed value does not live long enough` (스레드) | `thread::spawn`에 참조를 넘겼는지. 값을 옮기거나 `Arc`, 또는 `thread::scope` |
      | 스레드 수에 따라 결과가 다르다 | 전역 난수, 순서에 의존하는 합치기 연산 |

      ## 다 만든 뒤에

      - 3-3의 길찾기를 매 턴 계산하지 않고 경로를 캐시해 보세요. 캐시가 무효화되는 조건을 설계하는 것이 생각보다 어렵습니다.
      - 몬스터나 아이템 효과를 작은 스크립트 언어로 정의하게 만들면 렉서, 파서, 수명 붙은 토큰이 다시 등장합니다. 인터프리터 프로젝트로 넘어가는 다리로 좋습니다.
      - 막혔던 지점과 해결법을 `LEARNING.md` 진행 로그에 정리하세요.

      ## 참고 자료

      - Macroquad API 문서: https://docs.rs/macroquad/0.4.16/macroquad/
      - Roguelike Tutorial in Rust (Herbert Wolverson): https://bfnightly.bracketproductions.com/ — 기존 ECS 라이브러리와 bracket-lib을 씁니다. 코드를 따라 치지 말고 각 장의 **게임 규칙과 알고리즘 설명만** 참고하세요.
      - Red Blob Games, A* 소개: https://www.redblobgames.com/pathfinding/a-star/introduction.html
      - Symmetric Shadowcasting (시야 계산의 더 나은 방법, 선택): https://www.albertford.com/shadowcasting/
      - RogueBasin (BSP 던전 등 로그라이크 기법 모음): https://www.roguebasin.com/
      - serde 문서: https://serde.rs/
      - The Rustonomicon의 Send와 Sync 장, 그리고 Rust Book의 동시성 장 (16장)

      ## 정답 노트에서

      가이드 전체를 마친 뒤의 점검:

      - `rogue-core` 에서 `cargo test` (78개), `cargo clippy --all-targets` 경고 0.
      - `rogue-sim` 에서 `cargo test` (3개). `../data/defs.ron` 을 읽으므로 반드시 `rogue-sim` 폴더 안에서 실행해요.
      - `rogue` 에서 `cargo run` 으로 창이 뜨면 이동, 전투, 아이템 사용, 계단 내려가기, 저장/불러오기를 직접 한 번씩 해 보세요. 이 부분은 자동 테스트가 아니라 눈으로 확인하는 영역이에요.
