      - message: "[4] eval.rs — 유형별 점수를 모으는 평가 러너"
        files:
          - path: mnemo-core/src/eval.rs
            content: |
              use std::collections::BTreeMap;

              use serde::Deserialize;

              use crate::db::{Db, Result};
              use crate::search::Retriever;

              /// 평가 파일(JSON 배열)의 한 항목.
              #[derive(Debug, Clone, Deserialize)]
              pub struct Question {
                  pub q: String,
                  /// 정답 항목 id들. 정답 없음 유형은 빈 배열.
                  pub answers: Vec<i64>,
                  /// 유형 태그 (direct, paraphrase, ...)
                  pub tag: String,
                  /// 봉인 세트 여부. 기본 eval 에서는 제외된다.
                  #[serde(default)]
                  pub sealed: bool,
                  #[serde(default)]
                  pub note: String,
              }

              pub fn load_questions(json: &str) -> std::result::Result<Vec<Question>, serde_json::Error> {
                  serde_json::from_str(json)
              }

              /// 정답 id 가 DB 에 실제로 있는지 확인한다. 없는 (질문, id) 목록을 돌려준다.
              pub fn missing_answers(db: &Db, qs: &[Question]) -> Result<Vec<(String, i64)>> {
                  let mut missing = Vec::new();
                  for q in qs {
                      for &id in &q.answers {
                          if db.get(id)?.is_none() {
                              missing.push((q.q.clone(), id));
                          }
                      }
                  }
                  Ok(missing)
              }

              /// 상위 k개 안에 든 정답의 비율. 정답이 없는 질문은 None.
              pub fn recall_at_k(ranked: &[i64], answers: &[i64], k: usize) -> Option<f64> {
                  if answers.is_empty() {
                      return None;
                  }
                  let hit = answers.iter().filter(|a| ranked.iter().take(k).any(|r| r == *a)).count();
                  Some(hit as f64 / answers.len() as f64)
              }

              /// 첫 정답 순위의 역수. 못 찾으면 0, 정답이 없는 질문은 None.
              pub fn reciprocal_rank(ranked: &[i64], answers: &[i64]) -> Option<f64> {
                  if answers.is_empty() {
                      return None;
                  }
                  let pos = ranked.iter().position(|r| answers.contains(r));
                  Some(pos.map_or(0.0, |p| 1.0 / (p as f64 + 1.0)))
              }

              #[derive(Debug, Default, Clone)]
              pub struct Row {
                  pub n: usize,
                  pub recall3: f64,
                  pub recall5: f64,
                  pub mrr: f64,
                  /// 정답 없음 질문 중 아무것도 안 돌려준 비율 (정답 없음 질문이 없으면 None)
                  pub empty_rate: Option<f64>,
              }

              #[derive(Debug, Default)]
              pub struct Report {
                  pub overall: Row,
                  pub by_tag: BTreeMap<String, Row>,
              }

              /// 질문들의 결과를 모아서 평균을 내는 상자.
              #[derive(Default)]
              struct Acc {
                  n: usize,
                  scored: usize, // 정답이 있는 질문 수
                  r3: f64,
                  r5: f64,
                  rr: f64,
                  no_answer: usize, // 정답 없음 질문 수
                  empty: usize,     // 그중 아무것도 안 돌려준 수
              }

              impl Acc {
                  fn add(&mut self, ranked: &[i64], answers: &[i64]) {
                      self.n += 1;
                      match (recall_at_k(ranked, answers, 3), recall_at_k(ranked, answers, 5), reciprocal_rank(ranked, answers)) {
                          (Some(a), Some(b), Some(c)) => {
                              self.scored += 1;
                              self.r3 += a;
                              self.r5 += b;
                              self.rr += c;
                          }
                          _ => {
                              self.no_answer += 1;
                              if ranked.is_empty() {
                                  self.empty += 1;
                              }
                          }
                      }
                  }

                  fn finish(&self) -> Row {
                      let avg = |x: f64| if self.scored == 0 { 0.0 } else { x / self.scored as f64 };
                      Row {
                          n: self.n,
                          recall3: avg(self.r3),
                          recall5: avg(self.r5),
                          mrr: avg(self.rr),
                          empty_rate: (self.no_answer > 0).then(|| self.empty as f64 / self.no_answer as f64),
                      }
                  }
              }

              /// 질문마다 검색을 돌려 전체와 유형별 점수를 모은다.
              pub async fn run_eval(retriever: &impl Retriever, qs: &[Question], include_sealed: bool) -> anyhow::Result<Report> {
                  let mut overall = Acc::default();
                  let mut by_tag: BTreeMap<String, Acc> = BTreeMap::new();

                  for q in qs.iter().filter(|q| include_sealed || !q.sealed) {
                      let ranked: Vec<i64> = retriever.search(&q.q, 5).await?.into_iter().map(|s| s.id).collect();
                      overall.add(&ranked, &q.answers);
                      by_tag.entry(q.tag.clone()).or_default().add(&ranked, &q.answers);
                  }

                  Ok(Report {
                      overall: overall.finish(),
                      by_tag: by_tag.into_iter().map(|(k, v)| (k, v.finish())).collect(),
                  })
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  #[test]
                  fn recall_and_mrr() {
                      let ranked = [7, 3, 9, 1];
                      assert_eq!(recall_at_k(&ranked, &[3, 1], 3), Some(0.5));
                      assert_eq!(recall_at_k(&ranked, &[3, 1], 5), Some(1.0));
                      assert_eq!(reciprocal_rank(&ranked, &[9]), Some(1.0 / 3.0));
                      assert_eq!(reciprocal_rank(&ranked, &[42]), Some(0.0));
                      assert_eq!(recall_at_k(&ranked, &[], 3), None);
                      assert_eq!(reciprocal_rank(&ranked, &[]), None);
                  }

                  #[test]
                  fn parses_question_file() {
                      let json = r#"[
                          {"q": "배포는 언제 안 하기로 했지", "answers": [3], "tag": "direct"},
                          {"q": "우주선 연료는", "answers": [], "tag": "no_answer", "sealed": true}
                      ]"#;
                      let qs = load_questions(json).unwrap();
                      assert_eq!(qs.len(), 2);
                      assert!(qs[1].sealed && qs[1].answers.is_empty());
                  }
              }
      - message: "[4] main.rs — async main, search 와 eval 명령"
        files:
          - path: mnemo-cli/src/main.rs
            content: |
              use std::fs;
              use std::path::PathBuf;

              use anyhow::{Context, Result, bail};
              use clap::{Parser, Subcommand};
              use mnemo_core::search::{FtsRetriever, Retriever};
              use mnemo_core::{Db, Item, Kind, NewItem, Status, eval, import};

              #[derive(Parser)]
              #[command(version, about = "내 지식 DB")]
              struct Cli {
                  /// DB 파일 경로 (옵션 > MNEMO_DB 환경변수 > ./mnemo.db)
                  #[arg(long, env = "MNEMO_DB", default_value = "mnemo.db", global = true)]
                  db: PathBuf,

                  #[command(subcommand)]
                  cmd: Cmd,
              }

              #[derive(Subcommand)]
              enum Cmd {
                  /// 항목 하나 추가
                  Add {
                      /// project / pref / work
                      kind: Kind,
                      /// 프로젝트 이름 또는 global
                      scope: String,
                      /// 본문 (사실 하나)
                      body: String,
                      /// 이유
                      #[arg(long)]
                      why: Option<String>,
                  },
                  /// 항목 목록
                  List {
                      #[arg(long)]
                      kind: Option<Kind>,
                      #[arg(long)]
                      scope: Option<String>,
                      #[arg(long, default_value = "active")]
                      status: Status,
                  },
                  /// 항목 하나를 자세히
                  Get { id: i64 },
                  /// 텍스트 파일에서 한 줄에 하나씩 가져오기
                  Import { file: PathBuf },
                  /// 평가 파일의 정답 id가 DB에 다 있는지 확인
                  EvalCheck { file: PathBuf },
                  /// 질문으로 검색
                  Search {
                      query: String,
                      #[arg(short, default_value_t = 5)]
                      k: usize,
                  },
                  /// 평가 세트로 점수 내기 (봉인 문항은 기본 제외)
                  Eval {
                      #[arg(default_value = "eval.json")]
                      file: PathBuf,
                      /// 봉인 문항도 포함 (Stage 7 마지막에 딱 한 번만!)
                      #[arg(long)]
                      include_sealed: bool,
                  },
              }

              #[tokio::main]
              async fn main() -> Result<()> {
                  let cli = Cli::parse();
                  let db = Db::open(&cli.db).with_context(|| format!("{} 을 열지 못했어요", cli.db.display()))?;

                  match cli.cmd {
                      Cmd::Add { kind, scope, body, why } => {
                          let id = db.insert(&NewItem { kind, scope, body, why, source: "manual".into() })?;
                          println!("추가됨: #{id}");
                      }
                      Cmd::List { kind, scope, status } => {
                          for it in db.list(kind, scope.as_deref(), status)? {
                              println!("#{:<4} [{}/{}] {}", it.id, it.kind.as_str(), it.scope, it.body);
                          }
                      }
                      Cmd::Get { id } => match db.get(id)? {
                          Some(it) => print_item(&it),
                          None => bail!("#{id} 항목이 없어요"),
                      },
                      Cmd::Import { file } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          match import::parse_lines(&text) {
                              Ok(items) => {
                                  let n = db.insert_many(&items)?;
                                  println!("{n}개를 가져왔어요");
                              }
                              Err(errors) => {
                                  for (line, msg) in &errors {
                                      eprintln!("{}:{line}: {msg}", file.display());
                                  }
                                  bail!("{}줄에 문제가 있어서 아무것도 넣지 않았어요", errors.len());
                              }
                          }
                      }
                      Cmd::EvalCheck { file } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          let qs = eval::load_questions(&text).context("평가 파일 형식이 잘못됐어요")?;
                          let missing = eval::missing_answers(&db, &qs)?;
                          for (q, id) in &missing {
                              eprintln!("정답 id #{id} 가 DB에 없어요: {q}");
                          }
                          if !missing.is_empty() {
                              bail!("{}건의 정답 id를 고치세요", missing.len());
                          }
                          let sealed = qs.iter().filter(|q| q.sealed).count();
                          println!("질문 {}개 (봉인 {}개), 정답 id 모두 확인됨", qs.len(), sealed);
                      }
                      Cmd::Search { query, k } => {
                          let retriever = FtsRetriever { db: &db };
                          for (i, hit) in retriever.search(&query, k).await?.iter().enumerate() {
                              if let Some(it) = db.get(hit.id)? {
                                  println!("{:>2}) [{}/{}] {}  ({:.2})", i + 1, it.kind.as_str(), it.scope, it.body, hit.score);
                              }
                          }
                      }
                      Cmd::Eval { file, include_sealed } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          let qs = eval::load_questions(&text).context("평가 파일 형식이 잘못됐어요")?;
                          let report = eval::run_eval(&FtsRetriever { db: &db }, &qs, include_sealed).await?;

                          println!("{:<14} {:>3} {:>9} {:>9} {:>7}", "유형", "n", "Recall@3", "Recall@5", "MRR");
                          let line = |name: &str, r: &eval::Row| {
                              println!("{:<14} {:>3} {:>9.2} {:>9.2} {:>7.2}", name, r.n, r.recall3, r.recall5, r.mrr);
                              if let Some(e) = r.empty_rate {
                                  println!("{:<14}     (정답 없음 중 빈 결과 비율 {:.2})", "", e);
                              }
                          };
                          line("전체", &report.overall);
                          for (tag, row) in &report.by_tag {
                              line(tag, row);
                          }
                      }
                  }
                  Ok(())
              }

              fn print_item(it: &Item) {
                  println!("id         {}", it.id);
                  println!("kind       {}", it.kind.as_str());
                  println!("scope      {}", it.scope);
                  println!("body       {}", it.body);
                  println!("why        {}", it.why.as_deref().unwrap_or("-"));
                  println!("source     {}", it.source);
                  println!("status     {}", it.status.as_str());
                  println!("created_at {} (UTC 초)", it.created_at);
              }
  - id: "5"
    title: 임베딩
    doc: |
      # 임베딩

      **목표:** 항목을 벡터로 바꿔 DB에 저장한다. 외부 API든 로컬 모델이든 **바꿔 끼울 수 있게** 만든다.

      **새로 배우는 것:** `async`/`await`, `tokio`, `reqwest`, trait 설계(`Embedder`), 재시도와 타임아웃, `f32` 벡터의 BLOB 직렬화, 멱등한 배치 작업

      > 이 Stage는 Rust 난이도가 처음으로 올라가요(★★★). RAG 개념은 쉬워요. '글을 숫자 배열로 바꿔 저장한다'가 전부예요. 막히는 건 거의 다 async와 에러 처리일 거예요. 그 둘을 메모에서 분리해 두세요.

      ### 5-1. 요구사항

      - [ ] `Embedder` trait를 정의한다. 문자열 여러 개를 받아 벡터 여러 개를 돌려주고, **벡터 차원 수**와 **모델 식별자**를 알려줄 수 있어야 한다.
      - [ ] 구현을 둘 만든다. (1) Stage 0에서 고른 실제 제공자용, (2) **가짜 임베더**. 가짜는 같은 입력이면 항상 같은 벡터가 나오는 결정적인 방식으로. 왜 가짜가 필요한지는 Stage 8에서 알게 돼요.
      - [ ] API 키는 **환경변수로만** 받는다. 코드, DB, 로그, 에러 메시지 어디에도 키가 찍히면 안 된다.
      - [ ] 한 번에 한 개씩이 아니라 **배치**로 요청한다. 배치 크기 제한은 제공자 문서를 확인한다.
      - [ ] 429(속도 제한)와 5xx 에러에는 **지수 백오프로 재시도**하고, 최대 횟수와 타임아웃을 둔다. 4xx 중 재시도해도 소용없는 에러는 바로 실패시킨다.
      - [ ] `embeddings` 테이블을 만든다. 항목 id, **모델 식별자**, 차원 수, 벡터(BLOB), 생성 시각.
      - [ ] `mnemo embed` 명령: 아직 임베딩이 없는 항목만 처리한다. **여러 번 실행해도 안전**해야 한다(멱등).
      - [ ] 항목의 본문이 바뀌면 그 항목의 임베딩이 무효가 되게 한다.
      - [ ] 외부 API로 **몇 개의 항목이 나갔는지**만 로그에 남긴다. 본문은 남기지 않는다.

      <details><summary>힌트 1: 어떤 텍스트를 임베딩할까</summary>

      - 본문만 넣을지, 본문과 이유를 합칠지, 종류나 범위를 앞에 붙일지는 검색 품질에 영향을 줘요. 지금 정해도 좋고, 일단 본문만으로 시작해서 Stage 7에서 실험해 봐도 좋아요. 어느 쪽이든 결정 로그에 적으세요.

      </details>

      <details><summary>힌트 2: 벡터를 BLOB으로</summary>

      - `f32` 배열을 바이트열로 바꿔 저장하고 다시 읽을 수 있어야 해요. 바이트 순서(엔디언)를 정해서 일관되게 쓰고, 읽을 때 **길이가 차원 수의 4배인지 검증**하세요. 어긋나면 조용히 이상한 값이 나와요.
      - 직렬화 라이브러리를 쓰기 전에, 한 번은 손으로 바꿔 보는 걸 권해요.

      </details>

      <details><summary>힌트 3: 제공자 확인 사항</summary>

      - 문서와 검색용 임베딩을 **구분해서 요청하는** 모델이 있어요(입력 종류 지정 옵션). 질문은 질문으로, 항목은 문서로 임베딩해야 하는 모델인지 확인하세요.
      - Anthropic은 자체 임베딩 모델을 제공하지 않는 것으로 알고 있어요. 제공자는 직접 문서에서 확인하세요.

      </details>

      <details><summary>힌트 4: async가 막힐 때</summary>

      - 첫 목표는 '요청 하나 보내고 응답 하나 파싱하기'예요. 배치, 재시도는 그다음이에요.
      - 재시도는 '실패한 요청만 다시' 하는 작은 함수로 분리하면 테스트하기 쉬워요.

      </details>

      ### 단계별 코드

      원래 가이드에서는 `bytes_to_vec`, `retry`, `HttpEmbedder::once`, `embed_missing` 의 저장 부분 네 곳이 숙제였어요(권장 순서: `bytes_to_vec` → `embed_missing` → `retry` → `once`). 여기서는 정답 노트의 답까지 채운 완성본을 칩니다.

      **1) 의존성**

      ```
      cd mnemo-core
      cargo add reqwest --features json
      cargo add tokio --features rt,macros,time
      cd ..
      ```

      (`serde_json` 은 Stage 1에서 이미 넣었어요.)

      ▶ `mnemo-core/Cargo.toml` — 재생에서 따라 칩니다

      **2) mnemo-core/src/db.rs** — `MIGRATIONS` 에 세 번째 항목 추가

      (앞 항목의 끝 `"#,` 뒤에 이어 붙이고, 배열의 마지막 `"#];` 로 닫아요.)

      ▶ `mnemo-core/src/db.rs` — 재생에서 따라 칩니다

      **3) mnemo-core/src/lib.rs** 에 `pub mod embed;` 추가. (`db.rs` 의 `now_secs()` 는 이미 `pub` 이에요.)

      ▶ `mnemo-core/src/lib.rs` — 재생에서 따라 칩니다

      **4) mnemo-core/src/embed.rs**

      ▶ `mnemo-core/src/embed.rs` — 재생에서 따라 칩니다

      **5) mnemo-cli/src/main.rs** — 임베더를 고르는 작은 enum(`AnyEmbedder`)과 `embed` 명령

      ▶ `mnemo-cli/src/main.rs` — 재생에서 따라 칩니다

      **한 줄씩 이해하기**

      - `vec_to_bytes` 는 `to_le_bytes()` 로 각 `f32` 를 **리틀 엔디언** 4바이트로 바꿔서 이어 붙여요. 읽을 때도 같은 순서로 되돌려야 해요. 길이 검증(`dim * 4`)을 `bytes_to_vec` 에 넣는 이유는 어긋난 BLOB 이 조용히 이상한 숫자로 읽히기 때문이에요.
      - `FakeEmbedder` 는 글자 2개씩(`windows(2)`)을 해시해서 `dim` 칸 중 한 칸에 1을 더해요. 마지막에 길이를 1로 맞춰요(정규화). 같은 글자가 많이 겹치면 벡터가 가까워져서, 의미는 몰라도 '배관 테스트'에는 충분해요.
      - `Attempt` enum 은 '다시 해볼 에러'와 '바로 포기할 에러'를 **타입으로 구분**해요. `retry` 는 내용을 몰라도 이 분류만 보고 움직여요.
      - `HttpEmbedder` 에 `#[derive(Debug)]` 가 없는 건 의도예요. 실수로 `{:?}` 를 찍어도 키가 나올 수 없어요.
      - `|| self.once(texts)` 를 넘기는 클로저는 호출할 때마다 **새 future** 를 만들어요. 한 번 쓴 future 는 다시 await 할 수 없어서, 재시도 함수는 future 가 아니라 'future 를 만드는 함수'를 받아요.
      - `embed_missing` 의 `LEFT JOIN ... WHERE e.item_id IS NULL` 은 '임베딩 행이 없는 항목만'을 뜻하는 관용구예요. 그래서 다시 실행해도 0개를 처리하고 끝나요(멱등).

      **확인**

      ```
      cargo test -p mnemo-core
      ./target/debug/mnemo-cli --db mnemo.db embed
      ./target/debug/mnemo-cli --db mnemo.db embed
      ```

      두 번째 실행은 `0개를 임베딩했어요` 가 나와야 해요.

      ### 확인

      - 가짜 임베더로 `mnemo embed`를 돌린 뒤, 한 번 더 돌리면 아무 일도 하지 않는다.
      - 실제 제공자로 돌렸을 때 DB의 벡터 개수와 차원 수가 기대와 맞다.
      - 일부러 API 키를 틀리게 넣었을 때 에러 메시지에 키가 나오지 않는다.
      - 항목 본문을 바꾸면 그 항목만 다시 임베딩된다.

      ### 이해 체크

      - 임베딩 모델을 바꾸면 기존 벡터를 왜 그대로 쓸 수 없나요? 모델 식별자를 같이 저장하는 이유는?
      - `embed`가 중간에 네트워크 오류로 죽었다면, 다시 실행했을 때 어디서부터 이어질까요?
      - 재시도할 에러와 바로 실패시킬 에러를 어떤 기준으로 나눴나요?

      ## 정답 노트에서

      - **재시도할 에러와 아닌 에러를 나누는 기준**: 기다리면 나아질 수 있는가. 429, 5xx, 네트워크 오류는 Retry, 401 과 400 은 Fatal 이에요.
      - **백오프**: 1회 실패 뒤 base, 2회 뒤 2배, 3회 뒤 4배예요. `2u32.pow(tries - 1)` 이에요.
      - **키가 로그에 새지 않게**: 에러에는 `e.without_url()` 만 쓰고, 요청 헤더나 본문을 에러 메시지에 넣지 않았어요. `HttpEmbedder` 에 `Debug` 도 안 붙였어요.
      - **트랜잭션 하나로 묶는 이유**: 배치 도중 실패하면 일부만 저장된 채로 남지 않아요. 다시 돌리면 빠진 것만 처리돼요(멱등).
      - `unchecked_transaction` 은 `&Connection` 으로도 트랜잭션을 시작해 줘요. (`transaction()` 은 `&mut` 가 필요해요.)
      - 벡터를 f32 리틀엔디언 BLOB 으로 저장하는 이유 → 크기가 일정하고(dim x 4 바이트), 읽을 때 길이로 손상을 검사할 수 있어요.
      - 임베딩 모델 이름을 같이 저장하는 이유 → 모델이 바뀌면 벡터 공간이 달라서 섞어 쓸 수 없어요.
      - 본문이 바뀌면 임베딩을 지우는 트리거 → 옛 본문의 벡터가 남아 엉뚱한 검색이 되는 걸 막아요. 다시 `embed` 를 돌리면 채워져요.
    steps:
      - message: "[5] mnemo-core/Cargo.toml — reqwest, tokio time"
        files:
          - path: mnemo-core/Cargo.toml
            content: |
              [package]
              name = "mnemo-core"
              version = "0.1.0"
              edition = "2024"

              [dependencies]
              anyhow = "1"
              reqwest = { version = "0.13", features = ["json"] }
              rusqlite = { version = "0.40", features = ["bundled"] }
              serde = { version = "1", features = ["derive"] }
              serde_json = "1"
              thiserror = "2"
              tokio = { version = "1", features = ["rt", "macros", "time"] }
      - message: "[5] db.rs — v3 마이그레이션: embeddings 와 무효화 트리거"
        files:
          - path: mnemo-core/src/db.rs
            content: |
              use std::path::Path;
              use std::time::{SystemTime, UNIX_EPOCH};

              use rusqlite::{Connection, Row, params};

              use crate::item::{Item, Kind, NewItem, Status};

              pub type Result<T> = std::result::Result<T, rusqlite::Error>;

              /// 순서대로 적용되는 마이그레이션. 인덱스 + 1 이 곧 user_version.
              const MIGRATIONS: &[&str] = &[r#"
                  CREATE TABLE items (
                      id            INTEGER PRIMARY KEY AUTOINCREMENT,
                      kind          TEXT NOT NULL,
                      scope         TEXT NOT NULL,
                      body          TEXT NOT NULL,
                      why           TEXT,
                      source        TEXT NOT NULL,
                      created_at    INTEGER NOT NULL,
                      status        TEXT NOT NULL DEFAULT 'active',
                      supersedes_id INTEGER REFERENCES items(id)
                  );
              "#,
              // v2: 키워드 색인. items 를 가리키는 external content 방식 + 동기화 트리거
              r#"
                  CREATE VIRTUAL TABLE items_fts USING fts5(
                      body, why,
                      content = 'items', content_rowid = 'id',
                      tokenize = 'unicode61'
                  );
                  CREATE TRIGGER items_ai AFTER INSERT ON items BEGIN
                      INSERT INTO items_fts(rowid, body, why) VALUES (new.id, new.body, new.why);
                  END;
                  CREATE TRIGGER items_ad AFTER DELETE ON items BEGIN
                      INSERT INTO items_fts(items_fts, rowid, body, why) VALUES ('delete', old.id, old.body, old.why);
                  END;
                  CREATE TRIGGER items_au AFTER UPDATE ON items BEGIN
                      INSERT INTO items_fts(items_fts, rowid, body, why) VALUES ('delete', old.id, old.body, old.why);
                      INSERT INTO items_fts(rowid, body, why) VALUES (new.id, new.body, new.why);
                  END;
                  INSERT INTO items_fts(items_fts) VALUES ('rebuild');
              "#,
              // v3: 임베딩. 본문이 바뀌면 그 항목의 벡터는 무효 -> 트리거로 지운다
              r#"
                  CREATE TABLE embeddings (
                      item_id    INTEGER NOT NULL REFERENCES items(id),
                      model      TEXT NOT NULL,
                      dim        INTEGER NOT NULL,
                      vec        BLOB NOT NULL,
                      created_at INTEGER NOT NULL,
                      PRIMARY KEY (item_id, model)
                  );
                  CREATE TRIGGER items_body_changed AFTER UPDATE OF body ON items BEGIN
                      DELETE FROM embeddings WHERE item_id = new.id;
                  END;
              "#];

              pub struct Db {
                  conn: Connection,
              }

              impl Db {
                  pub fn open(path: &Path) -> Result<Self> {
                      Self::init(Connection::open(path)?)
                  }

                  pub fn open_in_memory() -> Result<Self> {
                      Self::init(Connection::open_in_memory()?)
                  }

                  fn init(conn: Connection) -> Result<Self> {
                      conn.pragma_update(None, "foreign_keys", true)?;
                      let db = Self { conn };
                      db.migrate()?;
                      Ok(db)
                  }

                  pub fn conn(&self) -> &Connection {
                      &self.conn
                  }

                  pub fn user_version(&self) -> Result<i64> {
                      self.conn.query_row("PRAGMA user_version", [], |r| r.get(0))
                  }

                  fn migrate(&self) -> Result<()> {
                      let current = self.user_version()? as usize;
                      for (i, sql) in MIGRATIONS.iter().enumerate().skip(current) {
                          // 마이그레이션 하나는 트랜잭션 하나. 중간에 실패하면 버전도 안 오른다.
                          let tx = self.conn.unchecked_transaction()?;
                          tx.execute_batch(sql)?;
                          tx.pragma_update(None, "user_version", (i + 1) as i64)?;
                          tx.commit()?;
                      }
                      Ok(())
                  }

                  pub fn insert(&self, new: &NewItem) -> Result<i64> {
                      self.conn.execute(
                          "INSERT INTO items (kind, scope, body, why, source, created_at)
                           VALUES (?1, ?2, ?3, ?4, ?5, ?6)",
                          params![new.kind, new.scope, new.body, new.why, new.source, now_secs()],
                      )?;
                      Ok(self.conn.last_insert_rowid())
                  }

                  /// 전부 넣거나 전부 취소한다 (트랜잭션 하나).
                  pub fn insert_many(&self, items: &[NewItem]) -> Result<usize> {
                      let tx = self.conn.unchecked_transaction()?;
                      for it in items {
                          self.insert(it)?;
                      }
                      tx.commit()?;
                      Ok(items.len())
                  }

                  pub fn get(&self, id: i64) -> Result<Option<Item>> {
                      let mut stmt = self.conn.prepare(
                          "SELECT id, kind, scope, body, why, source, created_at, status, supersedes_id
                           FROM items WHERE id = ?1",
                      )?;
                      let mut rows = stmt.query_map([id], row_to_item)?;
                      rows.next().transpose()
                  }

                  pub fn list(&self, kind: Option<Kind>, scope: Option<&str>, status: Status) -> Result<Vec<Item>> {
                      let mut stmt = self.conn.prepare(
                          "SELECT id, kind, scope, body, why, source, created_at, status, supersedes_id
                           FROM items
                           WHERE status = ?1
                             AND (?2 IS NULL OR kind = ?2)
                             AND (?3 IS NULL OR scope = ?3)
                           ORDER BY id",
                      )?;
                      stmt.query_map(params![status, kind, scope], row_to_item)?
                          .collect()
                  }
              }

              fn row_to_item(r: &Row<'_>) -> rusqlite::Result<Item> {
                  Ok(Item {
                      id: r.get(0)?,
                      kind: r.get(1)?,
                      scope: r.get(2)?,
                      body: r.get(3)?,
                      why: r.get(4)?,
                      source: r.get(5)?,
                      created_at: r.get(6)?,
                      status: r.get(7)?,
                      supersedes_id: r.get(8)?,
                  })
              }

              pub fn now_secs() -> i64 {
                  SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .map(|d| d.as_secs() as i64)
                      .unwrap_or(0)
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  fn sample(kind: Kind, scope: &str, body: &str) -> NewItem {
                      NewItem {
                          kind,
                          scope: scope.into(),
                          body: body.into(),
                          why: None,
                          source: "test".into(),
                      }
                  }

                  #[test]
                  fn insert_then_get() {
                      let db = Db::open_in_memory().unwrap();
                      let id = db.insert(&sample(Kind::Project, "projA", "상태 관리는 단순하게")).unwrap();
                      let item = db.get(id).unwrap().unwrap();
                      assert_eq!(item.body, "상태 관리는 단순하게");
                      assert_eq!(item.kind, Kind::Project);
                      assert_eq!(item.status, Status::Active);
                      assert!(db.get(999).unwrap().is_none());
                  }

                  #[test]
                  fn list_filters() {
                      let db = Db::open_in_memory().unwrap();
                      db.insert(&sample(Kind::Project, "projA", "a")).unwrap();
                      db.insert(&sample(Kind::Pref, "global", "b")).unwrap();
                      assert_eq!(db.list(None, None, Status::Active).unwrap().len(), 2);
                      assert_eq!(db.list(Some(Kind::Pref), None, Status::Active).unwrap().len(), 1);
                      assert_eq!(db.list(None, Some("projA"), Status::Active).unwrap().len(), 1);
                      assert_eq!(db.list(None, None, Status::Archived).unwrap().len(), 0);
                  }

                  #[test]
                  fn migration_is_idempotent() {
                      let path = std::env::temp_dir().join(format!("mnemo-test-{}", std::process::id()));
                      let _ = std::fs::remove_file(&path);
                      let db = Db::open(&path).unwrap();
                      assert_eq!(db.user_version().unwrap(), MIGRATIONS.len() as i64);
                      drop(db);
                      let db = Db::open(&path).unwrap(); // 다시 열어도 에러 없이 같은 버전
                      assert_eq!(db.user_version().unwrap(), MIGRATIONS.len() as i64);
                      let _ = std::fs::remove_file(&path);
                  }

                  #[test]
                  fn unknown_status_is_an_error_not_a_panic() {
                      let db = Db::open_in_memory().unwrap();
                      let id = db.insert(&sample(Kind::Work, "global", "x")).unwrap();
                      db.conn().execute("UPDATE items SET status = 'weird' WHERE id = ?1", [id]).unwrap();
                      assert!(db.get(id).is_err());
                  }
              }
      - message: "[5] embed.rs — Embedder, 가짜 임베더, BLOB 변환, 재시도, HTTP 임베더"
        files:
          - path: mnemo-core/src/embed.rs
            content: |
              use std::future::Future;
              use std::time::Duration;

              use anyhow::{Context, Result, anyhow, bail};
              use serde::Deserialize;

              use crate::db::{Db, now_secs};

              #[allow(async_fn_in_trait)]
              pub trait Embedder {
                  /// 어떤 모델로 만든 벡터인지. 벡터와 함께 DB에 저장한다.
                  fn model_id(&self) -> &str;
                  fn dim(&self) -> usize;
                  async fn embed(&self, texts: &[String]) -> Result<Vec<Vec<f32>>>;
              }

              // ---------- 가짜 임베더: 같은 입력이면 항상 같은 벡터 ----------

              /// 글자 2-gram 을 해시해서 dim 칸에 세는 가짜 임베더. 의미는 모르지만
              /// 글자가 겹치는 문장끼리는 가까워서 테스트에 쓸 만하다.
              pub struct FakeEmbedder {
                  pub dim: usize,
              }

              impl Embedder for FakeEmbedder {
                  fn model_id(&self) -> &str {
                      "fake-bigram-v1"
                  }
                  fn dim(&self) -> usize {
                      self.dim
                  }
                  async fn embed(&self, texts: &[String]) -> Result<Vec<Vec<f32>>> {
                      Ok(texts.iter().map(|t| fake_vector(t, self.dim)).collect())
                  }
              }

              fn fake_vector(text: &str, dim: usize) -> Vec<f32> {
                  let chars: Vec<char> = text.to_lowercase().chars().filter(|c| !c.is_whitespace()).collect();
                  let mut v = vec![0.0f32; dim];
                  for w in chars.windows(2) {
                      // FNV-1a
                      let mut h: u64 = 0xcbf29ce484222325;
                      for c in w {
                          for b in (*c as u32).to_le_bytes() {
                              h ^= b as u64;
                              h = h.wrapping_mul(0x100000001b3);
                          }
                      }
                      v[(h % dim as u64) as usize] += 1.0;
                  }
                  let norm = v.iter().map(|x| x * x).sum::<f32>().sqrt();
                  if norm > 0.0 {
                      v.iter_mut().for_each(|x| *x /= norm);
                  }
                  v
              }

              // ---------- f32 벡터 <-> BLOB ----------

              pub fn vec_to_bytes(v: &[f32]) -> Vec<u8> {
                  v.iter().flat_map(|x| x.to_le_bytes()).collect()
              }

              pub fn bytes_to_vec(bytes: &[u8], dim: usize) -> Result<Vec<f32>> {
                  if bytes.len() != dim * 4 {
                      bail!("벡터 길이가 이상해요: {}바이트 (기대 {}바이트)", bytes.len(), dim * 4);
                  }
                  Ok(bytes
                      .as_chunks::<4>()
                      .0
                      .iter()
                      .map(|c| f32::from_le_bytes(*c))
                      .collect())
              }

              // ---------- 재시도 ----------

              pub enum Attempt {
                  /// 429, 5xx, 네트워크 오류: 기다렸다 다시
                  Retry(anyhow::Error),
                  /// 잘못된 키, 잘못된 요청: 다시 해도 소용없음
                  Fatal(anyhow::Error),
              }

              /// 지수 백오프: 1회차 실패 후 base, 그다음 2*base, 4*base ...
              pub async fn retry<T, F, Fut>(max_tries: u32, base: Duration, mut f: F) -> Result<T>
              where
                  F: FnMut() -> Fut,
                  Fut: Future<Output = std::result::Result<T, Attempt>>,
              {
                  let mut tries = 0;
                  loop {
                      tries += 1;
                      match f().await {
                          Ok(v) => return Ok(v),
                          Err(Attempt::Fatal(e)) => return Err(e),
                          Err(Attempt::Retry(e)) if tries >= max_tries => {
                              return Err(e.context(format!("{tries}번 시도했지만 실패했어요")));
                          }
                          Err(Attempt::Retry(_)) => {
                              tokio::time::sleep(base * 2u32.pow(tries - 1)).await;
                          }
                      }
                  }
              }

              // ---------- 실제 제공자 (OpenAI 호환 /embeddings 형식) ----------

              pub struct HttpEmbedder {
                  client: reqwest::Client,
                  url: String,
                  api_key: String, // Debug 를 derive 하지 않는다: 실수로 로그에 찍히지 않게
                  model: String,
                  dim: usize,
              }

              #[derive(Deserialize)]
              struct EmbResponse {
                  data: Vec<EmbData>,
              }
              #[derive(Deserialize)]
              struct EmbData {
                  index: usize,
                  embedding: Vec<f32>,
              }

              impl HttpEmbedder {
                  /// MNEMO_EMBED_URL, MNEMO_EMBED_KEY, MNEMO_EMBED_MODEL, MNEMO_EMBED_DIM 에서 읽는다.
                  pub fn from_env() -> Result<Self> {
                      let get = |k: &str| std::env::var(k).with_context(|| format!("환경변수 {k} 가 필요해요"));
                      Ok(Self {
                          client: reqwest::Client::builder().timeout(Duration::from_secs(30)).build()?,
                          url: get("MNEMO_EMBED_URL")?,
                          api_key: get("MNEMO_EMBED_KEY")?,
                          model: get("MNEMO_EMBED_MODEL")?,
                          dim: get("MNEMO_EMBED_DIM")?.parse().context("MNEMO_EMBED_DIM 은 숫자여야 해요")?,
                      })
                  }

                  async fn once(&self, texts: &[String]) -> std::result::Result<Vec<Vec<f32>>, Attempt> {
                      let res = self
                          .client
                          .post(&self.url)
                          .bearer_auth(&self.api_key)
                          .json(&serde_json::json!({ "model": self.model, "input": texts }))
                          .send()
                          .await
                          .map_err(|e| Attempt::Retry(anyhow!("임베딩 요청 실패: {}", e.without_url())))?;

                      let status = res.status();
                      if status.as_u16() == 429 || status.is_server_error() {
                          return Err(Attempt::Retry(anyhow!("임베딩 서버가 {status} 를 돌려줬어요")));
                      }
                      if !status.is_success() {
                          return Err(Attempt::Fatal(anyhow!("임베딩 요청이 거절됐어요: {status}")));
                      }

                      let mut body: EmbResponse = res
                          .json()
                          .await
                          .map_err(|e| Attempt::Fatal(anyhow!("임베딩 응답을 해석하지 못했어요: {}", e.without_url())))?;
                      body.data.sort_by_key(|d| d.index);
                      Ok(body.data.into_iter().map(|d| d.embedding).collect())
                  }
              }

              impl Embedder for HttpEmbedder {
                  fn model_id(&self) -> &str {
                      &self.model
                  }
                  fn dim(&self) -> usize {
                      self.dim
                  }
                  async fn embed(&self, texts: &[String]) -> Result<Vec<Vec<f32>>> {
                      let out = retry(4, Duration::from_millis(500), || self.once(texts)).await?;
                      if out.len() != texts.len() || out.iter().any(|v| v.len() != self.dim) {
                          bail!("응답 개수나 차원 수가 기대와 달라요");
                      }
                      Ok(out)
                  }
              }

              // ---------- 아직 임베딩이 없는 항목만 처리 (멱등) ----------

              /// 이 모델의 벡터가 없는 active 항목을 batch 개씩 임베딩해 저장한다. 처리한 개수를 돌려준다.
              pub async fn embed_missing(db: &Db, embedder: &impl Embedder, batch: usize) -> Result<usize> {
                  let mut done = 0;
                  loop {
                      let rows: Vec<(i64, String)> = {
                          let mut stmt = db.conn().prepare(
                              "SELECT i.id, i.body FROM items i
                               LEFT JOIN embeddings e ON e.item_id = i.id AND e.model = ?1
                               WHERE e.item_id IS NULL AND i.status = 'active'
                               ORDER BY i.id LIMIT ?2",
                          )?;
                          stmt.query_map(rusqlite::params![embedder.model_id(), batch as i64], |r| Ok((r.get(0)?, r.get(1)?)))?
                              .collect::<std::result::Result<_, _>>()?
                      };
                      if rows.is_empty() {
                          return Ok(done);
                      }

                      let texts: Vec<String> = rows.iter().map(|(_, b)| b.clone()).collect();
                      // 본문은 로그에 남기지 않고 개수만 남긴다
                      eprintln!("임베딩 요청: {}개", texts.len());
                      let vecs = embedder.embed(&texts).await?;

                      let tx = db.conn().unchecked_transaction()?;
                      for ((id, _), v) in rows.iter().zip(&vecs) {
                          tx.execute(
                              "INSERT INTO embeddings (item_id, model, dim, vec, created_at) VALUES (?1, ?2, ?3, ?4, ?5)",
                              rusqlite::params![id, embedder.model_id(), v.len() as i64, vec_to_bytes(v), now_secs()],
                          )?;
                      }
                      tx.commit()?;
                      done += rows.len();
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::item::{Kind, NewItem};
                  use std::cell::Cell;

                  fn add(db: &Db, body: &str) -> i64 {
                      db.insert(&NewItem { kind: Kind::Work, scope: "g".into(), body: body.into(), why: None, source: "t".into() }).unwrap()
                  }

                  #[test]
                  fn bytes_roundtrip_and_length_check() {
                      let v = vec![0.5, -1.25, 3.0];
                      assert_eq!(bytes_to_vec(&vec_to_bytes(&v), 3).unwrap(), v);
                      assert!(bytes_to_vec(&vec_to_bytes(&v), 4).is_err());
                  }

                  #[tokio::test]
                  async fn fake_is_deterministic() {
                      let e = FakeEmbedder { dim: 32 };
                      let t = vec!["안녕 world".to_string()];
                      assert_eq!(e.embed(&t).await.unwrap(), e.embed(&t).await.unwrap());
                  }

                  #[tokio::test]
                  async fn embed_is_idempotent_and_invalidated_on_edit() {
                      let db = Db::open_in_memory().unwrap();
                      let a = add(&db, "first");
                      add(&db, "second");
                      let e = FakeEmbedder { dim: 16 };
                      assert_eq!(embed_missing(&db, &e, 1).await.unwrap(), 2);
                      assert_eq!(embed_missing(&db, &e, 1).await.unwrap(), 0);

                      db.conn().execute("UPDATE items SET body = 'changed' WHERE id = ?1", [a]).unwrap();
                      assert_eq!(embed_missing(&db, &e, 10).await.unwrap(), 1);
                  }

                  #[tokio::test]
                  async fn retry_retries_then_succeeds() {
                      let calls = Cell::new(0);
                      let out = retry(3, Duration::from_millis(1), || {
                          calls.set(calls.get() + 1);
                          let n = calls.get();
                          async move { if n < 3 { Err(Attempt::Retry(anyhow!("503"))) } else { Ok(n) } }
                      })
                      .await
                      .unwrap();
                      assert_eq!(out, 3);
                  }

                  #[tokio::test]
                  async fn retry_gives_up_and_fatal_is_immediate() {
                      let calls = Cell::new(0);
                      let r: Result<()> = retry(3, Duration::from_millis(1), || {
                          calls.set(calls.get() + 1);
                          async { Err(Attempt::Retry(anyhow!("503"))) }
                      })
                      .await;
                      assert!(r.is_err());
                      assert_eq!(calls.get(), 3);

                      calls.set(0);
                      let r: Result<()> = retry(3, Duration::from_millis(1), || {
                          calls.set(calls.get() + 1);
                          async { Err(Attempt::Fatal(anyhow!("401"))) }
                      })
                      .await;
                      assert!(r.is_err());
                      assert_eq!(calls.get(), 1);
                  }
              }
