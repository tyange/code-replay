              use std::collections::HashMap;

              use crate::error::Result;
              use crate::search::{Retriever, Scored};

              /// 여러 순위 목록을 RRF 로 합친다. 점수 = Σ 1/(k + 순위), 순위는 1부터.
              /// 점수 내림차순으로 돌려주고, 점수가 같으면 id 가 작은 쪽이 먼저 (결과가 매번 같도록).
              pub fn rrf(lists: &[Vec<i64>], k: f64) -> Vec<(i64, f64)> {
                  let mut score: HashMap<i64, f64> = HashMap::new();
                  for list in lists {
                      for (i, id) in list.iter().enumerate() {
                          *score.entry(*id).or_default() += 1.0 / (k + (i + 1) as f64);
                      }
                  }
                  let mut out: Vec<(i64, f64)> = score.into_iter().collect();
                  out.sort_by(|a, b| b.1.total_cmp(&a.1).then(a.0.cmp(&b.0)));
                  out
              }

              /// async fn 이 들어간 trait 는 `dyn` 으로 못 쓴다. 그래서 제네릭으로 받는다.
              pub struct HybridRetriever<A: Retriever, B: Retriever> {
                  pub a: A,
                  pub b: B,
                  pub rrf_k: f64,
                  /// 각 검색기에서 몇 개씩 가져와 합칠지
                  pub fetch: usize,
              }

              impl<A: Retriever, B: Retriever> Retriever for HybridRetriever<A, B> {
                  async fn search(&self, query: &str, k: usize) -> Result<Vec<Scored>> {
                      let ids = |v: Vec<Scored>| v.into_iter().map(|s| s.id).collect::<Vec<_>>();
                      let la = ids(self.a.search(query, self.fetch).await?);
                      let lb = ids(self.b.search(query, self.fetch).await?);
                      Ok(rrf(&[la, lb], self.rrf_k)
                          .into_iter()
                          .take(k)
                          .map(|(id, score)| Scored { id, score })
                          .collect())
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  #[test]
                  fn both_lists_beat_one_list() {
                      let out = rrf(&[vec![1, 2, 3], vec![3, 4]], 60.0);
                      assert_eq!(out[0].0, 3); // 두 목록에 다 나온 3이 1위
                      assert!(out.iter().any(|(id, _)| *id == 4)); // 한쪽에만 나온 항목도 점수를 받는다
                  }

                  #[test]
                  fn rank_matters() {
                      let out = rrf(&[vec![1, 2]], 60.0);
                      assert!(out[0].1 > out[1].1);
                      assert!((out[0].1 - 1.0 / 61.0).abs() < 1e-12);
                  }
              }
      - message: "[8] eval.rs — core Result 로"
        files:
          - path: mnemo-core/src/eval.rs
            content: |
              use std::collections::BTreeMap;

              use serde::Deserialize;

              use crate::db::Db;
              use crate::error::{Error, Result};
              use crate::search::Retriever;

              /// 평가 파일(JSON 배열)의 한 항목.
              #[derive(Debug, Clone, Deserialize)]
              pub struct Question {
                  pub q: String,
                  /// 정답 항목 id들. 정답 없음 유형은 빈 배열.
                  pub answers: Vec<i64>,
                  /// 유형 태그 (direct, paraphrase, ...)
                  pub tag: String,
                  /// 봉인 세트 여부. 기본 eval 에서는 제외된다.
                  #[serde(default)]
                  pub sealed: bool,
                  #[serde(default)]
                  pub note: String,
              }

              pub fn load_questions(json: &str) -> Result<Vec<Question>> {
                  serde_json::from_str(json).map_err(|e| Error::Invalid(format!("평가 파일 형식: {e}")))
              }

              /// 정답 id 가 DB 에 실제로 있는지 확인한다. 없는 (질문, id) 목록을 돌려준다.
              pub fn missing_answers(db: &Db, qs: &[Question]) -> Result<Vec<(String, i64)>> {
                  let mut missing = Vec::new();
                  for q in qs {
                      for &id in &q.answers {
                          if db.get(id)?.is_none() {
                              missing.push((q.q.clone(), id));
                          }
                      }
                  }
                  Ok(missing)
              }

              /// 상위 k개 안에 든 정답의 비율. 정답이 없는 질문은 None.
              pub fn recall_at_k(ranked: &[i64], answers: &[i64], k: usize) -> Option<f64> {
                  if answers.is_empty() {
                      return None;
                  }
                  let hit = answers.iter().filter(|a| ranked.iter().take(k).any(|r| r == *a)).count();
                  Some(hit as f64 / answers.len() as f64)
              }

              /// 첫 정답 순위의 역수. 못 찾으면 0, 정답이 없는 질문은 None.
              pub fn reciprocal_rank(ranked: &[i64], answers: &[i64]) -> Option<f64> {
                  if answers.is_empty() {
                      return None;
                  }
                  let pos = ranked.iter().position(|r| answers.contains(r));
                  Some(pos.map_or(0.0, |p| 1.0 / (p as f64 + 1.0)))
              }

              #[derive(Debug, Default, Clone)]
              pub struct Row {
                  pub n: usize,
                  pub recall3: f64,
                  pub recall5: f64,
                  pub mrr: f64,
                  /// 정답 없음 질문 중 아무것도 안 돌려준 비율 (정답 없음 질문이 없으면 None)
                  pub empty_rate: Option<f64>,
              }

              #[derive(Debug, Default)]
              pub struct Report {
                  pub overall: Row,
                  pub by_tag: BTreeMap<String, Row>,
              }

              /// 질문들의 결과를 모아서 평균을 내는 상자.
              #[derive(Default)]
              struct Acc {
                  n: usize,
                  scored: usize, // 정답이 있는 질문 수
                  r3: f64,
                  r5: f64,
                  rr: f64,
                  no_answer: usize, // 정답 없음 질문 수
                  empty: usize,     // 그중 아무것도 안 돌려준 수
              }

              impl Acc {
                  fn add(&mut self, ranked: &[i64], answers: &[i64]) {
                      self.n += 1;
                      match (recall_at_k(ranked, answers, 3), recall_at_k(ranked, answers, 5), reciprocal_rank(ranked, answers)) {
                          (Some(a), Some(b), Some(c)) => {
                              self.scored += 1;
                              self.r3 += a;
                              self.r5 += b;
                              self.rr += c;
                          }
                          _ => {
                              self.no_answer += 1;
                              if ranked.is_empty() {
                                  self.empty += 1;
                              }
                          }
                      }
                  }

                  fn finish(&self) -> Row {
                      let avg = |x: f64| if self.scored == 0 { 0.0 } else { x / self.scored as f64 };
                      Row {
                          n: self.n,
                          recall3: avg(self.r3),
                          recall5: avg(self.r5),
                          mrr: avg(self.rr),
                          empty_rate: (self.no_answer > 0).then(|| self.empty as f64 / self.no_answer as f64),
                      }
                  }
              }

              /// 질문마다 검색을 돌려 전체와 유형별 점수를 모은다.
              pub async fn run_eval(retriever: &impl Retriever, qs: &[Question], include_sealed: bool) -> Result<Report> {
                  let mut overall = Acc::default();
                  let mut by_tag: BTreeMap<String, Acc> = BTreeMap::new();

                  for q in qs.iter().filter(|q| include_sealed || !q.sealed) {
                      let ranked: Vec<i64> = retriever.search(&q.q, 5).await?.into_iter().map(|s| s.id).collect();
                      overall.add(&ranked, &q.answers);
                      by_tag.entry(q.tag.clone()).or_default().add(&ranked, &q.answers);
                  }

                  Ok(Report {
                      overall: overall.finish(),
                      by_tag: by_tag.into_iter().map(|(k, v)| (k, v.finish())).collect(),
                  })
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  #[test]
                  fn recall_and_mrr() {
                      let ranked = [7, 3, 9, 1];
                      assert_eq!(recall_at_k(&ranked, &[3, 1], 3), Some(0.5));
                      assert_eq!(recall_at_k(&ranked, &[3, 1], 5), Some(1.0));
                      assert_eq!(reciprocal_rank(&ranked, &[9]), Some(1.0 / 3.0));
                      assert_eq!(reciprocal_rank(&ranked, &[42]), Some(0.0));
                      assert_eq!(recall_at_k(&ranked, &[], 3), None);
                      assert_eq!(reciprocal_rank(&ranked, &[]), None);
                  }

                  #[test]
                  fn parses_question_file() {
                      let json = r#"[
                          {"q": "배포는 언제 안 하기로 했지", "answers": [3], "tag": "direct"},
                          {"q": "우주선 연료는", "answers": [], "tag": "no_answer", "sealed": true}
                      ]"#;
                      let qs = load_questions(json).unwrap();
                      assert_eq!(qs.len(), 2);
                      assert!(qs[1].sealed && qs[1].answers.is_empty());
                  }
              }
      - message: "[8] main.rs — core 에러를 anyhow 로 받기"
        files:
          - path: mnemo-cli/src/main.rs
            content: |
              use std::fs;
              use std::path::PathBuf;

              use anyhow::{Context, Result, bail};
              use clap::{Parser, Subcommand, ValueEnum};
              use mnemo_core::embed::{Embedder, FakeEmbedder, HttpEmbedder, embed_missing};
              use mnemo_core::hybrid::HybridRetriever;
              use mnemo_core::search::{FtsRetriever, Retriever, Scored};
              use mnemo_core::vector::VectorRetriever;
              use mnemo_core::{Db, Item, Kind, NewItem, Status, eval, import};

              #[derive(Parser)]
              #[command(version, about = "내 지식 DB")]
              struct Cli {
                  /// DB 파일 경로 (옵션 > MNEMO_DB 환경변수 > ./mnemo.db)
                  #[arg(long, env = "MNEMO_DB", default_value = "mnemo.db", global = true)]
                  db: PathBuf,

                  #[command(subcommand)]
                  cmd: Cmd,
              }

              // MNEMO_EMBED_URL 이 있으면 실제 제공자, 없으면 가짜 임베더
              enum AnyEmbedder {
                  Fake(FakeEmbedder),
                  Http(HttpEmbedder),
              }

              impl AnyEmbedder {
                  fn from_env() -> Result<Self> {
                      if std::env::var_os("MNEMO_EMBED_URL").is_some() {
                          Ok(Self::Http(HttpEmbedder::from_env()?))
                      } else {
                          Ok(Self::Fake(FakeEmbedder { dim: 128 }))
                      }
                  }
              }

              impl Embedder for AnyEmbedder {
                  fn model_id(&self) -> &str {
                      match self {
                          Self::Fake(e) => e.model_id(),
                          Self::Http(e) => e.model_id(),
                      }
                  }
                  fn dim(&self) -> usize {
                      match self {
                          Self::Fake(e) => e.dim(),
                          Self::Http(e) => e.dim(),
                      }
                  }
                  async fn embed(&self, texts: &[String]) -> mnemo_core::Result<Vec<Vec<f32>>> {
                      match self {
                          Self::Fake(e) => e.embed(texts).await,
                          Self::Http(e) => e.embed(texts).await,
                      }
                  }
              }

              #[derive(Clone, Copy, ValueEnum)]
              enum Mode {
                  Fts,
                  Vector,
                  Hybrid,
              }

              /// 모드에 맞는 검색을 돌린다. async fn 이 든 trait 는 `dyn` 으로 못 쓰니 match 로 갈라낸다.
              async fn run_search(db: &Db, mode: Mode, q: &str, k: usize) -> Result<Vec<Scored>> {
                  let emb = AnyEmbedder::from_env()?;
                  Ok(match mode {
                      Mode::Fts => FtsRetriever { db }.search(q, k).await?,
                      Mode::Vector => VectorRetriever { db, embedder: &emb }.search(q, k).await?,
                      Mode::Hybrid => {
                          let h = HybridRetriever {
                              a: FtsRetriever { db },
                              b: VectorRetriever { db, embedder: &emb },
                              rrf_k: 60.0,
                              fetch: 20,
                          };
                          h.search(q, k).await?
                      }
                  })
              }

              #[derive(Subcommand)]
              enum Cmd {
                  /// 항목 하나 추가
                  Add {
                      /// project / pref / work
                      kind: Kind,
                      /// 프로젝트 이름 또는 global
                      scope: String,
                      /// 본문 (사실 하나)
                      body: String,
                      /// 이유
                      #[arg(long)]
                      why: Option<String>,
                  },
                  /// 항목 목록
                  List {
                      #[arg(long)]
                      kind: Option<Kind>,
                      #[arg(long)]
                      scope: Option<String>,
                      #[arg(long, default_value = "active")]
                      status: Status,
                  },
                  /// 항목 하나를 자세히
                  Get { id: i64 },
                  /// 텍스트 파일에서 한 줄에 하나씩 가져오기
                  Import { file: PathBuf },
                  /// 평가 파일의 정답 id가 DB에 다 있는지 확인
                  EvalCheck { file: PathBuf },
                  /// 질문으로 검색
                  Search {
                      query: String,
                      #[arg(long, value_enum, default_value = "fts")]
                      mode: Mode,
                      #[arg(short, default_value_t = 5)]
                      k: usize,
                  },
                  /// 평가 세트로 점수 내기 (봉인 문항은 기본 제외)
                  Eval {
                      #[arg(default_value = "eval.json")]
                      file: PathBuf,
                      #[arg(long, value_enum, default_value = "fts")]
                      mode: Mode,
                      /// 봉인 문항도 포함 (Stage 7 마지막에 딱 한 번만!)
                      #[arg(long)]
                      include_sealed: bool,
                  },
                  /// 아직 임베딩이 없는 항목을 임베딩
                  Embed,
              }

              #[tokio::main]
              async fn main() -> Result<()> {
                  let cli = Cli::parse();
                  let db = Db::open(&cli.db).with_context(|| format!("{} 을 열지 못했어요", cli.db.display()))?;

                  match cli.cmd {
                      Cmd::Add { kind, scope, body, why } => {
                          let id = db.insert(&NewItem { kind, scope, body, why, source: "manual".into() })?;
                          println!("추가됨: #{id}");
                      }
                      Cmd::List { kind, scope, status } => {
                          for it in db.list(kind, scope.as_deref(), status)? {
                              println!("#{:<4} [{}/{}] {}", it.id, it.kind.as_str(), it.scope, it.body);
                          }
                      }
                      Cmd::Get { id } => match db.get(id)? {
                          Some(it) => print_item(&it),
                          None => bail!("#{id} 항목이 없어요"),
                      },
                      Cmd::Import { file } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          match import::parse_lines(&text) {
                              Ok(items) => {
                                  let n = db.insert_many(&items)?;
                                  println!("{n}개를 가져왔어요");
                              }
                              Err(errors) => {
                                  for (line, msg) in &errors {
                                      eprintln!("{}:{line}: {msg}", file.display());
                                  }
                                  bail!("{}줄에 문제가 있어서 아무것도 넣지 않았어요", errors.len());
                              }
                          }
                      }
                      Cmd::EvalCheck { file } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          let qs = eval::load_questions(&text)?;
                          let missing = eval::missing_answers(&db, &qs)?;
                          for (q, id) in &missing {
                              eprintln!("정답 id #{id} 가 DB에 없어요: {q}");
                          }
                          if !missing.is_empty() {
                              bail!("{}건의 정답 id를 고치세요", missing.len());
                          }
                          let sealed = qs.iter().filter(|q| q.sealed).count();
                          println!("질문 {}개 (봉인 {}개), 정답 id 모두 확인됨", qs.len(), sealed);
                      }
                      Cmd::Search { query, mode, k } => {
                          for (i, hit) in run_search(&db, mode, &query, k).await?.iter().enumerate() {
                              if let Some(it) = db.get(hit.id)? {
                                  println!("{:>2}) [{}/{}] {}  ({:.2})", i + 1, it.kind.as_str(), it.scope, it.body, hit.score);
                              }
                          }
                      }
                      Cmd::Eval { file, mode, include_sealed } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          let qs = eval::load_questions(&text)?;
                          let emb = AnyEmbedder::from_env()?;
                          let report = match mode {
                              Mode::Fts => eval::run_eval(&FtsRetriever { db: &db }, &qs, include_sealed).await?,
                              Mode::Vector => eval::run_eval(&VectorRetriever { db: &db, embedder: &emb }, &qs, include_sealed).await?,
                              Mode::Hybrid => {
                                  let h = HybridRetriever {
                                      a: FtsRetriever { db: &db },
                                      b: VectorRetriever { db: &db, embedder: &emb },
                                      rrf_k: 60.0,
                                      fetch: 20,
                                  };
                                  eval::run_eval(&h, &qs, include_sealed).await?
                              }
                          };

                          println!("{:<14} {:>3} {:>9} {:>9} {:>7}", "유형", "n", "Recall@3", "Recall@5", "MRR");
                          let line = |name: &str, r: &eval::Row| {
                              println!("{:<14} {:>3} {:>9.2} {:>9.2} {:>7.2}", name, r.n, r.recall3, r.recall5, r.mrr);
                              if let Some(e) = r.empty_rate {
                                  println!("{:<14}     (정답 없음 중 빈 결과 비율 {:.2})", "", e);
                              }
                          };
                          line("전체", &report.overall);
                          for (tag, row) in &report.by_tag {
                              line(tag, row);
                          }
                      }
                      Cmd::Embed => {
                          let n = embed_missing(&db, &AnyEmbedder::from_env()?, 32).await?;
                          println!("{n}개를 임베딩했어요");
                      }
                  }
                  Ok(())
              }

              fn print_item(it: &Item) {
                  println!("id         {}", it.id);
                  println!("kind       {}", it.kind.as_str());
                  println!("scope      {}", it.scope);
                  println!("body       {}", it.body);
                  println!("why        {}", it.why.as_deref().unwrap_or("-"));
                  println!("source     {}", it.source);
                  println!("status     {}", it.status.as_str());
                  println!("created_at {} (UTC 초)", it.created_at);
              }
