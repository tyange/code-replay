      - message: "[8] regression.rs — 네트워크 없는 점수 회귀 테스트"
        files:
          - path: mnemo-core/tests/regression.rs
            content: |
              //! 네트워크 없이 도는 회귀 테스트: 메모리 DB + 고정 데이터 + 가짜 임베더.
              //! 의미 품질이 아니라 "배관"(저장, 색인, 순위 합치기, 필터)이 망가지지 않았는지를 본다.

              use mnemo_core::embed::{FakeEmbedder, embed_missing};
              use mnemo_core::eval::{self, Question};
              use mnemo_core::hybrid::HybridRetriever;
              use mnemo_core::search::FtsRetriever;
              use mnemo_core::vector::VectorRetriever;
              use mnemo_core::{Db, import};

              fn fixture_db() -> Db {
                  let db = Db::open_in_memory().unwrap();
                  let items = import::parse_lines(include_str!("fixtures/items.txt")).unwrap();
                  db.insert_many(&items).unwrap();
                  db
              }

              fn questions() -> Vec<Question> {
                  eval::load_questions(include_str!("fixtures/eval.json")).unwrap()
              }

              #[tokio::test]
              async fn fixture_answers_exist() {
                  let db = fixture_db();
                  assert!(eval::missing_answers(&db, &questions()).unwrap().is_empty());
              }

              #[tokio::test]
              async fn keyword_search_does_not_regress() {
                  let db = fixture_db();
                  let report = eval::run_eval(&FtsRetriever { db: &db }, &questions(), false)
                      .await
                      .unwrap();
                  assert!(
                      report.overall.recall5 >= 0.8,
                      "Recall@5 가 떨어졌어요: {}",
                      report.overall.recall5
                  );
                  assert!(
                      report.overall.mrr >= 0.8,
                      "MRR 이 떨어졌어요: {}",
                      report.overall.mrr
                  );
              }

              #[tokio::test]
              async fn hybrid_search_does_not_regress() {
                  let db = fixture_db();
                  let e = FakeEmbedder { dim: 256 };
                  embed_missing(&db, &e, 32).await.unwrap();
                  let h = HybridRetriever {
                      a: FtsRetriever { db: &db },
                      b: VectorRetriever {
                          db: &db,
                          embedder: &e,
                      },
                      rrf_k: 60.0,
                      fetch: 20,
                  };
                  let report = eval::run_eval(&h, &questions(), false).await.unwrap();
                  assert!(
                      report.overall.recall5 >= 0.8,
                      "Recall@5 가 떨어졌어요: {}",
                      report.overall.recall5
                  );
                  assert!(
                      report.overall.mrr >= 0.8,
                      "MRR 이 떨어졌어요: {}",
                      report.overall.mrr
                  );
              }

              #[tokio::test]
              async fn superseded_items_are_not_returned() {
                  let db = fixture_db();
                  db.conn()
                      .execute("UPDATE items SET status = 'superseded' WHERE id = 1", [])
                      .unwrap();
                  let qs = vec![Question {
                      q: "금요일에 배포는".into(),
                      answers: vec![1],
                      tag: "superseded".into(),
                      sealed: false,
                      note: String::new(),
                  }];
                  let report = eval::run_eval(&FtsRetriever { db: &db }, &qs, false)
                      .await
                      .unwrap();
                  assert_eq!(report.overall.recall5, 0.0);
              }
  - id: "9"
    title: 기억 관리
    doc: |
      # 기억 관리

      **목표:** 항목이 늘고 바뀌어도 DB가 **믿을 만하게** 유지되게 한다. 이 프로젝트에서 정답이 없는 설계 문제가 가장 많은 곳이에요.

      **새로 배우는 것:** 트랜잭션과 롤백, 대체(supersede)·중복·충돌 처리, 감사 로그

      ### 요구사항

      - [ ] **대체**: 항목 A를 새 항목 B로 대체하는 연산을 만든다. B를 넣고, A를 `superseded`로 바꾸고, 둘을 연결하는 일이 **하나의 트랜잭션**이어야 한다. 중간에 실패하면 전부 되돌아가는 테스트를 쓴다.
      - [ ] 검색은 기본적으로 active만 보지만, `--history` 같은 옵션으로 대체된 항목까지 볼 수 있게 한다.
      - [ ] **중복 감지**: 새 항목을 넣을 때 기존 항목과 유사도가 임계값을 넘으면 경고하고, 합칠지/새로 넣을지/취소할지 묻는다.
      - [ ] **충돌 후보 감지**: 같은 범위에서 내용이 비슷하지만 서로 다른 말을 하는 항목 쌍을 찾아 목록으로 보여준다. (자동 판정은 하지 않는다. 사람이 판단한다.)
      - [ ] **오래된 항목**: 오랫동안 확인하지 않은 active 항목을 목록으로 보여주는 명령을 만든다. 얼마나 오래돼야 '오래된' 건지는 항목 종류마다 다를 수 있다.
      - [ ] **감사 로그**: 항목이 언제, 누구(사람/AI/가져오기)에 의해, 무엇이 바뀌었는지 기록하는 테이블을 만든다.
      - [ ] Stage 3의 폐기 함정 유형 점수가 이 변경으로 **실제로 좋아졌는지** 확인한다.

      <details><summary>힌트 1: 중복과 충돌은 다르다</summary>

      - 중복은 '같은 말을 두 번', 충돌은 '비슷한 주제에 다른 말'이에요. 둘 다 유사도가 높게 나오니, 어떻게 구분할지가 핵심이에요. 처음엔 구분하지 말고 '유사 항목 후보'로 보여주고 사람이 고르게 하는 것도 좋은 출발이에요.

      </details>

      <details><summary>힌트 2: 트랜잭션 실패를 테스트하는 법</summary>

      - 두 번째 쓰기가 실패하도록 일부러 제약 위반을 만들어 보세요. 첫 번째 쓰기가 남아 있으면 트랜잭션이 아닌 거예요.

      </details>

      <details><summary>힌트 3: 완벽을 목표로 하지 말 것</summary>

      - 이 Stage에는 정답이 없어요. '내가 직접 쓰면서 가장 불편한 것'부터 해결하세요. 쓰지 않을 기능은 만들지 마세요.

      </details>

      ### 단계별 코드

      원래 가이드는 감사 로그 테이블(마이그레이션 4번째 항목, 칸 설계는 바꿔도 돼요)과 대체 연산의 시그니처 두 조각만 줘요.

      ```rust
      /// old 를 superseded 로 바꾸고, new 를 넣고, 둘을 연결한다. 전부 한 트랜잭션.
      pub fn supersede(&self, old_id: i64, new: &NewItem) -> Result<i64>
      ```

      여기서는 요구사항을 채운 한 가지 완성본을 칩니다.

      ▶ `mnemo-core/src/db.rs` — 재생에서 따라 칩니다 (v4 마이그레이션: `audit_log`, `checked_at`, 삽입 감사 트리거 / `supersede`, `confirm`)

      ▶ `mnemo-core/src/search.rs` — 재생에서 따라 칩니다 (`search_history`)

      ▶ `mnemo-core/src/lib.rs`, `mnemo-core/src/manage.rs` — 재생에서 따라 칩니다 (중복 후보, 충돌 후보, 오래된 항목)

      ▶ `mnemo-cli/src/main.rs` — 재생에서 따라 칩니다 (`add` 의 중복 확인, `supersede`, `confirm`, `stale`, `conflicts`, `search --history`)

      **확인**: 두 번째 쓰기가 실패하도록 일부러 제약을 위반시켜서, 첫 번째 쓰기가 남지 않는지 테스트로 확인하세요.

      ```
      cargo test -p mnemo-core
      ./target/debug/mnemo-cli --db mnemo.db search "배포는" --history
      ./target/debug/mnemo-cli --db mnemo.db conflicts
      ./target/debug/mnemo-cli --db mnemo.db stale
      ```

      ### 확인

      - 대체 연산의 롤백 테스트가 통과한다.
      - 내 실제 데이터에서 중복 후보와 충돌 후보를 각각 한 건 이상 찾아냈다.
      - 이 Stage를 하고 나서 폐기 함정 유형 점수가 어떻게 바뀌었는지 실험 노트에 있다.

      ### 이해 체크

      - 항목을 지우지 않고 상태를 바꾸는 방식의 단점은 무엇인가요? 어떻게 보완할 건가요?
      - 충돌 감지를 AI에게 맡기지 않고 사람이 판단하게 둔 이유는?
      - 감사 로그가 나중에 어떤 질문에 답해 줄까요?

      ## 정답 노트에서

      - **Stage 9 (수명/감사)**: `supersede` 는 "옛 항목 상태 변경, 새 항목 삽입, 연결" 셋이 **한 트랜잭션**이어야 해요. 중간 실패 테스트가 통과하는지로 확인해요.
    steps:
      - message: "[9] db.rs — v4 감사 로그, supersede, confirm"
        files:
          - path: mnemo-core/src/db.rs
            content: |
              use std::path::Path;
              use std::time::{SystemTime, UNIX_EPOCH};

              use rusqlite::{Connection, Row, params};

              use crate::error::{Error, Result};
              use crate::item::{Item, Kind, NewItem, Status};

              /// 순서대로 적용되는 마이그레이션. 인덱스 + 1 이 곧 user_version.
              const MIGRATIONS: &[&str] = &[r#"
                  CREATE TABLE items (
                      id            INTEGER PRIMARY KEY AUTOINCREMENT,
                      kind          TEXT NOT NULL,
                      scope         TEXT NOT NULL,
                      body          TEXT NOT NULL,
                      why           TEXT,
                      source        TEXT NOT NULL,
                      created_at    INTEGER NOT NULL,
                      status        TEXT NOT NULL DEFAULT 'active',
                      supersedes_id INTEGER REFERENCES items(id)
                  );
              "#,
              // v2: 키워드 색인. items 를 가리키는 external content 방식 + 동기화 트리거
              r#"
                  CREATE VIRTUAL TABLE items_fts USING fts5(
                      body, why,
                      content = 'items', content_rowid = 'id',
                      tokenize = 'unicode61'
                  );
                  CREATE TRIGGER items_ai AFTER INSERT ON items BEGIN
                      INSERT INTO items_fts(rowid, body, why) VALUES (new.id, new.body, new.why);
                  END;
                  CREATE TRIGGER items_ad AFTER DELETE ON items BEGIN
                      INSERT INTO items_fts(items_fts, rowid, body, why) VALUES ('delete', old.id, old.body, old.why);
                  END;
                  CREATE TRIGGER items_au AFTER UPDATE ON items BEGIN
                      INSERT INTO items_fts(items_fts, rowid, body, why) VALUES ('delete', old.id, old.body, old.why);
                      INSERT INTO items_fts(rowid, body, why) VALUES (new.id, new.body, new.why);
                  END;
                  INSERT INTO items_fts(items_fts) VALUES ('rebuild');
              "#,
              // v3: 임베딩. 본문이 바뀌면 그 항목의 벡터는 무효 -> 트리거로 지운다
              r#"
                  CREATE TABLE embeddings (
                      item_id    INTEGER NOT NULL REFERENCES items(id),
                      model      TEXT NOT NULL,
                      dim        INTEGER NOT NULL,
                      vec        BLOB NOT NULL,
                      created_at INTEGER NOT NULL,
                      PRIMARY KEY (item_id, model)
                  );
                  CREATE TRIGGER items_body_changed AFTER UPDATE OF body ON items BEGIN
                      DELETE FROM embeddings WHERE item_id = new.id;
                  END;
              "#,
              // v4: 감사 로그와 '마지막으로 확인한 시각'. 삽입 기록은 어떤 경로로 넣어도 남도록 트리거로 남긴다
              r#"
                  CREATE TABLE audit_log (
                      id      INTEGER PRIMARY KEY AUTOINCREMENT,
                      item_id INTEGER,
                      action  TEXT NOT NULL,     -- insert / supersede / confirm ...
                      actor   TEXT NOT NULL,     -- human / ai / import
                      at      INTEGER NOT NULL,  -- UTC 초
                      detail  TEXT
                  );
                  ALTER TABLE items ADD COLUMN checked_at INTEGER;
                  CREATE TRIGGER items_audit_insert AFTER INSERT ON items BEGIN
                      INSERT INTO audit_log (item_id, action, actor, at, detail)
                      VALUES (
                          new.id, 'insert',
                          CASE new.source WHEN 'manual' THEN 'human' WHEN 'import' THEN 'import' WHEN 'ai' THEN 'ai' ELSE new.source END,
                          new.created_at, new.kind || ':' || new.scope
                      );
                  END;
              "#];

              pub struct Db {
                  conn: Connection,
              }

              impl Db {
                  pub fn open(path: &Path) -> Result<Self> {
                      Self::init(Connection::open(path)?)
                  }

                  pub fn open_in_memory() -> Result<Self> {
                      Self::init(Connection::open_in_memory()?)
                  }

                  fn init(conn: Connection) -> Result<Self> {
                      conn.pragma_update(None, "foreign_keys", true)?;
                      let db = Self { conn };
                      db.migrate()?;
                      Ok(db)
                  }

                  pub fn conn(&self) -> &Connection {
                      &self.conn
                  }

                  pub fn user_version(&self) -> Result<i64> {
                      Ok(self.conn.query_row("PRAGMA user_version", [], |r| r.get(0))?)
                  }

                  fn migrate(&self) -> Result<()> {
                      let current = self.user_version()? as usize;
                      for (i, sql) in MIGRATIONS.iter().enumerate().skip(current) {
                          // 마이그레이션 하나는 트랜잭션 하나. 중간에 실패하면 버전도 안 오른다.
                          let tx = self.conn.unchecked_transaction()?;
                          tx.execute_batch(sql)?;
                          tx.pragma_update(None, "user_version", (i + 1) as i64)?;
                          tx.commit()?;
                      }
                      Ok(())
                  }

                  pub fn insert(&self, new: &NewItem) -> Result<i64> {
                      self.conn.execute(
                          "INSERT INTO items (kind, scope, body, why, source, created_at)
                           VALUES (?1, ?2, ?3, ?4, ?5, ?6)",
                          params![new.kind, new.scope, new.body, new.why, new.source, now_secs()],
                      )?;
                      Ok(self.conn.last_insert_rowid())
                  }

                  /// 전부 넣거나 전부 취소한다 (트랜잭션 하나).
                  pub fn insert_many(&self, items: &[NewItem]) -> Result<usize> {
                      let tx = self.conn.unchecked_transaction()?;
                      for it in items {
                          self.insert(it)?;
                      }
                      tx.commit()?;
                      Ok(items.len())
                  }

                  /// old 를 superseded 로 바꾸고, new 를 넣고, 둘을 연결한다. 전부 한 트랜잭션.
                  pub fn supersede(&self, old_id: i64, new: &NewItem) -> Result<i64> {
                      let tx = self.conn.unchecked_transaction()?;
                      let old = self.get(old_id)?.ok_or(Error::NotFound(old_id))?;
                      if old.status != Status::Active {
                          return Err(Error::Invalid(format!("#{old_id} 는 active 가 아니라서 대체할 수 없어요")));
                      }
                      let new_id = self.insert(new)?;
                      tx.execute("UPDATE items SET supersedes_id = ?1 WHERE id = ?2", params![old_id, new_id])?;
                      tx.execute("UPDATE items SET status = ?1 WHERE id = ?2", params![Status::Superseded, old_id])?;
                      self.audit(old_id, "supersede", "human", Some(&format!("#{new_id} 로 대체")))?;
                      tx.commit()?;
                      Ok(new_id)
                  }

                  /// 항목이 아직 맞다고 사람이 확인했다. '오래된 항목' 목록에서 빠진다.
                  pub fn confirm(&self, id: i64) -> Result<()> {
                      let tx = self.conn.unchecked_transaction()?;
                      let n = tx.execute(
                          "UPDATE items SET checked_at = ?1 WHERE id = ?2 AND status = 'active'",
                          params![now_secs(), id],
                      )?;
                      if n == 0 {
                          return Err(Error::NotFound(id));
                      }
                      self.audit(id, "confirm", "human", None)?;
                      tx.commit()?;
                      Ok(())
                  }

                  fn audit(&self, item_id: i64, action: &str, actor: &str, detail: Option<&str>) -> Result<()> {
                      self.conn.execute(
                          "INSERT INTO audit_log (item_id, action, actor, at, detail) VALUES (?1, ?2, ?3, ?4, ?5)",
                          params![item_id, action, actor, now_secs(), detail],
                      )?;
                      Ok(())
                  }

                  pub fn get(&self, id: i64) -> Result<Option<Item>> {
                      let mut stmt = self.conn.prepare(
                          "SELECT id, kind, scope, body, why, source, created_at, status, supersedes_id
                           FROM items WHERE id = ?1",
                      )?;
                      let mut rows = stmt.query_map([id], row_to_item)?;
                      Ok(rows.next().transpose()?)
                  }

                  pub fn list(&self, kind: Option<Kind>, scope: Option<&str>, status: Status) -> Result<Vec<Item>> {
                      let mut stmt = self.conn.prepare(
                          "SELECT id, kind, scope, body, why, source, created_at, status, supersedes_id
                           FROM items
                           WHERE status = ?1
                             AND (?2 IS NULL OR kind = ?2)
                             AND (?3 IS NULL OR scope = ?3)
                           ORDER BY id",
                      )?;
                      Ok(stmt
                          .query_map(params![status, kind, scope], row_to_item)?
                          .collect::<rusqlite::Result<Vec<_>>>()?)
                  }
              }

              fn row_to_item(r: &Row<'_>) -> rusqlite::Result<Item> {
                  Ok(Item {
                      id: r.get(0)?,
                      kind: r.get(1)?,
                      scope: r.get(2)?,
                      body: r.get(3)?,
                      why: r.get(4)?,
                      source: r.get(5)?,
                      created_at: r.get(6)?,
                      status: r.get(7)?,
                      supersedes_id: r.get(8)?,
                  })
              }

              pub fn now_secs() -> i64 {
                  SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .map(|d| d.as_secs() as i64)
                      .unwrap_or(0)
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  fn sample(kind: Kind, scope: &str, body: &str) -> NewItem {
                      NewItem {
                          kind,
                          scope: scope.into(),
                          body: body.into(),
                          why: None,
                          source: "test".into(),
                      }
                  }

                  #[test]
                  fn insert_then_get() {
                      let db = Db::open_in_memory().unwrap();
                      let id = db.insert(&sample(Kind::Project, "projA", "상태 관리는 단순하게")).unwrap();
                      let item = db.get(id).unwrap().unwrap();
                      assert_eq!(item.body, "상태 관리는 단순하게");
                      assert_eq!(item.kind, Kind::Project);
                      assert_eq!(item.status, Status::Active);
                      assert!(db.get(999).unwrap().is_none());
                  }

                  #[test]
                  fn list_filters() {
                      let db = Db::open_in_memory().unwrap();
                      db.insert(&sample(Kind::Project, "projA", "a")).unwrap();
                      db.insert(&sample(Kind::Pref, "global", "b")).unwrap();
                      assert_eq!(db.list(None, None, Status::Active).unwrap().len(), 2);
                      assert_eq!(db.list(Some(Kind::Pref), None, Status::Active).unwrap().len(), 1);
                      assert_eq!(db.list(None, Some("projA"), Status::Active).unwrap().len(), 1);
                      assert_eq!(db.list(None, None, Status::Archived).unwrap().len(), 0);
                  }

                  #[test]
                  fn migration_is_idempotent() {
                      let path = std::env::temp_dir().join(format!("mnemo-test-{}", std::process::id()));
                      let _ = std::fs::remove_file(&path);
                      let db = Db::open(&path).unwrap();
                      assert_eq!(db.user_version().unwrap(), MIGRATIONS.len() as i64);
                      drop(db);
                      let db = Db::open(&path).unwrap(); // 다시 열어도 에러 없이 같은 버전
                      assert_eq!(db.user_version().unwrap(), MIGRATIONS.len() as i64);
                      let _ = std::fs::remove_file(&path);
                  }

                  fn count(db: &Db, table: &str) -> i64 {
                      db.conn()
                          .query_row(&format!("SELECT COUNT(*) FROM {table}"), [], |r| r.get(0))
                          .unwrap()
                  }

                  #[test]
                  fn supersede_links_and_audits() {
                      let db = Db::open_in_memory().unwrap();
                      let old = db.insert(&sample(Kind::Project, "projA", "상태 관리는 A")).unwrap();
                      let new = db.supersede(old, &sample(Kind::Project, "projA", "상태 관리는 B")).unwrap();
                      assert_eq!(db.get(old).unwrap().unwrap().status, Status::Superseded);
                      assert_eq!(db.get(new).unwrap().unwrap().supersedes_id, Some(old));
                      assert_eq!(count(&db, "audit_log"), 3); // insert, insert, supersede
                      assert!(db.supersede(old, &sample(Kind::Project, "projA", "C")).is_err());
                      assert!(matches!(db.supersede(999, &sample(Kind::Work, "g", "x")), Err(Error::NotFound(999))));
                  }

                  #[test]
                  fn supersede_rolls_back_when_second_write_fails() {
                      let db = Db::open_in_memory().unwrap();
                      let old = db.insert(&sample(Kind::Project, "projA", "a")).unwrap();
                      // 상태 변경(두 번째 쓰기)이 반드시 실패하게 만든다
                      db.conn()
                          .execute_batch(
                              "CREATE TRIGGER no_status_change BEFORE UPDATE OF status ON items
                               BEGIN SELECT RAISE(ABORT, 'boom'); END;",
                          )
                          .unwrap();
                      assert!(db.supersede(old, &sample(Kind::Project, "projA", "b")).is_err());
                      assert_eq!(count(&db, "items"), 1); // 새 항목이 남지 않았다
                      assert_eq!(count(&db, "audit_log"), 1);
                      assert_eq!(db.get(old).unwrap().unwrap().status, Status::Active);
                  }

                  #[test]
                  fn confirm_marks_checked() {
                      let db = Db::open_in_memory().unwrap();
                      let id = db.insert(&sample(Kind::Work, "global", "x")).unwrap();
                      db.confirm(id).unwrap();
                      let checked: Option<i64> = db
                          .conn()
                          .query_row("SELECT checked_at FROM items WHERE id = ?1", [id], |r| r.get(0))
                          .unwrap();
                      assert!(checked.is_some());
                      assert!(db.confirm(999).is_err());
                  }

                  #[test]
                  fn unknown_status_is_an_error_not_a_panic() {
                      let db = Db::open_in_memory().unwrap();
                      let id = db.insert(&sample(Kind::Work, "global", "x")).unwrap();
                      db.conn().execute("UPDATE items SET status = 'weird' WHERE id = ?1", [id]).unwrap();
                      assert!(db.get(id).is_err());
                  }
              }
      - message: "[9] search.rs — --history 용 search_history"
        files:
          - path: mnemo-core/src/search.rs
            content: |
              use crate::db::Db;
              use crate::error::Result;

              #[derive(Debug, Clone, PartialEq)]
              pub struct Scored {
                  pub id: i64,
                  /// 검색기마다 의미가 다르다 (FTS 는 bm25, 작을수록 좋음). 순위만 믿자.
                  pub score: f64,
              }

              /// 질문을 받아 순위가 매겨진 결과를 돌려주는 검색기. Stage 6, 7 에서도 이걸 구현한다.
              #[allow(async_fn_in_trait)]
              pub trait Retriever {
                  async fn search(&self, query: &str, k: usize) -> Result<Vec<Scored>>;
              }

              pub struct FtsRetriever<'a> {
                  pub db: &'a Db,
              }

              /// 사용자 입력을 FTS5 MATCH 문법에 안전한 형태로 바꾼다.
              /// 각 단어를 큰따옴표로 감싸고(내부의 " 는 "" 로) OR 로 잇는다. 단어가 없으면 None.
              pub fn sanitize_query(input: &str) -> Option<String> {
                  let tokens: Vec<String> = input
                      .split_whitespace()
                      .map(|t| t.replace('"', r#""""#))
                      .filter(|t| !t.is_empty())
                      .map(|t| format!(r#""{t}""#))
                      .collect();
                  if tokens.is_empty() { None } else { Some(tokens.join(" OR ")) }
              }

              impl Retriever for FtsRetriever<'_> {
                  async fn search(&self, query: &str, k: usize) -> Result<Vec<Scored>> {
                      let Some(q) = sanitize_query(query) else {
                          return Ok(vec![]);
                      };
                      let mut stmt = self.db.conn().prepare(
                          "SELECT items.id, bm25(items_fts)
                           FROM items_fts JOIN items ON items.id = items_fts.rowid
                           WHERE items_fts MATCH ?1 AND items.status = 'active'
                           ORDER BY bm25(items_fts)
                           LIMIT ?2",
                      )?;
                      let rows = stmt.query_map(rusqlite::params![q, k as i64], |r| {
                          Ok(Scored { id: r.get(0)?, score: r.get(1)? })
                      })?;
                      Ok(rows.collect::<std::result::Result<Vec<_>, _>>()?)
                  }
              }

              /// 대체·보관된 항목까지 포함해 키워드로 찾는다 (`--history`). 상태는 호출한 쪽이 보여 준다.
              pub fn search_history(db: &Db, query: &str, k: usize) -> Result<Vec<Scored>> {
                  let Some(q) = sanitize_query(query) else {
                      return Ok(vec![]);
                  };
                  let mut stmt = db.conn().prepare(
                      "SELECT items.id, bm25(items_fts)
                       FROM items_fts JOIN items ON items.id = items_fts.rowid
                       WHERE items_fts MATCH ?1
                       ORDER BY bm25(items_fts)
                       LIMIT ?2",
                  )?;
                  let rows = stmt.query_map(rusqlite::params![q, k as i64], |r| {
                      Ok(Scored {
                          id: r.get(0)?,
                          score: r.get(1)?,
                      })
                  })?;
                  Ok(rows.collect::<std::result::Result<Vec<_>, _>>()?)
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::item::{Kind, NewItem};

                  fn add(db: &Db, body: &str) -> i64 {
                      db.insert(&NewItem { kind: Kind::Work, scope: "global".into(), body: body.into(), why: None, source: "t".into() }).unwrap()
                  }

                  #[test]
                  fn sanitize_handles_special_chars() {
                      assert_eq!(sanitize_query("a-b c:d").unwrap(), r#""a-b" OR "c:d""#);
                      assert_eq!(sanitize_query(r#"say "hi""#).unwrap(), r#""say" OR """hi""""#);
                      assert_eq!(sanitize_query("   "), None);
                  }

                  #[tokio::test]
                  async fn finds_active_only() {
                      let db = Db::open_in_memory().unwrap();
                      let a = add(&db, "deploy on friday is banned");
                      let b = add(&db, "deploy with docker");
                      db.conn().execute("UPDATE items SET status = 'superseded' WHERE id = ?1", [b]).unwrap();
                      let r = FtsRetriever { db: &db };
                      let ids: Vec<i64> = r.search("deploy", 5).await.unwrap().into_iter().map(|s| s.id).collect();
                      assert_eq!(ids, vec![a]);
                  }

                  #[test]
                  fn history_includes_superseded() {
                      let db = Db::open_in_memory().unwrap();
                      let a = add(&db, "deploy on friday");
                      db.conn()
                          .execute("UPDATE items SET status = 'superseded' WHERE id = ?1", [a])
                          .unwrap();
                      let ids: Vec<i64> = search_history(&db, "deploy", 5).unwrap().into_iter().map(|s| s.id).collect();
                      assert_eq!(ids, vec![a]);
                  }

                  #[tokio::test]
                  async fn weird_input_does_not_error() {
                      let db = Db::open_in_memory().unwrap();
                      add(&db, "hello world");
                      let r = FtsRetriever { db: &db };
                      for q in [r#"""#, "a:b", "-x", "(", "AND OR", "한글 검색어"] {
                          assert!(r.search(q, 3).await.is_ok(), "{q}");
                      }
                  }

                  #[tokio::test]
                  async fn index_follows_updates() {
                      let db = Db::open_in_memory().unwrap();
                      let id = add(&db, "old text");
                      db.conn().execute("UPDATE items SET body = 'new text' WHERE id = ?1", [id]).unwrap();
                      let r = FtsRetriever { db: &db };
                      assert!(r.search("old", 3).await.unwrap().is_empty());
                      assert_eq!(r.search("new", 3).await.unwrap().len(), 1);
                  }
              }
      - message: "[9] manage.rs — 중복 후보, 충돌 후보, 오래된 항목"
        files:
          - path: mnemo-core/src/manage.rs
            content: |
              //! 기억 관리: 중복 후보, 충돌 후보, 오래된 항목.
              //! 어느 것도 자동으로 고치지 않는다. 후보를 보여 주고 판단은 사람이 한다.

              use crate::db::{Db, now_secs};
              use crate::embed::Embedder;
              use crate::error::Result;
              use crate::item::{Item, Kind};
              use crate::vector::{cosine, load_vectors, top_k_heap};

              /// 이 이상이면 '같은 말을 두 번' 했을 가능성이 크다 (중복 후보).
              pub const DUPLICATE_THRESHOLD: f32 = 0.9;
              /// 이 이상이면서 중복 기준보다 낮으면 '비슷한 주제에 다른 말' 후보 (충돌 후보).
              pub const CONFLICT_THRESHOLD: f32 = 0.6;

              /// 새로 넣으려는 글과 비슷한 active 항목을 유사도 내림차순으로 돌려준다.
              pub async fn similar_to(
                  db: &Db,
                  embedder: &impl Embedder,
                  text: &str,
                  min: f32,
              ) -> Result<Vec<(i64, f32)>> {
                  let q = embedder.embed(&[text.to_string()]).await?.remove(0);
                  let all = load_vectors(db, embedder.model_id())?;
                  let scored = all
                      .iter()
                      .map(|(id, v)| (*id, cosine(&q, v)))
                      .filter(|(_, s)| *s >= min);
                  Ok(top_k_heap(scored, 5))
              }

              /// 같은 scope 안에서 유사도가 [lo, hi) 인 active 항목 쌍. 충돌 후보 목록.
              pub fn similar_pairs(db: &Db, model: &str, lo: f32, hi: f32) -> Result<Vec<(i64, i64, f32)>> {
                  let vectors = load_vectors(db, model)?;
                  let mut with_scope = Vec::new();
                  for (id, v) in vectors {
                      if let Some(it) = db.get(id)? {
                          with_scope.push((it.scope, id, v));
                      }
                  }
                  let mut out = Vec::new();
                  for (i, (scope_a, a, va)) in with_scope.iter().enumerate() {
                      for (scope_b, b, vb) in &with_scope[i + 1..] {
                          if scope_a != scope_b {
                              continue;
                          }
                          let s = cosine(va, vb);
                          if s >= lo && s < hi {
                              out.push((*a.min(b), *a.max(b), s));
                          }
                      }
                  }
                  out.sort_by(|x, y| y.2.total_cmp(&x.2));
                  Ok(out)
              }

              /// 종류마다 '오래됐다'고 볼 기간(일). 프로젝트 맥락은 빨리 낡고 선호는 오래 간다.
              pub fn stale_after_days(kind: Kind) -> i64 {
                  match kind {
                      Kind::Project => 90,
                      Kind::Work => 180,
                      Kind::Pref => 365,
                  }
              }

              /// 마지막 확인(없으면 생성) 이후 기간이 지난 active 항목.
              pub fn stale_items(db: &Db, now: i64) -> Result<Vec<Item>> {
                  let mut stmt = db.conn().prepare(
                      "SELECT id, kind, COALESCE(checked_at, created_at) FROM items
                       WHERE status = 'active' ORDER BY id",
                  )?;
                  let rows = stmt
                      .query_map([], |r| {
                          Ok((
                              r.get::<_, i64>(0)?,
                              r.get::<_, Kind>(1)?,
                              r.get::<_, i64>(2)?,
                          ))
                      })?
                      .collect::<rusqlite::Result<Vec<_>>>()?;
                  let mut out = Vec::new();
                  for (id, kind, last) in rows {
                      if now - last > stale_after_days(kind) * 86_400
                          && let Some(it) = db.get(id)?
                      {
                          out.push(it);
                      }
                  }
                  Ok(out)
              }

              /// 지금 기준의 오래된 항목.
              pub fn stale_now(db: &Db) -> Result<Vec<Item>> {
                  stale_items(db, now_secs())
              }

              #[cfg(test)]
              mod tests {
                  use super::*;
                  use crate::embed::{FakeEmbedder, embed_missing};
                  use crate::item::NewItem;

                  fn add(db: &Db, kind: Kind, scope: &str, body: &str) -> i64 {
                      db.insert(&NewItem {
                          kind,
                          scope: scope.into(),
                          body: body.into(),
                          why: None,
                          source: "t".into(),
                      })
                      .unwrap()
                  }

                  #[tokio::test]
                  async fn finds_duplicate_candidate() {
                      let db = Db::open_in_memory().unwrap();
                      let a = add(&db, Kind::Work, "global", "deploy on friday is banned");
                      add(&db, Kind::Work, "global", "use sqlite for storage");
                      let e = FakeEmbedder { dim: 256 };
                      embed_missing(&db, &e, 10).await.unwrap();
                      let hits = similar_to(&db, &e, "deploy on friday is banned!", DUPLICATE_THRESHOLD)
                          .await
                          .unwrap();
                      assert_eq!(hits.len(), 1);
                      assert_eq!(hits[0].0, a);
                  }

                  #[tokio::test]
                  async fn pairs_stay_within_scope() {
                      let db = Db::open_in_memory().unwrap();
                      let a = add(&db, Kind::Project, "projA", "state management with signals");
                      let b = add(&db, Kind::Project, "projA", "state management with redux");
                      add(&db, Kind::Project, "projB", "state management with signals");
                      let e = FakeEmbedder { dim: 256 };
                      embed_missing(&db, &e, 10).await.unwrap();
                      let pairs = similar_pairs(&db, e.model_id(), CONFLICT_THRESHOLD, 0.99).unwrap();
                      assert_eq!(pairs.len(), 1);
                      assert_eq!((pairs[0].0, pairs[0].1), (a, b));
                  }

                  #[test]
                  fn stale_depends_on_kind_and_confirm() {
                      let db = Db::open_in_memory().unwrap();
                      let p = add(&db, Kind::Project, "projA", "old project fact");
                      let pref = add(&db, Kind::Pref, "global", "old preference");
                      let now = now_secs() + 100 * 86_400; // 100일 뒤
                      let ids: Vec<i64> = stale_items(&db, now)
                          .unwrap()
                          .iter()
                          .map(|i| i.id)
                          .collect();
                      assert_eq!(ids, vec![p]); // 선호는 아직 오래되지 않았다
                      assert!(!ids.contains(&pref));

                      db.confirm(p).unwrap();
                      assert!(stale_items(&db, now_secs() + 10).unwrap().is_empty());
                  }
              }
