      - message: "[6] main.rs — --mode 로 검색기 고르기"
        files:
          - path: mnemo-cli/src/main.rs
            content: |
              use std::fs;
              use std::path::PathBuf;

              use anyhow::{Context, Result, bail};
              use clap::{Parser, Subcommand, ValueEnum};
              use mnemo_core::embed::{Embedder, FakeEmbedder, HttpEmbedder, embed_missing};
              use mnemo_core::search::{FtsRetriever, Retriever, Scored};
              use mnemo_core::vector::VectorRetriever;
              use mnemo_core::{Db, Item, Kind, NewItem, Status, eval, import};

              #[derive(Parser)]
              #[command(version, about = "내 지식 DB")]
              struct Cli {
                  /// DB 파일 경로 (옵션 > MNEMO_DB 환경변수 > ./mnemo.db)
                  #[arg(long, env = "MNEMO_DB", default_value = "mnemo.db", global = true)]
                  db: PathBuf,

                  #[command(subcommand)]
                  cmd: Cmd,
              }

              // MNEMO_EMBED_URL 이 있으면 실제 제공자, 없으면 가짜 임베더
              enum AnyEmbedder {
                  Fake(FakeEmbedder),
                  Http(HttpEmbedder),
              }

              impl AnyEmbedder {
                  fn from_env() -> Result<Self> {
                      if std::env::var_os("MNEMO_EMBED_URL").is_some() {
                          Ok(Self::Http(HttpEmbedder::from_env()?))
                      } else {
                          Ok(Self::Fake(FakeEmbedder { dim: 128 }))
                      }
                  }
              }

              impl Embedder for AnyEmbedder {
                  fn model_id(&self) -> &str {
                      match self {
                          Self::Fake(e) => e.model_id(),
                          Self::Http(e) => e.model_id(),
                      }
                  }
                  fn dim(&self) -> usize {
                      match self {
                          Self::Fake(e) => e.dim(),
                          Self::Http(e) => e.dim(),
                      }
                  }
                  async fn embed(&self, texts: &[String]) -> Result<Vec<Vec<f32>>> {
                      match self {
                          Self::Fake(e) => e.embed(texts).await,
                          Self::Http(e) => e.embed(texts).await,
                      }
                  }
              }

              #[derive(Clone, Copy, ValueEnum)]
              enum Mode {
                  Fts,
                  Vector,
              }

              /// 모드에 맞는 검색을 돌린다. async fn 이 든 trait 는 `dyn` 으로 못 쓰니 match 로 갈라낸다.
              async fn run_search(db: &Db, mode: Mode, q: &str, k: usize) -> Result<Vec<Scored>> {
                  let emb = AnyEmbedder::from_env()?;
                  Ok(match mode {
                      Mode::Fts => FtsRetriever { db }.search(q, k).await?,
                      Mode::Vector => VectorRetriever { db, embedder: &emb }.search(q, k).await?,
                  })
              }

              #[derive(Subcommand)]
              enum Cmd {
                  /// 항목 하나 추가
                  Add {
                      /// project / pref / work
                      kind: Kind,
                      /// 프로젝트 이름 또는 global
                      scope: String,
                      /// 본문 (사실 하나)
                      body: String,
                      /// 이유
                      #[arg(long)]
                      why: Option<String>,
                  },
                  /// 항목 목록
                  List {
                      #[arg(long)]
                      kind: Option<Kind>,
                      #[arg(long)]
                      scope: Option<String>,
                      #[arg(long, default_value = "active")]
                      status: Status,
                  },
                  /// 항목 하나를 자세히
                  Get { id: i64 },
                  /// 텍스트 파일에서 한 줄에 하나씩 가져오기
                  Import { file: PathBuf },
                  /// 평가 파일의 정답 id가 DB에 다 있는지 확인
                  EvalCheck { file: PathBuf },
                  /// 질문으로 검색
                  Search {
                      query: String,
                      #[arg(long, value_enum, default_value = "fts")]
                      mode: Mode,
                      #[arg(short, default_value_t = 5)]
                      k: usize,
                  },
                  /// 평가 세트로 점수 내기 (봉인 문항은 기본 제외)
                  Eval {
                      #[arg(default_value = "eval.json")]
                      file: PathBuf,
                      #[arg(long, value_enum, default_value = "fts")]
                      mode: Mode,
                      /// 봉인 문항도 포함 (Stage 7 마지막에 딱 한 번만!)
                      #[arg(long)]
                      include_sealed: bool,
                  },
                  /// 아직 임베딩이 없는 항목을 임베딩
                  Embed,
              }

              #[tokio::main]
              async fn main() -> Result<()> {
                  let cli = Cli::parse();
                  let db = Db::open(&cli.db).with_context(|| format!("{} 을 열지 못했어요", cli.db.display()))?;

                  match cli.cmd {
                      Cmd::Add { kind, scope, body, why } => {
                          let id = db.insert(&NewItem { kind, scope, body, why, source: "manual".into() })?;
                          println!("추가됨: #{id}");
                      }
                      Cmd::List { kind, scope, status } => {
                          for it in db.list(kind, scope.as_deref(), status)? {
                              println!("#{:<4} [{}/{}] {}", it.id, it.kind.as_str(), it.scope, it.body);
                          }
                      }
                      Cmd::Get { id } => match db.get(id)? {
                          Some(it) => print_item(&it),
                          None => bail!("#{id} 항목이 없어요"),
                      },
                      Cmd::Import { file } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          match import::parse_lines(&text) {
                              Ok(items) => {
                                  let n = db.insert_many(&items)?;
                                  println!("{n}개를 가져왔어요");
                              }
                              Err(errors) => {
                                  for (line, msg) in &errors {
                                      eprintln!("{}:{line}: {msg}", file.display());
                                  }
                                  bail!("{}줄에 문제가 있어서 아무것도 넣지 않았어요", errors.len());
                              }
                          }
                      }
                      Cmd::EvalCheck { file } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          let qs = eval::load_questions(&text).context("평가 파일 형식이 잘못됐어요")?;
                          let missing = eval::missing_answers(&db, &qs)?;
                          for (q, id) in &missing {
                              eprintln!("정답 id #{id} 가 DB에 없어요: {q}");
                          }
                          if !missing.is_empty() {
                              bail!("{}건의 정답 id를 고치세요", missing.len());
                          }
                          let sealed = qs.iter().filter(|q| q.sealed).count();
                          println!("질문 {}개 (봉인 {}개), 정답 id 모두 확인됨", qs.len(), sealed);
                      }
                      Cmd::Search { query, mode, k } => {
                          for (i, hit) in run_search(&db, mode, &query, k).await?.iter().enumerate() {
                              if let Some(it) = db.get(hit.id)? {
                                  println!("{:>2}) [{}/{}] {}  ({:.2})", i + 1, it.kind.as_str(), it.scope, it.body, hit.score);
                              }
                          }
                      }
                      Cmd::Eval { file, mode, include_sealed } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          let qs = eval::load_questions(&text).context("평가 파일 형식이 잘못됐어요")?;
                          let emb = AnyEmbedder::from_env()?;
                          let report = match mode {
                              Mode::Fts => eval::run_eval(&FtsRetriever { db: &db }, &qs, include_sealed).await?,
                              Mode::Vector => eval::run_eval(&VectorRetriever { db: &db, embedder: &emb }, &qs, include_sealed).await?,
                          };

                          println!("{:<14} {:>3} {:>9} {:>9} {:>7}", "유형", "n", "Recall@3", "Recall@5", "MRR");
                          let line = |name: &str, r: &eval::Row| {
                              println!("{:<14} {:>3} {:>9.2} {:>9.2} {:>7.2}", name, r.n, r.recall3, r.recall5, r.mrr);
                              if let Some(e) = r.empty_rate {
                                  println!("{:<14}     (정답 없음 중 빈 결과 비율 {:.2})", "", e);
                              }
                          };
                          line("전체", &report.overall);
                          for (tag, row) in &report.by_tag {
                              line(tag, row);
                          }
                      }
                      Cmd::Embed => {
                          let n = embed_missing(&db, &AnyEmbedder::from_env()?, 32).await?;
                          println!("{n}개를 임베딩했어요");
                      }
                  }
                  Ok(())
              }

              fn print_item(it: &Item) {
                  println!("id         {}", it.id);
                  println!("kind       {}", it.kind.as_str());
                  println!("scope      {}", it.scope);
                  println!("body       {}", it.body);
                  println!("why        {}", it.why.as_deref().unwrap_or("-"));
                  println!("source     {}", it.source);
                  println!("status     {}", it.status.as_str());
                  println!("created_at {} (UTC 초)", it.created_at);
              }
  - id: "7"
    title: 혼합 검색과 튜닝
    doc: |
      # 혼합 검색과 튜닝

      **목표:** 키워드와 벡터 결과를 합치고, 변경마다 **점수로 판단**하는 습관을 만든다.

      **새로 배우는 것:** RRF(순위 합치기), 임계값, 제네릭과 `dyn`의 선택, 실험 노트

      ### 7-1. 순위를 합치는 법

      두 검색의 점수는 **스케일이 달라서 그대로 더할 수 없어요.** FTS5의 bm25는 음수에 가까울수록 좋고 범위가 정해져 있지 않지만, 코사인 유사도는 -1에서 1 사이예요. 그래서 점수 대신 **순위**를 합치는 RRF를 써요. 각 검색에서 항목의 순위가 r이면 그 항목은 `1 / (k + r)` 점을 받고, 두 검색에서 받은 점수를 더해요. k는 상수예요.

      ### 7-2. 요구사항

      - [ ] `HybridRetriever`를 만든다. 두 `Retriever`를 받아 RRF로 합친다. 제네릭과 `dyn Retriever` 중 무엇을 쓸지 고르고 이유를 적는다.
      - [ ] k를 10, 60, 100으로 바꿔 가며 점수를 비교한다. (60이 흔히 쓰이지만 **내 데이터에서도 그런지** 확인한다.)
      - [ ] 한쪽에만 나온 항목이 어떻게 점수를 받는지 확인한다.
      - [ ] '점수를 정규화해서 가중합하는 방식'을 한 번 구현해서 RRF와 비교한다. 왜 어려운지 직접 체감한다.
      - [ ] **정답 없음 유형**을 처리한다. 최종 점수가 임계값보다 낮으면 아무것도 돌려주지 않게 하고, 임계값별로 '정답 없는 질문을 제대로 비운 비율'과 '정답 있는 질문을 잘못 비운 비율'을 표로 만든다.
      - [ ] 폐기 함정과 범위 함정 유형의 점수가 오르도록 필터나 가중치를 설계한다.
      - [ ] 임베딩할 텍스트의 구성(본문만 / 본문과 이유 / 종류와 범위를 붙임)을 바꿔 비교한다. (재임베딩 필요)
      - [ ] **실험 노트**를 쓴다. 한 번에 한 가지만 바꾸고, 열은 이렇게: 가설 / 바꾼 것 / 전 점수 / 후 점수 / 결론.
      - [ ] 튜닝이 끝나면 **봉인한 10문항으로 딱 한 번** 최종 점수를 잰다. 20문항 점수와 비교하면 과적합이 얼마나 됐는지 보인다.

      <details><summary>힌트 1: 필터는 어디서</summary>

      - 폐기된 항목이 상위에 올라왔다가 나중에 걸러지면 top-k에 빈자리가 생겨요. 합치기 **전에** 거르는 게 대개 낫지만, 직접 두 방식을 비교해 보세요.

      </details>

      <details><summary>힌트 2: 임계값을 정하는 법</summary>

      - RRF 점수는 절대적인 의미가 약해서, 임계값을 정하기 어려울 수 있어요. 벡터 쪽 코사인 유사도에 임계값을 두는 방법도 있어요. 둘 다 시도해 보고 이유와 함께 선택하세요.

      </details>

      <details><summary>힌트 3: 점수가 정체될 때</summary>

      - 질문 하나씩 열어 보세요. 정답이 몇 위에 나왔고, 1위로 나온 항목은 무엇이고, 왜 그랬는지. 평균 점수보다 **실패한 질문 하나**를 읽는 게 훨씬 많이 알려줘요.

      </details>

      ### 단계별 코드

      원래 가이드에서는 RRF 계산과 `HybridRetriever` 의 본문이 숙제였어요. 여기서는 정답 노트의 답까지 채운 완성본을 칩니다. 임계값, 가중합 비교, 필터 설계, 실험은 전부 코드 없이 요구사항대로 해요.

      **1) mnemo-core/src/hybrid.rs** (새 파일. lib.rs 에 `pub mod hybrid;` 추가)

      ▶ `mnemo-core/src/lib.rs`, `mnemo-core/src/hybrid.rs` — 재생에서 따라 칩니다

      **2) mnemo-cli/src/main.rs** — `Mode` 에 `Hybrid` 를 추가하고, `run_search` 와 `Cmd::Eval` 의 match 에 같은 모양으로 추가해요.

      ▶ `mnemo-cli/src/main.rs` — 재생에서 따라 칩니다

      `rrf_k: 60.0` 을 10, 100 으로 바꿔 가며 점수를 비교하는 게 요구사항이에요. 지금은 코드에 박혀 있으니 옵션으로 빼는 것도 연습이에요.

      **확인**

      ```
      cargo test -p mnemo-core
      ./target/debug/mnemo-cli --db mnemo.db eval eval.json --mode hybrid
      ```

      ### 확인

      - 키워드 / 벡터 / 혼합의 유형별 점수 표.
      - 실험 노트에 최소 6개의 실험이 있고, **점수가 오르지 않은 실험**도 기록돼 있다.
      - 봉인 세트 최종 점수와, 20문항 튜닝 점수의 차이를 설명할 수 있다.

      ### 이해 체크

      - 점수를 직접 더하지 않고 순위를 쓰는 이유는?
      - 튜닝 점수는 오르는데 봉인 점수는 안 오른다면 무슨 일이 생긴 걸까요?
      - 질문 30개로 얻은 결론을 얼마나 믿을 수 있나요? 더 믿으려면 무엇을 해야 하나요?

      ## 정답 노트에서

      - **점수가 아니라 순위를 쓰는 이유**: bm25(작을수록 좋음)와 코사인(클수록 좋음)은 단위가 달라서 더할 수 없어요. 순위는 둘 다 같은 말이에요.
      - **k=60**: 값이 클수록 상위권과 하위권의 점수 차가 줄어요. 정답은 없고 평가로 고르는 값이에요.
      - **정렬에 `.then(a.0.cmp(&b.0))`**: HashMap 순회 순서는 매번 달라서, 동점일 때 id 로 고정해야 결과가 재현돼요.
      - **제네릭인 이유**: async fn 이 있는 trait 는 `dyn` 으로 못 써요. 그래서 CLI 에서는 `match` 로 갈라요.
      - 하이브리드가 항상 이기지는 않는 이유 → 한쪽이 훨씬 나쁘면 합쳐도 끌려 내려가요. 유형별 표(tag)로 어디서 이득인지 확인하세요.
    steps:
      - message: "[7] hybrid.rs — RRF 와 HybridRetriever"
        files:
          - path: mnemo-core/src/hybrid.rs
            content: |
              use std::collections::HashMap;

              use anyhow::Result;

              use crate::search::{Retriever, Scored};

              /// 여러 순위 목록을 RRF 로 합친다. 점수 = Σ 1/(k + 순위), 순위는 1부터.
              /// 점수 내림차순으로 돌려주고, 점수가 같으면 id 가 작은 쪽이 먼저 (결과가 매번 같도록).
              pub fn rrf(lists: &[Vec<i64>], k: f64) -> Vec<(i64, f64)> {
                  let mut score: HashMap<i64, f64> = HashMap::new();
                  for list in lists {
                      for (i, id) in list.iter().enumerate() {
                          *score.entry(*id).or_default() += 1.0 / (k + (i + 1) as f64);
                      }
                  }
                  let mut out: Vec<(i64, f64)> = score.into_iter().collect();
                  out.sort_by(|a, b| b.1.total_cmp(&a.1).then(a.0.cmp(&b.0)));
                  out
              }

              /// async fn 이 들어간 trait 는 `dyn` 으로 못 쓴다. 그래서 제네릭으로 받는다.
              pub struct HybridRetriever<A: Retriever, B: Retriever> {
                  pub a: A,
                  pub b: B,
                  pub rrf_k: f64,
                  /// 각 검색기에서 몇 개씩 가져와 합칠지
                  pub fetch: usize,
              }

              impl<A: Retriever, B: Retriever> Retriever for HybridRetriever<A, B> {
                  async fn search(&self, query: &str, k: usize) -> Result<Vec<Scored>> {
                      let ids = |v: Vec<Scored>| v.into_iter().map(|s| s.id).collect::<Vec<_>>();
                      let la = ids(self.a.search(query, self.fetch).await?);
                      let lb = ids(self.b.search(query, self.fetch).await?);
                      Ok(rrf(&[la, lb], self.rrf_k)
                          .into_iter()
                          .take(k)
                          .map(|(id, score)| Scored { id, score })
                          .collect())
                  }
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  #[test]
                  fn both_lists_beat_one_list() {
                      let out = rrf(&[vec![1, 2, 3], vec![3, 4]], 60.0);
                      assert_eq!(out[0].0, 3); // 두 목록에 다 나온 3이 1위
                      assert!(out.iter().any(|(id, _)| *id == 4)); // 한쪽에만 나온 항목도 점수를 받는다
                  }

                  #[test]
                  fn rank_matters() {
                      let out = rrf(&[vec![1, 2]], 60.0);
                      assert!(out[0].1 > out[1].1);
                      assert!((out[0].1 - 1.0 / 61.0).abs() < 1e-12);
                  }
              }
      - message: "[7] lib.rs — hybrid 모듈 추가"
