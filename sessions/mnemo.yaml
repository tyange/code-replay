      - message: "[8] lib.rs — error 모듈과 Result 공개"
        files:
          - path: mnemo-core/src/lib.rs
            content: |
              pub mod db;
              pub mod embed;
              pub mod error;
              pub mod eval;
              pub mod hybrid;
              pub mod import;
