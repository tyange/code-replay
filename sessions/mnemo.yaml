      - message: "[7] main.rs — hybrid 모드"
        files:
          - path: mnemo-cli/src/main.rs
            content: |
              use std::fs;
              use std::path::PathBuf;

              use anyhow::{Context, Result, bail};
              use clap::{Parser, Subcommand, ValueEnum};
              use mnemo_core::embed::{Embedder, FakeEmbedder, HttpEmbedder, embed_missing};
              use mnemo_core::hybrid::HybridRetriever;
              use mnemo_core::search::{FtsRetriever, Retriever, Scored};
              use mnemo_core::vector::VectorRetriever;
              use mnemo_core::{Db, Item, Kind, NewItem, Status, eval, import};

              #[derive(Parser)]
              #[command(version, about = "내 지식 DB")]
              struct Cli {
                  /// DB 파일 경로 (옵션 > MNEMO_DB 환경변수 > ./mnemo.db)
                  #[arg(long, env = "MNEMO_DB", default_value = "mnemo.db", global = true)]
                  db: PathBuf,

                  #[command(subcommand)]
                  cmd: Cmd,
              }

              // MNEMO_EMBED_URL 이 있으면 실제 제공자, 없으면 가짜 임베더
              enum AnyEmbedder {
                  Fake(FakeEmbedder),
                  Http(HttpEmbedder),
              }

              impl AnyEmbedder {
                  fn from_env() -> Result<Self> {
                      if std::env::var_os("MNEMO_EMBED_URL").is_some() {
                          Ok(Self::Http(HttpEmbedder::from_env()?))
                      } else {
                          Ok(Self::Fake(FakeEmbedder { dim: 128 }))
                      }
                  }
              }

              impl Embedder for AnyEmbedder {
                  fn model_id(&self) -> &str {
                      match self {
                          Self::Fake(e) => e.model_id(),
                          Self::Http(e) => e.model_id(),
                      }
                  }
                  fn dim(&self) -> usize {
                      match self {
                          Self::Fake(e) => e.dim(),
                          Self::Http(e) => e.dim(),
                      }
                  }
                  async fn embed(&self, texts: &[String]) -> Result<Vec<Vec<f32>>> {
                      match self {
                          Self::Fake(e) => e.embed(texts).await,
                          Self::Http(e) => e.embed(texts).await,
                      }
                  }
              }

              #[derive(Clone, Copy, ValueEnum)]
              enum Mode {
                  Fts,
                  Vector,
                  Hybrid,
              }

              /// 모드에 맞는 검색을 돌린다. async fn 이 든 trait 는 `dyn` 으로 못 쓰니 match 로 갈라낸다.
              async fn run_search(db: &Db, mode: Mode, q: &str, k: usize) -> Result<Vec<Scored>> {
                  let emb = AnyEmbedder::from_env()?;
                  Ok(match mode {
                      Mode::Fts => FtsRetriever { db }.search(q, k).await?,
                      Mode::Vector => VectorRetriever { db, embedder: &emb }.search(q, k).await?,
                      Mode::Hybrid => {
                          let h = HybridRetriever {
                              a: FtsRetriever { db },
                              b: VectorRetriever { db, embedder: &emb },
                              rrf_k: 60.0,
                              fetch: 20,
                          };
                          h.search(q, k).await?
                      }
                  })
              }

              #[derive(Subcommand)]
              enum Cmd {
                  /// 항목 하나 추가
                  Add {
                      /// project / pref / work
                      kind: Kind,
                      /// 프로젝트 이름 또는 global
                      scope: String,
                      /// 본문 (사실 하나)
                      body: String,
                      /// 이유
                      #[arg(long)]
                      why: Option<String>,
                  },
                  /// 항목 목록
                  List {
                      #[arg(long)]
                      kind: Option<Kind>,
                      #[arg(long)]
                      scope: Option<String>,
                      #[arg(long, default_value = "active")]
                      status: Status,
                  },
                  /// 항목 하나를 자세히
                  Get { id: i64 },
                  /// 텍스트 파일에서 한 줄에 하나씩 가져오기
                  Import { file: PathBuf },
                  /// 평가 파일의 정답 id가 DB에 다 있는지 확인
                  EvalCheck { file: PathBuf },
                  /// 질문으로 검색
                  Search {
                      query: String,
                      #[arg(long, value_enum, default_value = "fts")]
                      mode: Mode,
                      #[arg(short, default_value_t = 5)]
                      k: usize,
                  },
                  /// 평가 세트로 점수 내기 (봉인 문항은 기본 제외)
                  Eval {
                      #[arg(default_value = "eval.json")]
                      file: PathBuf,
                      #[arg(long, value_enum, default_value = "fts")]
                      mode: Mode,
                      /// 봉인 문항도 포함 (Stage 7 마지막에 딱 한 번만!)
                      #[arg(long)]
                      include_sealed: bool,
                  },
                  /// 아직 임베딩이 없는 항목을 임베딩
                  Embed,
              }

              #[tokio::main]
              async fn main() -> Result<()> {
                  let cli = Cli::parse();
                  let db = Db::open(&cli.db).with_context(|| format!("{} 을 열지 못했어요", cli.db.display()))?;

                  match cli.cmd {
                      Cmd::Add { kind, scope, body, why } => {
                          let id = db.insert(&NewItem { kind, scope, body, why, source: "manual".into() })?;
                          println!("추가됨: #{id}");
                      }
                      Cmd::List { kind, scope, status } => {
                          for it in db.list(kind, scope.as_deref(), status)? {
                              println!("#{:<4} [{}/{}] {}", it.id, it.kind.as_str(), it.scope, it.body);
                          }
                      }
                      Cmd::Get { id } => match db.get(id)? {
                          Some(it) => print_item(&it),
                          None => bail!("#{id} 항목이 없어요"),
                      },
                      Cmd::Import { file } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          match import::parse_lines(&text) {
                              Ok(items) => {
                                  let n = db.insert_many(&items)?;
                                  println!("{n}개를 가져왔어요");
                              }
                              Err(errors) => {
                                  for (line, msg) in &errors {
                                      eprintln!("{}:{line}: {msg}", file.display());
                                  }
                                  bail!("{}줄에 문제가 있어서 아무것도 넣지 않았어요", errors.len());
                              }
                          }
                      }
                      Cmd::EvalCheck { file } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          let qs = eval::load_questions(&text).context("평가 파일 형식이 잘못됐어요")?;
                          let missing = eval::missing_answers(&db, &qs)?;
                          for (q, id) in &missing {
                              eprintln!("정답 id #{id} 가 DB에 없어요: {q}");
                          }
                          if !missing.is_empty() {
                              bail!("{}건의 정답 id를 고치세요", missing.len());
                          }
                          let sealed = qs.iter().filter(|q| q.sealed).count();
                          println!("질문 {}개 (봉인 {}개), 정답 id 모두 확인됨", qs.len(), sealed);
                      }
                      Cmd::Search { query, mode, k } => {
                          for (i, hit) in run_search(&db, mode, &query, k).await?.iter().enumerate() {
                              if let Some(it) = db.get(hit.id)? {
                                  println!("{:>2}) [{}/{}] {}  ({:.2})", i + 1, it.kind.as_str(), it.scope, it.body, hit.score);
                              }
                          }
                      }
                      Cmd::Eval { file, mode, include_sealed } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          let qs = eval::load_questions(&text).context("평가 파일 형식이 잘못됐어요")?;
                          let emb = AnyEmbedder::from_env()?;
                          let report = match mode {
                              Mode::Fts => eval::run_eval(&FtsRetriever { db: &db }, &qs, include_sealed).await?,
                              Mode::Vector => eval::run_eval(&VectorRetriever { db: &db, embedder: &emb }, &qs, include_sealed).await?,
                              Mode::Hybrid => {
                                  let h = HybridRetriever {
                                      a: FtsRetriever { db: &db },
                                      b: VectorRetriever { db: &db, embedder: &emb },
                                      rrf_k: 60.0,
                                      fetch: 20,
                                  };
                                  eval::run_eval(&h, &qs, include_sealed).await?
                              }
                          };

                          println!("{:<14} {:>3} {:>9} {:>9} {:>7}", "유형", "n", "Recall@3", "Recall@5", "MRR");
                          let line = |name: &str, r: &eval::Row| {
                              println!("{:<14} {:>3} {:>9.2} {:>9.2} {:>7.2}", name, r.n, r.recall3, r.recall5, r.mrr);
                              if let Some(e) = r.empty_rate {
                                  println!("{:<14}     (정답 없음 중 빈 결과 비율 {:.2})", "", e);
                              }
                          };
                          line("전체", &report.overall);
                          for (tag, row) in &report.by_tag {
                              line(tag, row);
                          }
                      }
                      Cmd::Embed => {
                          let n = embed_missing(&db, &AnyEmbedder::from_env()?, 32).await?;
                          println!("{n}개를 임베딩했어요");
                      }
                  }
                  Ok(())
              }

              fn print_item(it: &Item) {
                  println!("id         {}", it.id);
                  println!("kind       {}", it.kind.as_str());
                  println!("scope      {}", it.scope);
                  println!("body       {}", it.body);
                  println!("why        {}", it.why.as_deref().unwrap_or("-"));
                  println!("source     {}", it.source);
                  println!("status     {}", it.status.as_str());
                  println!("created_at {} (UTC 초)", it.created_at);
              }
  - id: "8"
    title: 구조 정리와 테스트
    doc: |
      # 구조 정리와 테스트

      **목표:** 흩어진 코드를 모듈로 정리하고, 오프라인에서 돌아가는 테스트와 점수 회귀 방지 장치를 만든다.

      **새로 배우는 것:** `mod`, `pub`, 가시성 설계, 라이브러리 에러(`thiserror`)와 애플리케이션 에러(`anyhow`)의 역할 분담, 통합 테스트, 테스트용 가짜(fake) 설계

      ### 요구사항

      - [ ] core를 `db`, `model`, `search`, `embed`, `eval` 같은 모듈로 나눈다. **밖에 보일 것만** `pub`으로 연다. 나눈 기준을 적는다.
      - [ ] core의 에러는 `thiserror`로 **종류가 구분되는 enum**으로, cli에서는 `anyhow`로 받아 출력한다. 이 둘을 나누는 이유를 한 문장으로 적는다.
      - [ ] `tests/` 폴더에 통합 테스트를 둔다. 메모리 DB, 가짜 임베더, 작은 고정 데이터로 **네트워크 없이** 돌아가야 한다.
      - [ ] 가짜 임베더와 FTS만으로 돌리는 **작은 평가 세트**를 만들고, 점수가 기준보다 떨어지면 실패하는 테스트를 만든다. (검색 코드를 건드렸을 때의 안전망)
      - [ ] `cargo fmt`와 `cargo clippy`를 통과시킨다. clippy 경고는 무시하지 말고 하나씩 읽어 본다.
      - [ ] (선택) Forgejo Actions로 push마다 fmt, clippy, test를 돌린다.

      <details><summary>힌트 1: 가시성</summary>

      - 처음에는 전부 `pub`으로 두고 시작해서, 외부(cli)가 실제로 쓰는 것만 남기고 나머지를 닫아 보세요. 컴파일러가 알려줘요.

      </details>

      <details><summary>힌트 2: 에러 enum</summary>

      - 'DB 에러', 'API 에러', '입력 검증 에러'처럼 **호출한 쪽이 다르게 대응할 수 있는** 단위로 나누세요. 하위 에러를 자동으로 감싸는 변환(`From`)을 써 보세요.

      </details>

      <details><summary>힌트 3: 가짜 임베더의 쓸모</summary>

      - 결정적인 가짜 벡터로는 '의미'를 못 재지만, **배관이 맞는지**(저장, 로드, 순위 합치기, 필터)는 완벽히 테스트할 수 있어요. 의미 품질은 실제 임베더로 하는 평가 러너의 몫이에요. 둘의 역할을 구분하세요.

      </details>

      ### 단계별 코드

      이 Stage는 대부분 **정리 작업**이라 코드보다 판단이 중요해요.

      **에러 enum 의 모양** (`mnemo-core/src/error.rs`, 의존성: `cargo add thiserror`)

      ▶ `mnemo-core/src/error.rs` — 재생에서 따라 칩니다

      - 이 enum 을 core 의 공개 함수들이 돌려주게 바꾸세요. 어떤 에러를 어느 칸에 넣을지가 설계예요. (`anyhow` 로 받던 `Retriever`, `Embedder` 의 반환 타입이 어떻게 바뀌어야 할지 먼저 생각해 보세요.)
      - `#[from]` 이 붙은 칸은 `?` 가 자동으로 변환해 줘요.

      ▶ `mnemo-core/src/lib.rs`, `mnemo-core/src/db.rs`, `mnemo-core/src/embed.rs`, `mnemo-core/src/eval.rs`, `mnemo-core/src/search.rs`, `mnemo-core/src/vector.rs`, `mnemo-core/src/hybrid.rs`, `mnemo-core/Cargo.toml`, `mnemo-cli/src/main.rs` — 재생에서 따라 칩니다

      **회귀 테스트의 모양** (`mnemo-core/tests/regression.rs`)

      1) 메모리 DB 에 작은 고정 데이터를 넣는다 (`tests/fixtures/` 에 파일로) 2) 고정 평가 질문으로 `run_eval` 을 돌린다 3) 기준보다 떨어지면 실패:

      ```rust
      assert!(report.overall.recall5 >= 0.8, "Recall@5 가 떨어졌어요: {}", report.overall.recall5);
      ```

      ▶ `mnemo-core/tests/fixtures/items.txt`, `mnemo-core/tests/fixtures/eval.json`, `mnemo-core/tests/regression.rs` — 재생에서 따라 칩니다

      나머지(모듈 분리 기준, 가시성, clippy, CI)는 요구사항대로 직접 하세요.

      ### 확인

      - 네트워크를 끊고도 `cargo test`가 전부 통과한다.
      - 일부러 RRF 코드를 망가뜨리면 회귀 테스트가 실패한다.

      ### 이해 체크

      - 라이브러리와 애플리케이션이 서로 다른 에러 전략을 쓰는 이유는?
      - 의미 품질을 단위 테스트가 아닌 평가 러너로 재는 이유는?

      ## 정답 노트에서

      - **Stage 8 (에러/구조)**: core 는 `thiserror` 로 호출자가 분기할 수 있는 에러를, CLI 는 `anyhow` 로 사람에게 보여 줄 메시지를 만든다는 구분이 핵심이에요. `Retriever` 와 `Embedder` 의 반환 타입도 core 의 `Result` 로 바꿔야 일관돼요.
    steps:
      - message: "[8] error.rs — thiserror 로 core 에러 enum"
        files:
          - path: mnemo-core/src/error.rs
            content: |
              /// core 의 에러. 호출한 쪽이 종류별로 다르게 대응할 수 있게 나눈다.
              /// (cli 는 anyhow 로 받아 사람에게 보여 주고, 서버는 종류에 따라 HTTP 상태를 고른다.)
              #[derive(Debug, thiserror::Error)]
              pub enum Error {
                  #[error("DB 오류: {0}")]
                  Db(#[from] rusqlite::Error),
                  #[error("입력이 잘못됐어요: {0}")]
                  Invalid(String),
                  #[error("임베딩 제공자 오류: {0}")]
                  Embed(String),
                  #[error("#{0} 항목이 없어요")]
                  NotFound(i64),
              }

              pub type Result<T> = std::result::Result<T, Error>;
