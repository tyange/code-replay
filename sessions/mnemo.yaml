          - path: mnemo-core/src/item.rs
            content: |
              use std::str::FromStr;

              use rusqlite::types::{FromSql, FromSqlError, FromSqlResult, ToSql, ToSqlOutput, ValueRef};

              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              pub enum Kind {
                  Project,
                  Pref,
                  Work,
              }

              impl Kind {
                  pub fn as_str(self) -> &'static str {
                      match self {
                          Kind::Project => "project",
                          Kind::Pref => "pref",
                          Kind::Work => "work",
                      }
                  }
              }

              impl FromStr for Kind {
                  type Err = String;
                  fn from_str(s: &str) -> Result<Self, Self::Err> {
                      match s {
                          "project" => Ok(Kind::Project),
                          "pref" => Ok(Kind::Pref),
                          "work" => Ok(Kind::Work),
                          other => Err(format!("알 수 없는 kind: {other}")),
                      }
                  }
              }

              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              pub enum Status {
                  Active,
                  Superseded,
                  Archived,
              }

              impl Status {
                  pub fn as_str(self) -> &'static str {
                      match self {
                          Status::Active => "active",
                          Status::Superseded => "superseded",
                          Status::Archived => "archived",
                      }
                  }
              }

              impl FromStr for Status {
                  type Err = String;
                  fn from_str(s: &str) -> Result<Self, Self::Err> {
                      match s {
                          "active" => Ok(Status::Active),
                          "superseded" => Ok(Status::Superseded),
                          "archived" => Ok(Status::Archived),
                          other => Err(format!("알 수 없는 status: {other}")),
                      }
                  }
              }

              // DB 문자열 <-> enum 변환을 rusqlite에 알려 준다.
              // 모르는 값이 들어 있으면 패닉 대신 에러로 돌려준다.
              macro_rules! sql_enum {
                  ($t:ty) => {
                      impl ToSql for $t {
                          fn to_sql(&self) -> rusqlite::Result<ToSqlOutput<'_>> {
                              Ok(self.as_str().into())
                          }
                      }
                      impl FromSql for $t {
                          fn column_result(value: ValueRef<'_>) -> FromSqlResult<Self> {
                              value
                                  .as_str()?
                                  .parse()
                                  .map_err(|e: String| FromSqlError::Other(e.into()))
                          }
                      }
                  };
              }
              sql_enum!(Kind);
              sql_enum!(Status);

              /// 새로 넣을 항목 (id, 시각 등은 DB가 채운다).
              #[derive(Debug, Clone)]
              pub struct NewItem {
                  pub kind: Kind,
                  pub scope: String,
                  pub body: String,
                  pub why: Option<String>,
                  pub source: String,
              }

              #[derive(Debug, Clone)]
              pub struct Item {
                  pub id: i64,
                  pub kind: Kind,
                  pub scope: String,
                  pub body: String,
                  pub why: Option<String>,
                  pub source: String,
                  pub created_at: i64, // UTC 유닉스 초
                  pub status: Status,
                  pub supersedes_id: Option<i64>,
              }
      - message: "[1] db.rs — 스키마, user_version 마이그레이션, insert/get/list"
        files:
          - path: mnemo-core/src/db.rs
            content: |
              use std::path::Path;
              use std::time::{SystemTime, UNIX_EPOCH};

              use rusqlite::{Connection, Row, params};

              use crate::item::{Item, Kind, NewItem, Status};

              pub type Result<T> = std::result::Result<T, rusqlite::Error>;

              /// 순서대로 적용되는 마이그레이션. 인덱스 + 1 이 곧 user_version.
              const MIGRATIONS: &[&str] = &[r#"
                  CREATE TABLE items (
                      id            INTEGER PRIMARY KEY AUTOINCREMENT,
                      kind          TEXT NOT NULL,
                      scope         TEXT NOT NULL,
                      body          TEXT NOT NULL,
                      why           TEXT,
                      source        TEXT NOT NULL,
                      created_at    INTEGER NOT NULL,
                      status        TEXT NOT NULL DEFAULT 'active',
                      supersedes_id INTEGER REFERENCES items(id)
                  );
              "#];

              pub struct Db {
                  conn: Connection,
              }

              impl Db {
                  pub fn open(path: &Path) -> Result<Self> {
                      Self::init(Connection::open(path)?)
                  }

                  pub fn open_in_memory() -> Result<Self> {
                      Self::init(Connection::open_in_memory()?)
                  }

                  fn init(conn: Connection) -> Result<Self> {
                      conn.pragma_update(None, "foreign_keys", true)?;
                      let db = Self { conn };
                      db.migrate()?;
                      Ok(db)
                  }

                  pub fn conn(&self) -> &Connection {
                      &self.conn
                  }

                  pub fn user_version(&self) -> Result<i64> {
                      self.conn.query_row("PRAGMA user_version", [], |r| r.get(0))
                  }

                  fn migrate(&self) -> Result<()> {
                      let current = self.user_version()? as usize;
                      for (i, sql) in MIGRATIONS.iter().enumerate().skip(current) {
                          // 마이그레이션 하나는 트랜잭션 하나. 중간에 실패하면 버전도 안 오른다.
                          let tx = self.conn.unchecked_transaction()?;
                          tx.execute_batch(sql)?;
                          tx.pragma_update(None, "user_version", (i + 1) as i64)?;
                          tx.commit()?;
                      }
                      Ok(())
                  }

                  pub fn insert(&self, new: &NewItem) -> Result<i64> {
                      self.conn.execute(
                          "INSERT INTO items (kind, scope, body, why, source, created_at)
                           VALUES (?1, ?2, ?3, ?4, ?5, ?6)",
                          params![new.kind, new.scope, new.body, new.why, new.source, now_secs()],
                      )?;
                      Ok(self.conn.last_insert_rowid())
                  }

                  pub fn get(&self, id: i64) -> Result<Option<Item>> {
                      let mut stmt = self.conn.prepare(
                          "SELECT id, kind, scope, body, why, source, created_at, status, supersedes_id
                           FROM items WHERE id = ?1",
                      )?;
                      let mut rows = stmt.query_map([id], row_to_item)?;
                      rows.next().transpose()
                  }

                  pub fn list(&self, kind: Option<Kind>, scope: Option<&str>, status: Status) -> Result<Vec<Item>> {
                      let mut stmt = self.conn.prepare(
                          "SELECT id, kind, scope, body, why, source, created_at, status, supersedes_id
                           FROM items
                           WHERE status = ?1
                             AND (?2 IS NULL OR kind = ?2)
                             AND (?3 IS NULL OR scope = ?3)
                           ORDER BY id",
                      )?;
                      stmt.query_map(params![status, kind, scope], row_to_item)?
                          .collect()
                  }
              }

              fn row_to_item(r: &Row<'_>) -> rusqlite::Result<Item> {
                  Ok(Item {
                      id: r.get(0)?,
                      kind: r.get(1)?,
                      scope: r.get(2)?,
                      body: r.get(3)?,
                      why: r.get(4)?,
                      source: r.get(5)?,
                      created_at: r.get(6)?,
                      status: r.get(7)?,
                      supersedes_id: r.get(8)?,
                  })
              }

              pub fn now_secs() -> i64 {
                  SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .map(|d| d.as_secs() as i64)
                      .unwrap_or(0)
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  fn sample(kind: Kind, scope: &str, body: &str) -> NewItem {
                      NewItem {
                          kind,
                          scope: scope.into(),
                          body: body.into(),
                          why: None,
                          source: "test".into(),
                      }
                  }

                  #[test]
                  fn insert_then_get() {
                      let db = Db::open_in_memory().unwrap();
                      let id = db.insert(&sample(Kind::Project, "projA", "상태 관리는 단순하게")).unwrap();
                      let item = db.get(id).unwrap().unwrap();
                      assert_eq!(item.body, "상태 관리는 단순하게");
                      assert_eq!(item.kind, Kind::Project);
                      assert_eq!(item.status, Status::Active);
                      assert!(db.get(999).unwrap().is_none());
                  }

                  #[test]
                  fn list_filters() {
                      let db = Db::open_in_memory().unwrap();
                      db.insert(&sample(Kind::Project, "projA", "a")).unwrap();
                      db.insert(&sample(Kind::Pref, "global", "b")).unwrap();
                      assert_eq!(db.list(None, None, Status::Active).unwrap().len(), 2);
                      assert_eq!(db.list(Some(Kind::Pref), None, Status::Active).unwrap().len(), 1);
                      assert_eq!(db.list(None, Some("projA"), Status::Active).unwrap().len(), 1);
                      assert_eq!(db.list(None, None, Status::Archived).unwrap().len(), 0);
                  }

                  #[test]
                  fn migration_is_idempotent() {
                      let path = std::env::temp_dir().join(format!("mnemo-test-{}", std::process::id()));
                      let _ = std::fs::remove_file(&path);
                      let db = Db::open(&path).unwrap();
                      assert_eq!(db.user_version().unwrap(), MIGRATIONS.len() as i64);
                      drop(db);
                      let db = Db::open(&path).unwrap(); // 다시 열어도 에러 없이 같은 버전
                      assert_eq!(db.user_version().unwrap(), MIGRATIONS.len() as i64);
                      let _ = std::fs::remove_file(&path);
                  }

                  #[test]
                  fn unknown_status_is_an_error_not_a_panic() {
                      let db = Db::open_in_memory().unwrap();
                      let id = db.insert(&sample(Kind::Work, "global", "x")).unwrap();
                      db.conn().execute("UPDATE items SET status = 'weird' WHERE id = ?1", [id]).unwrap();
                      assert!(db.get(id).is_err());
                  }
              }
      - message: "[1] lib.rs — 모듈 공개"
        files:
          - path: mnemo-core/src/lib.rs
            content: |
              pub mod db;
              pub mod item;

              pub use db::Db;
              pub use item::{Item, Kind, NewItem, Status};
  - id: "2"
    title: "CLI: add / list / get / import"
    doc: |
      # CLI: add / list / get / import

      **목표:** 터미널에서 항목을 넣고 보고, **실제 내 데이터를 50개 이상 쌓는다.**

      **새로 배우는 것:** `clap`의 서브커맨드(`Subcommand` derive), 사용자 친화적인 에러, 파일 입력

      > 이 Stage의 진짜 산출물은 **데이터**예요. 가짜 데이터로 평가하면 점수가 의미 없어요. 반드시 실제 프로젝트 결정, 실제 선호, 실제 업무 지식을 넣으세요. 단, Stage 0의 저장 금지 목록을 지키세요.

      ### 요구사항

      - [ ] `add`: 종류, 범위, 이유(선택), 본문을 받아 저장한다. 성공하면 id를 출력한다.
      - [ ] `list`: 종류, 범위, 상태로 거를 수 있다. 기본은 active만.
      - [ ] `get <id>`: 항목 하나를 모든 필드와 함께 보여준다. 없는 id는 친절한 메시지로.
      - [ ] `import <파일>`: 텍스트 파일을 읽어 한 줄에 하나씩 항목으로 넣는다. 한 줄 형식은 직접 설계한다. (예: 접두사로 종류와 범위를 표시)
      - [ ] DB 파일 위치는 옵션 > 환경변수 > 기본값 순으로 정한다.
      - [ ] 실제 데이터 **50개 이상**을 넣는다. 프로젝트, 선호, 업무 지식이 섞이게.
      - [ ] 한 줄 형식이 잘못됐을 때 몇 번째 줄이 문제인지 알려주고, 나머지는 계속 처리할지 전부 취소할지 정해서 결정 로그에 적는다.

      <details><summary>힌트 1: import의 실패 처리</summary>

      - 100줄 중 3줄이 잘못됐을 때 '97줄만 넣는다'와 '전부 취소한다'는 다른 설계예요. 트랜잭션 하나로 묶으면 후자가 쉬워요. 어느 쪽이 데이터 입력에 더 맞는지 생각해 보세요.

      </details>

      <details><summary>힌트 2: 데이터가 막막할 때</summary>

      - 최근 한 달간 내린 기술 결정을 이유와 함께 떠올려 보세요. '왜 A 대신 B를 골랐지?'가 가장 좋은 항목이에요.
      - 같은 사실을 서로 다른 말로 적은 항목을 일부러 섞지는 마세요. 그건 Stage 3에서 질문 쪽에서 만들어요.

      </details>

      ### 단계별 코드

      **1) 의존성 추가**

      ```
      cd mnemo-cli
      cargo add anyhow
      cargo add clap --features derive,env
      cargo add --path ../mnemo-core
      cd ..
      ```

      ▶ `mnemo-cli/Cargo.toml` — 재생에서 따라 칩니다

      **2) mnemo-core/src/lib.rs** 에 한 줄 추가

      ▶ `mnemo-core/src/lib.rs` — 재생에서 따라 칩니다

      **3) mnemo-core/src/import.rs** (한 줄 형식: `kind:scope | 본문 | 이유(선택)`)

      ▶ `mnemo-core/src/import.rs` — 재생에서 따라 칩니다

      **4) mnemo-core/src/db.rs** 의 `impl Db` 안, `insert` 바로 아래에 `insert_many` 추가

      ▶ `mnemo-core/src/db.rs` — 재생에서 따라 칩니다

      **5) mnemo-cli/src/main.rs** (전체)

      ▶ `mnemo-cli/src/main.rs` — 재생에서 따라 칩니다

      **한 줄씩 이해하기**

      - `kind: Kind` 인자가 바로 동작하는 건 `Kind` 에 `FromStr` 를 구현했기 때문이에요. clap 이 문자열을 `parse()` 해 주고, 실패하면 우리가 만든 메시지가 clap 에러로 나와요.
      - `global = true` 는 `--db` 를 서브커맨드 앞뒤 어디에 써도 되게 해요. `env = "MNEMO_DB"` 와 `default_value` 가 합쳐져서 '옵션 > 환경변수 > 기본값' 순서가 돼요.
      - `parse_lines` 가 `Result<Vec<_>, Vec<(usize, String)>>` 를 돌려주는 건 **에러를 하나만이 아니라 전부 모아서** 보여주려는 거예요. 100줄 중 3줄이 틀렸을 때 3번 고치지 않아도 돼요.
      - `insert_many` 는 트랜잭션 하나로 묶어서 '전부 아니면 전무'로 만들어요. 이 가이드는 그쪽을 골랐어요. 다른 쪽을 고르고 싶다면 결정 로그에 이유를 적고 바꿔 보세요.
      - `anyhow::Result` 를 쓰고 `?` 로 `rusqlite::Error` 를 그대로 넘기는 건 cli 라서 가능해요. 에러 종류를 나눠 다뤄야 하는 core 의 정리는 Stage 8에서 해요.

      **확인**

      ```
      cargo build
      ./target/debug/mnemo-cli --db t.db add work global "배포는 금요일에 하지 않는다" --why "대응 인력 부족"
      ./target/debug/mnemo-cli --db t.db list
      ./target/debug/mnemo-cli --db t.db get 1
      ```

      ### 확인

      - `list`와 `get`으로 방금 넣은 항목이 그대로 나온다.
      - 같은 파일을 두 번 import하면 어떻게 되는지 확인하고, 그게 원하는 동작인지 판단해 결정 로그에 적는다. (중복 처리는 Stage 9에서 본격적으로 다뤄요.)

      ### 이해 체크

      - 위치 인자와 옵션 인자는 어떤 기준으로 나눴나요?
      - import를 트랜잭션으로 묶으면 성능에는 어떤 영향이 있을까요?
    steps:
      - message: "[2] mnemo-cli/Cargo.toml — clap, anyhow, core 의존성"
        files:
          - path: mnemo-cli/Cargo.toml
            content: |
              [package]
              name = "mnemo-cli"
              version = "0.1.0"
              edition = "2024"

              [dependencies]
              anyhow = "1"
              clap = { version = "4.6", features = ["derive", "env"] }
              mnemo-core = { path = "../mnemo-core" }
      - message: "[2] import.rs — 한 줄 형식 파싱과 줄 번호 에러"
        files:
          - path: mnemo-core/src/import.rs
            content: |
              use crate::item::{Kind, NewItem};

              /// 한 줄 형식:  kind:scope | 본문 | 이유(선택)
              /// 빈 줄과 # 로 시작하는 줄은 건너뛴다.
              /// 하나라도 잘못되면 (줄 번호, 사유) 목록을 돌려준다.
              pub fn parse_lines(text: &str) -> Result<Vec<NewItem>, Vec<(usize, String)>> {
                  let mut items = Vec::new();
                  let mut errors = Vec::new();

                  for (idx, line) in text.lines().enumerate() {
                      let line = line.trim();
                      if line.is_empty() || line.starts_with('#') {
                          continue;
                      }
                      match parse_line(line) {
                          Ok(item) => items.push(item),
                          Err(e) => errors.push((idx + 1, e)),
                      }
                  }

                  if errors.is_empty() { Ok(items) } else { Err(errors) }
              }

              fn parse_line(line: &str) -> Result<NewItem, String> {
                  let mut parts = line.splitn(3, '|').map(str::trim);
                  let head = parts.next().unwrap_or_default();
                  let body = parts.next().filter(|s| !s.is_empty()).ok_or("본문이 없어요")?;
                  let why = parts.next().filter(|s| !s.is_empty()).map(String::from);

                  let (kind, scope) = head.split_once(':').ok_or("'kind:scope' 형식이어야 해요")?;
                  let kind: Kind = kind.trim().parse()?;
                  let scope = scope.trim();
                  if scope.is_empty() {
                      return Err("scope가 비어 있어요".into());
                  }

                  Ok(NewItem {
                      kind,
                      scope: scope.into(),
                      body: body.into(),
                      why,
                      source: "import".into(),
                  })
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  #[test]
                  fn parses_good_lines() {
                      let text = "# 주석
              project:projA | 상태 관리는 단순하게 | 화면이 적음

              pref:global | 번들 크기보다 유지보수 상태";
                      let items = parse_lines(text).unwrap();
                      assert_eq!(items.len(), 2);
                      assert_eq!(items[0].why.as_deref(), Some("화면이 적음"));
                      assert_eq!(items[1].why, None);
                  }

                  #[test]
                  fn reports_line_numbers() {
                      let text = "project:a | ok
              bad line
              foo:b | x
              ";
                      let errs = parse_lines(text).unwrap_err();
                      assert_eq!(errs.iter().map(|e| e.0).collect::<Vec<_>>(), vec![2, 3]);
                  }
              }
      - message: "[2] db.rs — insert_many (전부 아니면 전무)"
        files:
          - path: mnemo-core/src/db.rs
            content: |
              use std::path::Path;
              use std::time::{SystemTime, UNIX_EPOCH};

              use rusqlite::{Connection, Row, params};

              use crate::item::{Item, Kind, NewItem, Status};

              pub type Result<T> = std::result::Result<T, rusqlite::Error>;

              /// 순서대로 적용되는 마이그레이션. 인덱스 + 1 이 곧 user_version.
              const MIGRATIONS: &[&str] = &[r#"
                  CREATE TABLE items (
                      id            INTEGER PRIMARY KEY AUTOINCREMENT,
                      kind          TEXT NOT NULL,
                      scope         TEXT NOT NULL,
                      body          TEXT NOT NULL,
                      why           TEXT,
                      source        TEXT NOT NULL,
                      created_at    INTEGER NOT NULL,
                      status        TEXT NOT NULL DEFAULT 'active',
                      supersedes_id INTEGER REFERENCES items(id)
                  );
              "#];

              pub struct Db {
                  conn: Connection,
              }

              impl Db {
                  pub fn open(path: &Path) -> Result<Self> {
                      Self::init(Connection::open(path)?)
                  }

                  pub fn open_in_memory() -> Result<Self> {
                      Self::init(Connection::open_in_memory()?)
                  }

                  fn init(conn: Connection) -> Result<Self> {
                      conn.pragma_update(None, "foreign_keys", true)?;
                      let db = Self { conn };
                      db.migrate()?;
                      Ok(db)
                  }

                  pub fn conn(&self) -> &Connection {
                      &self.conn
                  }

                  pub fn user_version(&self) -> Result<i64> {
                      self.conn.query_row("PRAGMA user_version", [], |r| r.get(0))
                  }

                  fn migrate(&self) -> Result<()> {
                      let current = self.user_version()? as usize;
                      for (i, sql) in MIGRATIONS.iter().enumerate().skip(current) {
                          // 마이그레이션 하나는 트랜잭션 하나. 중간에 실패하면 버전도 안 오른다.
                          let tx = self.conn.unchecked_transaction()?;
                          tx.execute_batch(sql)?;
                          tx.pragma_update(None, "user_version", (i + 1) as i64)?;
                          tx.commit()?;
                      }
                      Ok(())
                  }

                  pub fn insert(&self, new: &NewItem) -> Result<i64> {
                      self.conn.execute(
                          "INSERT INTO items (kind, scope, body, why, source, created_at)
                           VALUES (?1, ?2, ?3, ?4, ?5, ?6)",
                          params![new.kind, new.scope, new.body, new.why, new.source, now_secs()],
                      )?;
                      Ok(self.conn.last_insert_rowid())
                  }

                  /// 전부 넣거나 전부 취소한다 (트랜잭션 하나).
                  pub fn insert_many(&self, items: &[NewItem]) -> Result<usize> {
                      let tx = self.conn.unchecked_transaction()?;
                      for it in items {
                          self.insert(it)?;
                      }
                      tx.commit()?;
                      Ok(items.len())
                  }

                  pub fn get(&self, id: i64) -> Result<Option<Item>> {
                      let mut stmt = self.conn.prepare(
                          "SELECT id, kind, scope, body, why, source, created_at, status, supersedes_id
                           FROM items WHERE id = ?1",
                      )?;
                      let mut rows = stmt.query_map([id], row_to_item)?;
                      rows.next().transpose()
                  }

                  pub fn list(&self, kind: Option<Kind>, scope: Option<&str>, status: Status) -> Result<Vec<Item>> {
                      let mut stmt = self.conn.prepare(
                          "SELECT id, kind, scope, body, why, source, created_at, status, supersedes_id
                           FROM items
                           WHERE status = ?1
                             AND (?2 IS NULL OR kind = ?2)
                             AND (?3 IS NULL OR scope = ?3)
                           ORDER BY id",
                      )?;
                      stmt.query_map(params![status, kind, scope], row_to_item)?
                          .collect()
                  }
              }

              fn row_to_item(r: &Row<'_>) -> rusqlite::Result<Item> {
                  Ok(Item {
                      id: r.get(0)?,
                      kind: r.get(1)?,
                      scope: r.get(2)?,
                      body: r.get(3)?,
                      why: r.get(4)?,
                      source: r.get(5)?,
                      created_at: r.get(6)?,
                      status: r.get(7)?,
                      supersedes_id: r.get(8)?,
                  })
              }

              pub fn now_secs() -> i64 {
                  SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .map(|d| d.as_secs() as i64)
                      .unwrap_or(0)
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  fn sample(kind: Kind, scope: &str, body: &str) -> NewItem {
                      NewItem {
                          kind,
                          scope: scope.into(),
                          body: body.into(),
                          why: None,
                          source: "test".into(),
                      }
                  }

                  #[test]
                  fn insert_then_get() {
                      let db = Db::open_in_memory().unwrap();
                      let id = db.insert(&sample(Kind::Project, "projA", "상태 관리는 단순하게")).unwrap();
                      let item = db.get(id).unwrap().unwrap();
                      assert_eq!(item.body, "상태 관리는 단순하게");
                      assert_eq!(item.kind, Kind::Project);
                      assert_eq!(item.status, Status::Active);
                      assert!(db.get(999).unwrap().is_none());
                  }

                  #[test]
                  fn list_filters() {
                      let db = Db::open_in_memory().unwrap();
                      db.insert(&sample(Kind::Project, "projA", "a")).unwrap();
                      db.insert(&sample(Kind::Pref, "global", "b")).unwrap();
                      assert_eq!(db.list(None, None, Status::Active).unwrap().len(), 2);
                      assert_eq!(db.list(Some(Kind::Pref), None, Status::Active).unwrap().len(), 1);
                      assert_eq!(db.list(None, Some("projA"), Status::Active).unwrap().len(), 1);
                      assert_eq!(db.list(None, None, Status::Archived).unwrap().len(), 0);
                  }

                  #[test]
                  fn migration_is_idempotent() {
                      let path = std::env::temp_dir().join(format!("mnemo-test-{}", std::process::id()));
                      let _ = std::fs::remove_file(&path);
                      let db = Db::open(&path).unwrap();
                      assert_eq!(db.user_version().unwrap(), MIGRATIONS.len() as i64);
                      drop(db);
                      let db = Db::open(&path).unwrap(); // 다시 열어도 에러 없이 같은 버전
                      assert_eq!(db.user_version().unwrap(), MIGRATIONS.len() as i64);
                      let _ = std::fs::remove_file(&path);
                  }

                  #[test]
                  fn unknown_status_is_an_error_not_a_panic() {
                      let db = Db::open_in_memory().unwrap();
                      let id = db.insert(&sample(Kind::Work, "global", "x")).unwrap();
                      db.conn().execute("UPDATE items SET status = 'weird' WHERE id = ?1", [id]).unwrap();
                      assert!(db.get(id).is_err());
                  }
              }
      - message: "[2] lib.rs — import 모듈 추가"
        files:
          - path: mnemo-core/src/lib.rs
            content: |
              pub mod db;
              pub mod import;
              pub mod item;

              pub use db::Db;
              pub use item::{Item, Kind, NewItem, Status};
      - message: "[2] main.rs — add/list/get/import 서브커맨드"
        files:
          - path: mnemo-cli/src/main.rs
            content: |
              use std::fs;
              use std::path::PathBuf;

              use anyhow::{Context, Result, bail};
              use clap::{Parser, Subcommand};
              use mnemo_core::{Db, Item, Kind, NewItem, Status, import};

              #[derive(Parser)]
              #[command(version, about = "내 지식 DB")]
              struct Cli {
                  /// DB 파일 경로 (옵션 > MNEMO_DB 환경변수 > ./mnemo.db)
                  #[arg(long, env = "MNEMO_DB", default_value = "mnemo.db", global = true)]
                  db: PathBuf,

                  #[command(subcommand)]
                  cmd: Cmd,
              }

              #[derive(Subcommand)]
              enum Cmd {
                  /// 항목 하나 추가
                  Add {
                      /// project / pref / work
                      kind: Kind,
                      /// 프로젝트 이름 또는 global
                      scope: String,
                      /// 본문 (사실 하나)
                      body: String,
                      /// 이유
                      #[arg(long)]
                      why: Option<String>,
                  },
                  /// 항목 목록
                  List {
                      #[arg(long)]
                      kind: Option<Kind>,
                      #[arg(long)]
                      scope: Option<String>,
                      #[arg(long, default_value = "active")]
                      status: Status,
                  },
                  /// 항목 하나를 자세히
                  Get { id: i64 },
                  /// 텍스트 파일에서 한 줄에 하나씩 가져오기
                  Import { file: PathBuf },
              }

              fn main() -> Result<()> {
                  let cli = Cli::parse();
                  let db = Db::open(&cli.db).with_context(|| format!("{} 을 열지 못했어요", cli.db.display()))?;

                  match cli.cmd {
                      Cmd::Add { kind, scope, body, why } => {
                          let id = db.insert(&NewItem { kind, scope, body, why, source: "manual".into() })?;
                          println!("추가됨: #{id}");
                      }
                      Cmd::List { kind, scope, status } => {
                          for it in db.list(kind, scope.as_deref(), status)? {
                              println!("#{:<4} [{}/{}] {}", it.id, it.kind.as_str(), it.scope, it.body);
                          }
                      }
                      Cmd::Get { id } => match db.get(id)? {
                          Some(it) => print_item(&it),
                          None => bail!("#{id} 항목이 없어요"),
                      },
                      Cmd::Import { file } => {
                          let text = fs::read_to_string(&file)
                              .with_context(|| format!("{} 을 읽지 못했어요", file.display()))?;
                          match import::parse_lines(&text) {
                              Ok(items) => {
                                  let n = db.insert_many(&items)?;
                                  println!("{n}개를 가져왔어요");
                              }
                              Err(errors) => {
                                  for (line, msg) in &errors {
                                      eprintln!("{}:{line}: {msg}", file.display());
                                  }
                                  bail!("{}줄에 문제가 있어서 아무것도 넣지 않았어요", errors.len());
                              }
                          }
                      }
                  }
                  Ok(())
              }

              fn print_item(it: &Item) {
                  println!("id         {}", it.id);
                  println!("kind       {}", it.kind.as_str());
                  println!("scope      {}", it.scope);
                  println!("body       {}", it.body);
                  println!("why        {}", it.why.as_deref().unwrap_or("-"));
                  println!("source     {}", it.source);
                  println!("status     {}", it.status.as_str());
                  println!("created_at {} (UTC 초)", it.created_at);
              }
  - id: "3"
    title: 평가 세트 먼저 만들기
    doc: |
      # 평가 세트 먼저 만들기

      **목표:** 검색 코드를 쓰기 **전에** 정답지를 만든다. 질문 30개와 그 정답 항목.

      **새로 배우는 것:** 평가 세트 설계, Recall@k와 MRR, 과적합과 봉인(hold-out) 세트

      > 이 Stage가 이 프로젝트에서 **가장 중요해요.** 평가 세트가 없으면 '검색이 좋아진 것 같다'는 느낌만 남아요. 그리고 코드를 짠 뒤에 정답을 매기면, 내 검색 결과를 보고 정답을 맞추게 돼서 평가가 오염돼요.

      ### 3-1. 질문의 유형

      질문을 아래 유형으로 나눠서 골고루 만드세요. **유형별로 점수를 따로 보는 것**이 나중에 어디를 고칠지 알려줘요.

      | # | 유형 | 예시 방향 | 어느 검색이 유리할까 |
      | --- | --- | --- | --- |
      | 1 | 직접 | 항목 본문과 단어가 거의 같은 질문 | 키워드 |
      | 2 | 바꿔 말하기 | 같은 뜻이지만 단어가 전혀 다른 질문 | 벡터 |
      | 3 | 고유명사·약어 | 프로젝트 이름, 도구 이름, 약자로 묻는 질문 | 키워드 |
      | 4 | 여러 정답 | 정답 항목이 둘 이상인 질문 | 둘 다 |
      | 5 | 정답 없음 | DB에 없는 내용을 묻는 질문 | 못 찾는 게 정답 |
      | 6 | 폐기 함정 | 예전 결정과 최신 결정이 모두 있는 질문 | 필터와 상태 처리 |
      | 7 | 범위 함정 | 전체 선호와 특정 프로젝트 한정 선호가 다른 질문 | 범위 처리 |
      | 8 | 한영 혼용 | 한국어 질문에 영어 용어, 또는 그 반대 | 둘 다 |

      - [ ] 30개를 만든다. 유형 1–4는 각 5개 안팎, 5–8은 각 2개 안팎으로.
      - [ ] 각 질문에 **정답 항목 id 목록**을 붙인다. 정답 없음 유형은 빈 목록.
      - [ ] 평가 파일 형식은 직접 정한다. 질문, 정답 id들, 유형 태그, 메모는 최소한 있어야 한다.
      - [ ] 6번 유형을 위해 **일부러 폐기된 항목**이 DB에 있어야 한다. 필요하면 Stage 2의 데이터에 대체 관계를 추가한다.
      - [ ] 정답 매기기는 **검색을 돌려 보기 전에** 끝낸다.
      - [ ] 30개 중 **10개를 봉인**한다. 별도 파일에 두고, Stage 7의 마지막에 **딱 한 번**만 쓴다. 나머지 20개로 튜닝한다.

      ### 3-2. 지표

      - **Recall@k**: 질문마다 '정답 중 상위 k개 안에 든 비율'을 구하고 평균. k는 3과 5 둘 다 보세요.
      - **MRR**: 질문마다 '첫 정답의 순위의 역수'를 구하고 평균. 첫 정답이 1등이면 1, 3등이면 1/3.
      - **정답 없음 유형**은 위 지표로 못 재요. 별도로 '아무것도 안 돌려준 비율'을 봐요. (Stage 7에서)
      - 30개는 작은 세트예요. 질문 하나가 점수를 3퍼센트포인트 가까이 움직여요. **작은 차이는 노이즈일 수 있다**고 의심하세요.

      <details><summary>힌트 1: 좋은 질문을 만드는 법</summary>

      - 실제로 AI에게 하고 싶었던 질문을 쓰세요. 항목 본문을 보면서 질문을 만들면 단어가 겹쳐서 너무 쉬워져요.
      - 바꿔 말하기 유형은 항목을 먼저 읽고 덮은 뒤, 기억나는 대로 다른 말로 물어보세요.

      </details>

      <details><summary>힌트 2: 정답 경계</summary>

      - '정답'은 그 질문에 답하려면 **꼭 필요한** 항목이에요. 관련은 있지만 없어도 답할 수 있는 항목은 정답이 아니에요. 기준을 먼저 적어 두고 일관되게 매기세요.

      </details>

      ### 단계별 코드

      질문 30개를 쓰는 건 코드가 아니라 **당신의 몫**이에요. 코드는 그 파일을 읽고 검증하고 점수를 계산하는 부분만 제공해요. (검색 코드는 아직 없어요. 정답을 먼저 매기기 위해서예요.)

      **1) 평가 파일 형식** (`eval.json`)

      ```
      [
        {"q": "배포는 언제 하지 않기로 했지", "answers": [3], "tag": "direct", "note": "본문과 단어가 겹침"},
        {"q": "출시 직전에 서버 올리는 거 피하기로 한 이유", "answers": [3], "tag": "paraphrase"},
        {"q": "우주선 연료는 뭘로 하기로 했지", "answers": [], "tag": "no_answer"},
        {"q": "상태 관리 라이브러리 정한 게 뭐였지", "answers": [1, 7], "tag": "multi", "sealed": true}
      ]
      ```

      - `answers` 는 `mnemo list` 에서 보이는 id 예요. 정답 없음 유형은 `[]` 예요.
      - `sealed: true` 로 표시한 10개는 봉인 세트예요. 기본 점수에서 빠져요. (Stage 4에서 반영돼요.)

      **2) mnemo-core/src/lib.rs** 에 `pub mod eval;` 한 줄 추가

      ▶ `mnemo-core/src/lib.rs` — 재생에서 따라 칩니다

      **3) mnemo-core/src/eval.rs**

      ▶ `mnemo-core/src/eval.rs` — 재생에서 따라 칩니다

      **4) mnemo-cli/src/main.rs** 에 명령 하나 추가: 세 군데를 고쳐요. (a) use 줄에 `eval` 추가, (b) `enum Cmd` 의 `Import` 아래에 `EvalCheck` 변형 추가, (c) `main` 의 match 안, `Cmd::Import` 팔 아래에 추가.

      ▶ `mnemo-cli/src/main.rs` — 재생에서 따라 칩니다

      **한 줄씩 이해하기**

      - `Option<f64>` 을 돌려주는 이유: 정답 없음 질문은 Recall 이나 MRR 이 **정의되지 않아요.** 0 으로 취급하면 평균이 조용히 깎여요. `None` 으로 구분해야 나중에 '정답 없음'을 따로 셀 수 있어요.
      - `answers.iter().filter(|a| ranked.iter().take(k).any(|r| r == *a))` 는 '정답 중에서, 상위 k개 안에 있는 것만 남긴다'예요. `count()` 를 정답 수로 나누면 Recall@k 예요.
      - `position(...)` 은 0부터 세는 위치예요. 그래서 순위는 `p + 1`, 역수는 `1.0 / (p as f64 + 1.0)`. 1등이면 1, 3등이면 1/3 이에요.
      - `#[serde(default)]` 는 JSON 에 그 칸이 없으면 기본값(`false`, 빈 문자열)을 쓰게 해요. 질문 대부분은 `sealed` 를 안 써도 돼요.
      - `r#"..."#` 는 안에 큰따옴표가 있어도 이스케이프가 필요 없는 문자열이에요. JSON 을 테스트에 넣을 때 편해요.

      **확인**

      ```
      cargo test -p mnemo-core
      ./target/debug/mnemo-cli --db mnemo.db eval-check eval.json
      ```

      테스트가 통과하고, 존재하지 않는 id를 일부러 넣으면 어느 질문인지 알려 줘야 해요.

      ### 확인

      - 질문 30개, 유형별 개수, 봉인 10개가 정리된 표를 만든다.
      - 정답 id가 DB에 실제로 존재하는지 확인하는 스크립트나 테스트가 있다. (id가 틀리면 평가가 조용히 망가져요.)

      ### 이해 체크

      - 왜 정답을 검색 결과를 보기 전에 매겨야 하나요?
      - 봉인 세트를 마지막에 한 번만 쓰는 이유는? 여러 번 쓰면 무슨 일이 생기나요?
      - Recall@5는 높은데 MRR이 낮다면 검색에서 무슨 일이 벌어지고 있는 걸까요?

      ## 정답 노트에서

      - 검색을 만들기 전에 평가부터 만드는 이유 → 고칠 때마다 "나아졌는지" 를 숫자로 말하려면 기준이 먼저 필요해요.
      - 정답이 없는 질문을 따로 두는 이유 → 모르는 건 모른다고 해야 해서, 검색기가 엉뚱한 걸 자신 있게 돌려주는지 보려고요.
      - sealed 질문 → 튜닝에 쓰지 않고 마지막에 한 번만 보는 질문이에요. 계속 보면서 고치면 평가에 과적합돼요.
    steps:
      - message: "[3] eval.rs — 평가 파일, Recall@k, MRR"
        files:
          - path: mnemo-core/src/eval.rs
            content: |
              use serde::Deserialize;

              use crate::db::{Db, Result};

              /// 평가 파일(JSON 배열)의 한 항목.
              #[derive(Debug, Clone, Deserialize)]
              pub struct Question {
                  pub q: String,
                  /// 정답 항목 id들. 정답 없음 유형은 빈 배열.
                  pub answers: Vec<i64>,
                  /// 유형 태그 (direct, paraphrase, ...)
                  pub tag: String,
                  /// 봉인 세트 여부. 기본 eval 에서는 제외된다.
                  #[serde(default)]
                  pub sealed: bool,
                  #[serde(default)]
                  pub note: String,
              }

              pub fn load_questions(json: &str) -> std::result::Result<Vec<Question>, serde_json::Error> {
                  serde_json::from_str(json)
              }

              /// 정답 id 가 DB 에 실제로 있는지 확인한다. 없는 (질문, id) 목록을 돌려준다.
              pub fn missing_answers(db: &Db, qs: &[Question]) -> Result<Vec<(String, i64)>> {
                  let mut missing = Vec::new();
                  for q in qs {
                      for &id in &q.answers {
                          if db.get(id)?.is_none() {
                              missing.push((q.q.clone(), id));
                          }
                      }
                  }
                  Ok(missing)
              }

              /// 상위 k개 안에 든 정답의 비율. 정답이 없는 질문은 None.
              pub fn recall_at_k(ranked: &[i64], answers: &[i64], k: usize) -> Option<f64> {
                  if answers.is_empty() {
                      return None;
                  }
                  let hit = answers.iter().filter(|a| ranked.iter().take(k).any(|r| r == *a)).count();
                  Some(hit as f64 / answers.len() as f64)
              }

              /// 첫 정답 순위의 역수. 못 찾으면 0, 정답이 없는 질문은 None.
              pub fn reciprocal_rank(ranked: &[i64], answers: &[i64]) -> Option<f64> {
                  if answers.is_empty() {
                      return None;
                  }
                  let pos = ranked.iter().position(|r| answers.contains(r));
                  Some(pos.map_or(0.0, |p| 1.0 / (p as f64 + 1.0)))
              }

              #[cfg(test)]
              mod tests {
                  use super::*;

                  #[test]
                  fn recall_and_mrr() {
                      let ranked = [7, 3, 9, 1];
                      assert_eq!(recall_at_k(&ranked, &[3, 1], 3), Some(0.5));
                      assert_eq!(recall_at_k(&ranked, &[3, 1], 5), Some(1.0));
                      assert_eq!(reciprocal_rank(&ranked, &[9]), Some(1.0 / 3.0));
                      assert_eq!(reciprocal_rank(&ranked, &[42]), Some(0.0));
                      assert_eq!(recall_at_k(&ranked, &[], 3), None);
                      assert_eq!(reciprocal_rank(&ranked, &[]), None);
                  }

                  #[test]
                  fn parses_question_file() {
                      let json = r#"[
                          {"q": "배포는 언제 안 하기로 했지", "answers": [3], "tag": "direct"},
                          {"q": "우주선 연료는", "answers": [], "tag": "no_answer", "sealed": true}
                      ]"#;
                      let qs = load_questions(json).unwrap();
                      assert_eq!(qs.len(), 2);
                      assert!(qs[1].sealed && qs[1].answers.is_empty());
                  }
              }
      - message: "[3] lib.rs — eval 모듈 추가"
        files:
          - path: mnemo-core/src/lib.rs
            content: |
              pub mod db;
              pub mod eval;
              pub mod import;
              pub mod item;

              pub use db::Db;
